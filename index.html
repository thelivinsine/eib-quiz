    <style>
        /* ============================================================
           EIB · Bento redesign (2026-07-16)
           ------------------------------------------------------------
           A clean, confident bento-grid learning app. Cool paper-grey
           canvas (light, default) / deep charcoal canvas (dark), a faint
           dotted grid, big friendly rounded-[26px] tiles, full-pill
           buttons, two soft layered shadows, and a DISCIPLINED accent
           duo: one TEAL primary + one warm APRICOT pop. Most tiles are
           white/charcoal with a hairline border; saturated fills are
           rationed. Type: Bricolage Grotesque (display) + Inter (body),
           uppercase tracked micro-labels as tile eyebrows. Tiles lift on
           hover via a springy cubic-bezier.
           Legacy token NAMES preserved so existing JS keeps working:
             --lime (=teal primary) --gold (=apricot) --blue --green
             --red --red-text --ink --font-mono --spacing-* ...
           ============================================================ */
        :root {
            /* ===== DARK canvas (charcoal) — :root is the no-class base =====
               Per the dark reference: neutral greys, every level of containment
               steps LIGHTER, no drop shadows anywhere — elevation is lightness
               plus a hairline. Text tiers are solid values, never opacity. */
            color-scheme: dark;

            --canvas:    #131418;
            --bg:        #131418;
            --surface:   #1B1D23;   /* tile — 1.09 above canvas */
            --surface2:  #23262E;   /* inset well inside a tile */
            --surface3:  #2C303A;   /* track / rail */
            --ink-tile:  #262A33;   /* CTA tile — the top of the dark ladder, 1.28 on canvas */
            --hover:     #262931;   /* hover steps UP in dark */

            --border:       #30343E;   /* 1.35 on tile */
            --border-soft:  #262A33;
            --border-hover: #3C414D;
            --ink:          #30343E;   /* legacy alias (borders) */
            --hairline:     #30343E;

            /* Primary TEAL */
            --teal:       #17B5A4;
            --teal-deep:  #17B5A4;   /* text-safe variant = the bright one in dark */
            --teal-tint:  #14312F;
            --accent:       #17B5A4;
            --accent-text:  #17B5A4;
            --accent-fill:  #0E9C8D;
            --accent-soft:  #16302E;
            --accent-line:  #1E5B54;
            --accent-grad:  linear-gradient(135deg, #0E9C8D 0%, #17B5A4 100%);
            --on-accent:    #06201D;

            /* Contrast APRICOT */
            --apricot:      #FB923C;
            --apricot-deep: #FB923C;
            --apricot-tint: #3A2A18;
            --on-apricot:   #1E1205;

            /* legacy names read by JS inline styles */
            --lime:      #17B5A4;
            --lime-dim:  #16302E;
            --lime-glow: rgba(23,181,164,0.30);
            --gold:      #FB923C;
            --gold-dim:  #3A2A18;
            --gold-line: #5C4222;
            --on-gold:   #1E1205;

            --blue:      #7FB4FF;
            --blue-dim:  #1B2738;
            --green:     #34D399;
            --green-dim: #122D25;
            --red:       #FB7185;
            --red-text:  #FB7185;
            --red-dim:   #341A20;

            --text:     #ECEDEF;   /* 14.4 on tile */
            --sub-text: #B9BCC4;   /*  8.9 */
            --muted:    #9296A0;   /*  5.7 */
            --faint:    #838792;   /*  4.7 */
            --on-dark:  #FFFFFF;

            --radius:      16px;
            --radius-sm:   10px;
            --radius-lg:   20px;   /* tiles */
            --radius-xl:   24px;
            --radius-pill: 999px;

            --spacing-xs:  6px;
            --spacing-sm:  8px;
            --spacing-md:  16px;
            --spacing-lg:  24px;
            --spacing-xl:  32px;
            --spacing-2xl: 48px;

            --font-head: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            --font-mono: 'Inter', system-ui, sans-serif;   /* alias: JS reads var(--font-mono) */

            --ease:        cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --maxw: 1100px;
            --header-h: 56px;   /* a fallback; syncHeaderHeight() measures the real one */
        }

        html.light {
            /* ===== LIGHT canvas (paper-grey) — the default look =====
               Per the light reference: ~two fill levels, then edges do the work.
               Raised surfaces go UP towards white; hover and selected go DOWN
               into grey. Shadows exist but only under things that float. */
            color-scheme: light;

            --canvas:    #F2F3F5;
            --bg:        #F2F3F5;
            --surface:   #FFFFFF;    /* tile — 1.11 above page */
            --surface2:  #F5F6F8;    /* inset well inside a tile */
            --surface3:  #E6E7EB;    /* track / rail */
            --ink-tile:  #17181C;    /* charcoal-fill tiles */
            --hover:     #F1F2F5;    /* hover steps DOWN in light */

            --border:       #E6E7EB;   /* 1.24 on tile, 1.11 on page */
            --border-soft:  #EEEFF2;
            --border-hover: #D3D5DB;
            --ink:          #E6E7EB;
            --hairline:     #E6E7EB;

            --teal:       #0F9D8F;
            --teal-deep:  #0B7D72;   /* text-safe: 5.01 on white */
            --teal-tint:  #EDF7F4;
            --accent:       #0B7D72;
            --accent-text:  #0B7D72;
            --accent-fill:  #0B7D72;   /* white on it = 5.01 */
            --accent-soft:  #EDF7F4;
            --accent-line:  #BEE0DA;
            --accent-grad:  linear-gradient(135deg, #0B7D72 0%, #0F9D8F 100%);
            --on-accent:    #FFFFFF;

            --apricot:      #E07A1F;
            --apricot-deep: #B45309;
            --apricot-tint: #FDF4EA;
            --on-apricot:   #17181C;

            --lime:      #0B7D72;
            --lime-dim:  #EDF7F4;
            --lime-glow: rgba(11,125,114,0.22);
            --gold:      #B45309;                  /* text-safe apricot: 5.02 on white */
            --gold-dim:  #FDF4EA;
            --gold-line: #EFD8BD;
            --on-gold:   #17181C;

            --blue:      #1D4ED8;
            --blue-dim:  #EDF1FD;
            --green:     #047857;
            --green-dim: #EBF7F1;
            --red:       #C81E33;
            --red-text:  #C81E33;
            --red-dim:   #FDEFF1;

            --text:     #17181C;   /* 17.7 on white */
            --sub-text: #3F424A;   /* 10.1 */
            --muted:    #5F636E;   /*  6.0 */
            --faint:    #6B6F7B;   /*  5.0 on white, 4.5 on page */
            --on-dark:  #FFFFFF;
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }

        html { overflow-x: clip; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-body);
            background: var(--canvas);
            color: var(--text);
            line-height: 1.6;
            font-size: 16px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: clip;
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; color: inherit; }
        select { font-family: inherit; }
        ::selection { background: var(--accent-soft); color: var(--text); }
        :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: 4px; }

        /* Shared eyebrow micro-label */
        .eyebrow, .stat-label, .ds-label, .breakdown-label, .review-q-num,
        .ready-ring-sub, .timer-label,
        .sidebar-title, .question-num {
            font-family: var(--font-body);
            font-size: 0.69rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ============================================================
           TILE — the bento primitive.
           A tile is a fill plus a hairline. Elevation is not a shadow and
           hover is not a lift: light steps the fill DOWN into grey, dark
           steps it UP. Both stay inside the 1.10-1.25 band.
           ============================================================ */
        .hist-list, .hist-exam, .glossary-wrap, .question-card, .quiz-sidebar,
        .stat-card, .breakdown-item, .review-item, .score-display {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        .topic-chip { transition: background 0.18s var(--ease), border-color 0.18s var(--ease); }
        @media (hover: hover) {
            .topic-chip:hover { background: var(--hover); border-color: var(--border-hover); }
        }
        .topic-chip:active { background: var(--surface3); }

        /* ============================================================
           HEADER — slim top bar
           ============================================================ */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--canvas) 88%, transparent);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding-top: env(safe-area-inset-top);
        }
        .header-content {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: 10px var(--spacing-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
        }
        .brand { display: inline-flex; align-items: center; gap: 11px; min-height: 44px; background: none; border: none; padding: 4px 6px; border-radius: var(--radius-sm); }
        .brand-mark {
            width: 34px; height: 34px;
            border-radius: 10px;
            display: grid; place-items: center;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--on-dark);
            background: var(--ink-tile);
        }
        html.light .brand-mark { color: #fff; }
        .brand-name { font-weight: 600; font-size: 0.95rem; letter-spacing: -0.01em; color: var(--text); }

        .header-controls { display: flex; align-items: center; gap: var(--spacing-sm); }
        .seg {
            display: inline-flex;
            padding: 3px; gap: 2px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
        }
        .seg-btn {
            border: 1px solid transparent; background: none;
            color: var(--muted);
            font-size: 0.78rem; font-weight: 600;
            min-height: 38px; padding: 0 14px;
            border-radius: var(--radius-pill);
            transition: color 0.2s var(--ease), background 0.2s var(--ease);
        }
        .seg-btn:hover { color: var(--text); }
        /* The selected segment steps back UP to the tile fill and gets a
           hairline — colour alone is too close to carry the state. */
        .seg-btn.active { color: var(--text); background: var(--surface); border-color: var(--border); }

        /* ============================================================
           LAYOUT / SCREENS
           ============================================================ */
        main {
            max-width: var(--maxw); margin: 0 auto;
            padding: var(--spacing-xl) var(--spacing-lg);
            padding-bottom: calc(96px + env(safe-area-inset-bottom));
        }
        .screen { display: none; animation: fadeUp 0.32s var(--ease) both; }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ============================================================
           LANDING HERO (top of home; CTA scrolls to the bento content)
           ============================================================ */
        /* The hero introduces the app; it does not own the screen. It is
           sized by its own content so the working surface below it is one
           swipe away on a phone. */
        .hero-landing {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--spacing-xl) 0 var(--spacing-2xl);
            margin-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--border);
        }
        .hero-inner { max-width: 780px; display: flex; flex-direction: column; align-items: center; }

        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            color: var(--teal-deep);
            background: var(--teal-tint);
            border: 1px solid var(--accent-line);
            padding: 6px 13px; border-radius: var(--radius-pill);
            margin-bottom: var(--spacing-md);
        }
        .hero-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }

        .hero-headline {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: clamp(1.85rem, 5.2vw, 3.4rem);
            line-height: 1.08;
            letter-spacing: -0.035em;
            color: var(--text);
            text-wrap: balance;
        }
        .hero-mark {
            background: linear-gradient(var(--apricot), var(--apricot)) no-repeat left 94%;
            background-size: 100% 0.09em;
            padding-bottom: 0.04em;
        }
        .hero-lead {
            max-width: 620px;
            margin: var(--spacing-md) auto 0;
            color: var(--sub-text);
            font-size: clamp(0.98rem, 1.4vw, 1.08rem);
            line-height: 1.6;
            text-wrap: pretty;
        }
        .hero-cta-row {
            display: flex; flex-wrap: wrap; gap: var(--spacing-md);
            justify-content: center;
            margin-top: var(--spacing-lg);
        }
        .hero-cta-row .btn-primary, .hero-cta-row .btn-secondary { padding: 14px 28px; font-size: 0.98rem; }
        .hero-cta-row .btn-primary svg { width: 18px; height: 18px; }

        .hero-trust {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 8px 20px;
            margin-top: var(--spacing-lg);
        }
        .hero-trust { list-style: none; padding: 0; }
        .hero-trust > li {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 0.86rem; font-weight: 500; color: var(--sub-text);
        }
        .hero-trust > li svg {
            width: 15px; height: 15px; flex-shrink: 0;
            color: var(--teal-deep);
        }


        #homeMain { scroll-margin-top: 84px; }

        /* ============================================================
           HOME — a page of named sections, not a wall of tiles.
           The rhythm is: section heading > card title > body. Every
           section owns one job and says so above itself.
           ============================================================ */
        .home-section { margin-bottom: 56px; }
        .home-section:last-child { margin-bottom: 0; }

        .section-head { margin-bottom: var(--spacing-md); max-width: 62ch; }
        /* A section head that carries a control for its own section. */
        .section-head--row {
            max-width: none;
            display: flex; align-items: flex-end; justify-content: space-between;
            gap: var(--spacing-md); flex-wrap: wrap;
        }
        .section-head--row > div { max-width: 62ch; }
        #statePickerSlot { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-width: 0; }
        .state-picker-label { display: block; }
        .section-head h2 {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: 1.3rem;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .section-head p {
            margin-top: 4px;
            font-size: 0.92rem;
            color: var(--muted);
        }
        /* The tail is reference material, not something to act on. */
        .home-section--quiet .section-head h2 { font-size: 1.1rem; }

        #homeMain { scroll-margin-top: 76px; }

        /* ---- Overview card: ring headline + three counters ---- */
        .dash {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
        }
        .dash-head { margin-bottom: var(--spacing-lg); }

        .state-picker {
            position: relative;
            min-width: 0; max-width: 100%;
            display: inline-flex; align-items: center; gap: 8px;
            min-height: 44px;
            padding: 0 36px 0 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--muted);
            cursor: pointer;
        }
        .state-picker:focus-within { border-color: var(--accent); }
        .state-picker svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--muted); }
        /* The pill hugs this, so it fits "Berlin" as well as it fits
           "Mecklenburg-Vorpommern". */
        .state-picker-value {
            color: var(--text);
            font-size: 0.92rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        /* The real control, invisible, over the whole pill. 16px so iOS does not
           zoom when it opens. */
        .state-picker select {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            opacity: 0;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        /* the caret, drawn once so the native arrow can stay hidden */
        .state-picker::after {
            content: ''; position: absolute; right: 14px; top: 50%;
            width: 7px; height: 7px; margin-top: -5px;
            border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
            transform: rotate(45deg); pointer-events: none;
        }

        .dash-body {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: var(--spacing-xl);
        }
        .ready-ring-wrap { position: relative; width: 148px; height: 148px; flex-shrink: 0; }
        .ready-ring { width: 100%; height: 100%; display: block; }
        .ready-ring-track { fill: none; stroke: var(--surface3); stroke-width: 8; }
        .ready-ring-bar {
            fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 314; stroke-dashoffset: 314;
            transition: stroke-dashoffset 0.95s var(--ease-spring);
        }
        .ready-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ready-ring-pct { color: var(--text); font-family: var(--font-head); font-weight: 600; font-size: 1.9rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
        .ready-ring-sub { margin-top: 6px; font-size: 0.6rem; }

        .dash-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-sm); min-width: 0; }
        .dash-stat {
            background: var(--surface2);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            padding: 14px var(--spacing-md);
            display: flex; flex-direction: column; gap: 4px;
            min-width: 0;
        }
        /* Something to do today is the one counter allowed to raise its hand. */
        .dash-stat--due { background: var(--apricot-tint); border-color: var(--gold-line); }
        .dash-stat--due .ds-num { color: var(--gold); }
        .ds-num { font-family: var(--font-head); font-weight: 600; font-size: 1.55rem; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--text); }
        .ds-of { color: var(--faint); font-size: 0.85rem; font-weight: 500; }

        .resume-banner {
            margin-top: var(--spacing-md);
            padding: 14px var(--spacing-md);
            background: var(--accent-soft);
            border: 1px solid var(--accent-line);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--spacing-md); flex-wrap: wrap;
        }
        .resume-text { display: flex; flex-direction: column; gap: 2px; font-size: 0.88rem; color: var(--muted); }
        .resume-text strong { color: var(--text); font-size: 0.95rem; }
        .resume-actions { display: flex; gap: 8px; }

        .progress-reset {
            display: block; margin: var(--spacing-md) auto 0;
            background: none; border: none; color: var(--muted);
            font-size: 0.8rem; font-weight: 500;
            min-height: 44px; padding: 0 16px;
            text-decoration: underline; text-underline-offset: 3px;
            transition: color 0.2s var(--ease);
        }
        .progress-reset:hover { color: var(--red-text); }

        /* ============================================================
           MODE CARDS — one featured, three peers
           ============================================================ */
        .modes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
        }
        .mode-card {
            grid-column: span 1;
            position: relative;
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex; flex-direction: column;
            text-align: left;
            font: inherit; color: inherit;
            transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
        }
        @media (hover: hover) {
            .mode-card:hover { background: var(--hover); border-color: var(--border-hover); }
        }
        .mode-card:active { background: var(--surface3); }

        /* The exam is what the app is for, so it is the only card in charcoal
           and the only one that spans the row. */
        .mode-card--featured {
            grid-column: 1 / -1;
            background: var(--ink-tile);
            border-color: var(--border);
            color: var(--on-dark);
            padding: var(--spacing-lg);
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-areas: "icon title action" "icon desc action" "icon meta action";
            column-gap: var(--spacing-md);
            align-items: center;
        }
        html.light .mode-card--featured { color: #fff; }
        @media (hover: hover) {
            .mode-card--featured:hover { background: #22262E; border-color: var(--border-hover); }
        }
        html.light .mode-card--featured:hover { background: #24262C; }
        .mode-card--featured:active { background: #2A2E37; }
        .mode-card:not(.mode-card--featured) .mode-start-btn { display: none; }
        .mode-card--featured .mode-icon { grid-area: icon; align-self: start; width: 44px; height: 44px; margin-bottom: 0; background: rgba(23,181,164,0.16); color: var(--teal); }
        .mode-card--featured:hover .mode-icon { background: rgba(23,181,164,0.22); color: var(--teal); }
        .mode-card--featured .mode-icon svg { width: 26px; height: 26px; }
        .mode-card--featured .mode-title { grid-area: title; font-size: 1.3rem; color: #fff; }
        .mode-card--featured .mode-description { grid-area: desc; color: #B4B7C0; max-width: 52ch; margin-bottom: 0; }
        .mode-card--featured .mode-meta { grid-area: meta; margin: 10px 0 0; color: #9397A1; }
        .mode-card--featured .mode-start-btn {
            grid-area: action;
            justify-self: end;
            background: var(--teal); color: #06201D;
            border-radius: var(--radius-pill);
            min-height: 44px; padding: 0 22px;
            font-size: 0.92rem;
        }

        .mode-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: grid; place-items: center;
            color: var(--muted);
            background: var(--surface2);
            margin-bottom: 14px;
            transition: color 0.18s var(--ease), background 0.18s var(--ease);
        }
        .mode-icon svg { width: 19px; height: 19px; }
        @media (hover: hover) {
            .mode-card:hover .mode-icon { color: var(--accent-text); background: var(--accent-soft); }
        }
        .mode-title { font-family: var(--font-head); font-weight: 600; font-size: 1.02rem; letter-spacing: -0.02em; margin-bottom: 4px; }
        .mode-description {
            color: var(--muted); font-size: 0.87rem; line-height: 1.5;
            margin-bottom: 10px;
        }
        /* A chip states a fact; the fact is small and grey. Only work that is
           actually waiting gets a colour. */
        .mode-meta {
            display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
            margin-top: auto;
            font-size: 0.8rem; color: var(--faint);
            font-variant-numeric: tabular-nums;
        }
        .mode-flag {
            font-size: 0.75rem; font-weight: 600;
            padding: 2px 8px; border-radius: var(--radius-pill);
            color: var(--gold); background: var(--gold-dim);
        }
        .mode-start-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.84rem; font-weight: 600; }
        .msb-arrow { transition: transform 0.25s var(--ease-spring); }
        .mode-card:hover .msb-arrow { transform: translateX(3px); }

        /* ============================================================
           TOPICS — chips on the page; the section heading names them
           ============================================================ */
        .topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-sm); }
        .topic-chip {
            display: flex; align-items: center; gap: var(--spacing-md);
            padding: 14px var(--spacing-md);
            min-height: 72px;
            text-align: left;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .topic-chip-icon {
            width: 36px; height: 36px; flex-shrink: 0;
            border-radius: 10px;
            display: grid; place-items: center;
            color: var(--accent-text);
            background: var(--teal-tint);
        }
        .topic-chip-icon svg { width: 19px; height: 19px; }
        .topic-chip-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
        .topic-chip-name { font-weight: 600; font-size: 0.95rem; color: var(--text); }
        .topic-chip-meta { font-size: 0.78rem; color: var(--muted); }
        .topic-chip-bar { display: block; height: 3px; margin-top: 3px; border-radius: 2px; background: var(--surface3); overflow: hidden; }
        .topic-chip-bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
        .topic-chip-go { flex-shrink: 0; color: var(--faint); display: grid; place-items: center; }
        .topic-chip-go svg { width: 18px; height: 18px; }
        .topic-chip:hover .topic-chip-go { color: var(--accent-text); }

        /* ============================================================
           TAIL — history and glossary, one quiet card each
           ============================================================ */
        .sub-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
        }
        .sub-card > .eyebrow { display: block; margin-bottom: var(--spacing-md); }
        #historySection:empty, #topicSection:empty, #glossarySection:empty { display: none; }

        .load-error {
            grid-column: 1 / -1;
            padding: var(--spacing-lg);
            text-align: center;
            color: var(--red-text);
            background: var(--red-dim);
            border-radius: var(--radius);
        }

        /* History */
        .hist-exam { padding: var(--spacing-md); border-radius: var(--radius); margin-bottom: var(--spacing-md); background: var(--surface2); border-color: var(--border-soft); }
        .hist-exam-stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--spacing-sm); font-size: 0.86rem; color: var(--sub-text); margin-bottom: var(--spacing-md); }
        .hist-exam-stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
        .hist-bars { display: flex; align-items: flex-end; gap: 6px; height: 52px; }
        .hist-bar { flex: 1 1 0; min-width: 6px; max-width: 34px; border-radius: 4px 4px 2px 2px; background: var(--muted); transition: height 0.4s var(--ease); }
        .hist-bar.pass { background: var(--teal-deep); }
        .hist-bar.fail { background: var(--red); }
        .hist-list { border-radius: var(--radius); overflow: hidden; border-color: var(--border-soft); }
        .hist-row { display: flex; align-items: center; gap: var(--spacing-md); padding: 12px var(--spacing-md); border-bottom: 1px solid var(--border-soft); font-size: 0.86rem; flex-wrap: wrap; }
        .hist-row:last-child { border-bottom: none; }
        .hist-mode { font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
        .hist-date { color: var(--muted); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
        .hist-score { color: var(--sub-text); font-weight: 500; font-variant-numeric: tabular-nums; }
        .hist-badge { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 3px 9px; border-radius: var(--radius-pill); }
        .hist-badge.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .hist-badge.fail { color: var(--red-text); background: var(--red-dim); }

        /* Glossary */
        .glossary-section { margin-bottom: var(--spacing-lg); }
        .glossary-wrap { border-radius: var(--radius-lg); overflow: hidden; }
        details.glossary-wrap > summary, details.gloss-item > summary { cursor: pointer; list-style: none; }
        details.glossary-wrap > summary::-webkit-details-marker, details.gloss-item > summary::-webkit-details-marker { display: none; }
        .glossary-summary { padding: var(--spacing-md); min-height: 52px; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; transition: background 0.2s var(--ease); }
        .glossary-summary:hover { background: var(--hover); }
        .glossary-summary::after { content: '+'; margin-left: auto; color: var(--muted); font-size: 1.15rem; line-height: 1; }
        details.glossary-wrap[open] .glossary-summary::after { content: '−'; }
        .gloss-list { border-top: 1px solid var(--border-soft); }
        .gloss-item { border-bottom: 1px solid var(--border-soft); }
        .gloss-item:last-child { border-bottom: none; }
        .gloss-item > summary { padding: 13px var(--spacing-md); font-weight: 600; font-size: 0.9rem; color: var(--text); transition: color 0.2s var(--ease); }
        .gloss-item > summary:hover { color: var(--accent-text); }
        .gloss-def { padding: 0 var(--spacing-md) 14px; display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; color: var(--sub-text); }
        .gloss-en { color: var(--muted); font-style: italic; }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary, .btn-secondary {
            font-family: var(--font-body);
            font-weight: 600; font-size: 0.92rem;
            min-height: 44px;
            padding: 11px 22px;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease), filter 0.16s var(--ease);
        }
        .btn-primary { color: var(--on-accent); background: var(--accent-fill); }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { filter: brightness(0.94); }
        .btn-secondary { color: var(--sub-text); background: var(--surface); border-color: var(--border); }
        .btn-secondary:hover { color: var(--text); background: var(--hover); border-color: var(--border-hover); }
        .btn-lg { min-height: 50px; padding: 14px 28px; font-size: 0.98rem; }
        .btn-sm { min-height: 38px; padding: 0 16px; font-size: 0.8rem; }

        /* Visually hidden, still read out. */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .btn-group { display: flex; gap: var(--spacing-md); margin-top: var(--spacing-lg); flex-wrap: wrap; }

        /* ============================================================
           QUIZ SCREEN
           ============================================================ */
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--spacing-sm); margin-bottom: var(--spacing-lg); }
        .stat-card { padding: 11px 14px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 4px; }
        .stat-value { font-family: var(--font-head); font-weight: 600; font-size: 1.25rem; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

        .quiz-layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--spacing-md); align-items: start; }
        .quiz-main { min-width: 0; }

        /* The exam timer follows you down the page. It used to scroll away at the
           first question, so a timed simulation ran with an invisible clock. */
        #timer {
            position: sticky; top: var(--header-h); z-index: 20;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px var(--spacing-md); text-align: center;
        }
        #timer.danger { border-color: var(--red); background: var(--red-dim); animation: pulseDanger 1.1s var(--ease) infinite; }
        @keyframes pulseDanger { 50% { border-color: transparent; } }
        .timer-display { font-family: var(--font-head); font-weight: 600; font-size: 1.7rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; color: var(--text); }
        #timer.danger .timer-display { color: var(--red-text); }
        .pacing-info { font-size: 0.74rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }

        .quiz-progress { height: 4px; background: var(--surface3); border-radius: var(--radius-pill); overflow: hidden; margin-bottom: var(--spacing-md); }
        .quiz-progress > span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent-grad); transition: width 0.45s var(--ease-spring); }

        .question-card { padding: var(--spacing-lg); border-radius: var(--radius-lg); }
        .q-enter { animation: qEnter 0.4s var(--ease-spring) both; }
        @keyframes qEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .question-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-sm); margin-bottom: var(--spacing-md); }
        .question-meta > div:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .question-num { color: var(--accent-text); flex-shrink: 0; }
        .question-category {
            font-size: 0.72rem; font-weight: 500; color: var(--muted);
            padding: 4px 10px; border-radius: var(--radius-pill);
            background: var(--surface2); border: 1px solid var(--border-soft);
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .question-meta-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .speak-btn, .bilingual-toggle {
            border: 1px solid var(--border); background: var(--surface2); color: var(--sub-text);
            font-size: 0.76rem; font-weight: 600;
            min-height: 40px; padding: 0 12px; border-radius: var(--radius-pill);
            display: inline-flex; align-items: center; justify-content: center;
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        .speak-btn { min-width: 40px; padding: 0 10px; }
        /* On a touch screen every one of these is a finger target, not a cursor target. */
        @media (pointer: coarse) {
            .speak-btn, .bilingual-toggle, .seg-btn { min-height: 44px; }
            .speak-btn { min-width: 44px; }
            .q-nav-btn { min-height: 40px; }
        }
        .speak-btn svg, .bilingual-toggle svg { width: 16px; height: 16px; }
        .bilingual-toggle { gap: 6px; }
        .speak-btn:hover, .bilingual-toggle:hover { border-color: var(--border-hover); background: var(--hover); color: var(--text); }
        .bilingual-toggle.active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }

        .question-text { font-family: var(--font-head); font-weight: 600; font-size: clamp(1.18rem, 2.2vw, 1.45rem); line-height: 1.35; letter-spacing: -0.015em; color: var(--text); text-wrap: pretty; }
        .question-text:focus { outline: none; }
        .question-english { display: none; margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 0.98rem; line-height: 1.5; }
        .question-english.show { display: block; }
        .question-image { width: 100%; max-width: 420px; margin: var(--spacing-lg) auto 0; border-radius: var(--radius); border: 1px solid var(--border); }
        #imageCredit { color: var(--muted); }

        .options { display: flex; flex-direction: column; gap: 10px; margin-top: var(--spacing-lg); }
        .option-btn {
            display: flex; align-items: center; gap: var(--spacing-md);
            width: 100%; text-align: left;
            min-height: 56px;
            padding: 13px 14px;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--surface); color: var(--text);
            font-size: 1rem; line-height: 1.45;
            transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
        }
        @media (hover: hover) {
            .option-btn:hover:not(:disabled) { border-color: var(--border-hover); background: var(--hover); }
        }
        .option-btn:active:not(:disabled) { background: var(--surface3); }
        .option-btn:disabled { cursor: default; }
        .opt-letter {
            flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px;
            display: grid; place-items: center;
            font-weight: 600; font-size: 0.84rem;
            color: var(--muted); background: var(--surface2); border: 1px solid var(--border);
            transition: border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        @media (hover: hover) {
            .option-btn:hover:not(:disabled) .opt-letter { border-color: var(--border-hover); color: var(--text); }
        }
        .opt-text-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .option-en-text { display: none; font-size: 0.82rem; color: var(--muted); font-style: italic; }
        .option-en-text.show { display: block; }
        .options.answered .option-btn:not(.correct):not(.incorrect) { color: var(--muted); background: var(--surface2); }
        .option-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--text); }
        .option-btn.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; }
        html:not(.light) .option-btn.correct .opt-letter { color: #06231a; }
        .option-btn.incorrect { border-color: var(--red); background: var(--red-dim); color: var(--text); }
        .option-btn.incorrect .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }
        html:not(.light) .option-btn.incorrect .opt-letter { color: #2a0710; }
        .option-btn.just-picked { animation: pickPop 0.28s var(--ease); }
        @keyframes pickPop { 0% { transform: scale(1); } 45% { transform: scale(1.015); } 100% { transform: scale(1); } }

        .options--image { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); }
        .option-btn--image { flex-direction: column; align-items: stretch; padding: 10px; gap: 10px; }
        .option-btn--image { min-height: 0; }
        .opt-img { display: block; border-radius: var(--radius-sm); overflow: hidden; background: var(--surface2); border: 1px solid var(--border-soft); aspect-ratio: 4 / 3; }
        .opt-img img { width: 100%; height: 100%; object-fit: contain; }
        .option-btn--image .opt-num { font-size: 0.8rem; font-weight: 500; color: var(--sub-text); text-align: center; }
        .option-btn--image.img-missing .opt-img { display: grid; place-items: center; min-height: 120px; }
        .option-btn--image.img-missing .opt-img::after { content: attr(data-missing); font-size: 0.78rem; color: var(--muted); }
        .option-btn--image.img-missing .opt-img img { display: none; }

        #answerHint { color: var(--muted); }
        .keyboard-hint { position: relative; margin-top: var(--spacing-md); padding: 9px 14px; background: var(--surface2); border: 1px solid var(--border-soft); border-radius: var(--radius); font-size: 0.76rem; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        @media (hover: none) { .keyboard-hint { display: none; } }
        kbd { font-size: 0.72rem; padding: 2px 8px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--sub-text); box-shadow: 0 1px 0 var(--border); font-weight: 600; }
        .keyboard-hint-close { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 0 4px; }
        .keyboard-hint-close:hover { color: var(--text); }

        .explanation { display: none; margin-top: var(--spacing-md); padding: var(--spacing-md); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface2); border-left: 3px solid var(--accent); animation: fadeUp 0.28s var(--ease) both; }
        .explanation.show { display: block; }
        .explanation.correct { border-left-color: var(--green); background: var(--green-dim); }
        .explanation.incorrect { border-left-color: var(--red); background: var(--red-dim); }
        .explanation-header { font-family: var(--font-head); font-weight: 600; font-size: 1rem; margin-bottom: 6px; letter-spacing: -0.01em; }
        .explanation.correct .explanation-header { color: var(--green); }
        .explanation.incorrect .explanation-header { color: var(--red-text); }
        .explanation-text { color: var(--sub-text); font-size: 0.92rem; line-height: 1.6; }
        .explanation-english { display: none; margin-top: 8px; color: var(--muted); font-size: 0.86rem; font-style: italic; }
        .explanation-english.show { display: block; }

        /* Sidebar navigator */
        .quiz-sidebar {
            width: 256px;
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            position: sticky;
            top: calc(var(--header-h) + 8px);
            /* Never taller than the screen — otherwise it is not sticky, it is just long. */
            max-height: calc(100svh - var(--header-h) - 24px);
            display: flex; flex-direction: column;
        }
        .sidebar-header { cursor: default; }
        .sidebar-header-row { display: flex; align-items: center; justify-content: space-between; }
        .sidebar-chevron { display: none; color: var(--muted); transition: transform 0.25s var(--ease); }
        .sidebar-count { display: block; font-size: 0.74rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
        .sidebar-body { margin-top: var(--spacing-md); min-height: 0; overflow-y: auto; }
        .progress-bar { height: 5px; background: var(--surface3); border-radius: var(--radius-pill); overflow: hidden; }
        .progress-fill { height: 100%; width: 0; background: var(--accent-grad); border-radius: inherit; transition: width 0.4s var(--ease-spring); }
        .progress-text { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
        .question-nav-legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: var(--spacing-md) 0; font-size: 0.72rem; color: var(--muted); }
        .question-nav-legend > span { display: inline-flex; align-items: center; gap: 5px; }
        .legend-swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
        /* Five across in the 256px sidebar, many more across the full-width strip
           on a narrow screen — the cells stay finger-sized either way. */
        .question-nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }

        /* Collapsible category groups. The group holding the current question is
           always open; anything else the reader opened stays open across renders. */
        .question-nav-groups { display: flex; flex-direction: column; gap: 4px; }
        .qnav-group { border-radius: var(--radius-sm); }
        .qnav-group + .qnav-group { border-top: 1px solid var(--border-soft); padding-top: 4px; }
        .qnav-group-head {
            display: flex; align-items: center; gap: 8px;
            min-height: 36px; padding: 0 4px;
            cursor: pointer; list-style: none;
            font-size: 0.78rem; font-weight: 600; color: var(--sub-text);
        }
        .qnav-group-head::-webkit-details-marker { display: none; }
        /* One caret, drawn here, rotating on open. */
        .qnav-group-head::before {
            content: ''; flex-shrink: 0;
            width: 6px; height: 6px; margin-left: 2px;
            border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform 0.18s var(--ease);
        }
        .qnav-group[open] > .qnav-group-head::before { transform: rotate(45deg); }
        .qnav-group-head:hover { color: var(--text); }
        .qnav-group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qnav-group-count { flex-shrink: 0; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
        .qnav-group > .question-nav-grid { padding: 4px 0 10px; }

        /* Shuffle is a round-level control, so it sits above the numbers it re-orders. */
        #navActions:empty { display: none; }
        #navActions { margin: var(--spacing-sm) 0 2px; }
        .qnav-shuffle {
            display: inline-flex; align-items: center; gap: 7px;
            min-height: 36px; padding: 0 12px;
            border: 1px solid var(--border); border-radius: var(--radius-pill);
            background: var(--surface2); color: var(--sub-text);
            font-size: 0.78rem; font-weight: 600;
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        .qnav-shuffle svg { width: 14px; height: 14px; }
        .qnav-shuffle:hover { background: var(--hover); border-color: var(--border-hover); color: var(--text); }
        .qnav-shuffle.is-on { color: var(--accent-text); border-color: var(--accent-line); background: var(--accent-soft); }

        /* Stated after the base rules above, not with the other coarse-pointer
           overrides earlier in the sheet — same specificity, so source order decides. */
        @media (pointer: coarse) {
            .qnav-shuffle, .qnav-group-head { min-height: 44px; }
        }
        .q-nav-btn { aspect-ratio: 1; min-height: 34px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: 8px; font-size: 0.74rem; font-weight: 600; font-variant-numeric: tabular-nums; transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease); }
        .q-nav-btn:hover { border-color: var(--border-hover); background: var(--hover); color: var(--text); }
        .q-nav-btn.qnav-current { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
        .q-nav-btn.qnav-correct { background: var(--green-dim); border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--green); }
        .q-nav-btn.qnav-incorrect { background: var(--red-dim); border-color: color-mix(in srgb, var(--red) 55%, transparent); color: var(--red-text); }

        /* ============================================================
           END SCREEN
           ============================================================ */
        .end-screen { max-width: 680px; margin: 0 auto; text-align: center; }
        .end-screen > h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(1.6rem, 3.6vw, 2.1rem); letter-spacing: -0.03em; margin-bottom: var(--spacing-lg); }
        .score-display { border-radius: var(--radius-lg); padding: var(--spacing-xl) var(--spacing-lg); }
        .score-ring-wrap { position: relative; width: 170px; height: 170px; margin: 0 auto var(--spacing-md); }
        .score-ring { width: 100%; height: 100%; display: block; }
        .score-ring-track { fill: none; stroke: var(--surface3); stroke-width: 9; }
        .score-ring-bar { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.1s var(--ease-spring); }
        .score-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
        .score-ring-pct { font-family: var(--font-head); font-weight: 600; font-size: 2.7rem; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); }
        .score-ring-center .score-number { font-size: 0.9rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
        .score-text { color: var(--sub-text); font-size: 1rem; margin-top: var(--spacing-sm); }
        .pass-fail { display: inline-block; margin-top: var(--spacing-md); font-family: var(--font-head); font-weight: 600; font-size: 1rem; padding: 8px 20px; border-radius: var(--radius-pill); }
        .pass-fail.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .pass-fail.fail { color: var(--red-text); background: var(--red-dim); }
        .score-breakdown { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--spacing-md); margin-top: var(--spacing-md); }
        .breakdown-item { padding: var(--spacing-md); border-radius: var(--radius); background: var(--surface2); border-color: var(--border-soft); }
        .breakdown-label { margin-bottom: 8px; }
        .breakdown-number { font-family: var(--font-head); font-weight: 600; font-size: 1.8rem; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .pass-threshold-note { font-size: 0.8rem; color: var(--muted); margin: var(--spacing-lg) 0 var(--spacing-md); }
        .exam-subscores { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--spacing-sm); }
        .review-section { margin-top: var(--spacing-xl); text-align: left; }
        .review-section-header { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-md); flex-wrap: wrap; margin-bottom: var(--spacing-lg); }
        .review-section-header h2 { font-family: var(--font-head); font-weight: 600; font-size: 1.15rem; letter-spacing: -0.02em; }
        .review-header-actions { display: flex; align-items: center; gap: var(--spacing-md); flex-wrap: wrap; }
        .review-count { color: var(--muted); font-size: 0.9rem; }
        .review-item { padding: var(--spacing-md); border-radius: var(--radius); margin-bottom: var(--spacing-sm); }
        .review-q-num { margin-bottom: 6px; }
        .review-q-text { font-weight: 600; font-size: 1rem; line-height: 1.4; margin-bottom: var(--spacing-md); }
        .review-answers { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--spacing-md); }
        .review-answer { font-size: 0.9rem; padding: 10px 14px; border-radius: var(--radius-sm); }
        .review-answer.user-wrong { color: var(--red-text); background: var(--red-dim); }
        .review-answer.correct-ans { color: var(--green); background: var(--green-dim); }
        .review-explanation { font-size: 0.88rem; color: var(--sub-text); line-height: 1.6; padding-top: var(--spacing-sm); border-top: 1px solid var(--border-soft); }
        .review-explanation-en { color: var(--muted); font-style: italic; margin-top: 6px; }

        /* ============================================================
           MOTION PREFERENCES
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 940px) {
            /* Three secondary cards stay three across: two columns orphans one of
               them beside an empty cell. */
            .mode-card--featured { grid-column: 1 / -1; }
            .quiz-layout { grid-template-columns: minmax(0, 1fr); }
            .quiz-sidebar { width: auto; position: static; order: -1; max-height: none; }
            .sidebar-header { cursor: pointer; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
            .sidebar-chevron { display: block; }
            .sidebar-chevron.open { transform: rotate(180deg); }
            .sidebar-body { display: none; }
            .sidebar-body.expanded { display: block; max-height: 45vh; }
        }

        @media (max-width: 620px) {
            main { padding: var(--spacing-lg) var(--spacing-md); padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
            .header-content { padding: 8px var(--spacing-md); }

            /* Hero: introduce, then get out of the way. */
            .hero-landing { padding: var(--spacing-lg) 0 var(--spacing-xl); margin-bottom: var(--spacing-lg); }
            .hero-badge { font-size: 0.64rem; letter-spacing: 0.04em; padding: 5px 11px; }
            .hero-lead { font-size: 0.95rem; }
            .hero-cta-row { width: 100%; flex-direction: column; gap: var(--spacing-sm); margin-top: var(--spacing-md); }
            .hero-cta-row .btn-primary, .hero-cta-row .btn-secondary { width: 100%; padding: 13px 22px; }
            .hero-trust { gap: 6px 16px; margin-top: var(--spacing-md); }
            .hero-trust > li { font-size: 0.8rem; }

            .home-section { margin-bottom: 40px; }
            .section-head h2 { font-size: 1.15rem; }
            .section-head p { font-size: 0.88rem; }
            .dash { padding: var(--spacing-md); }
            /* The ring stops being a column of its own and sits above the counters. */
            .dash-body { grid-template-columns: 1fr; justify-items: center; gap: var(--spacing-md); }
            .dash-stats { width: 100%; }
            .ready-ring-wrap { width: 128px; height: 128px; }
            .ready-ring-pct { font-size: 1.6rem; }
            .dash-head { margin-bottom: var(--spacing-md); }
            /* The picker goes full width under its section heading rather than
               squeezing onto the same line as it. */
            .section-head--row { align-items: stretch; }
            #statePickerSlot { width: 100%; }
            .state-picker { width: 100%; justify-content: space-between; }
            .resume-actions { width: 100%; }
            .resume-actions .btn-primary, .resume-actions .btn-secondary { flex: 1; }

            /* The featured card gives up its side-by-side layout before the text
               gets squeezed into a column two words wide. */
            .mode-card--featured {
                display: flex; flex-direction: column;
                align-items: stretch;
                padding: var(--spacing-md);
            }
            .mode-card--featured .mode-icon { width: 38px; height: 38px; margin-bottom: 14px; }
            .mode-card--featured .mode-icon svg { width: 20px; height: 20px; }
            .mode-card--featured .mode-title { font-size: 1.1rem; }
            .mode-card--featured .mode-start-btn { justify-self: stretch; width: 100%; margin-top: 4px; }
            /* Three numbers stay three columns — stacking them turned the
               overview into a screenful of its own. */
            .dash-stats { width: 100%; gap: 6px; }
            .dash-stat { padding: 10px 8px; align-items: center; text-align: center; gap: 2px; }
            .ds-num { font-size: 1.3rem; }
            .ds-of { font-size: 0.72rem; }
            .dash-stat .ds-label { font-size: 0.6rem; letter-spacing: 0.04em; }
            .resume-actions { width: 100%; }
            .resume-actions .btn-primary, .resume-actions .btn-secondary { flex: 1; }

            /* The three secondary modes read as a list on a phone: icon beside
               the title, one tap target each, all three in view. */
            .modes-grid { grid-template-columns: 1fr; gap: var(--spacing-sm); }
            .mode-card:not(.mode-card--featured) {
                display: grid;
                grid-template-columns: 38px 1fr;
                grid-template-areas: "icon title" "icon desc" "icon meta";
                column-gap: 14px; row-gap: 3px;
                align-items: center;
            }
            .mode-card:not(.mode-card--featured) .mode-icon { grid-area: icon; align-self: start; margin-bottom: 0; }
            .mode-card:not(.mode-card--featured) .mode-title { grid-area: title; margin-bottom: 0; }
            .mode-card:not(.mode-card--featured) .mode-description { grid-area: desc; margin-bottom: 0; font-size: 0.82rem; }
            .mode-card:not(.mode-card--featured) .mode-meta { grid-area: meta; margin: 4px 0 0; }
            .mode-card:not(.mode-card--featured) .mode-start-btn { display: none; }

            .topic-grid { grid-template-columns: 1fr; }
            .sub-card { padding: var(--spacing-md); }
            .header-controls { gap: 6px; }
            .seg-btn { padding: 0 11px; font-size: 0.74rem; }
            .question-card { padding: var(--spacing-md); }
            .question-text { font-size: 1.15rem; }
            /* The tiles carry their own height on a wide grid; on a phone they
               only need to hold their content. */
            #statTile { min-height: 0; }
            /* Timer becomes one line so the question starts higher. The JS
               owns #timer's own display, so the children go inline instead. */
            #timer { padding: 9px var(--spacing-md); }
            .timer-label, .timer-display, .pacing-info { display: inline; }
            .timer-label { margin-right: 8px; }
            .timer-display { font-size: 1.35rem; }
            .pacing-info { margin-left: 8px; }
            .stats-bar { grid-template-columns: repeat(4, 1fr); gap: 6px; }
            .stat-card { padding: 9px 8px; align-items: center; text-align: center; }
            .stat-value { font-size: 1.1rem; }
            .stat-card .stat-label { font-size: 0.56rem; letter-spacing: 0.03em; }
            .exam-subscores { grid-template-columns: 1fr; }
            .score-display { padding: var(--spacing-lg) var(--spacing-md); }
            .score-ring-wrap { width: 150px; height: 150px; }
            .score-ring-pct { font-size: 2.3rem; }
            .btn-group { flex-direction: column; }
            .btn-group .btn-primary, .btn-group .btn-secondary { width: 100%; justify-content: center; }
            .hist-row { font-size: 0.82rem; gap: 8px; }
        }

        @media (max-width: 400px) {
            .options--image { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <button class="brand" onclick="showScreen('home')" data-i18n-aria="nav.home">
                <span class="brand-mark" aria-hidden="true">E</span>
                <span class="brand-name">eib</span>
            </button>
            <div class="header-controls">
                <div class="seg" role="group" data-i18n-aria="nav.language">
                    <button class="seg-btn active" id="langEn" onclick="setLang('en')" lang="en" aria-pressed="true">EN</button>
                    <button class="seg-btn" id="langDe" onclick="setLang('de')" lang="de" aria-pressed="false">DE</button>
                </div>
                <div class="seg" role="group" data-i18n-aria="nav.scheme">
                    <button class="seg-btn active" id="darkBtn" data-i18n="nav.dark" aria-pressed="true">Dark</button>
                    <button class="seg-btn" id="lightBtn" data-i18n="nav.light" aria-pressed="false">Light</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Home Screen -->
        <section id="homeScreen" class="screen active">

            <!-- Landing hero: the pitch, one primary action, then out of the way. -->
            <div class="hero-landing">
                <div class="hero-inner">
                    <span class="hero-badge" data-i18n="hero.badge"></span>
                    <h1 class="hero-headline" data-i18n-html="hero.headline"></h1>
                    <p class="hero-lead" data-i18n="hero.lead"></p>
                    <div class="hero-cta-row">
                        <button class="btn-primary btn-lg" onclick="scrollToMain()">
                            <span data-i18n="hero.cta"></span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
                        </button>
                    </div>
                    <ul class="hero-trust">
                        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="hero.trust1"></span></li>
                        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="hero.trust2"></span></li>
                        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="hero.trust3"></span></li>
                        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="hero.trust4"></span></li>
                    </ul>
                </div>
            </div>

            <!-- 1 · Where you stand — one wide card, the page's opening statement. -->
            <section class="home-section" id="homeMain">
                <div class="section-head">
                    <h2 data-i18n="home.progress.title"></h2>
                    <p data-i18n="home.progress.lead"></p>
                </div>
                <div id="homeStatus"></div>
            </section>

            <!-- 2 · Practise — the main event: one featured mode, three secondary. -->
            <section class="home-section">
                <div class="section-head section-head--row">
                    <div>
                        <h2 data-i18n="home.practice.title"></h2>
                        <p data-i18n="home.practice.lead"></p>
                    </div>
                    <div id="statePickerSlot"></div>
                </div>
                <div class="modes-grid" id="modesGrid"></div>
            </section>

            <!-- 3 · By topic -->
            <section class="home-section">
                <div class="section-head">
                    <h2 data-i18n="home.topics.title"></h2>
                    <p data-i18n="home.topics.lead"></p>
                </div>
                <div id="topicSection"></div>
            </section>

            <!-- 4 · Quieter tail: what you did, and what the words mean. -->
            <section class="home-section home-section--quiet">
                <div class="section-head">
                    <h2 data-i18n="home.more.title"></h2>
                    <p data-i18n="home.more.lead"></p>
                </div>
                <div id="historySection"></div>
                <div id="glossarySection"></div>
            </section>
        </section>

        <!-- Quiz Screen -->
        <section id="quizScreen" class="screen">
            <div class="stats-bar" id="statsBar">
                <!-- Populated by JavaScript -->
            </div>

            <div class="quiz-layout">
                <!-- Left column: question card (+ timer for exam mode) -->
                <div class="quiz-main">
                    <div id="timer" style="display: none; margin-bottom: var(--spacing-md);">
                        <div class="timer-label" data-i18n="quiz.time"></div>
                        <div class="timer-display" id="timerDisplay">60:00</div>
                    </div>

                    <div class="quiz-progress" aria-hidden="true"><span id="quizProgressFill"></span></div>

                    <div class="question-card">
                        <div class="question-meta">
                            <div>
                                <span class="question-num" id="questionNum"></span>
                                <span class="question-category" id="questionCategory"></span>
                            </div>
                            <div class="question-meta-actions">
                                <button class="speak-btn" id="speakBtn" data-i18n-aria="quiz.speak"></button>
                                <button class="bilingual-toggle" id="bilingualToggle"></button>
                            </div>
                        </div>

                        <div class="question-text" id="questionText" tabindex="-1" lang="de"></div>
                        <div class="question-english" id="questionEnglish" lang="en"></div>

                        <img id="questionImage" class="question-image" style="display: none;">
                        <div id="imageCredit" style="display: none; font-size: 0.68rem; color: var(--muted); text-align: center; margin: -4px 0 6px;"></div>

                        <div class="options" id="optionsContainer" lang="de"></div>
                        <div id="answerHint" data-i18n="quiz.pick" style="display:none; font-size: 0.85rem; color: var(--muted); text-align: center; padding: var(--spacing-sm) 0; margin-top: 2px;"></div>

                        <div id="keyboardHintContainer"></div>

                        <div class="explanation" id="explanation" role="status" aria-live="polite">
                            <div class="explanation-header" id="explanationHeader"></div>
                            <div class="explanation-text" id="explanationText" lang="de"></div>
                            <div class="explanation-english" id="explanationEnglish" lang="en"></div>
                        </div>

                        <div class="btn-group">
                            <button class="btn-secondary" id="backBtn" style="display: none;">← <span data-i18n="quiz.back"></span></button>
                            <button class="btn-primary" id="nextBtn" style="display: none;"></button>
                            <button class="btn-secondary" id="quitBtn">← <span data-i18n="quiz.quit"></span></button>
                        </div>
                    </div>
                </div>

                <!-- Right column: vertical navigator sidebar -->
                <aside class="quiz-sidebar" id="questionNavWrapper" style="display: none;">
                    <div class="sidebar-header" id="sidebarToggle" role="button" aria-expanded="false">
                        <div class="sidebar-header-row">
                            <span class="sidebar-title" data-i18n="qnav.overview"></span>
                            <span class="sidebar-chevron" id="sidebarChevron">▼</span>
                        </div>
                        <span class="sidebar-count" id="navProgressSummary"></span>
                    </div>
                    <div class="sidebar-body" id="sidebarBody">
                        <div class="progress-bar" style="margin-bottom: 4px;">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" style="margin-top: 0; margin-bottom: 4px;">
                            <span id="progressLeft"></span>
                            <span id="progressPercent"></span>
                        </div>
                        <div id="navActions"></div>
                        <div class="question-nav-legend">
                            <span><span class="legend-swatch" style="background:var(--accent);"></span><span data-i18n="qnav.current"></span></span>
                            <span><span class="legend-swatch" style="background:var(--green);"></span><span data-i18n="qnav.correct"></span></span>
                            <span><span class="legend-swatch" style="background:var(--red);"></span><span data-i18n="qnav.wrong"></span></span>
                            <span><span class="legend-swatch" style="background:var(--border-hover);"></span><span data-i18n="qnav.open"></span></span>
                        </div>
                        <div class="question-nav-grid" id="questionNavGrid"></div>
                    </div>
                </aside>
            </div>
        </section>

        <!-- End Screen -->
        <section id="endScreen" class="screen">
            <div class="end-screen">
                <h1 id="endTitle"></h1>

                <div class="score-display">
                    <div class="score-ring-wrap">

        // Unbiased random sample (Fisher-Yates). NOT sort(() => Math.random() - 0.5): that
        // comparator is inconsistent, and it made early catalogue questions ~7x likelier to

        function sample(arr, n) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
