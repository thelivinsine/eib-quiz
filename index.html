           the card it overflows visibly instead of silently becoming two rows.
           overflow: hidden is what keeps that overflow INSIDE the tile. Measured, the
           worst case ("All questions" in English) needs exactly the 165px it has - 0px
           of slack, not the 2 the note claimed - so anything that narrows the card by a
           pixel spills it, and a classic vertical scrollbar on this page narrows it by
           about 7. Without this the estimate drew across the card's own border into the
           grid gap; clipped at the content edge it is still a visible tell, and it is
           one the card contains. */
        .mode-meta {
            display: flex; align-items: center; gap: var(--space-2xs); flex-wrap: nowrap;
            white-space: nowrap; overflow: hidden;
            margin-top: auto;
            font-size: var(--fs-2xs); color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .mode-flag {
            font-size: var(--fs-2xs); font-weight: 600;
            padding: var(--space-3xs) var(--space-sm); border-radius: var(--radius-pill);
            color: var(--gold); background: var(--gold-dim);
        }

        /* ============================================================
           TOPICS — chips on the page; the section heading names them
           ============================================================ */
        .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--space-sm); }
        .topic-chip {
            display: flex; align-items: center; gap: var(--space-ms);
            padding: var(--space-sm) var(--space-ms);
            min-height: var(--ctl-lg);
            text-align: left;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
        }
        .topic-chip-icon {
            width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0;
            display: grid; place-items: center;
            color: var(--muted);
            transition: color 0.18s var(--ease);
        }
        .topic-chip-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        .topic-chip-body { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; flex: 1; }
        .topic-chip-name { font-weight: 600; font-size: var(--fs-base); color: var(--text); }
        .topic-chip-meta { font-size: var(--fs-2xs); color: var(--muted); }
        .topic-chip-bar { display: block; height: 3px; margin-top: var(--space-3xs); border-radius: var(--radius-xs); background: var(--surface3); overflow: hidden; }
        .topic-chip-bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
        .topic-chip-go { flex-shrink: 0; color: var(--faint); display: grid; place-items: center; }
        .topic-chip-go svg { width: var(--icon-md); height: var(--icon-md); }
        @media (hover: hover) {
            .topic-chip:hover .topic-chip-icon,
            .topic-chip:hover .topic-chip-go { color: var(--accent-text); }
        }

        /* ============================================================
           TAIL — history and glossary, one quiet card each
           ============================================================ */
        .sub-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
        }
        .sub-card > .eyebrow { display: block; margin-bottom: var(--space-md); }
        #historySection:empty, #topicSection:empty, #glossarySection:empty { display: none; }
        /* The Topic card's reveal. Below the grid, so opening it never reflows the cards. */
        #topicSection { margin-top: var(--space-md); }

        .load-error {
            grid-column: 1 / -1;
            padding: var(--space-lg);
            text-align: center;
            color: var(--red-text);
            background: var(--red-dim);
            border-radius: var(--radius);
        }

        /* History */
        .hist-exam { padding: var(--space-md); border-radius: var(--radius); margin-bottom: var(--space-md); background: var(--surface2); border-color: var(--border-soft); }
        .hist-exam-stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-sm); font-size: var(--fs-sm); color: var(--sub-text); margin-bottom: var(--space-md); }
        .hist-exam-stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
        .hist-bars { display: flex; align-items: flex-end; gap: var(--space-sm); height: 52px; }
        .hist-bar { flex: 1 1 0; min-width: 6px; max-width: 34px; border-radius: var(--radius-xs) var(--radius-xs) 0 0; background: var(--muted); transition: height 0.4s var(--ease); }
        .hist-bar.pass { background: var(--teal-deep); }
        .hist-bar.fail { background: var(--red); }
        .hist-list { border-radius: var(--radius); overflow: hidden; border-color: var(--border-soft); }
        .hist-row { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-ms) var(--space-md); border-bottom: 1px solid var(--border-soft); font-size: var(--fs-sm); flex-wrap: wrap; }
        .hist-row:last-child { border-bottom: none; }
        .hist-mode { font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
        .hist-date { color: var(--muted); font-size: var(--fs-2xs); font-variant-numeric: tabular-nums; }
        .hist-score { color: var(--sub-text); font-weight: 500; font-variant-numeric: tabular-nums; }
        .hist-badge { font-size: var(--fs-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: var(--ls-caps); padding: var(--space-3xs) var(--space-sm); border-radius: var(--radius-pill); }
        .hist-badge.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .hist-badge.fail { color: var(--red-text); background: var(--red-dim); }

        /* Glossary */
        .glossary-section { margin-bottom: var(--space-lg); }
        .glossary-wrap { border-radius: var(--radius); overflow: hidden; }
        details.glossary-wrap > summary, details.gloss-item > summary { cursor: pointer; list-style: none; }
        details.glossary-wrap > summary::-webkit-details-marker, details.gloss-item > summary::-webkit-details-marker { display: none; }
        .glossary-summary { padding: var(--space-ms) var(--space-md); min-height: var(--ctl-md); font-weight: 600; font-size: var(--fs-base); display: flex; align-items: center; gap: var(--space-sm); transition: background 0.2s var(--ease); }
        .glossary-summary:hover { background: var(--hover); }
        .glossary-summary::after { content: '+'; margin-left: auto; color: var(--muted); font-size: var(--fs-lg); line-height: 1; }
        details.glossary-wrap[open] .glossary-summary::after { content: '−'; }
        .gloss-list { border-top: 1px solid var(--border-soft); }
        .hist-body { padding: var(--space-md); border-top: 1px solid var(--border-soft); }
        .hist-body .hist-list { border: none; border-radius: 0; }
        .gloss-item { border-bottom: 1px solid var(--border-soft); }
        .gloss-item:last-child { border-bottom: none; }
        .gloss-item > summary { padding: var(--space-ms) var(--space-md); font-weight: 600; font-size: var(--fs-sm); color: var(--text); transition: color 0.2s var(--ease); }
        .gloss-item > summary:hover { color: var(--accent-text); }
        .gloss-def { padding: 0 var(--space-md) var(--space-ms); display: flex; flex-direction: column; gap: var(--space-2xs); font-size: var(--fs-sm); color: var(--sub-text); }
        .gloss-en { color: var(--muted); font-style: italic; }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary, .btn-secondary {
            font-family: var(--font-body);
            font-weight: 600; font-size: var(--fs-base);
            min-height: var(--ctl-md);
            padding: var(--space-ms) var(--space-lg);
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease), filter 0.16s var(--ease);
        }
        /* --btn-fill, not --accent-fill: on the mockup a CTA is near-black navy and
           the accent blue is reserved for tints, links and small discs. In dark the two
           tokens hold the same value. */
        .btn-primary { color: var(--on-btn); background: var(--btn-fill); }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { filter: brightness(0.94); }
        .btn-secondary { color: var(--sub-text); background: var(--surface); border-color: var(--border); }
        .btn-secondary:hover { color: var(--text); background: var(--hover); border-color: var(--border-hover); }
        .btn-lg { min-height: var(--ctl-md); padding: var(--space-ms) var(--space-lg); font-size: var(--fs-base); }
        .btn-sm { min-height: var(--ctl-sm); padding: 0 var(--space-md); font-size: var(--fs-xs); }
        /* Inside a round the header is a back button and a preferences menu; a section
           nav there points at a page you are not on. */
        body.in-session .header-nav { display: none; }

        /* ============================================================
           FOOTER — the page's last band, and the small print's home
           ============================================================ */
        .site-footer {
            border-top: 1px solid var(--border);
            background: var(--band);
            padding: var(--space-2xl) var(--space-lg)
                     calc(var(--space-2xl) + env(safe-area-inset-bottom));
        }
        /* A session screen is pinned to the viewport and nothing after <main> may add
           to the page's height, or scrollHeight stops equalling innerHeight. */
        body.in-session .site-footer { display: none; }
        .footer-inner {
            max-width: var(--maxw); margin: 0 auto;
            display: flex; flex-wrap: wrap; align-items: flex-start;
            justify-content: space-between; gap: var(--space-xl);
        }
        .footer-col { min-width: 0; }
        /* The brand column carries the blurb, so it earns more room than the two link
           columns beside it. */
        .footer-col--brand { flex: 1 1 260px; max-width: 34ch; }
        .footer-brand { display: flex; align-items: center; gap: var(--space-sm); }
        .footer-blurb {
            margin-top: var(--space-md);
            font-size: var(--fs-xs); line-height: var(--lh-prose); color: var(--sub-text);
        }
        .footer-col-title {
            font-size: var(--fs-2xs); font-weight: 600; letter-spacing: var(--ls-caps);
            text-transform: uppercase; color: var(--muted);
            margin-bottom: var(--space-md);
        }
        .footer-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-sm); }
        /* One rule for the <button>s and the <a>s alike, so a mode action and an
           external source read identically. Underline on hover only: four stacked
           permanently-underlined lines read as a wall. */
        .footer-link {
            display: inline-block; text-align: left;
            padding: 0; border: 0; background: none;
            font-family: inherit; font-size: var(--fs-xs); line-height: var(--lh-ui);
            color: var(--sub-text); text-decoration: none; cursor: pointer;
            transition: color 0.16s var(--ease);
        }
        .footer-link:hover { color: var(--accent-text); text-decoration: underline; }
        .footer-bar {
            max-width: var(--maxw); margin: 0 auto;
            margin-top: var(--space-2xl); padding-top: var(--space-md);
            border-top: 1px solid var(--border);
            display: flex; flex-wrap: wrap; align-items: baseline;
            justify-content: space-between; gap: var(--space-sm);
            font-size: var(--fs-2xs); line-height: var(--lh-prose); color: var(--muted);
        }
        .footer-legal a { color: inherit; text-decoration: underline; }
        .footer-legal a:hover { color: var(--accent-text); }
        .footer-lockup { display: flex; flex-direction: column; line-height: var(--lh-tight); }
        .footer-name {
            font-family: var(--font-head); font-weight: 700; font-size: var(--fs-base);
            letter-spacing: var(--ls-display); color: var(--text);
        }
        .footer-tagline { font-size: var(--fs-2xs); color: var(--muted); letter-spacing: var(--ls-caps); }

        /* Visually hidden, still read out. */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: calc(1px * -1); overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
        .btn-group { display: flex; gap: var(--space-md); margin-top: var(--space-lg); flex-wrap: wrap; }

        /* The card's pinned footer. Previous on the left, Next on the right -
           the row maps to the direction each button moves you. Neither is ever
           allowed to change the row's height: a row that reflows as you answer
           cannot be pinned under your thumb. */
        .quiz-nav .btn-primary, .quiz-nav .btn-secondary {
            min-height: var(--ctl-sm); padding: 0 var(--space-md); font-size: var(--fs-xs); flex-shrink: 0;
        }
        .quiz-nav {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            flex-shrink: 0;
        }
        #nextBtn:disabled { visibility: hidden; }
        #backBtn:disabled { color: var(--faint); border-color: var(--border-soft); background: var(--surface2); cursor: default; }

        /* ============================================================
           QUIZ SCREEN
           ============================================================ */
        /* NOT tiles. Four numbers boxed in four cards is the containers-inside-
           containers look, and it spent a row of height the question card needs.
           Same move as the home overview band: figures separated by hairlines,
           label and value on one line. */
        /* The readouts line up with the question column and centre over it — they
           report on the round you are reading, not on the whole screen. */
        .quiz-topbar {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-md); flex-wrap: wrap;
            margin-bottom: var(--space-md); flex-shrink: 0;
        }
        .stats-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: var(--space-lg); row-gap: var(--space-2xs); }
        /* It rides in the footer row, between the two buttons: out of the reading
           path, on a line that already exists, and costing the question no height. */
        #keyboardHintContainer { flex: 0 1 auto; min-width: 0; display: flex; justify-content: center; }
        /* No ticks between the readouts: four numbers separated by three hairlines
           is six things to look at. Whitespace does the separating, the labels drop
           to the quietest tier, and the numbers carry the row. */
        .stat { display: flex; align-items: baseline; gap: var(--space-sm); padding: 0; }
        /* --muted, not --faint: at 0.63rem uppercase these were the smallest type on the
           screen painted in the quietest tier (4.52 light / 5.67 dark), and on a phone
           the row now sits at the bottom where it has to be legible in one glance.
           --faint is for placeholder and disabled, not for a label you read. */
        .stat .stat-label { color: var(--muted); font-size: var(--fs-2xs); letter-spacing: var(--ls-caps); }
        .stat-value { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-md); line-height: 1; letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }
        .stat-of { color: var(--muted); font-size: var(--fs-xs); font-weight: 500; }

        /* The question column — readouts, question, buttons — beside the navigator.
           Column gap only, and wider than the page's rhythm: the two are different
           jobs and should not read as one block. */
        .quiz-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0 var(--space-xl);
            align-items: start;
        }
        .quiz-main { min-width: 0; }

        /* The exam timer follows you down the page. It used to scroll away at the
           first question, so a timed simulation ran with an invisible clock. */
        /* NOT a tile. A clock is one figure you glance at, and boxing it cost the
           question a 100px row it needed — it is a line of text now, at one size, with
           the label and the figure reading as a single phrase. */
        #timer {
            position: sticky; top: var(--header-h); z-index: 20;
            display: flex; align-items: baseline; justify-content: center; gap: var(--space-sm);
            padding: 0; text-align: center; background: none; border: 0; border-radius: 0;
        }
        #timer .timer-label, #timer .timer-display, #timer .pacing-info { font-size: var(--fs-sm); line-height: 1.3; }
        /* One line, so it needs a line's worth of room under it and no more. */
        body.in-session #timer { margin-bottom: var(--space-sm); }
        /* With no border left to pulse, the danger state is carried by the figure. */
        #timer.danger { animation: pulseDanger 1.1s var(--ease) infinite; }
        @keyframes pulseDanger { 50% { opacity: 0.55; } }
        .timer-display { font-family: var(--font-head); font-weight: 600; letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; color: var(--text); }
        #timer.danger .timer-display { color: var(--red-text); }
        .pacing-info { font-weight: 600; margin-top: 0; font-variant-numeric: tabular-nums; }

        /* A 3px hairline told you nothing but "some". This is a real track: 8px, the
           quarters marked so a length means something at a glance, and a bright tip on
           the fill so the leading edge is findable on a 300-question round. */
        .quiz-progress {
            position: relative; height: 8px; margin-bottom: var(--space-2xl); flex-shrink: 0;
            background: var(--surface3); border-radius: var(--radius-pill);
            overflow: hidden;
        }
        .quiz-progress > span {
            position: relative; display: block; height: 100%; width: 0;
            border-radius: inherit; background: var(--accent-grad);
            transition: width 0.45s var(--ease-spring);
        }
        /* The leading edge, lit from inside the fill so the pill's clip keeps it tidy. */
        .quiz-progress > span::after {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 12px;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, var(--on-accent));
            opacity: 0.4;
        }
        /* One continuous track. It used to carry quarter marks, which nothing on the
           screen explained — a bar cut into four reads as four somethings, and the
           readouts already state the count exactly. */

        /* NOT a tile. The question sits on the page and the options are the boxes
           inside it — a card around a card around four cards is the containers-in-
           containers look, and the outer one carried no information. No fill, no
           hairline, no padding: the question's left edge is the column's left edge. */
        .question-card { padding: 0; }
        .q-enter { animation: qEnter 0.4s var(--ease-spring) both; }
        @keyframes qEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .question-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); margin-bottom: var(--space-md); flex-shrink: 0; }
        .question-meta > div:first-child { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
        .question-num { color: var(--accent-text); flex-shrink: 0; }
        /* Plain text after a dot, not a pill. The category is context you glance
           at; a bordered chip next to the bordered buttons made the row above the
           question busier than the question. */
        /* --muted: it names the topic of the question you are reading, which is content,
           not a placeholder. The separator dot stays in --faint — that IS decoration. */
        .question-category {
            font-size: var(--fs-2xs); font-weight: 500; color: var(--muted);
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .question-category:empty { display: none; }
        .question-category::before { content: '·'; margin-right: var(--space-sm); color: var(--faint); }
        .question-meta-actions { display: flex; gap: var(--space-sm); flex-shrink: 0; }
        /* These are buttons and have to look like buttons: an icon floating on the
           page is a decoration. They stay small and quiet — a hairline and the tile
           fill — but never borderless. */
        .speak-btn, .bilingual-toggle {
            border: none; background: none; color: var(--sub-text);
            font-size: var(--fs-2xs); font-weight: 600;
            min-height: var(--ctl-sm); padding: 0 var(--space-xs);
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.16s var(--ease);
        }
        .speak-btn { min-width: 34px; padding: 0 var(--space-xs); }
        /* On a touch screen every one of these is a finger target, not a cursor target. */
        @media (pointer: coarse) {
            .speak-btn, .bilingual-toggle, .session-back, .brand { min-height: var(--ctl-md); }
            /* The next rung UP, or this rule sets the height it already had: an answer
               row is the thing you reach for most, and a thumb gets the height back. */
            .option-btn { min-height: var(--ctl-lg); }
            /* The two segs sit in two places now and want two sizes. In the PANEL a
               menu option is something you aim at, so it takes the ordinary 44px
               floor. In the ROW the theme toggle is back to being glance-only chrome
               in a strip with two other things, which is the exception --ctl-sm is
               for. The `>` is load-bearing: it keeps this off the panel's seg, which
               is nested inside .hmenu. */
            .hmenu-panel .seg-btn { min-height: var(--ctl-md); }
            .header-controls > .seg .seg-btn { min-height: var(--ctl-sm); }
            .speak-btn { min-width: 44px; }
            .q-nav-btn { min-height: var(--ctl-md); }
            /* Previous/Next and the results screen's three actions are sized DOWN on
               purpose (--ctl-sm, --fs-xs) so they do not weigh as much as the question
               or the score ring beside them. That is a visual-weight decision and it
               holds for a mouse; on a thumb it left the app's most-pressed control at
               36px, under the 44px floor everything else that is CONTENT keeps. Same
               move .option-btn already makes here: the height comes back on touch and
               the desktop look is untouched. */
            .quiz-nav .btn-primary, .quiz-nav .btn-secondary { min-height: var(--ctl-md); }
            .end-actions .btn-primary, .end-actions .btn-secondary { min-height: var(--ctl-md); }
            /* The footer's links are 17px of text with 8px between them, i.e. a 25px
               pitch. That scrapes past WCAG 2.5.8 on spacing alone, and four of these
               START A ROUND, so they get a real target rather than a technicality.
               --ctl-sm, not --ctl-md: they are a list of links, not the card's own
               buttons, and 44px x 4 would make the footer taller than the content it
               sits under. Applying the rule the last mobile pass wrote down: a control
               shrunk for visual weight gets added to this block in the same change. */
            .footer-link { min-height: var(--ctl-sm); display: inline-flex; align-items: center; }
        }
        .speak-btn svg, .bilingual-toggle svg { width: var(--icon-sm); height: var(--icon-sm); }
        .bilingual-toggle { gap: var(--space-sm); }
        .speak-btn:hover, .bilingual-toggle:hover { color: var(--text); }
        .bilingual-toggle.active { color: var(--accent-text); }

        .question-text { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-lg); line-height: 1.4; letter-spacing: var(--ls-display); color: var(--text); text-wrap: pretty; }
        .question-text:focus { outline: none; }
        .question-english { display: none; margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px dashed var(--border); color: var(--muted); font-size: var(--fs-sm); line-height: var(--lh-prose); }
        .question-english.show { display: block; }
        .question-image { width: 100%; max-width: 294px; margin: var(--space-md) auto 0; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        #imageCredit { color: var(--muted); }

        .options { display: flex; flex-direction: column; gap: var(--space-sm); margin-top: var(--space-lg); }
        .option-btn {
            display: flex; align-items: center; gap: var(--space-sm);
            width: 100%; text-align: left;
            min-height: var(--ctl-md);
            padding: var(--space-sm) var(--space-ms);
            /* concentric: a 16px card with 14px of padding holds a 10px option. */
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            /* --surface2 in BOTH themes now. This was --surface in light, on the
               argument that --surface2 was a 1.02 step on the old paper-grey page and
               therefore the washed-out look. On a WHITE canvas that argument inverts:
               --surface IS the page, and --surface2 is a clear 1.15 step above it. */
            background: var(--surface2); color: var(--text);
            font-size: var(--fs-md); line-height: 1.4;
            transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
        }

        @media (hover: hover) {
            /* --surface3, not --hover, in BOTH themes now that the option is --surface2.
               --hover is the token that knows which way each theme steps, and in light
               it steps DOWN from --surface — from --surface2 that is the wrong way and a
               1.03 step besides. One rung up the ramp is the same move in both. */
            .option-btn:hover:not(:disabled) { border-color: var(--border-hover); background: var(--surface3); }
        }
        .option-btn:active:not(:disabled) { background: var(--surface3); }
        .option-btn:disabled { cursor: default; }
        .opt-letter {
            flex-shrink: 0; width: 26px; height: 26px; border-radius: var(--radius-sm);
            display: grid; place-items: center;
            font-weight: 600; font-size: var(--fs-2xs);
            /* The chip is the well inside the option now that the option is the tile.
               Its letter is --sub-text, not --muted: A/B/C/D is how you name the answer
               you are picking, and --muted put it at 4.68 on the chip in dark — the
               PLACEHOLDER tier (theme-dark.md §2 measures 4.67 there), on a label that
               is content. --sub-text lands it in the secondary band, 6.4 dark / 9.2
               light, and the chip reads at a glance instead of disappearing. */
            color: var(--sub-text); background: var(--surface3); border: 1px solid var(--border);
            transition: border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        @media (hover: hover) {
            .option-btn:hover:not(:disabled) .opt-letter { border-color: var(--border-hover); color: var(--text); }
        }
        .opt-text-wrap { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
        /* The English line IS the answer for a reader using the translation, so it takes
           the secondary tier rather than the quietest one. */
        .option-en-text { display: none; font-size: var(--fs-2xs); color: var(--sub-text); font-style: italic; }
        .option-en-text.show { display: block; }
        /* The dim is a text tier now; the fill it used to borrow is the base. */
        /* :not(.picked) too — in the exam the chosen option carries no green or red, so
           without it the answer you put down is the one thing on the row that dims. */
        .options.answered .option-btn:not(.correct):not(.incorrect):not(.picked) { color: var(--muted); }
        /* The exam's only answer state: what you put down, said without saying whether
           it is right. Accent rather than green or red, and the letter chip filled so it
           reads at a glance from the navigator's cell colour too. */
        .option-btn.picked { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
        .option-btn.picked .opt-letter { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
        .option-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--text); }
        .option-btn.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; }
        html:not(.light) .option-btn.correct .opt-letter { color: #04231A; }
        .option-btn.incorrect { border-color: var(--red); background: var(--red-dim); color: var(--text); }
        .option-btn.incorrect .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }
        html:not(.light) .option-btn.incorrect .opt-letter { color: #3A0A0A; }
        .option-btn.just-picked { animation: pickPop 0.28s var(--ease); }
        @keyframes pickPop { 0% { transform: scale(1); } 45% { transform: scale(1.015); } 100% { transform: scale(1); } }

        /* margin-inline: auto — the grid is capped at 70% of the column, and without it
           that 30% all fell on the right, so a four-image question sat off-centre under
           a full-width question. */
        /* ONE row of four, not 2x2. Four pictures you are choosing between are four
           things to compare, and a 2x2 makes you compare them in two passes; side by
           side they read in one. It also halves the block's height, which is what pays
           for the extra width.
           Capped against the VIEWPORT as well as the column, because the frames are
           square: the column width sets the frame width and the frame width sets the
           height, so on a wide screen an uncapped row would push the labels off the
           bottom. You can open any of them full size, so a thumbnail only has to be
           recognisable, not readable. */
        .options--image { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-md); max-width: min(100%, 72svh); margin-inline: auto; }
        .option-btn--image { flex-direction: column; align-items: stretch; padding: var(--space-sm); gap: var(--space-sm); }
        .option-btn--image { min-height: 0; }
        /* A SQUARE frame, not 4/3. The catalogue's crests run 0.78-1.0 in aspect, so in a
           landscape box every one of them was height-limited and they came out 136-174px
           wide against an identical 174px box — same height, visibly different sizes. A
           square frame is the shape the content actually is, so each image fills it and
           the four read as one set. `contain` stays: these images ARE the answer and
           cropping one can remove the detail that distinguishes it. */
        .opt-img { position: relative; display: block; border-radius: var(--radius-xs); overflow: hidden; background: var(--surface2); border: 1px solid var(--border-soft); aspect-ratio: 1 / 1; }
        .opt-img img { width: 100%; height: 100%; object-fit: contain; }
        /* The whole picture is the zoom target — the option is a BUTTON, so the click
           handler stops propagation or looking would answer the question. Selecting is
           the label row beneath, which is why it keeps its own hover. */
        .opt-img { cursor: zoom-in; }
        /* On a pointer device the invitation is the hover itself: a veil over the
           picture carrying the words, so nothing sits on top of the answer at rest. */
        .opt-img-hover {
            position: absolute; inset: 0; display: grid; place-items: center;
            padding: var(--space-sm); text-align: center;
            font-size: var(--fs-2xs); font-weight: 600; line-height: 1.3;
            /* 0.60, not 0.55: the veil lets 45%/40% of the picture through, so the WORST
               case is a white crest, and at 0.55 the composite was #78787A — 4.41 against
               #fff at 0.76rem, under the AA floor. 0.60 composites to #6B6C6E, 5.26. Both
               literals are registered in tools/contrast.test.mjs (LITERAL_PAIRS). */
            color: #fff; background: rgba(9, 10, 13, 0.60);
            opacity: 0; transition: opacity 0.16s var(--ease);
        }
        @media (hover: none) { .opt-img-hover { display: none; } }
        @media (hover: hover) {
            .opt-img:hover .opt-img-hover { opacity: 1; }
        }
        .question-image { cursor: zoom-in; }
        /* Where there is no hover to carry the message, one quiet line does — under the
           question, above the pictures it is talking about. */
        .img-zoom-hint { display: none; margin: 0 0 var(--space-sm); text-align: center; font-size: var(--fs-2xs); color: var(--muted); }
        @media (hover: none) { .img-zoom-hint { display: block; } }

        /* ---- Image lightbox ---- */
        .img-zoom[hidden] { display: none; }
        .img-zoom { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: var(--space-lg); }
        .img-zoom-backdrop { position: absolute; inset: 0; background: rgba(9, 10, 13, 0.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
        .img-zoom-figure {
            position: relative; margin: 0; max-width: min(760px, 100%); max-height: 100%;
            display: flex; flex-direction: column; gap: var(--space-sm);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: var(--space-md);
        }
        /* OFF the picture: in the overlay's own corner, so it never covers a corner of
           the thing you opened it to look at. Clicking anywhere outside the frame closes
           it too — the backdrop fills the rest of the screen. */
        .img-zoom-close {
            position: absolute; top: var(--space-md); right: var(--space-md);
            width: var(--ctl-md); height: var(--ctl-md); z-index: 2;
            display: grid; place-items: center;
            background: none; border: none; color: var(--sub-text);
            cursor: pointer; transition: color 0.16s var(--ease);
        }
        .img-zoom-close:hover { color: var(--text); }
        .img-zoom-close svg { width: var(--icon-md); height: var(--icon-md); }
        .img-zoom img { display: block; width: 100%; max-height: calc(100svh - 190px); object-fit: contain; border-radius: var(--radius-sm); }
        .img-zoom-caption { font-size: var(--fs-xs); color: var(--sub-text); text-align: center; }
        @media (max-width: 620px) {
            .img-zoom { padding: var(--space-md); }
            .img-zoom-figure { padding: var(--space-sm); }
        }
        /* overflow-wrap, because `Christusmonogramm` is a single 17-character word: its
           min-content width alone made that column wider than its neighbour, and with
           `1fr` meaning minmax(auto, 1fr) the grid handed it the extra space. The two
           tiles then held different-sized pictures for no reason but a label. */
        .option-btn--image .opt-num { font-size: var(--fs-xs); font-weight: 500; color: var(--sub-text); text-align: center; overflow-wrap: anywhere; }
        .option-btn--image.img-missing .opt-img { display: grid; place-items: center; min-height: 120px; }
        .option-btn--image.img-missing .opt-img::after { content: attr(data-missing); font-size: var(--fs-2xs); color: var(--muted); }
        .option-btn--image.img-missing .opt-img img { display: none; }

        .keyboard-hint { position: relative; padding: var(--space-2xs) var(--space-xs) var(--space-2xs) var(--space-ms); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: var(--fs-2xs); color: var(--muted); display: flex; align-items: center; gap: var(--space-2xs); flex-wrap: wrap; }
        @media (hover: none) { .keyboard-hint { display: none; } }
        kbd { font-size: var(--fs-2xs); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border); color: var(--sub-text); box-shadow: 0 1px 0 var(--border); font-weight: 600; }
        .keyboard-hint-close {
            margin-left: var(--space-2xs); width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-pill);
            color: var(--muted); font-size: var(--fs-base); line-height: 1;
        }
        .keyboard-hint-close:hover { color: var(--text); background: var(--hover); border-color: var(--border-hover); }

        .explanation { display: none; margin-top: var(--space-md); padding: var(--space-ms) var(--space-ms); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); animation: fadeUp 0.28s var(--ease) both; }
        .explanation.show { display: block; }
        .explanation.correct { border-color: var(--green); background: var(--green-dim); }
        .explanation.incorrect { border-color: var(--red); background: var(--red-dim); }
        .explanation-header { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-base); margin-bottom: var(--space-2xs); letter-spacing: var(--ls-display); }
        .explanation.correct .explanation-header { color: var(--green); }
        .explanation.incorrect .explanation-header { color: var(--red-text); }
        .explanation-text { color: var(--sub-text); font-size: var(--fs-sm); line-height: var(--lh-prose); }
        .explanation-english { display: none; margin-top: var(--space-xs); color: var(--muted); font-size: var(--fs-xs); font-style: italic; }
        .explanation-english.show { display: block; }

        /* Sidebar navigator */
        .quiz-sidebar {
            width: 248px;
            border-radius: var(--radius);
            padding: var(--space-ms);
            position: sticky;
            top: calc(var(--header-h) + 8px);
            /* Never taller than the screen — otherwise it is not sticky, it is just long.
               vh first: a browser that does not know svh drops that line and keeps this
               one, rather than dropping the cap and growing to 2900px again. */
            max-height: calc(100vh - var(--header-h) - 24px);
            max-height: calc(100svh - var(--header-h) - 24px);
            display: flex; flex-direction: column;
        }
        /* A real button at every width now that the panel collapses on the desktop too. */
        .sidebar-header { cursor: pointer; flex-shrink: 0; }
        .sidebar-header-row { display: flex; align-items: center; justify-content: space-between; min-height: var(--ctl-xs); }
        /* A drawn chevron in a hit target, not a dingbat: the glyph rendered at a
           different weight and baseline in every font stack. */
        .sidebar-chevron {
            display: grid; flex-shrink: 0;
            width: var(--ctl-xs); height: var(--ctl-xs);
            place-items: center; color: var(--muted);
            transition: transform 0.25s var(--ease), color 0.2s var(--ease);
        }
        .sidebar-chevron svg { width: var(--icon-sm); height: var(--icon-sm); }
        .sidebar-chevron.open { transform: rotate(180deg); }
        .sidebar-header:hover .sidebar-chevron { color: var(--text); }
        /* Same gutter as .question-body — the nav numbers were touching the bar. */
        .sidebar-body {
            margin-top: var(--space-sm); min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* The grid is the scroller, not the panel: the view switcher above it is a
           control OVER the list and used to scroll away with it. Both views of the
           list carry the id, so the rule is written against that and not the class
           the renderer swaps. */
        #questionNavGrid {
            /* align-content: start is load-bearing. A grid defaults to stretch, and
               this one is now a flex child that FILLS the panel — so with fewer cells
               than room, the auto rows stretched to fit and every cell came out a tall
               rounded slab instead of the square the aspect-ratio asks for, with the
               row gap swallowed. Extra room belongs at the bottom of the list. */
            align-content: start;
            flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain;
            padding-right: var(--space-sm); margin-right: calc(var(--space-sm) * -1);
        }
        /* Six across in the sidebar, many more across the full-width strip on a
           narrow screen. 34px clears the 24px AA target with room and still holds a
           three-digit number — which a shuffled round shows. */
        .question-nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: var(--space-2xs); }

        /* Collapsible category groups. The group holding the current question is
           always open; anything else the reader opened stays open across renders. */
        .question-nav-groups { display: flex; flex-direction: column; gap: var(--space-2xs); }
        .qnav-group { border-radius: var(--radius-sm); }
        .qnav-group + .qnav-group { border-top: 1px solid var(--border-soft); padding-top: var(--space-2xs); }
        .qnav-group-head {
            display: flex; align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-sm); padding: 0 var(--space-2xs);
            cursor: pointer; list-style: none;
            font-size: var(--fs-2xs); font-weight: 600; color: var(--sub-text);
        }
        .qnav-group-head::-webkit-details-marker { display: none; }
        /* One caret, drawn here, rotating on open. */
        .qnav-group-head::before {
            content: ''; flex-shrink: 0;
            width: 6px; height: 6px; margin-left: var(--space-3xs);
            border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform 0.18s var(--ease);
        }
        .qnav-group[open] > .qnav-group-head::before { transform: rotate(45deg); }
        .qnav-group-head:hover { color: var(--text); }
        .qnav-group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qnav-group-count { flex-shrink: 0; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
        .qnav-group > .question-nav-grid { padding: var(--space-2xs) 0 var(--space-sm); }

        /* Order/view is a round-level control, so it sits above the numbers it
           re-orders. Same segmented control as the header switches — three
           mutually exclusive views is exactly what that pattern is for. */
        #navActions:empty { display: none; }
        #navActions { flex-shrink: 0; margin: 0 0 var(--space-sm); }
        .qnav-seg { display: flex; width: 100%; }
        .qnav-seg .seg-btn { flex: 1; min-width: 0; padding: 0 var(--space-xs); font-size: var(--fs-2xs); min-height: var(--ctl-xs); }

        /* Stated after the base rules above, not with the other coarse-pointer
           overrides earlier in the sheet — same specificity, so source order decides. */
        @media (pointer: coarse) {
            .qnav-seg .seg-btn, .qnav-group-head { min-height: var(--ctl-md); }
        }
        .q-nav-btn { aspect-ratio: 1; min-height: var(--ctl-xs); border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: var(--radius-sm); font-size: var(--fs-2xs); font-weight: 600; font-variant-numeric: tabular-nums; transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease); }
        .q-nav-btn:hover { border-color: var(--border-hover); background: var(--hover); color: var(--text); }
        .q-nav-btn.qnav-current { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
        /* Answered, mark withheld — the exam's cell. */
        .q-nav-btn.qnav-answered { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
        .q-nav-btn.qnav-correct { background: var(--green-dim); border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--green); }
        .q-nav-btn.qnav-incorrect { background: var(--red-dim); border-color: color-mix(in srgb, var(--red) 55%, transparent); color: var(--red-text); }

        /* ============================================================
           END SCREEN
           ============================================================ */
        .end-screen { max-width: 680px; margin: 0 auto; text-align: center; }
        .end-screen > h1 { font-family: var(--font-head); font-weight: 700; font-size: var(--fs-2xl); letter-spacing: var(--ls-display); margin-bottom: var(--space-lg); }
        /* A ROW, not a stack. The card is 680px wide and held a 170px ring centred in it
           with a pill underneath: 286px tall and empty either side of the ring. The ring
           sits ON the page now: a box around a ring and a verdict says nothing the ring
           does not, and it cost a band of height at the top of every result. */
        .score-hero { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
        .score-ring-wrap { position: relative; width: 190px; height: 190px; flex-shrink: 0; margin: 0; }
        .score-ring { width: 100%; height: 100%; display: block; }
        .score-ring-track { fill: none; stroke: var(--surface3); stroke-width: 9; }
        .score-ring-bar { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.1s var(--ease-spring); }
        .score-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2xs); }
        .score-ring-pct { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-3xl); letter-spacing: var(--ls-display); line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); }
        .score-ring-center .score-number { font-size: var(--fs-sm); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
        /* Only an exam has a pass mark, so on every other round this is empty — and an
           empty inline-block still spent its margin and padding as a blank band under
           the ring. Visible once it has something to say. */
        .pass-fail:empty { display: none; }
        /* align-self so the pill is as wide as its words, inside a stretch column. */
        .pass-fail { display: inline-block; align-self: center; margin: 0; font-family: var(--font-head); font-weight: 600; font-size: var(--fs-md); padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-pill); }
        .pass-fail.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .pass-fail.fail { color: var(--red-text); background: var(--red-dim); }
        /* ONE band, figures separated by hairlines — the same move the home overview card
           makes. It replaces two wells and three more cards: five boxes for five numbers,
           each a container holding nothing but a label and a figure. */
        /* Three bands are built this way now: the results breakdown, the landing tier's
           why-band and its four headline numbers. One rule, so the hairline gap below is
           the only 1px literal in the sheet. */
        /* .why-grid was the third selector here until 2026-09-21 and is not any more:
           it is no longer a panel at all. See its own rule above. */
        .result-stats, .stats-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            border: 1px solid var(--border); border-radius: var(--radius);
            /* The separators are a 1px GAP over the band's own colour, not a border on
               each cell: a border-left lands on the first cell of a wrapped row too, and
               draws a stray line down the middle of the band on a phone. A gap separates
               in both directions and cannot do that. */
            gap: 1px; background: var(--border); overflow: hidden;
        }
        .result-stats { margin-top: var(--space-xl); }
        .result-stat {
            flex: 1 1 0; min-width: 104px;
            padding: var(--space-ms) var(--space-md);
            display: flex; flex-direction: column; align-items: center; gap: var(--space-2xs);
            background: var(--surface);
        }

        .result-stat .rs-label { font-size: var(--fs-2xs); letter-spacing: var(--ls-caps); text-transform: uppercase; color: var(--muted); }
        .result-stat .rs-num { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-xl); line-height: 1; letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }
        .pass-threshold-note { font-size: var(--fs-xs); color: var(--muted); margin: 0; }
        .pass-threshold-note[hidden] { display: none; }
        .review-section { margin-top: var(--space-xl); text-align: left; }
        .review-section-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-lg); }
        /* The exam's header is the count alone — no heading beside it to sit opposite, and
           no button since Retry moved up to the action row — so it centres rather than
           hanging off the left edge. */
        .review-section-header--solo { justify-content: center; }
        .review-section-header h2 { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-lg); letter-spacing: var(--ls-display); }
        .review-header-actions { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; }
        .review-count { color: var(--muted); font-size: var(--fs-sm); }
        .review-item { padding: var(--space-md); border-radius: var(--radius); margin-bottom: var(--space-sm); }
        .review-q-num { margin-bottom: var(--space-xs); }
        .review-q-text { font-weight: 600; font-size: var(--fs-md); line-height: 1.4; margin-bottom: var(--space-md); }
        .review-answers { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-md); }
        .review-answer { font-size: var(--fs-sm); padding: var(--space-sm) var(--space-ms); border-radius: var(--radius-sm); }
        .review-answer.user-wrong { color: var(--red-text); background: var(--red-dim); }
        .review-answer.correct-ans { color: var(--green); background: var(--green-dim); }
        /* The exam's list carries every question, so it needs a right and a blank too. */
        .review-answer.user-right { color: var(--green); background: var(--green-dim); }
        .review-answer.user-blank { color: var(--muted); background: var(--surface2); }
        .review-explanation { font-size: var(--fs-sm); color: var(--sub-text); line-height: var(--lh-prose); padding-top: var(--space-sm); border-top: 1px solid var(--border-soft); }
        .review-explanation-en { color: var(--muted); font-style: italic; margin-top: var(--space-xs); }

        /* ============================================================
           MOTION PREFERENCES
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 940px) {
            /* The hero stacks, photo FIRST: the picture is what says what this is, and
               below the fold a headline over a 1:1 photograph pushes the buttons off. */
            .hero-landing { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
            .hero-visual { order: -1; max-width: 460px; width: 100%; margin-inline: auto; }
            .hero-text { align-items: center; text-align: center; }
            .hero-lead { margin-inline: auto; }

            /* body.in-session-prefixed, or the desktop two-column rule outranks this one
               and the areas fight: "main stats" against a single column collapsed the
               question to 12px. */
            body.in-session .quiz-layout, .quiz-layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto auto;
                grid-template-areas: "main" "stats" "nav";
            }
            /* The question comes first and the collapsed navigator sits UNDER it: on a
               phone the strip was the first thing on the screen, competing with the
               question for the reader's first look. The card takes the flexible row,
               the strip takes what it needs. */
            body.in-session .quiz-layout { position: relative; }
            /* Expanded, the panel takes a share of the screen and no more: it grows
               up from the bottom to 42% of the viewport and the numbers scroll INSIDE
               it, so the question stays on screen above. It used to cover the card
               outright (absolute; inset: 0), which is fine when the strip is at the
               top of the screen and wrong now that it is at the bottom — you lost the
               question you were answering the moment you opened the overview. The card
               shrinks into what is left; .question-body is its scroller. */
            body.in-session .quiz-sidebar { z-index: 30; }
            /* Collapsed, this is a strip with one line of text in it — the card's
               padding made it a 76px box holding a 20px label. */
            /* The card stretches again here, which parks .quiz-nav at the bottom of
               the column — the two buttons then sit in the same place on every
               question, directly above the overview strip, where a thumb can learn
               them. The question itself stays top-aligned inside .question-body.
               (There is no rule above them: pinned, it would float in open space —
               and it separated nothing on a wide screen either.) */
            /* The fixed pane height is a DESKTOP rule: down here the navigator is a
               collapsed strip, and a 450px strip is 450px of nothing. */
            body.in-session .quiz-sidebar { height: auto; max-height: none; align-self: auto; }
            /* No floor here: the card fills its area instead, which parks the buttons
               directly above the overview strip — one position on every question, and
               the place a thumb is already reaching for. */
            body.in-session .question-body { min-height: 0; }
            /* Nothing to spend down here either: the card already fills its area and
               the buttons are already pinned above the strip, so the shift would come
               straight out of the question and start it scrolling. */
            body.in-session .quiz-layout { flex: 1; margin-block: 0; }
            /* No spare space to split down here — the layout fills its row — and left
               growing they would take the column and collapse the question to nothing. */
            body.in-session .quiz-headspace, body.in-session .quiz-tailspace { display: none; }
            /* The readouts move BELOW Previous and Next on a phone. At the top they
               were the first thing on the screen, competing with the question for the
               reader's first look, and they are a running tally you glance at — not
               something to lead with. `order` moves them without touching the DOM, so
               the reading order stays question-first and the focus order with it.
               The gap above is a full --space-2xl: the buttons belong to the
               question, the tally and the overview strip below do not, and that
               distance is what says so. */
            body.in-session .quiz-topbar { margin-top: var(--space-2xl); margin-bottom: 0; }
            /* Back to one line down here: the panel's 248px column is what asked for a
               2x2, and on a phone the row is the full width. */
            body.in-session .quiz-topbar .stats-bar { display: flex; }
            /* The column has to take the whole row before the card can fill it: the
               grid places items at the start, so on its own .quiz-main is as tall as
               its content and flex: 1 has nothing to grow into. */
            body.in-session .quiz-main { align-self: stretch; }
            body.in-session .question-card { flex: 1; }
            .quiz-sidebar { width: auto; position: static; padding: var(--space-xs) var(--space-md); margin-top: var(--space-sm); }
            .sidebar-header { cursor: pointer; min-height: var(--ctl-md); display: flex; flex-direction: column; justify-content: center; }
            /* Below this the hint costs the card a row for a tip that is only ever
               shown once — and there is no keyboard to hint at. The CONTAINER goes
               too: hidden content still left its top margin between the buttons and
               the overview strip. */
            .keyboard-hint { display: none; }
            #keyboardHintContainer { display: none; }
            /* The buttons and the strip below them are one band at the bottom of the
               screen, so they sit close enough to read as one. */
            .quiz-layout { gap: 0 var(--space-sm); }

            .sidebar-body { display: none; }
            /* flex, not block: the grid inside it is the scroller now. vh first, as
               everywhere else, so a browser without svh keeps a cap. 26% here plus the
               header and the panel's own padding puts the WHOLE panel just under 35%
               of the screen, which is the budget — the question keeps the rest. */
            .sidebar-body.expanded { display: flex; max-height: 26vh; max-height: 26svh; }
        }

        @media (max-width: 620px) {
            main { padding: var(--space-lg) var(--space-md); padding-bottom: calc(var(--space-2xl) + env(safe-area-inset-bottom)); }
            /* body.in-session main outranks the rule above it on specificity alone,
               media query or not, so the 16px gutter has to be restated here. */
            body.in-session main {
                padding: var(--space-sm) var(--space-md);
                padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom));
            }

            /* Hero: introduce, then get out of the way. */
            .hero-landing { padding: var(--space-ms) 0 var(--space-lg); gap: var(--space-lg); }
            .hero-cta-row { width: 100%; flex-direction: column; gap: var(--space-sm); margin-top: var(--space-ms); }
            .hero-cta-row .btn-primary, .hero-cta-row .btn-secondary { width: 100%; }
            /* The margin notes are decorative, and down here they have nowhere to sit
               that is not on top of the building. */
            .stats-item--note, .cta-note, .cta-art { display: none; }

            .why-item { flex-basis: 100%; }
            /* Stacked, the small print has nothing to sit opposite, so it stops
               being right-aligned and reads from the same edge as the mark. */
            .site-footer { padding-inline: var(--space-md); }
            /* Stacked, the brand column stops reserving width it no longer needs. */
            .footer-inner { gap: var(--space-xl); }
            .footer-col--brand { flex-basis: 100%; max-width: none; }
            .cta-band { padding: var(--space-lg); gap: var(--space-ms); }
            .cta-btn { width: 100%; }

            .home-section { margin-bottom: var(--space-lg); }
            /* The panel's desktop air is a desktop rhythm; down here it is a band of
               nothing either side of a full-width card. It also stops bleeding: one
               column does not need the width, and a 16px radius against the screen edge
               is not a corner. */
            .modes-band { padding: var(--space-lg) var(--space-md); }
            /* A section's one-line description is a desktop affordance. Down here each
               wraps to two lines and the four of them cost ~150px — 7% of the page —
               while the headings above them already name the section. The heading stays;
               the gloss goes. */
            .section-head p { display: none; }
            .section-head h2, .cta-copy h2 { font-size: var(--fs-lg); }
            .section-head p { font-size: var(--fs-sm); }
            .dash { padding: var(--space-ms); }
            /* The ring stops being a column of its own and sits above the counters. */
            /* Stacked, the hairline that separated ring from stats becomes the
               rule under the ring. */
            .dash-body { grid-template-columns: 1fr; justify-items: center; gap: var(--space-ms); }
            .dash-stats { width: 100%; border-left: none; border-top: 1px solid var(--border); padding-top: var(--space-ms); padding-right: 0; }
            .ready-ring-wrap { width: 96px; height: 96px; }
            /* Full width down here, label hard left and pill hard right, rather than
               a centred pair with the band's padding wasted either side of it. */
            #statePickerSlot { width: 100%; justify-content: space-between; }
            .state-picker { flex: 1; min-width: 0; justify-content: space-between; }

            /* One card a row on a phone. They stay GRIDS rather than flex columns so
               the meta and the arrow can share the last row. */
            .modes-grid { grid-template-columns: 1fr; gap: var(--space-sm); }
            .mode-card {
                display: grid;
                grid-template-columns: 1fr;
                grid-template-areas: "title" "desc" "meta" "start";
                row-gap: var(--space-2xs);
            }
            /* Back to one row down here: the card is a list item, not a tile, so the
               plate sits beside the name rather than stacked above it. */
            .mode-card .mode-head { grid-area: title; margin-bottom: 0; flex-direction: row; align-items: center; gap: var(--space-sm); }
            .mode-card .mode-description { grid-area: desc; margin-bottom: 0; font-size: var(--fs-xs); }
            .mode-card .mode-meta { grid-area: meta; margin: var(--space-2xs) 0 0; }
            /* Centred in a TILE, hard left in a list row: down here the title, the
               description and the meta are all flush left in a 343px row, and a centred
               action would be the one thing floating in the middle of it. */
            .mode-card .mode-start { grid-area: start; margin-top: var(--space-2xs); justify-content: flex-start; }

            /* ONE column, and two-up was tried and reverted: at 175px the long topic
               names ('Fundamental Rights & Constitution') wrap to four lines, so a chip
               went 55px -> 114px and the section got TALLER (314 -> 340). The label is
               what decides this grid, not the icon. */
            .topic-grid { grid-template-columns: 1fr; }
            .sub-card { padding: var(--space-md); }
            .header-content { padding: var(--space-xs) var(--space-md); }
            .header-controls { gap: var(--space-2xs); }
            .seg { padding: 1px; }
            /* The .header-controls .seg-btn shrink to --ctl-xs that used to sit here
               is GONE. It was written for two segmented controls standing in the
               header strip; they moved into #prefsMenu's panel on 2026-09-21, so all
               the rule did down here was undo the coarse-pointer 44px floor above it
               (it is stated later in the sheet, so source order gave it the win) and
               hand a phone four 28px targets inside an opened menu. */
            .session-back { min-height: var(--ctl-sm); padding: 0 var(--space-ms) 0 var(--space-sm); font-size: var(--fs-2xs); gap: var(--space-sm); }
            .session-back-icon svg { width: var(--icon-sm); height: var(--icon-sm); }
            .brand { min-height: var(--ctl-sm); gap: var(--space-sm); }
            .brand-mark { width: var(--ctl-xs); height: var(--ctl-xs); }
            .brand-name { font-size: var(--fs-sm); }
            /* The strip is a glance down here: the tagline restates what the page
               already says, and brand + nav + menu + toggle does not fit a 343px
               content width. */
            /* The nav goes with it, and a ONE-ITEM nav ("the page you are not on")
               was tried on the day Practise became a screen and does not fit either.
               Measured at 375px: the content row is 343, the brand is 77 and the
               controls are 211, which leaves 55px for a link that sets 56 ("Home")
               to 71 ("Practise"). Dropping the nav's auto margins changes nothing -
               the row is simply full, and dropping About and FAQs did not free any
               of it (they sat in the nav, which was already hidden down here). So on
               a phone the two pages are reached the conventional way: the hero's
               Start button and the CTA band go to Practise, and the BRAND MARK goes
               home from anywhere. Do not add a nav item down here without taking
               something else out of the row. */
            .brand-tagline, .header-nav { display: none; }
            /* The number and the topic stack instead of sharing a line. Side by side in a
               375px row the topic was the one that lost, ellipsised to "Fundame..." —
               and it is the half that actually varies. Stacked, both read in full and
               the pair still aligns with the speak/translate buttons opposite, because
               the row centres the two columns against each other. */
            .question-meta > div:first-child { flex-direction: column; align-items: flex-start; gap: var(--space-2xs); }
            .question-category { white-space: normal; }
            .question-category::before { content: none; }
            .question-card { padding: var(--space-md); }
            /* The card's padding insets the question and its options by --space-md a
               side; the progress bar hangs off #quizScreen and .quiz-nav off .quiz-main,
               so neither inherited it and both ran 16px wider at each edge than the
               question they belong to. Measured at 390px: question 32-358, bar and
               buttons 16-374. They take the same inset now, so the bar starts where the
               question starts and Previous sits under the first option. Only below
               620px — above it the card has no padding and the three already agree. */
            body.in-session .quiz-progress,
            .quiz-nav,
            body.in-session .quiz-topbar,
            body.in-session .quiz-sidebar { margin-inline: var(--space-md); }
            .question-text { font-size: var(--fs-md); }
            body.in-session main { padding-left: var(--space-md); padding-right: var(--space-md); }
            /* Same trade, against the phone's narrower gutter. */
            body.in-session #endScreen.active {
                margin-inline: calc(-1 * var(--space-md));
                padding-inline: var(--space-md);
            }
            /* Still below the buttons here — only the gap tightens. margin-bottom stays
               0 from the 940px block; restating it as spacing-md would put a dead row
               under the tally and push the overview strip off a short phone. */
            .quiz-topbar { margin-top: var(--space-xl); }
            .question-meta { margin-bottom: var(--space-ms); }
            /* The tiles carry their own height on a wide grid; on a phone they
               only need to hold their content. */
            #statTile { min-height: 0; }
            /* Timer becomes one line so the question starts higher. The JS
               owns #timer's own display, so the children go inline instead. */
            #timer { padding: var(--space-sm) var(--space-md); }
            /* Already one line at one size; nothing left to collapse down here. */
            #timer { gap: var(--space-sm); }
            /* The strip needs air above it on a phone: flush to the top edge (or to a
               notch's inset) it read as part of the status bar. The safe-area inset is
               added to this, not replaced by it, so a notched phone gets both. */
            .header-content { padding-top: var(--space-md); padding-bottom: var(--space-ms); }
            /* ...and the progress bar drops clear of that row instead of sitting tight
               under the hairline. */
            body.in-session .quiz-progress { margin-top: var(--space-sm); margin-bottom: var(--space-lg); }
            /* One step down: the tally is a glance, and at the bottom of the column it
               no longer has to carry the row the way it did at the top. */
            .stats-bar { column-gap: var(--space-sm); row-gap: var(--space-2xs); }
            /* One declaration each. Three stacked PRs left three `.stat { gap }` rules
               (6/4/5px, last won) and set the label's size twice, so the "one size"
               a comment here claimed was overridden three lines under it. These are
               the values that were actually rendering. `.stat + .stat` had a
               `border-left: none` with nothing to cancel — the base rule carries no
               border since the hairlines between the readouts were dropped. */
            .stat { padding: 0; gap: var(--space-2xs); }
            .stat-value, .stat-of { font-size: var(--fs-2xs); }
            /* The answered readout drops its word, not its figure. Once the labels
               cleared the 12px floor the four no longer fitted one 360px line in
               German: "Beantwortet" alone sets ~100px, and the LABEL is what is wide,
               not the number. `n / total` is the one readout that names itself —
               beside Richtig, Falsch and Score it can only be the count — so it is
               the one that can give the word up and keep the row on one line. */
            .stats-bar .stat:last-child .stat-label { display: none; }
            .stat .stat-label { font-size: var(--fs-2xs); letter-spacing: var(--ls-caps); }
            /* Wraps to two rows rather than squeezing five figures into 390px. */
            .result-stat { min-width: 30%; }
            .score-ring-wrap { width: 160px; height: 160px; }
            /* One step down with the dial (190 -> 160px). It re-stated --fs-3xl, the value
               its base already carried, so the ring shrank and the numeral did not. */
            .score-ring-pct { font-size: var(--fs-2xl); }
            .btn-group { flex-direction: column; }
            .btn-group .btn-primary, .btn-group .btn-secondary { width: 100%; justify-content: center; }
            .hist-row { font-size: var(--fs-xs); gap: var(--space-sm); }
            /* Back to 2x2 on a phone. Four across a 375px row is an 80px frame under a
               three-line label — the comparison the single row buys you needs the
               pictures to still be legible, and down here they would not be. */
            .options--image { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: min(92%, 33svh); }
        }

        @media (max-width: 400px) {
            /* Stays 2x2, never one column: four square frames stacked is 757px of
               overflow on a 390px screen; two columns of small thumbnails fit, and a
               thumbnail only has to be recognisable now that any of them opens full
               size on a tap. */
            .options--image { max-width: min(92%, 26svh); }
            /* The label is what tips a 2x2 over on a narrow screen — "Christusmonogramm
               (Chi-Rho)" sets in three lines. It only has to name the picture. */
            .option-btn--image .opt-num { font-size: var(--fs-2xs); line-height: 1.25; }
            .option-btn--image { padding: var(--space-sm); gap: var(--space-sm); }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <button class="brand" onclick="showScreen('home')" data-i18n-aria="nav.home">
                <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="4" fill="#000000"/><rect y="4" width="12" height="4" fill="#DD0000"/><rect y="8" width="12" height="4" fill="#FFCE00"/></svg></span>
                <span class="brand-lockup">
                    <span class="brand-name">EIB Quiz</span>
                    <span class="brand-tagline" data-i18n="nav.tagline"></span>
                </span>
            </button>
            <button class="session-back" id="sessionBack" data-i18n-aria="nav.backAria">
                <span class="session-back-icon" aria-hidden="true"></span>
                <span data-i18n="nav.back"></span>
            </button>
            <!-- The mockup's centre nav, and both links go somewhere: Home is the
                 landing page, Practise is the app. Practise wears the primary button
                 because it is the way in. Nothing here promises a page we do not have —
                 About and FAQs were aria-disabled buttons wearing a "Soon" chip until
                 2026-09-21 and are gone. -->
            <nav class="header-nav" data-i18n-aria="nav.sections">
                <button class="nav-link nav-link--active" type="button" data-screen="home" aria-current="page" onclick="showScreen('home')" data-i18n="nav.navHome"></button>
                <button class="nav-link nav-link--cta" type="button" data-screen="practise" onclick="showScreen('practise')" data-i18n="nav.navPractise"></button>
            </nav>
            <div class="header-controls">
                <!-- One globe menu instead of two segmented controls, per the mockup.
                     A native <details> so open/close, Enter, Space and focus order come
                     free; the only JS is closing it on an outside click or Escape. The
                     theme switch moved INSIDE it — the mockup shows one control here,
                     and appearance is a preference you set once. -->
                <details class="hmenu" id="prefsMenu">
                    <summary class="hmenu-summary" data-i18n-aria="nav.preferences">
                        <span class="hmenu-icon" data-icon="globe" aria-hidden="true"></span>
                        <span id="langBadge">EN</span>
                        <span class="hmenu-caret" data-icon="chevron" aria-hidden="true"></span>
                    </summary>
                    <div class="hmenu-panel">
                        <span class="eyebrow" data-i18n="nav.language"></span>
                        <div class="seg" role="group" data-i18n-aria="nav.language">
                            <button class="seg-btn active" id="langEn" onclick="setLang('en')" lang="en" aria-pressed="true">EN</button>
                            <button class="seg-btn" id="langDe" onclick="setLang('de')" lang="de" aria-pressed="false">DE</button>
                        </div>
                    </div>
                </details>
                <!-- The theme toggle sits in the ROW, not in the menu: it is a
                     two-state switch you flip on sight, and burying it behind a
                     disclosure cost a click to do something instant. The globe menu
                     keeps the language, which is the thing that needs a current-value
                     readout. (The .header-cta "Start practising" that used to close
                     this row is gone: the hero's own Start is ten pixels below it on
                     the landing tier, and the dashboard tier has the mode band.) -->
                <div class="seg" role="group" data-i18n-aria="nav.scheme">
                    <button class="seg-btn active" id="darkBtn" data-i18n="nav.dark" aria-pressed="true">Dark</button>
                    <button class="seg-btn" id="lightBtn" data-i18n="nav.light" aria-pressed="false">Light</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <!-- Home Screen -->
        <section id="homeScreen" class="screen active">

            <!-- The home screen is the LANDING PAGE, for everyone, always. It was two
                 tiers over one section list until 2026-09-21 - a first visitor got the
                 marketing, a returner got the dashboard in its place - and the tier
                 switch retired when the app moved to #practiseScreen: one page each,
                 nothing to keep in sync. -->

            <!-- Landing hero: the pitch on the left, the building on the right. -->
            <div class="hero-landing">
                <div class="hero-text">
                    <p class="eyebrow" data-i18n="hero.eyebrow"></p>
                    <h1 class="hero-headline" data-i18n="hero.headline"></h1>
                    <p class="hero-lead" data-i18n="hero.lead"></p>
                    <div class="hero-cta-row">
                        <button class="btn-primary btn-lg" onclick="showScreen('practise')">
                            <span data-i18n="hero.cta"></span>
                            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M13.2 5.1 20.1 12l-6.9 6.9-1.8-1.8 3.8-3.8H4.4v-2.6h10.8l-3.8-3.8Z"/></svg>
                        </button>
                        <button class="btn-secondary btn-lg" onclick="scrollToId('whyBand')" data-i18n="hero.cta2"></button>
                    </div>
                </div>

                <div class="hero-visual">
                    <figure class="hero-photo">
                        <img src="img/hero-reichstag.webp" width="1100" height="1100" data-i18n-alt="hero.photoAlt" alt="">
                        <!-- Both overlays are children of the figure so they are placed
