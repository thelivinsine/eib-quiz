        function renderGlossary() {
            const el = document.getElementById('glossarySection');
            if (!el) return;
            const items = GLOSSARY.map(g => `
                <details class="gloss-item">
                    <summary lang="de">${g.term}</summary>
                    <div class="gloss-def"><span lang="de">${g.de}</span><span class="gloss-en" lang="en">${g.en}</span></div>
                </details>`).join('');
            el.innerHTML = `
                <details class="glossary-wrap">
                    <summary class="glossary-summary">${t('gloss.title', { n: GLOSSARY.length })}</summary>
                    <div class="gloss-list">${items}</div>
                </details>`;
        }

        // ============================================================
        // TEXT-TO-SPEECH (German question read-aloud)
        // ============================================================
        const ttsSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;
        function speakQuestion() {
            if (!ttsSupported) return;
            const q = state.currentQuestions[state.currentQuestionIndex];
            if (!q) return;
            const synth = window.speechSynthesis;
            if (synth.speaking) { synth.cancel(); return; } // toggle off
            const parts = [q.de, ...q.options.filter(o => o && !/^img\//.test(o))];
            const utt = new SpeechSynthesisUtterance(parts.join('. '));
            utt.lang = 'de-DE';
            utt.rate = 0.95;
            const deVoice = synth.getVoices().find(v => v.lang && v.lang.startsWith('de'));
            if (deVoice) utt.voice = deVoice;
            synth.cancel();
            synth.speak(utt);
        }

        // ============================================================
        // HOME · the overview card
        // ------------------------------------------------------------
        // One card, three levels of weight: the accuracy ring is the
        // headline, the three counters are the supporting row, and the
        // state picker and reset are the quiet edge.
        // ============================================================
        function renderHomeStatus() {
            const el = document.getElementById('homeStatus');
            // Its whole section is [data-needs-data], so a load failure hides it and
            // there is nothing to paint into. Guarded here rather than at each caller.
            if (!el || el.closest('[hidden]')) return;
            const pool = activePool();
            const totalPool = pool.length;
            const mastered = masteredCount();
            const due = reviewDueCount();
            const ring = overallAccuracy();
            const answeredInPool = pool.filter(q => progress[q.id]).length;

            // Resume banner — only when a saved in-progress session exists.
            const sess = getSavedSession();
            let resumeHtml = '';
            if (sess && Array.isArray(sess.ids) && sess.ids.length) {
                const sessLabel = sess.mode === 'topic'
                    ? catLabel(sess.topic)
                    : sess.mode === 'bundesland'
                        ? (STATES[sess.stateCode] || t('mode.state.title'))
                        : t('hist.mode.' + sess.mode);
                const answered = sess.answered ? Object.keys(sess.answered).length : 0;
                resumeHtml = `
                    <div class="resume-banner">
                        <div class="resume-text">
                            <strong>${t('dash.resume')}</strong>
                            <span>${sessLabel} · ${t('dash.resumeMeta', { n: answered, total: sess.ids.length })}</span>
                        </div>
                        <div class="resume-actions">
                            <button class="btn-primary btn-sm" onclick="resumeSession()">${t('dash.resumeGo')} →</button>
                            <button class="btn-secondary btn-sm" onclick="clearSession(); initHomeScreen();">${t('dash.resumeDrop')}</button>
                        </div>
                    </div>`;
            }

            el.innerHTML = `
                <div class="dash">
                    <div class="dash-body">
                        <div class="ready-ring-wrap" role="img" title="${ring}% ${t('dash.accuracy')}" aria-label="${ring}% ${t('dash.accuracy')}">
                            <svg class="ready-ring" viewBox="0 0 120 120" aria-hidden="true">
                                <circle class="ready-ring-track" cx="60" cy="60" r="50"></circle>
                                <circle class="ready-ring-bar" id="readyRingBar" cx="60" cy="60" r="50" transform="rotate(-90 60 60)"></circle>
                            </svg>
                            <div class="ready-ring-center">
                                <span class="ready-ring-pct" id="readyRingPct">0%</span>
                            </div>
                        </div>
                        <div class="dash-stats">
                            <div class="dash-stat">
                                <span class="ds-num">${answeredInPool}<span class="ds-of"> / ${totalPool}</span></span>
                                <span class="ds-label">${t('dash.answered')}</span>
                            </div>
                            <div class="dash-stat">
                                <span class="ds-num">${mastered}</span>
                                <span class="ds-label">${t('dash.mastered')}</span>
                            </div>
                            <div class="dash-stat${due ? ' dash-stat--due' : ''}">
                                <span class="ds-num">${due}</span>
                                <span class="ds-label">${t('dash.due')}</span>
                            </div>
                        </div>
                    </div>
                    ${resumeHtml}
                    ${answeredInPool > 0 ? `<button class="progress-reset" title="${t('dash.reset')}" aria-label="${t('dash.reset')}" onclick="if(confirm(t('dash.resetConfirm'))){clearProgress();initHomeScreen();}">${ICONS.reset}</button>` : ''}
                </div>`;

            animateReadyRing(ring);
        }

        function animateReadyRing(pct) {
            const bar = document.getElementById('readyRingBar');
            const lbl = document.getElementById('readyRingPct');
            if (!bar || !lbl) return;
            const C = 314; // 2*PI*r(50)
            bar.style.opacity = pct >= 2 ? '1' : '0'; // hide tiny arcs (round cap would show a stray dot)
            bar.style.strokeDashoffset = C;
            lbl.textContent = '0%';
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                bar.style.strokeDashoffset = String(C * (1 - pct / 100));
                if (reduce) { lbl.textContent = pct + '%'; return; }
                const t0 = performance.now(), dur = 900;
                const tick = now => {
                    const k = Math.min(1, (now - t0) / dur);
                    lbl.textContent = Math.round(pct * (1 - Math.pow(1 - k, 3))) + '%';
                    if (k < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }));
        }

        function resumeSession() {
            const sess = getSavedSession();
            if (!sess) return;
            const byId = new Map(QUESTIONS.map(q => [q.id, q]));
            const qs = sess.ids.map(id => byId.get(id)).filter(Boolean);
            // `answered` is keyed by position in sess.ids, so dropping any id shifts every
            // later answer onto the wrong question. Nothing sane to resume — discard it.
            if (!qs.length || qs.length !== sess.ids.length) { clearSession(); initHomeScreen(); return; }
            state.currentMode = sess.mode;
            state.currentTopic = sess.topic || null;
            state.stateCode = sess.stateCode || selectedState;
            state.currentQuestions = qs;
            state.currentQuestionIndex = Math.min(sess.idx || 0, qs.length - 1);
            state.answered = sess.answered || {};
            state.shuffled = !!sess.shuffled;
            state.navView = sess.navView || (state.shuffled ? 'shuffle' : 'linear');
            state.baseOrder = Array.isArray(sess.baseOrder) ? sess.baseOrder : null;
            state.correct = sess.correct || 0;
            state.incorrect = sess.incorrect || 0;
            state.showExplanation = false;
            // Rebuild the wrong-answer list from the saved answers — otherwise the end
            // screen only reviews mistakes made after the resume. Derived, not persisted,
            // so sessions saved by older builds resume correctly too.
            state.missedQuestions = Object.entries(state.answered)
                .filter(([i, a]) => qs[i] && a !== qs[i].correct)
                .map(([i, a]) => ({ q: qs[i], userAnswerIdx: a }));
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        function renderModes() {
            const grid = document.getElementById('modesGrid');
            const due = reviewDueCount();
            const st = STATES[selectedState];
            // Five equal peers, no featured card. Each NAMES its own action in
            // .mode-start ("Start test", "Choose topic") beside a solid disc of its own
            // hue — the mockup's row, and what replaced the bare corner arrow that read
            // as decoration on a touch screen. The time estimate rides in the meta row
            // beside the count: as a corner stamp opposite the title it took 115px of a
            // 165px head row and crushed "All questions" to 13px wide.
            // Each card carries a data-hue, which is what paints its icon plate and its
            // start disc — see the HUE DISCS block. The hues are the mockup's four plus
            // one: rose goes to Smart Review, where "questions you keep getting wrong"
            // is the one place a warm alert hue says something true.
            const card = (hue, handler, icon, title, desc, meta, time, action, attrs = '') => `
                <button class="mode-card" data-hue="${hue}" ${handler}${attrs}>
                    <span class="mode-head">
                        <span class="mode-icon">${icon}</span><span class="mode-title">${title}</span>
                    </span>
                    <span class="mode-description">${desc}</span>
                    <span class="mode-meta">${meta}<span class="mode-time">${ICONS.clock}${time}</span></span>
                    <span class="mode-start">${action}<span class="mode-start-dot" aria-hidden="true">${ICONS.arrowRight}</span></span>
                </button>`;
            const mode = m => `onclick="startMode('${m}')"`;
            // The reveal's open state lives on the panel, not in a variable: renderModes()
            // runs again on every language switch and would otherwise reset the button
            // while the topics below it are still on show.
            const topicsOpen = !document.getElementById('topicSection').hidden;

            grid.innerHTML =
                card('blue', mode('exam'), ICONS.exam, t('mode.exam.title'), t('mode.exam.desc', { state: st }),
                     t('mode.exam.badge'), t('mode.exam.time'), t('mode.exam.start')) +
                card('green', mode('allQuestions'), ICONS.allQuestions, t('mode.all.title'), t('mode.all.desc'),
                     t('mode.all.badge'), t('mode.all.time'), t('mode.all.start')) +
                card('amber', mode('bundesland'), ICONS.bundesland, t('mode.state.title'), t('mode.state.desc', { state: st }),
                     t('mode.state.badge'), t('mode.state.time'), t('mode.state.start')) +
                card('rose', mode('review'), ICONS.review, t('mode.review.title'), t('mode.review.desc'),
                     due ? `<span class="mode-flag">${t('mode.review.badgeDue', { n: due })}</span>`
                         : t('mode.review.badge'), t('mode.review.time'), t('mode.review.start')) +
                card('violet', 'onclick="toggleTopics(this)"', ICONS.topic, t('mode.topic.title'), t('mode.topic.desc'),
                     t('mode.topic.badge'), t('mode.topic.time'), t('mode.topic.start'),
                     ` aria-expanded="${topicsOpen}" aria-controls="topicSection"`);
        }

        /**
         * The Topic card reveals the topic chips in place rather than opening a screen.
         * A button with aria-expanded/aria-controls rather than the <details> the history
         * and glossary sections use: a <details> needs its summary and its body in one
         * element, and here the summary is a card inside a five-column grid while the body
         * has to span the whole row beneath it.
         */
        function toggleTopics(btn) {
            const el = document.getElementById('topicSection');
            el.hidden = !el.hidden;
            btn.setAttribute('aria-expanded', String(!el.hidden));
        }

        // ============================================================
        // QUESTION NAVIGATOR
        // ============================================================
        function renderQuestionNav() {
            const total = state.currentQuestions.length;
            // Self-correcting: even if a resize event is missed, the header's semantics
            // are right again the next time the panel renders.
            syncNavHeaderRole();

            const groups = new Map();
            state.currentQuestions.forEach((q, i) => {
                const k = navGroupKey(q);
                if (!groups.has(k)) groups.set(k, []);
                groups.get(k).push(i);
            });

            // Three views of the same round: shuffle re-orders it, linear and topics
            // are the built order shown flat or grouped. Topics is offered only when
            // there is more than one — one <details> over the whole list is a lid.
            const actions = document.getElementById('navActions');
            if (actions) {
                const seg = (view, label) =>
                    `<button class="seg-btn${state.navView === view ? ' active' : ''}"
                             aria-pressed="${state.navView === view}"
                             onclick="setNavView('${view}')">${label}</button>`;
                // No switcher in the exam: the paper is the paper, in the order it was
                // drawn. Empty, so `#navActions:empty` collapses the row entirely.
                actions.innerHTML = (total < 2 || state.currentMode === 'exam') ? '' :
                    `<div class="seg qnav-seg" role="group" aria-label="${t('qnav.view')}">
                        ${seg('linear', t('qnav.linear'))}
                        ${seg('shuffle', t('qnav.shuffle'))}
                        ${groups.size > 1 ? seg('categories', t('qnav.categories')) : ''}
                    </div>`;
            }

            const cell = i => {
                const ans = state.answered[i];
                let cls = 'q-nav-btn';
                if (i === state.currentQuestionIndex) {
                    cls += ' qnav-current';
                } else if (ans !== undefined) {
                    // In the exam a cell says ANSWERED and nothing more. Green and red
                    // here would hand you the mark the question card is withholding —
                    // you would know your score before you finished the paper.
                    cls += state.currentMode === 'exam' ? ' qnav-answered'
                        : ans === state.currentQuestions[i].correct
                            ? ' qnav-correct' : ' qnav-incorrect';
                }
                const n = roundNumber(i);
                return `<button class="${cls}" onclick="jumpToQuestion(${i})" title="${t('quiz.question', { n })}">${n}</button>`;
            };

            const el = document.getElementById('questionNavGrid');

            // Grouping is a view the reader picks, not something inferred from the
            // round's length. It still falls back to the flat grid when there is
            // nothing to group by.
            if (state.navView !== 'categories' || groups.size < 2) {
                el.className = 'question-nav-grid';
                el.innerHTML = Array.from({ length: total }, (_, i) => cell(i)).join('');
                showCurrentCell(el);
                return;
            }

            // Carry the reader's own open/closed groups across the re-render by reading
            // the DOM we are about to replace. The previously active group is dropped:
            // it was open because it held the question, not because anyone chose it, and
            // keeping it would leave every category expanded after a lap of the round.
            const stillOpen = new Set(
                [...el.querySelectorAll('.qnav-group[open]')].map(d => d.dataset.cat)
            );
            stillOpen.delete(navLastActiveKey);
            const activeKey = navGroupKey(state.currentQuestions[state.currentQuestionIndex]);

            navLastActiveKey = activeKey;
            el.className = 'question-nav-groups';
            el.innerHTML = [...groups].map(([key, idxs]) => {
                const done = idxs.filter(i => state.answered[i] !== undefined).length;
                const open = key === activeKey || stillOpen.has(key);
                return `
                    <details class="qnav-group"${open ? ' open' : ''} data-cat="${key}">
                        <summary class="qnav-group-head">
                            <span class="qnav-group-name">${navGroupLabel(key)}</span>
                            <span class="qnav-group-count">${done}/${idxs.length}</span>
                        </summary>
                        <div class="question-nav-grid">${idxs.map(cell).join('')}</div>
                    </details>`;
            }).join('');

            showCurrentCell(el);
        }

        /**
         * Keep the question you are on in view inside the scrolling panel. It used
         * to run only in the grouped branch, so in a 300-cell flat list — and in
         * shuffle, where the numbers give you no way to guess where you are — the
         * current cell was routinely off screen.
         */
        function showCurrentCell(el) {
            const cur = el.querySelector('.qnav-current');
            if (cur) cur.scrollIntoView({ block: 'nearest' });
        }

        // The group that was open purely because it was active, last render.
        let navLastActiveKey = null;

        /**
         * The number a question wears. In a shuffled round it is the question's
         * place in the round as BUILT, not its current position — otherwise the
         * navigator reads 1, 2, 3 in every view and a shuffle is invisible. The
         * cells stay in the round's current order, so shuffled they read 42, 7, 190.
         */
        function roundNumber(i) {
            if (!state.shuffled || !state.baseOrder) return i + 1;
            const pos = state.baseOrder.indexOf(state.currentQuestions[i].id);
            return pos >= 0 ? pos + 1 : i + 1;
        }

        /** Which navigator group a question belongs to. */
        function navGroupKey(q) { return q.state ? 'state' : (q.category || 'other'); }
        function navGroupLabel(key) {
            if (key === 'state') return STATES[state.stateCode] || t('mode.state.title');
            return CATEGORIES[key] ? catLabel(key) : t('quiz.general');
        }

        /**
         * Re-order the round, or put it back in catalogue order.
         * `state.answered` is keyed by POSITION, so it has to move with the
         * questions — otherwise every answer lands on a different question.
         */
        function shuffleRound() {
            const qs = state.currentQuestions;
            if (qs.length < 2) return;
            const byId = new Map(qs.map(q => [q.id, q]));
            // Remember the order the round was actually built in. Sorting by id only
            // matches that for rounds built from the catalogue: a mistakes round is in
            // the order the questions were missed, and id order was never its order.
            if (!state.shuffled) state.baseOrder = qs.map(q => q.id);
            const restored = (state.baseOrder || []).map(id => byId.get(id)).filter(Boolean);
            const next = state.shuffled
                ? (restored.length === qs.length ? restored : [...qs].sort((a, b) => a.id - b.id))
                : sample(qs, qs.length);
            const wasAt = new Map(qs.map((q, i) => [q.id, i]));
            const here = qs[state.currentQuestionIndex];
            const answered = {};
            next.forEach((q, i) => {
                const was = wasAt.get(q.id);
                if (state.answered[was] !== undefined) answered[i] = state.answered[was];
            });
            state.currentQuestions = next;
            state.answered = answered;
            state.shuffled = !state.shuffled;
            // stay on the question that was on screen
            state.currentQuestionIndex = Math.max(0, next.indexOf(here));
            saveSession();
            displayQuestion();
        }

        /**
         * The navigator's three views. Shuffle is an ORDER, so switching to or away
         * from it re-orders the round (shuffleRound re-keys the answers); linear and
         * topics are the same order drawn two ways, so they only repaint.
         */
        function setNavView(view) {
            if (state.navView === view) return;
            const wantShuffled = view === 'shuffle';
            state.navView = view;
            if (wantShuffled !== state.shuffled) { shuffleRound(); return; }
            saveSession();
            renderQuestionNav();
        }

        function toggleQuestionNav() {} // sidebar is always open

        function jumpToQuestion(qIdx) {
            state.currentQuestionIndex = qIdx;
            displayQuestion();
        }

        function startMode(mode) {
            // No catalogue, no round. The footer's four Practise links call this
            // straight from the landing page, where nothing else says the load failed,
            // and an empty pool starts a quiz screen with no question and no message.
            // One guard here covers the footer, the mode cards and every other caller.
            if (loadFailed) { showScreen('practise'); return; }
            // Bail before touching state — a half-reset state with the previous round's
            // questions still in it is worse than not starting.
            const reviewQueue = mode === 'review' ? buildReviewQueue(25) : null;
            if (reviewQueue && !reviewQueue.length) {
                alert('Noch nichts zu wiederholen — beantworte zuerst ein paar Fragen.');
                return;
            }
            state.currentMode = mode;
            state.currentTopic = null;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            state.stateCode = selectedState;
            state.shuffled = false;
            state.navView = 'linear';
            state.baseOrder = null;

            if (mode === 'allQuestions') {
                state.currentQuestions = generalQuestions();
            } else if (mode === 'bundesland') {
                state.currentQuestions = stateQuestions();
            } else if (mode === 'review') {
                state.currentQuestions = reviewQueue;
            } else if (mode === 'exam') {
                state.currentQuestions = [...sample(generalQuestions(), 30), ...sample(stateQuestions(), 3)];
                state.examStartTime = Date.now();
                startTimer();
            }

            // Only the exam has a clock. Starting a practice round straight after one
            // left the exam's timer sitting above the question, counting down a round
            // that is not timed — startTimer() shows the element and nothing on the
            // practice path ever hid it again.
            if (mode !== 'exam') {
                if (state.timerInterval) clearInterval(state.timerInterval);
                document.getElementById('timer').style.display = 'none';
            }

            clearSession(); // committed to a fresh round — replace any prior resumable session

            // The navigator is shown in the exam too — you need to see which of the 33
            // you have done and jump back. What it does NOT get is the view switcher:
            // shuffling or grouping the paper mid-exam is not a thing the real test does.
            const navWrapper = document.getElementById('questionNavWrapper');
            navWrapper.style.display = 'flex';

            // Every round starts with the navigator closed, at any width.
            const sidebarBody = document.getElementById('sidebarBody');
            const sidebarChevron = document.getElementById('sidebarChevron');
            if (sidebarBody) sidebarBody.classList.remove('expanded');
            if (sidebarChevron) sidebarChevron.classList.remove('open');
            document.getElementById('questionNavWrapper').classList.remove('nav-open');
            syncNavHeaderRole();

            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // QUIZ SCREEN
        // ============================================================
        let hintShown = false;

        function displayQuestion() {
            const q = state.currentQuestions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex + 1) / state.currentQuestions.length) * 100;

            // The card body is the scroller now, so a new question starts at its top.
            const qBody = document.getElementById('questionBody');
            if (qBody) qBody.scrollTop = 0;

            // Re-trigger the per-question entrance animation.
            const card = document.querySelector('.question-card');
            if (card) { card.classList.remove('q-enter'); void card.offsetWidth; card.classList.add('q-enter'); }

            // Update stats
            updateStats();
            updateProgress(progress);

            // Question content
            document.getElementById('questionNum').textContent =
                t('quiz.questionOf', { n: roundNumber(state.currentQuestionIndex), total: state.currentQuestions.length });
            // Not in the exam: naming the topic tells you which of the four answers to
            // look for, and the real test does not.
            document.getElementById('questionCategory').textContent =
                state.currentMode === 'exam' ? ''
                    : q.state ? (q.stateName || STATES[q.state] || t('mode.state.title'))
                    : (q.category ? catLabel(q.category) : t('quiz.general'));
            document.getElementById('questionText').textContent = q.de;
            document.getElementById('questionEnglish').innerHTML = `<div>${q.en}</div>`;
            document.getElementById('questionEnglish').classList.remove('show');

            const imgCredit = document.getElementById('imageCredit');
            if (q.image) {
                const qImg = document.getElementById('questionImage');
                qImg.src = q.image;
                qImg.alt = q.de;
                qImg.style.display = 'block';
                qImg.onclick = e => openZoom(e, qImg.getAttribute('src'), q.de);
                qImg.title = t('quiz.zoomOpen');
                if (q.image_credit) {
                    imgCredit.textContent = q.image_credit;
                    imgCredit.style.display = 'block';
                } else {
                    imgCredit.style.display = 'none';
                }
            } else {
                document.getElementById('questionImage').style.display = 'none';
                imgCredit.style.display = 'none';
            }

            // Options
            const optionsContainer = document.getElementById('optionsContainer');
            const hasImages = Array.isArray(q.option_images) && q.option_images.length === q.options.length;
            optionsContainer.classList.toggle('options--image', hasImages);
            optionsContainer.innerHTML = q.options.map((opt, idx) => {
                if (hasImages) {
                    return `
                <button class="option-btn option-btn--image" onclick="selectAnswer(${idx})" id="option-${idx}" aria-label="${String.fromCharCode(65 + idx)}: ${opt}">
                    <span class="opt-img" data-missing="${t('quiz.imgMissing')}" onclick="openZoom(event, '${q.option_images[idx]}', ${JSON.stringify(opt).replace(/'/g, "&#39;").replace(/"/g, '&quot;')})"><img src="${q.option_images[idx]}" alt="${opt}" decoding="async" onerror="this.closest('.option-btn').classList.add('img-missing')"><span class="opt-img-hover" aria-hidden="true">${t('quiz.zoomHover')}</span></span>
                    <span class="opt-num">${String.fromCharCode(65 + idx)} — ${opt}</span>
                </button>`;
                }
                const enText = q.options_en && q.options_en[idx] ? q.options_en[idx] : '';
                const enClass = enText && state.showEnglish ? ' show' : '';
                return `
                <button class="option-btn" onclick="selectAnswer(${idx})" id="option-${idx}">
                    <span class="opt-letter">${String.fromCharCode(65 + idx)}</span><span class="opt-text-wrap">${opt}${enText ? `<span class="option-en-text${enClass}" lang="en">${enText}</span>` : ''}</span>
                </button>`;
            }).join('');
            // Says the images can be opened, for the reader who has no hover to discover
            // it with. Only under an image grid, and only where there is no pointer.
            document.getElementById('imgZoomHint')?.remove();
            if (hasImages) {
                optionsContainer.insertAdjacentHTML('beforebegin',
                    `<p class="img-zoom-hint" id="imgZoomHint">${t('quiz.zoomHint')}</p>`);
            }

            // Keyboard hint (shown once per session, on first question only)
            const hintContainer = document.getElementById('keyboardHintContainer');
            if (!hintShown && state.currentQuestionIndex === 0) {
                hintShown = true;
                hintContainer.innerHTML = `
                    <div class="keyboard-hint" id="keyboardHint">
                        <kbd>↑</kbd><kbd>↓</kbd> ${t('quiz.kbNav')} &nbsp;
                        <kbd>Space</kbd> ${t('quiz.kbPick')} &nbsp;
                        <kbd>Enter</kbd> ${t('quiz.kbNext')}
                        <button class="keyboard-hint-close" aria-label="${t('quiz.kbClose')}" onclick="document.getElementById('keyboardHintContainer').innerHTML=''">×</button>
                    </div>`;
            } else {
                hintContainer.innerHTML = '';
            }

            // Bilingual toggle state
            const toggle = document.getElementById('bilingualToggle');
            toggle.innerHTML = ICONS.translate + '<span>EN</span>';
            toggle.title = state.showEnglish ? t('quiz.hideEn') : t('quiz.showEn');
            toggle.setAttribute('aria-pressed', String(!!state.showEnglish));
            const speakBtn = document.getElementById('speakBtn');
            if (speakBtn && !speakBtn.firstChild) speakBtn.innerHTML = ICONS.speaker;
            toggle.classList.toggle('active', state.showEnglish);
            document.getElementById('questionEnglish').classList.toggle('show', state.showEnglish);

            // Show back button when not on the first question
            const backBtn = document.getElementById('backBtn');
            backBtn.disabled = state.currentQuestionIndex === 0;

            // Restore answered state if this question was already answered (via navigator jump)
            const prevAnswer = state.answered[state.currentQuestionIndex];
            const optsEl = document.getElementById('optionsContainer');
            if (prevAnswer !== undefined) {
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                // Set in BOTH branches, or the exam's leaves it at whatever the last
                // question put there: the same answered question then rendered dimmed
                // or not depending on which one you arrived from.
                if (optsEl) optsEl.classList.add('answered');
                // Revisiting a question in the exam shows what you put down, and still
                // not whether it was right.
                if (state.currentMode === 'exam') {
                    document.getElementById('option-' + prevAnswer).classList.add('picked');
                    document.getElementById('explanation').classList.remove('show');
                } else {
                    document.getElementById('option-' + q.correct).classList.add('correct');
                    if (prevAnswer !== q.correct) {
                        document.getElementById('option-' + prevAnswer).classList.add('incorrect');
                    }
                    showExplanation(q, prevAnswer === q.correct);
                }
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.disabled = false;
                nextBtn.textContent = state.currentQuestionIndex + 1 === state.currentQuestions.length
                    ? t('quiz.finish') : t('quiz.next') + ' →';
            } else {
                if (optsEl) optsEl.classList.remove('answered');
                document.getElementById('explanation').classList.remove('show');
                document.getElementById('nextBtn').disabled = true;
                // Focus question text (non-interactive) so Space can't accidentally select option A
                document.getElementById('questionText').focus({ preventScroll: true });
            }

            // Always update sidebar navigator
            renderQuestionNav();

        }

        function updateStats() {
            // Accuracy so far, not progress towards the round. The denominator was
            // the whole round, so one right answer out of 300 read as 0% and the
            // number stayed near zero for most of a long set. Numerator and
            // denominator come from the same pair of counters, so they cannot drift
            // apart the way a separate answered-count could.
            const answered = state.correct + state.incorrect;
            const score = answered > 0 ? Math.round((state.correct / answered) * 100) : 0;

            // A zero is not news: green and red arrive with the first right or wrong
            // answer, so an untouched round is one neutral row rather than a traffic
            // light reporting nothing.
            // Answered counts the questions you have a pick for, which is what the
            // navigator's header used to state; correct+incorrect is the accuracy
            // pair above and deliberately a different number.
            const done = Object.keys(state.answered).length;
            const total = state.currentQuestions.length;

            // The exam withholds every mark until the end, and this row was the one
            // place that did not: the options stay neutral and the navigator's cell
            // says only "answered", but correct/wrong/score sat above the question
            // handing you the result a question at a time. Only the count survives
            // there — how far through the paper you are is not a mark.
            const marks = state.currentMode === 'exam' ? '' : `
                <div class="stat">
                    <span class="stat-value"${state.correct ? ' style="color: var(--green)"' : ''}>${state.correct}</span>
                    <span class="stat-label">${t('quiz.stat.correct')}</span>
                </div>
                <div class="stat">
                    <span class="stat-value"${state.incorrect ? ' style="color: var(--red-text)"' : ''}>${state.incorrect}</span>
                    <span class="stat-label">${t('quiz.stat.wrong')}</span>
                </div>
                <div class="stat">
                    <span class="stat-value">${score}%</span>
                    <span class="stat-label">${t('quiz.stat.score')}</span>
                </div>`;

            document.getElementById('statsBar').innerHTML = `
                ${marks}
                <div class="stat">
                    <span class="stat-value">${done}<span class="stat-of"> / ${total}</span></span>
                    <span class="stat-label">${t('quiz.stat.answered')}</span>
                </div>
            `;
        }

        // One bar, above the card. The navigator used to carry a second copy of it
        // plus the same number written out twice more.
        function updateProgress(percent) {
            const qpf = document.getElementById('quizProgressFill');
            if (qpf) qpf.style.width = percent + '%';
        }

        // ---- Image lightbox -------------------------------------------------
        // One dialog for the prompt image and every option image. `zoomReturn` is what
        // the reader was on when they opened it — focus goes back there on close, or a
        // keyboard user is dumped at the top of the document.
        let zoomReturn = null;
        function openZoom(e, src, caption) {
            // An option image lives inside the option BUTTON. Without this, looking at
            // the picture answers the question.
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (!src) return;
            const box = document.getElementById('imgZoom');
            const img = document.getElementById('imgZoomImg');
            img.src = src;
            img.alt = caption || '';
            const cap = document.getElementById('imgZoomCaption');
            cap.textContent = caption || '';
            cap.style.display = caption ? '' : 'none';
            zoomReturn = document.activeElement;
            box.hidden = false;
            document.getElementById('imgZoomClose').focus();
        }
        function closeZoom() {
            const box = document.getElementById('imgZoom');
            if (box.hidden) return;
            box.hidden = true;
            // Drop the source so a large image is not held for the rest of the round.
            document.getElementById('imgZoomImg').removeAttribute('src');
            if (zoomReturn && document.contains(zoomReturn)) zoomReturn.focus();
            zoomReturn = null;
        }
        function zoomIsOpen() { return !document.getElementById('imgZoom').hidden; }

        function selectAnswer(idx) {
            const q = state.currentQuestions[state.currentQuestionIndex];
            state.answered[state.currentQuestionIndex] = idx;

            // Disable all buttons; dim the unchosen
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            const optsEl = document.getElementById('optionsContainer');
            if (optsEl) optsEl.classList.add('answered');

            // In the EXAM nothing is marked: you find out at the end, as in the real
            // test. The chosen option carries a neutral `.picked` so the paper still
            // shows what you put down, and no green, red or explanation appears.
            const isExamRound = state.currentMode === 'exam';
            const picked = document.getElementById('option-' + idx);
            if (isExamRound) {
                if (picked) { picked.classList.add('picked', 'just-picked'); }
            } else {
                document.getElementById('option-' + q.correct).classList.add('correct');
                if (picked) { picked.classList.add('just-picked'); }
                if (idx !== q.correct) {
                    document.getElementById('option-' + idx).classList.add('incorrect');
                }
            }

            // Update score and sub-scores
            if (idx === q.correct) {
                state.correct++;
                if (q.state) state.stateCorrect++;
                else state.generalCorrect++;
            } else {
                state.incorrect++;
                state.missedQuestions.push({ q, userAnswerIdx: idx });
            }

            // Durable progress (spaced repetition) + resumable session
            recordAnswer(q, idx === q.correct);
            saveSession();

            // Show explanation — never in the exam.
            if (!isExamRound) showExplanation(q, idx === q.correct);

            // Show next button and scroll it into view
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = false;
            nextBtn.textContent = state.currentQuestionIndex + 1 === state.currentQuestions.length ? t('quiz.finish') : t('quiz.next') + ' →';
            if (!isExamRound) setTimeout(() => document.getElementById('explanation').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            setTimeout(() => nextBtn.focus(), 600);

            // The counters read from state, and state just changed. They were only
            // repainted on a question change, so they lagged a full question behind
            // the answer you had just given.
            updateStats();

            // Always refresh sidebar navigator
            renderQuestionNav();
        }

        function showExplanation(q, isCorrect) {
            const exp = document.getElementById('explanation');
            exp.classList.remove('correct', 'incorrect');
            exp.classList.add(isCorrect ? 'correct' : 'incorrect');
            exp.classList.add('show');

            document.getElementById('explanationHeader').textContent = isCorrect ? t('quiz.correct') : t('quiz.wrong');
            if (!isCorrect) {
                document.getElementById('explanationHeader').textContent += t('quiz.rightAnswer') + q.options[q.correct];
            }

            document.getElementById('explanationText').textContent = q.explanation_de;
            document.getElementById('explanationEnglish').textContent = q.explanation_en;
            document.getElementById('explanationEnglish').classList.toggle('show', state.showEnglish);
        }

        // ============================================================
        // TIMER
        // ============================================================
        function startTimer() {
            const timerEl = document.getElementById('timer');
            // 'flex', not 'block': the stylesheet lays the clock out as a one-line flex
            // row, and an inline `display: block` beats it — the label and the figure
            // stacked again, with the row's padding around both.
            timerEl.style.display = 'flex';
            state.timeLeft = 3600; // 60 minutes

            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerDisplay();

                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(state.timeLeft / 60);
            const secs = state.timeLeft % 60;
            const display = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;

            const timerEl = document.getElementById('timer');
            if (state.timeLeft < 300) {
                timerEl.classList.add('danger');
            } else {
                timerEl.classList.remove('danger');
            }

            // Pacing indicator: show after first answer
            let pacingEl = document.getElementById('pacingInfo');
            if (!pacingEl) {
                pacingEl = document.createElement('div');
                pacingEl.id = 'pacingInfo';
                pacingEl.className = 'pacing-info';
                timerEl.appendChild(pacingEl);
            }
            const answered = state.currentQuestionIndex;
            if (answered > 0 && state.examStartTime) {
                const elapsed = (Date.now() - state.examStartTime) / 1000;
                const avgSec = elapsed / answered;
                const remaining = state.currentQuestions.length - answered;
                const projectedSec = avgSec * remaining;
                const bufferSec = state.timeLeft - projectedSec;
                const avgMin = (avgSec / 60).toFixed(1);
                if (bufferSec > 300) {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage`;
                    pacingEl.style.color = 'var(--green)';
                } else if (bufferSec > 0) {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage`;
                    pacingEl.style.color = 'var(--gold)';
                } else {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage — zu langsam`;
                    pacingEl.style.color = 'var(--red)';
                }
            }
        }

        // ============================================================
        // END SCREEN
        // ============================================================
        function animateScoreRing(percent, passed) {
            const bar = document.getElementById('scoreRingBar');
            const pctEl = document.getElementById('scoreRingPct');
            if (!bar || !pctEl) return;
            const C = 377; // 2 * PI * r(60)
            const color = passed === true ? 'var(--green)' : passed === false ? 'var(--red)' : 'var(--lime)';
            bar.style.stroke = color;
            pctEl.style.color = passed === false ? 'var(--red)' : (passed === true ? 'var(--green)' : 'var(--lime)');
            bar.style.opacity = percent > 0 ? '1' : '0'; // avoid stray round-cap dot at 0%
            bar.style.strokeDashoffset = C;            // reset
            pctEl.textContent = '0%';
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(() => {
                bar.style.strokeDashoffset = String(C * (1 - percent / 100));
                if (reduce) { pctEl.textContent = percent + '%'; return; }
                const t0 = performance.now(), dur = 1000;
                const tick = now => {
                    const k = Math.min(1, (now - t0) / dur);
                    const eased = 1 - Math.pow(1 - k, 3);
                    pctEl.textContent = Math.round(percent * eased) + '%';
                    if (k < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }, 80);
        }

        // endQuiz records the round once; renderEndScreen paints it from state and
        // may run again (a language switch repaints without re-recording).
        function endQuiz() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            clearSession(); // round finished — no longer resumable

            const total = state.currentQuestions.length;
            const percent = Math.round((state.correct / total) * 100);
            const isExam = state.currentMode === 'exam';

            state.elapsedSecs = isExam
                ? (state.examStartTime
                    ? Math.round((Date.now() - state.examStartTime) / 1000)
                    : (3600 - state.timeLeft))
                : null;

            recordResult({
                ts: Date.now(),
                mode: state.currentMode,
                topic: state.currentTopic || null,
                correct: state.correct,
                total,
                percent,
                passed: isExam ? state.correct >= 17 : null
            });

            renderEndScreen();
            showScreen('end');
            requestAnimationFrame(syncEndScrollCue);
        }

        /**
         * The cue is a "there is more" sign, so it is up exactly while there IS more:
         * it appears when the results screen has content past the fold and goes when you
         * reach the bottom, where a scroll-down button would do nothing. It is wired to
         * the screen's own scroll, to resize, and to every repaint of the results.
         */
        /**
         * What is scrolling the results, and how much is left. Usually #endScreen
         * itself — but under `max-height: 640px` the lock is released and it is
         * `overflow: visible`, so it never scrolls and the PAGE does. Measured against
         * #endScreen regardless, scrollHeight equalled clientHeight, the cue read
         * "nowhere to go" and sat disabled over a review list entirely below the fold.
         *
         * The page branch goes through window, not through an element: `body` carries
         * `overflow: auto` down here while `html` is what actually scrolls, and
         * scrollTop/scrollBy on either one of those is not dependable. window.scrollY
         * and window.scrollBy always mean the viewport.
         */
        function endScrollState() {
            const el = document.getElementById('endScreen');
            if (el && el.scrollHeight > el.clientHeight) {
                return {
                    remaining: el.scrollHeight - el.scrollTop - el.clientHeight,
                    step: el.clientHeight,
                    by: (top, behavior) => el.scrollBy({ top, behavior }),
                };
            }
            return {
                remaining: document.documentElement.scrollHeight - window.scrollY - window.innerHeight,
                step: window.innerHeight,
                by: (top, behavior) => window.scrollBy({ top, behavior }),
            };
        }

        function syncEndScrollCue() {
            const cue = document.getElementById('endScrollCue');
            if (!cue) return;
            // The row is in the flow, so nothing has to show or hide it — it is simply
            // part of the results. All this decides is whether there is anywhere to go.
            cue.disabled = state.currentScreen !== 'end' || endScrollState().remaining <= 24;
        }

        function scrollEndDown() {
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const s = endScrollState();
            // A screenful at a time, so a 33-question review is walked rather than jumped.
            s.by(Math.round(s.step * 0.85), reduce ? 'auto' : 'smooth');
        }

        function renderEndScreen() {
            const total = state.currentQuestions.length;
            if (!total) return;
            const percent = Math.round((state.correct / total) * 100);
            const isExam = state.currentMode === 'exam';

            document.getElementById('endTitle').textContent = t('end.' + state.currentMode) === 'end.' + state.currentMode
                ? t('end.done')
                : t('end.' + state.currentMode);

            document.getElementById('finalScore').textContent = `${state.correct}/${total}`;

            const passFail = document.getElementById('passFail');
            passFail.textContent = '';
            passFail.className = 'pass-fail';
            const passed = isExam ? state.correct >= 17 : null;
            if (isExam) {
                passFail.textContent = passed ? t('end.pass') : t('end.fail');
                passFail.classList.add(passed ? 'pass' : 'fail');
            }

            animateScoreRing(percent, passed);

            // One band of figures, hairline-separated. Correct and wrong always; the
            // exam adds its two sub-scores and the clock. A cell is a label and a number,
            // not a card.
            const stat = (label, value, colour) =>
                `<div class="result-stat"><span class="rs-label">${label}</span>` +
                `<span class="rs-num"${colour ? ` style="color: ${colour}"` : ''}>${value}</span></div>`;
            let cells = stat(t('end.correctCount'), state.correct, state.correct ? 'var(--green)' : '')
                      + stat(t('end.wrongCount'), state.incorrect, state.incorrect ? 'var(--red-text)' : '');
            const threshold = document.getElementById('passThreshold');
            if (isExam) {
                const elapsed = state.elapsedSecs || 0;
                const elapsedStr = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;
                cells += stat(t('end.general'), state.generalCorrect, 'var(--gold)')
                       + stat(t('end.stateOf3', { state: STATES[state.stateCode] || t('mode.state.title') }), state.stateCorrect, 'var(--gold)')
                       + stat(t('end.elapsed'), elapsedStr, 'var(--blue)');
                threshold.textContent = t('end.threshold');
                threshold.hidden = false;
            } else {
                threshold.hidden = true;
            }
            document.getElementById('resultStats').innerHTML = cells;

            // "Retry the wrong ones" sits with the other actions now, not buried in the
            // review header. It is shown when startMistakeMode() would actually have
            // something to run — that reads missedQuestions, which holds wrong ANSWERS
            // only, so a paper left blank does not offer it. Set before the exam branch
            // returns, or the exam would never reach it.
            document.getElementById('restartBtn').textContent =
                t(isExam ? 'end.retry' : 'end.retryPractice');
            document.getElementById('retryWrongBtn').hidden =
                state.missedQuestions.filter(m => m && m.q).length === 0;

            // The EXAM withholds every mark until here, so here it shows the whole paper:
            // each question, what you put down, and the right answer — including the ones
            // you left blank, which the wrong-answer list cannot know about.
            const reviewEl = document.getElementById('reviewSection');
            if (isExam) {
                const rows = state.currentQuestions.map((q, i) => {
                    const given = state.answered[i];
                    const right = given === q.correct;
                    return { q, given, right, blank: given === undefined };
                });
                reviewEl.innerHTML = `
                    <div class="review-section">
                        <div class="review-section-header review-section-header--solo">
                            <span class="review-count">${t('end.examReviewCount', { n: rows.length })}</span>
                        </div>
                        ${rows.map(({ q, given, right, blank }) => `
                            <div class="review-item${right ? ' review-item--right' : ''}">
                                <div class="review-q-num">${t('end.reviewQ', { id: q.id })} · ${right ? t('end.aRight') : blank ? t('end.aBlank') : t('end.aWrong')}</div>
                                <div class="review-q-text" lang="de">${q.de}</div>
                                <div class="review-answers" lang="de">
                                    ${blank ? `<div class="review-answer user-blank">— ${t('end.aBlank')}</div>`
                                            : `<div class="review-answer ${right ? 'user-right' : 'user-wrong'}">${right ? '✓' : '✗'} ${q.options[given]}</div>`}
                                    ${right ? '' : `<div class="review-answer correct-ans">✓ ${q.options[q.correct]}</div>`}
                                </div>
                                <div class="review-explanation" lang="de">
                                    ${q.explanation_de}
                                    ${state.showEnglish ? `<div class="review-explanation-en" lang="en">${q.explanation_en}</div>` : ''}
                                </div>
                            </div>`).join('')}
                    </div>`;
                return;
            }

            // Every other mode marks as you go, so its list is the ones you got wrong.
            const missed = state.missedQuestions.filter(m => m && m.q);
            if (missed.length > 0) {
                const count = missed.length === 1
                    ? t('end.reviewCount', { n: 1 })
                    : t('end.reviewCountPl', { n: missed.length });
                reviewEl.innerHTML = `
                    <div class="review-section">
                        <div class="review-section-header">
                            <h2>${t('end.reviewTitle')}</h2>
                            <div class="review-header-actions">
                                <span class="review-count">${count}</span>
                            </div>
                        </div>
                        ${missed.map(({ q, userAnswerIdx }) => `
                            <div class="review-item">
                                <div class="review-q-num">${t('end.reviewQ', { id: q.id })}</div>
                                <div class="review-q-text" lang="de">${q.de}</div>
                                <div class="review-answers" lang="de">
                                    <div class="review-answer user-wrong">✗ ${q.options[userAnswerIdx]}</div>
                                    <div class="review-answer correct-ans">✓ ${q.options[q.correct]}</div>
                                </div>
                                <div class="review-explanation" lang="de">
                                    ${q.explanation_de}
                                    ${state.showEnglish ? `<div class="review-explanation-en" lang="en">${q.explanation_en}</div>` : ''}
                                </div>
                            </div>`).join('')}
                    </div>`;
            } else {
                reviewEl.innerHTML = '';
            }
        }

        // ============================================================
        // MISTAKE MODE
        // ============================================================
        function startMistakeMode() {
            const qs = state.missedQuestions.map(m => m.q);
            if (qs.length === 0) return;
            state.currentMode = 'mistakes';
            state.shuffled = false;
            state.navView = 'linear';
            state.baseOrder = null;
            state.currentQuestions = qs;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.getElementById('darkBtn').addEventListener('click', () => setTheme('dark'));
        document.getElementById('lightBtn').addEventListener('click', () => setTheme('light'));

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (ttsSupported) window.speechSynthesis.cancel();
            state.currentQuestionIndex++;
            state.showExplanation = false;
            if (state.currentQuestionIndex < state.currentQuestions.length) {
                displayQuestion();
            } else {
                endQuiz();
            }
        });

        const _speakBtn = document.getElementById('speakBtn');
        if (_speakBtn) {
            if (!ttsSupported) _speakBtn.style.display = 'none';
            else _speakBtn.addEventListener('click', speakQuestion);
        }

        document.getElementById('bilingualToggle').addEventListener('click', () => {
            state.showEnglish = !state.showEnglish;
            const toggle = document.getElementById('bilingualToggle');
            toggle.innerHTML = ICONS.translate + '<span>EN</span>';
            toggle.title = state.showEnglish ? t('quiz.hideEn') : t('quiz.showEn');
            toggle.setAttribute('aria-pressed', String(!!state.showEnglish));
            toggle.classList.toggle('active', state.showEnglish);
            document.getElementById('questionEnglish').classList.toggle('show', state.showEnglish);
            document.getElementById('explanationEnglish').classList.toggle('show', state.showEnglish);
            document.querySelectorAll('.option-en-text').forEach(el => el.classList.toggle('show', state.showEnglish));
        });

        const _navToggle = document.getElementById('questionNavToggle');
        if (_navToggle) _navToggle.addEventListener('click', toggleQuestionNav);

        document.getElementById('backBtn').addEventListener('click', () => {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                displayQuestion();
            }
        });

        // One handler, one branch: leaving a round in progress asks first, leaving
        // the results screen has nothing left to lose.
        document.getElementById('sessionBack').addEventListener('click', () => {
            // Either branch leaves the session, so neither may leave a question
            // being read aloud behind it.
            if (ttsSupported) window.speechSynthesis.cancel();
            if (state.currentScreen !== 'quiz') {
                initHomeScreen();
                showScreen('practise');
                return;
            }
            const resumable = state.currentMode !== 'exam' && state.currentMode !== 'mistakes';
            const msg = resumable ? t('quit.resumable') : t('quit.lost');
            if (confirm(msg)) {
                if (state.timerInterval) clearInterval(state.timerInterval);
                if (ttsSupported) window.speechSynthesis.cancel();
                if (!resumable) clearSession();
                document.getElementById('timer').style.display = 'none';
                initHomeScreen();
                showScreen('practise');
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if (state.currentMode === 'topic') startTopic(state.currentTopic);
            else startMode(state.currentMode);
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // The lightbox is modal, so it takes Escape BEFORE the screen check — it can
            // be opened from the results screen's review list too, not just the quiz.
            if (zoomIsOpen()) {
                if (e.key === 'Escape') { e.preventDefault(); closeZoom(); }
                return; // and it swallows the answer shortcuts while it is up
            }
            if (state.currentScreen !== 'quiz') return;
            const options = Array.from(document.querySelectorAll('.option-btn:not(:disabled)'));
            const nextBtn = document.getElementById('nextBtn');

            if (options.length > 0) {
                const focused = document.activeElement;
                const idx = options.indexOf(focused);
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    options[(idx + 1) % options.length].focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    options[(idx - 1 + options.length) % options.length].focus();
                } else if ((e.key === 'z' || e.key === 'Z') && idx !== -1) {
                    // The zoom target is the picture itself, which a keyboard cannot
                    // click. `z` opens the focused option's image instead.
                    const frame = options[idx].querySelector('.opt-img');
                    if (frame) { e.preventDefault(); frame.click(); }
                } else if ((e.key === ' ' || e.key === 'Enter') && idx !== -1) {
                    e.preventDefault();
                    focused.click();
                }
            } else if (e.key === 'Enter' && !nextBtn.disabled) {
                nextBtn.click();
            }
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        // Don't let the browser restore a partial scroll offset after a
        // pull-to-refresh / reload — that would tuck the hero under the
        // sticky header. Always start at the top.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        // Use instant (not smooth) — html{scroll-behavior:smooth} would otherwise
        // animate these resets and they could be interrupted mid-scroll.
        const toTop = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        toTop();
        window.addEventListener('load', toTop);
        // PWA resume / bfcache restore: keep the home screen pinned to the top
        // so the hero is never tucked under the sticky header.
        window.addEventListener('pageshow', () => {
            if (state.currentScreen === 'home') toTop();
        });

        // The sticky exam timer has to clear the sticky header, and the header grows a row
        // when its controls wrap. Measure it rather than guessing a breakpoint.
        const _headerEl = document.querySelector('header');
        function syncHeaderHeight() {
            document.documentElement.style.setProperty('--header-h', _headerEl.offsetHeight + 'px');
        }
        syncHeaderHeight();
        new ResizeObserver(syncHeaderHeight).observe(_headerEl);

        loadProgress();
        loadHistory();
        initTheme();
        initLang();

        // A <details> gives us the disclosure for free but stays open on an outside
        // click, which for a header menu reads as broken. Two listeners, no state.
        const _prefsMenu = document.getElementById('prefsMenu');
        document.addEventListener('click', (e) => {
            if (_prefsMenu.open && !_prefsMenu.contains(e.target)) _prefsMenu.open = false;
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && _prefsMenu.open) {
                _prefsMenu.open = false;
                _prefsMenu.querySelector('summary').focus();
            }
        });

        async function loadQuestions() {
            try {
                const res = await fetch('questions.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                QUESTIONS = await res.json();
            } catch (e) {
                console.error('Failed to load questions.json', e);
                loadFailed = true;
                initHomeScreen();
                return;
            }
            initHomeScreen();
            // The home content renders here (async), making the page tall enough to
            // scroll. Reset to the top now so a pull-to-refresh can't leave the hero
            // tucked under the sticky header. rAF covers post-layout reflow.
            if (state.currentScreen === 'home') {
                toTop();
                requestAnimationFrame(toTop);
            }
        }
        loadQuestions();

        /**
         * The header is a real button at EVERY width now — the panel starts collapsed on
         * the desktop too, so it is never the caption over an open panel it used to be.
         * What collapses differs: on a wide screen the numbers fold away and the
         * Linear/Shuffle/Topics switch stays on show, because that is the control you
         * reach for mid-round; on a phone the whole body folds, since a strip there has
         * no room to keep anything.
         */
        function syncNavHeaderRole() {
            const tgl = document.getElementById('sidebarToggle');
            const body = document.getElementById('sidebarBody');
            if (!tgl || !body) return;
            tgl.setAttribute('role', 'button');
            tgl.setAttribute('tabindex', '0');
            tgl.setAttribute('aria-expanded', String(body.classList.contains('expanded')));
        }

        function toggleNavPanel() {
            const body = document.getElementById('sidebarBody');
            const chevron = document.getElementById('sidebarChevron');
            const expanded = body.classList.toggle('expanded');
            chevron.classList.toggle('open', expanded);
            // The aside carries it too: the pane's height rule needs to know, and a
            // parent cannot be selected from a child without :has().
            document.getElementById('questionNavWrapper').classList.toggle('nav-open', expanded);
            syncNavHeaderRole();
            // A frame later: the grid goes from display:none to a flex child of a
            // max-height panel in this same tick, so scrolling it now measures a
            // zero-height box and lands nowhere.
            if (expanded) requestAnimationFrame(() => showCurrentCell(document.getElementById('questionNavGrid')));
        }

        document.getElementById('sidebarToggle').addEventListener('click', toggleNavPanel);
        // A div with role="button" is not operable by keyboard on its own.
        document.getElementById('sidebarToggle').addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleNavPanel(); }
        });
        // Static markup names its glyph with data-icon rather than carrying the path, so
        // the icon set stays the single definition. One pass at boot fills them all.
        document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ICONS[el.dataset.icon] || ''; });
        document.getElementById('ctaArt').innerHTML = GATE_ART;
        // One arrow in the icon set; the back button mirrors it in CSS.
        document.querySelector('.session-back-icon').innerHTML = ICONS.arrowRight;
        document.getElementById('sidebarChevron').innerHTML = ICONS.chevron;
        // Lightbox wiring: the glyph, the two ways out, and the label that follows the
        // language switch (applyStaticStrings fills the aria-label via data-i18n-aria).
        document.getElementById('imgZoomClose').innerHTML = ICONS.close;
        document.getElementById('imgZoomClose').addEventListener('click', closeZoom);
        document.getElementById('imgZoomBackdrop').addEventListener('click', closeZoom);
        syncNavHeaderRole();
        // resize rather than a matchMedia change listener: the latter did not fire under
        // viewport emulation, and this has to be right at whatever width the reader lands on.
        window.addEventListener('resize', syncNavHeaderRole);
        document.getElementById('endScreen').addEventListener('scroll', syncEndScrollCue, { passive: true });
        // ...and the page, for the short-viewport case where #endScreen is not the
        // scroller and its own scroll event therefore never fires.
        window.addEventListener('scroll', syncEndScrollCue, { passive: true });
        window.addEventListener('resize', syncEndScrollCue);

        // ---- Service worker (offline / installable PWA) ----
        // Three things make an update actually ARRIVE, and the registration alone is
        // none of them:
        //   updateViaCache: 'none' - the worker script itself must never come out of the
        //     HTTP cache, or the browser compares a stale sw.js against itself and finds
        //     no update to install. This is the same trap as the fetch handler's
        //     `cache: 'reload'`, one level up.
        //   reg.update() on load AND on return to the tab - a left-open tab may go days
        //     without a navigation, which is the only thing that checks on its own.
        //   controllerchange -> reload - sw.js calls skipWaiting() + clients.claim(), so a
        //     new worker takes over the open tab immediately; without this the tab keeps
        //     rendering the OLD page it already parsed, and the user needs a second
        //     reload. A reload does not touch localStorage, so progress, the resumable
        //     session and the history all survive it.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        reg.update().catch(() => {});
                        document.addEventListener('visibilitychange', () => {
                            if (!document.hidden) reg.update().catch(() => {});
                        });
                    })
                    .catch(() => {});

                // Only when this tab already HAD a controller: on a first-ever install
                // claim() fires this too, and there is nothing stale to replace.
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        // ONE automatic reload per tab, stamped in sessionStorage so the
                        // bound survives the reload itself. An auto-reload loop would be a
                        // far worse bug than a stale tab, and a second update in the same
                        // sitting still arrives on the next manual refresh.
                        let done = true;
                        try { done = sessionStorage.getItem('eib_sw_reloaded') === '1'; } catch (e) {}
                        // Mid-round the swap can wait. The session is in localStorage and
                        // the next natural load picks the new build up; yanking the page
                        // out from under a question to save one reload is a bad trade.
                        if (done || document.body.classList.contains('in-session')) return;
                        try { sessionStorage.setItem('eib_sw_reloaded', '1'); } catch (e) { return; }
                        location.reload();
                    });
                }
            });
        }
    </script>
</body>
</html>
