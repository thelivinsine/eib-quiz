    <style>
        /* ============================================================
           EIB · Bento redesign (2026-07-16)
           ------------------------------------------------------------
           A clean, confident bento-grid learning app. Cool paper-grey
           canvas (light, default) / deep charcoal canvas (dark), a faint
           dotted grid, big friendly rounded-[26px] tiles, full-pill
           buttons, two soft layered shadows, and a DISCIPLINED accent
           duo: one TEAL primary + one warm APRICOT pop. Most tiles are
           white/charcoal with a hairline border; saturated fills are
           rationed. Type: Bricolage Grotesque (display) + Inter (body),
           uppercase tracked micro-labels as tile eyebrows. Tiles lift on
           hover via a springy cubic-bezier.
           Legacy token NAMES preserved so existing JS keeps working:
             --lime (=teal primary) --gold (=apricot) --blue --green
             --red --red-text --ink --font-mono --space-* ...
           ============================================================ */
        :root {
            /* ===== DARK canvas — :root is the no-class base =====
               RE-DERIVED 2026-09-21 against claude-context-kit theme-dark.md, on
               request, and it reverses the slate tint. Three measured failures, each
               of them the reference naming its own commonest fault:
                 §2   "greys are perfectly neutral, R = G = B EXACTLY ... no
                      fashionable dark navy. A tinted dark grey photographs well in a
                      mockup and goes muddy on a real monitor." Every surface here was
                      H 218 slate, 11-21 apart per channel, DERIVED FROM A LIGHT-ONLY
                      MOCKUP — the exact move that sentence warns against.
                 §3   "every level of containment steps LIGHTER than the thing containing
                      it, monotonically, every time." --band was a RECESS: the panel under
                      the practise, numbers and CTA bands was DARKER than the page, with
                      cards raised back out of it. §3 reverses for exactly one element,
                      a large multi-line text well, and a panel of cards is not one. The
                      page is now the darkest thing on screen and nothing goes below it
                      — see the --band block for the ladder it produced.
                 §4   "1.20 is the floor for a state change ... anything under about
                      1.15 is not a hover, it is a rounding error — and no contrast
                      script will flag it, because both values pass on their own."
                      --hover was 1.182 on a tile, and FILLS asserts STATE at 1.08, so
                      the ratchet could not see it. It is 1.23 now.
               The ladder is unchanged in SHAPE — 1.18 / 1.14 / 1.15 with the hairline
               at 1.60 per §5 — only the hue and the floor moved. The seven tinted
               --*-dim plates came up with the ladder: they sat 1.01-1.15 on a tile,
               invisible as fills, and are 1.20 now. --red and --violet lightened a hair
               (#F87171 -> #F98989, #A78BFA -> #B39CFA) so their own text still clears
               AA on those risen grounds, which is §6's "lighten it until it clears".
               LIGHT IS UNTOUCHED: its palette is the mockup's own and measures clean.
               Still true and still the reference's: every level of containment steps
               LIGHTER, no drop shadows, text tiers solid values and never opacity. */
            color-scheme: dark;

            --canvas:    #1A1A1A;
            --bg:        #1A1A1A;
            --surface:   #323232;   /* tile — 1.18 on the band, 1.36 on the page */
            --surface2:  #3B3B3B;   /* well or option inside a tile — 1.14 on it */
            --surface3:  #434343;   /* letter chip, track, press fill — 1.13 on that */
            --hover:     #3F3F3F;   /* hover steps UP — 1.22 on a tile, clearing §4's 1.20 */
            /* The panel under the practise band, the numbers band, the CTA band and the
               footer. In LIGHT it is a RECESS, because the mockup draws it darker than its
               white page and light has no "up" to go.
               IN DARK IT IS THE OPPOSITE, AND THAT IS THE WHOLE LADDER (2026-09-21, on
               request, after it shipped as a recess here too). theme-dark.md §3: "every
               level of containment steps LIGHTER than the thing containing it,
               monotonically, every time", and the only element in the reference's entire
               sample that reverses is a large multi-line text well — "a chip or a button
               is a raised object you press; a big text well is a hole you type into". A
               panel holding five cards is not a hole. So the page is the darkest thing on
               screen and the ladder only climbs from here:
                 --canvas  #1A1A1A   the page
                 --band    #262626   1.15   a panel ON the page
                 --surface #323232   1.18   a card IN the panel (1.36 on the bare page)
                 --surface2 #3B3B3B  1.14   a well or an option INSIDE a card
                 --surface3 #434343  1.13   a letter chip inside THAT, and the press fill
               §3.a: the step SHRINKS with depth (1.30, 1.22, 1.13 in the reference),
               because there is less headroom at each level. Do not add a sixth rung —
               §3 says depth 3 is where fill stops working and the hairline takes over. */
            --band:      #262626;

            /* The hairline carries dark mode, because the FILLS cannot.
               theme-dark.md §5: "below ~1.20 between two touching surfaces, stop pushing
               the fills apart and draw the edge instead", and every rung of the ladder
               above is under that line — 1.13 to 1.18. The same section measures real dividers at
               1.59-1.60 ON the panel they sit on, "deliberately more contrasty than the
               panel-to-page step: it has to survive being one pixel tall". This app's
               hairline was 1.375 on a tile, well under that band, which is the whole of
               why dark read flat while light did not. Raising the EDGE costs the text
               tiers nothing; raising the fills would have cost --faint its AA on
               --surface2 (measured 4.15). The 2026-09-21 re-derivation kept all three
               ratios and only neutralised the hue. */
            --border:       #505050;   /* 1.59 on a tile, 2.16 on the page */
            --border-soft:  #434343;   /* 1.30 — the gentler internal rule */
            --border-hover: #5F5F5F;   /* 2.00 — still a clear step above --border */
            --ink:          #505050;   /* legacy alias (borders) */
            --hairline:     #505050;

            /* Primary TEAL */
            --teal:       #70ADFA;
            --teal-deep:  #70ADFA;   /* text-safe variant = the bright one in dark */
            --teal-tint:  #263F64;
            --accent:       #70ADFA;
            --accent-text:  #70ADFA;
            --accent-fill:  #2563EB;
            --accent-soft:  #273E67;
            --accent-line:  #2D5185;
            --accent-grad:  linear-gradient(135deg, #2563EB 0%, #70ADFA 100%);
            --on-accent:    #FFFFFF;

            /* Contrast APRICOT */
            --apricot:      #F59E0B;
            --apricot-deep: #F59E0B;
            --on-apricot:   #1A1206;

            /* legacy names read by JS inline styles */
            --lime:      #70ADFA;
            --lime-dim:  #273E67;
            --lime-glow: rgba(112,173,250,0.30);
            --gold:      #F59E0B;
            --gold-dim:  #503A19;
            --on-gold:   #1A1206;

            --blue:      #93C5FD;
            --blue-dim:  #293E65;
            --green:     #10C185;
            --green-dim: #144639;
            --red:       #F98989;
            --red-text:  #F98989;
            --red-dim:   #612F34;
            --violet:     #B39CFA;
            --violet-dim: #453276;

            /* The primary button's own fill, separate from --accent-fill. The mockup
               paints every CTA near-black navy, which reads only on a light page; dark
               keeps the accent blue. --on-hue is the glyph colour on ANY solid hue disc
               — all five dark hues are light colours, so one token serves all five
               (white on dark's #A78BFA is 2.72, under the 3.0 non-text floor). */
            --btn-fill:  #2563EB;
            --on-btn:    #FFFFFF;
            --on-hue:    #1A1A1A;

            --text:     #FFFFFF;   /* 12.82 on a tile, 17.40 on the page */
            --sub-text: #D1D1D1;   /*  8.40 */
            --muted:    #B3B3B3;   /*  6.11 on a tile, 4.72 on --surface3, its lightest ground */
            --faint:    #A2A2A2;   /*  5.02 on a tile */

            /* One three-step scale. Nested corners follow
               inner = outer - padding, snapped to the nearest step. */
            --radius-xs:    4px;   /* bars, tracks, swatches, an image inside an option */
            --radius-sm:   10px;   /* wells, nav cells, letter chips, thumbnails, kbd */
            --radius:      16px;   /* every tile and card */
            --radius-pill: 999px;  /* anything that is a control */

            /* ---- SPACE ----------------------------------------------------------
               The scale was missing its bottom and middle rungs (it jumped 6 -> 8 -> 16),
               which is why half the sheet reached for a literal instead. 2 / 4 / 12 fill
               them in. The old `--spacing-*` aliases are gone — nothing reads them.
               Measured against the four systems in
               claude-context-kit/docs/reference/type-and-space.md: 4px and 8px appear in
               every one of them, and ONE value carries 86-88% of a real page's gaps. A flat
               histogram means the scale is not being used. */
            --space-3xs:  2px;
            --space-2xs:  4px;
            --space-xs:   6px;
            --space-sm:   8px;
            --space-ms:  12px;
            --space-md:  16px;
            --space-lg:  20px;
            --space-xl:  28px;
            --space-2xl: 40px;


            /* ---- TYPE -----------------------------------------------------------
               Eight steps, and a font-size written as a literal is a bug — the same rule
               the radius scale already holds to. The floor is 12px: of the four reference
               systems, three render nothing below 12 and the fourth stops at 13, and 11px
               tokens that exist (Stripe, Linear) went unused on every page measured.
               --fs-base is 15px, which is Linear's --text-regular exactly. */
            --fs-2xs:  0.75rem;    /* 12px — meta, captions, nav cells. THE FLOOR. */
            --fs-xs:   0.8125rem;  /* 13px — secondary labels, dense chrome */
            --fs-sm:   0.875rem;   /* 14px — buttons, chips, compact UI */
            --fs-base: 0.9375rem;  /* 15px — card descriptions, body copy */
            --fs-md:   1rem;       /* 16px — answer options, prominent body */
            --fs-lg:   1.125rem;   /* 18px — question text, card titles */
            --fs-xl:   1.375rem;   /* 22px — the hero's margin notes, the accuracy ring's
                                      percentage, a results-band figure. NOT a heading at any
                                      width: the phone's home headings take --fs-lg. */
            --fs-2xl:  1.75rem;    /* 28px — home section headings; display numerals */
            --fs-3xl:  2.25rem;    /* 36px — the score ring, and the landing page's four
                                      headline numbers: in both places the number IS the
                                      content, so it takes the top step */
            /* 2026-09-21: the landing tier was measured against the mockup at 1.14x
               (its 928px column against this app's 1060px) and the display tier came
               back 1.3-1.5x short across the board — the hero at 38px against 59, the
               section headings at 22 against 30. The ladder above 22px moved up one
               notch each. This DOES reopen sizing phase 5's headline cut, deliberately
               and on request; the note in CLAUDE.md about never minting a token larger
               than the value it replaces still holds for a token minted in silence. */
            --fs-hero: clamp(2rem, 5.2vw, 3.5rem);   /* the one clamp left */

            /* ---- LEADING --------------------------------------------------------
               Compare the LINE BOX, not the ratio. All four reference systems land their
               dominant UI line at 19.5-21px whatever ratio they use to get there; this app
               was at 16px x 1.6 = 25.6px, ~25% taller than any of them, paid once per line
               everywhere. --lh-ui is 1.3, which puts the default at 20.8px and tracks
               Khan Academy's `size + 4px` law closely across the range that matters
               (12 -> 15.6, 14 -> 18.2, 16 -> 20.8 against their 16 / 18 / 20).
               Unitless on purpose: a length would be inherited verbatim by a 12px label.
               Running text opts UP — Stripe sets prose 1.63 against 1.43 for its chrome. */
            --lh-tight: 1.15;   /* display numerals, the hero */
            --lh-ui:    1.3;    /* the default: controls, labels, headings, options */
            --lh-prose: 1.55;   /* explanation bodies, glossary, section descriptions */

            /* ---- CONTROL HEIGHT -------------------------------------------------
               Four, replacing fourteen. 44px is named here rather than living only inside
               the coarse-pointer media query — Primer and Linear both publish their touch
               target as a token (--control-minTarget-coarse, --min-tap-size). */
            --ctl-xs: 28px;   /* nav cells, micro chips */
            --ctl-sm: 36px;   /* header chrome */
            --ctl-md: 44px;   /* the default, and the WCAG 2.5.5 touch floor */
            --ctl-lg: 52px;   /* answer options, primary CTA */

            /* ---- ICON -----------------------------------------------------------
               The last axis still written as literals: nine glyph sizes
               (14/15/16/17/18/20/22/24/28) doing five jobs. Five steps, nearest-with-
               ties-down, so nothing moved more than 2px. A glyph box with no plate is
               the same size as its glyph, so these serve both.
               NOT icons and deliberately left alone: the two ring diameters
               (--ready/--score rings are layout), the 6px scrollbar, the 7px caret and
               .sr-only's 1px. A hit target is --ctl-*, not --icon-*. */
            --icon-xs: 14px;   /* inline, beside small text */
            --icon-sm: 16px;   /* the default glyph */
            --icon-md: 18px;   /* a glyph you aim at */
            --icon-lg: 22px;   /* a card's own mark */
            --icon-xl: 28px;   /* the featured card only */

            /* ---- TRACKING -------------------------------------------------------
               Assigned by TIER, never per component — per-component is how this reached
               eleven values. Positive at the smallest sizes, zero through the middle,
               negative at display, which is what Linear and Primer both do. */
            --ls-caps:     0.06em;
            --ls-normal:   0;
            --ls-display: -0.02em;

            --font-head: 'Bricolage Grotesque', 'Inter', system-ui, sans-serif;
            --font-body: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            --font-mono: 'Inter', system-ui, sans-serif;   /* alias: JS reads var(--font-mono) */
            /* The mockup's margin-note script. Scoped to .script-note ONLY —
               it must never be inherited by body copy. */
            --font-hand: 'Caveat', 'Bricolage Grotesque', cursive;

            --ease:        cubic-bezier(0.4, 0, 0.2, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

            --maxw: 1100px;
            --header-h: 56px;   /* a fallback; syncHeaderHeight() measures the real one */
        }

        html.light {
            /* ===== LIGHT canvas (paper-grey) — the default look =====
               Per the light reference: ~two fill levels, then edges do the work.
               Raised surfaces go UP towards white; hover and selected go DOWN
               into grey. Shadows exist but only under things that float. */
            color-scheme: light;

            /* The mockup's page is WHITE (#FEFEFE measured), not the paper-grey this
               theme was built on, so the whole light ramp was re-derived to nest DOWN
               from white instead of up towards it. Every value below is checked by
               tools/contrast.test.mjs; none of it was picked by eye.

               The consequence worth stating: at the top of the ramp a tile CANNOT step
               up, so --surface is the canvas colour and **the hairline carries a tile
               on the page** — the same argument theme-dark.md §5 makes for dark, which
               is out of fill room at the bottom, applied to light being out of room at
               the top. --border is 1.245 on white, comfortably over the 1.10 floor, and
               `surface/canvas` is the one FILL pair the test no longer asserts. */
            --canvas:    #FFFFFF;
            --bg:        #FFFFFF;
            --surface:   #FFFFFF;    /* a tile IS the page; its edge separates it */
            --surface2:  #E9F0F8;    /* inset well inside a tile — 1.15 */
            --surface3:  #DAE3F0;    /* track / rail — 1.29 */
            --hover:     #EEF3FA;    /* hover still steps DOWN in light — 1.12 */
            /* The mockup's pale panel: 1.065 below white, with a white card 1.065 back
               up out of it. Both clear the 1.05 nesting floor, and the panel carries a
               hairline (1.169 on it) because neither step reaches 1.20. */
            --band:      #F5F8FC;

            --border:       #E0E7F1;   /* 1.245 on a tile AND on the page */
            --border-soft:  #EDF1F8;
            --border-hover: #C8D2E2;
            --ink:          #E0E7F1;
            --hairline:     #E0E7F1;

            --teal:       #3B82F6;
            --teal-deep:  #2563EB;   /* text-safe: 5.17 on white */
            --teal-tint:  #E7F0FE;
            --accent:       #2563EB;
            --accent-text:  #2563EB;
            --accent-fill:  #2563EB;   /* white on it = 5.17 */
            --accent-soft:  #E7F0FE;
            --accent-line:  #BFD4FA;
            --accent-grad:  linear-gradient(135deg, #2563EB 0%, #3B82F6 100%);
            --on-accent:    #FFFFFF;

            /* Near-black navy, straight off the mockup (#132338 measured on Start Now,
               Start Practice and the CTA band alike). Blue is what the mockup tints
               icons and small discs with; it never fills a button. */
            --btn-fill:  #132338;
            --on-btn:    #FFFFFF;
            --on-hue:    #FFFFFF;

            --apricot:      #D97706;
            --apricot-deep: #B45309;
            --on-apricot:   #0F1929;

            --lime:      #2563EB;
            --lime-dim:  #E7F0FE;
            --lime-glow: rgba(37,99,235,0.22);
            --gold:      #B45309;                  /* text-safe apricot: 5.02 on white */
            --gold-dim:  #FDF2E6;
            --on-gold:   #0F1929;

            --blue:      #1D4ED8;
            --blue-dim:  #E7EEFD;
            --green:     #047857;
            --green-dim: #E2F5EC;
            --red:       #CC2020;
            --red-text:  #CC2020;
            --red-dim:   #FDEAEB;
            --violet:     #6D28D9;
            --violet-dim: #EFE8FD;

            /* The tints all deepened a rung with the canvas: a #EFF4FE wash was 1.04 on
               paper-grey and would have been 1.04 on white too — invisible as a plate. */
            --text:     #0F1929;   /* 17.6 on white */
            --sub-text: #33425E;   /* 10.1 */
            --muted:    #4F6280;   /*  6.2 */
            --faint:    #5C6E8C;   /*  5.2 */
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        /* The home tiers are toggled with `hidden`, and several of the sections they
           toggle set their own `display` — which beats the UA's `[hidden]` rule. */
        [hidden] { display: none !important; }

        html { overflow-x: clip; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font-body);
            background: var(--canvas);
            color: var(--text);
            /* 1.3, not 1.6. See --lh-ui: the reference systems all land their dominant UI
               line box at 19.5-21px, and 16 x 1.6 = 25.6 was paying a quarter of a line of
               height on every label, chip, button and meta row in the app. Running text
               opts back up to --lh-prose where it is actually running text. */
            line-height: var(--lh-ui);
            font-size: var(--fs-md);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: clip;
        }

        img { max-width: 100%; display: block; }
        button { font-family: inherit; cursor: pointer; color: inherit; }
        select { font-family: inherit; }
        ::selection { background: var(--accent-soft); color: var(--text); }
        :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: var(--radius-xs); }

        /* ============================================================
           HUE DISCS — the mockup's tinted plates.
           ------------------------------------------------------------
           The mockup puts a tinted disc behind every hero fact, every
           why-band mark and every mode card's icon, and a SOLID disc of
           the same hue under each card's start arrow. That colour is most
           of why it reads as a lively page and the grey build read as a
           dead one, so "an icon has no plate" is lifted for those three
           places — and only those. A glyph sitting on the canvas (speak,
           translate, the navigator's chevron, the lightbox close) still
           has no plate.

           Five hues and NOT ONE NEW TOKEN: each maps to a --*-dim / --*
           pair the palette already carries, so every plate in the app is
           already asserted by tools/contrast.test.mjs. --on-hue is the
           glyph on a SOLID disc and is one value per theme, because all
           five light hues are dark colours and all five dark hues are
           light ones.
           ============================================================ */
        /* --hue-ink, NOT --ink: the palette already defines --ink as its legacy
           border alias (#3C4451 dark / #E0E7F1 light), so the short name silently
           redefined a hairline token as a saturated accent for every descendant of a
           hue element. Nothing read it for a border yet; the next rule that did would
           have got a solid red edge inside a card and a correct-looking palette. */
        [data-hue]          { --hue-tint: var(--surface2);   --hue-ink: var(--muted); }
        [data-hue="blue"]   { --hue-tint: var(--accent-soft); --hue-ink: var(--accent-text); }
        [data-hue="green"]  { --hue-tint: var(--green-dim);   --hue-ink: var(--green); }
        [data-hue="amber"]  { --hue-tint: var(--gold-dim);    --hue-ink: var(--gold); }
        [data-hue="rose"]   { --hue-tint: var(--red-dim);     --hue-ink: var(--red-text); }
        [data-hue="violet"] { --hue-tint: var(--violet-dim);  --hue-ink: var(--violet); }

        /* Shared eyebrow micro-label */
        .eyebrow, .stat-label, .ds-label, .breakdown-label, .review-q-num,
        .timer-label,
        .sidebar-title, .question-num {
            font-family: var(--font-body);
            font-size: var(--fs-2xs);
            font-weight: 600;
            letter-spacing: var(--ls-caps);
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ============================================================
           TILE — the bento primitive.
           A tile is a fill plus a hairline. Elevation is not a shadow and
           hover is not a lift: light steps the fill DOWN into grey, dark
           steps it UP. Both stay inside the 1.10-1.25 band.
           ============================================================ */
        .hist-list, .hist-exam, .glossary-wrap, .quiz-sidebar, .review-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .topic-chip { transition: background 0.18s var(--ease), border-color 0.18s var(--ease); }
        @media (hover: hover) {
            .topic-chip:hover { background: var(--hover); border-color: var(--border-hover); }
        }
        .topic-chip:active { background: var(--surface3); }

        /* ============================================================
           HEADER — slim top bar
           ============================================================ */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--canvas) 88%, transparent);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding-top: env(safe-area-inset-top);
        }
        .header-content {
            max-width: var(--maxw);
            margin: 0 auto;
            padding: var(--space-sm) var(--space-lg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
        }
        .brand { display: inline-flex; align-items: center; gap: var(--space-sm); min-height: var(--ctl-sm); background: none; border: none; padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-sm); }
        /* The mark is the flag, not a charcoal tile with an E on it. Its three bands are
           written as literals INSIDE the SVG rather than in a rule: they are the German
           flag's own values, they are the same in both themes, and they are a graphic
           with no text on them, so there is no pair for LITERAL_PAIRS to hold. The
           --ink-tile and --on-dark tokens went with the old mark; nothing else read them. */
        .brand-mark {
            width: var(--ctl-sm); height: var(--ctl-sm);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: grid; place-items: center;
        }
        .brand-mark svg { width: 100%; height: 100%; display: block; }
        .brand-lockup { display: flex; flex-direction: column; align-items: flex-start; line-height: var(--lh-tight); }
        .brand-name { font-family: var(--font-head); font-weight: 700; font-size: var(--fs-base); letter-spacing: var(--ls-display); color: var(--text); }
        .brand-tagline { font-size: var(--fs-2xs); color: var(--muted); letter-spacing: var(--ls-caps); }

        /* Inside a session the logo is a link that loses your round, dressed as a
           logo. Body.in-session swaps the two; nothing branches in JS. */
        .session-back {
            display: none;
            align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-sm); padding: 0 var(--space-ms) 0 var(--space-sm);
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--sub-text); font-size: var(--fs-sm); font-weight: 600;
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        .session-back:hover { background: var(--hover); border-color: var(--border-hover); color: var(--text); }
        .session-back-icon { display: grid; place-items: center; }
        /* The icon set has one arrow. This is the same one, mirrored. */
        .session-back-icon svg { width: var(--icon-md); height: var(--icon-md); transform: scaleX(-1); }
        body.in-session header { border-bottom: none; }
        body.in-session .brand { display: none; }
        body.in-session .session-back { display: inline-flex; }

        /* Centred by auto margins rather than by being the middle of a
           space-between row: .session-back is display:none most of the time, so the
           number of flex children changes and space-between would move the nav with it. */
        .header-nav { display: flex; align-items: center; gap: var(--space-sm); margin-inline: auto; }
        .nav-link {
            display: inline-flex; align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-sm); padding: 0 var(--space-sm);
            background: none; border: none; border-radius: var(--radius-sm);
            font-size: var(--fs-sm); font-weight: 600; color: var(--muted);
            transition: color 0.18s var(--ease);
        }
        .nav-link:hover { color: var(--text); }
        /* The mockup underlines the current section. A box-shadow rather than a
           border, so the rule does not add to the control's height. */
        .nav-link--active { color: var(--text); box-shadow: inset 0 -2px 0 var(--text); border-radius: 0; }
        /* PRACTISE is the way in, so it is DRAWN LOUDER than Home - but it is still a
           LINK, not a button (2026-09-21, on request; it wore --btn-fill in a pill for
           a few hours before that). Same shape as .nav-link, one size up and in the
           accent: two items in a two-item nav should read as the same kind of thing,
           and a solid pill beside a bare word reads as a control that does something
           rather than a page you go to. The hero's Start and the CTA band still carry
           the button, so nothing lost the primary voice.
           Its :hover and :active rules stay because .nav-link:hover is (0,2,0) and
           would otherwise repaint it --text; same reason the active rule re-states the
           accent, or the underline and the label come back in --text. */
        .nav-link--cta { font-size: var(--fs-md); color: var(--accent-text); }
        .nav-link--cta:hover { color: var(--accent-text); filter: brightness(1.12); }
        /* The hover STEPS DOWN in light and up in dark, like every other state in this
           sheet — and here it is not only house style. Brightening #2563EB by 1.12 puts
           the label at #296FFF, which is 4.36 on the white canvas: under the AA floor
           that the accent-text/canvas pair in contrast.test.mjs exists to hold. A filter
           is invisible to that test, so the ratchet cannot catch this one. 0.88 is 6.31. */
        html.light .nav-link--cta:hover { filter: brightness(0.88); }
        .nav-link--cta:active { filter: brightness(0.9); }
        .nav-link--cta.nav-link--active {
            color: var(--accent-text); box-shadow: inset 0 -2px 0 var(--accent-text);
        }

        /* About and FAQs were here as aria-disabled buttons wearing a "Soon" chip,
           and both are GONE (2026-09-21, on request) along with .nav-soon, the
           [aria-disabled] state rule and nav.navAbout / nav.navFaqs / nav.soon /
           nav.soonTitle. Nothing else in the app promises a page that does not
           exist; if either is ever built, it comes back as an ordinary .nav-link
           with a data-screen and a real screen behind it. */

        .header-controls { display: flex; align-items: center; gap: var(--space-sm); }

        /* The globe menu. A <details>, so the disclosure behaviour is the platform's. */
        .hmenu { position: relative; }
        .hmenu-summary {
            display: inline-flex; align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-sm); padding: 0 var(--space-ms);
            border-radius: var(--radius-pill);
            border: 1px solid var(--border); background: var(--surface);
            font-size: var(--fs-sm); font-weight: 600; color: var(--sub-text);
            cursor: pointer; list-style: none;
            transition: border-color 0.18s var(--ease), color 0.18s var(--ease);
        }
        .hmenu-summary::-webkit-details-marker { display: none; }
        .hmenu-summary::marker { content: ''; }
        .hmenu-summary:hover { color: var(--text); border-color: var(--border-hover); }
        .hmenu-icon { display: grid; place-items: center; color: var(--muted); }
        .hmenu-icon svg { width: var(--icon-sm); height: var(--icon-sm); }
        .hmenu-caret { display: grid; place-items: center; color: var(--muted); transition: transform 0.18s var(--ease); }
        .hmenu-caret svg { width: var(--icon-xs); height: var(--icon-xs); }
        .hmenu[open] .hmenu-caret { transform: rotate(180deg); }
        .hmenu-panel {
            position: absolute; top: calc(100% + var(--space-sm)); right: 0;
            z-index: 10; min-width: 176px;
            display: flex; flex-direction: column; gap: var(--space-sm);
            padding: var(--space-ms);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        /* THE one shadow in the app, and the one thing in it that genuinely floats:
           an overlay panel above unrelated content, on a white canvas where the
           hairline alone cannot hold it off the page beneath. CLAUDE.md's no-shadow
           rule always carried this condition ("light would only earn a shadow under
           something that genuinely floats, and nothing in this app does") — the
           second clause is what changed, and the rule now records it. Dark needs none:
           its --surface is 1.15 ABOVE the canvas, so the fill already separates.
           The literal is not in LITERAL_PAIRS because a shadow carries no text and
           so has no pair to assert — the same reason .brand-mark's flag is exempt. */
        html.light .hmenu-panel { box-shadow: 0 12px 28px rgba(15, 25, 41, 0.12); }
        .hmenu-panel .eyebrow { display: block; }
        .hmenu-panel .seg { width: 100%; }
        .hmenu-panel .seg-btn { flex: 1; }
        .seg {
            display: inline-flex;
            padding: var(--space-3xs); gap: var(--space-2xs);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
        }
        .seg-btn {
            border: 1px solid transparent; background: none;
            color: var(--muted);
            font-size: var(--fs-2xs); font-weight: 600;
            min-height: var(--ctl-xs); padding: 0 var(--space-ms);
            border-radius: var(--radius-pill);
            transition: color 0.2s var(--ease), background 0.2s var(--ease);
        }
        .seg-btn:hover { color: var(--text); }
        /* The selected segment steps back UP to the tile fill and gets a
           hairline — colour alone is too close to carry the state. */
        .seg-btn.active { color: var(--text); background: var(--surface); border-color: var(--border); }

        /* ============================================================
           LAYOUT / SCREENS
           ============================================================ */
        main {
            max-width: var(--maxw); margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
            /* --space-2xl, down from a literal 96px: that padding was the home screen's
               only bottom breathing room (body.in-session main overrides it outright), and
               the footer's own --space-2xl plus its hairline now does that job. 96 + 40
               read as a band of nothing above the footer. */
            padding-bottom: calc(var(--space-2xl) + env(safe-area-inset-bottom));
        }
        .screen { display: none; animation: fadeUp 0.32s var(--ease) both; }
        .screen.active { display: block; }

        /* ------------------------------------------------------------
           IN-SESSION — everything past the home screen is an app view.
           The PAGE never scrolls; exactly one region inside it does.
           The min-height: 0 chain below is load-bearing: a flex child
           defaults to min-height: auto, and one missing link lets the
           column grow past the viewport again.
           ------------------------------------------------------------ */
        body.in-session { overflow: hidden; }
        body.in-session main {
            /* vh first: a browser that does not know svh drops that line and
               keeps a cap, rather than dropping both and growing. */
            height: calc(100vh - var(--header-h));
            height: calc(100svh - var(--header-h));
            /* Wider gutters than the page uses: in a session the question is the only
               thing on screen, and it should not run to the edges. */
            padding: var(--space-lg) var(--space-xl);
            padding-bottom: calc(var(--space-md) + env(safe-area-inset-bottom));
            overflow: hidden;
            display: flex;
        }
        body.in-session .screen.active {
            flex: 1; min-width: 0; min-height: 0;
            display: flex; flex-direction: column;
        }
        /* The results screen has nothing that needs pinning, so it is one
           scroller and no layout surgery. */
        /* Its scrollbar belongs at the WINDOW's edge, not 28px inside it: the scroller
           spans main's side gutters (negative margin) and re-states them as its own
           padding, so the content does not move and only the bar does. Negative margins
           rather than :has(), which would leave a browser without it double-padded. */
        body.in-session #endScreen.active {
            overflow: hidden auto; overscroll-behavior: contain;
            margin-inline: calc(-1 * var(--space-xl));
            padding-inline: var(--space-xl);
        }
        /* minmax(0, 1fr) rather than the default auto row: an auto row sizes to its
           tallest item, so the card pushed the nav bar off the bottom of a locked
           screen while the grid itself sat comfortably inside it. */
        /* Two columns: the question spans every row on the left, the readouts sit over
           the navigator on the right. The readouts moved out of .quiz-main to make that
           possible — they report on the round, and the round's map is what they now sit
           on top of.
           The readouts and the navigator are ONE block, and its middle lines up with the
           question's middle: a 1fr spacer row either side of the pair takes whatever the
           question column has spare. They only GROW (a zero basis, like the head/tail
           spacers), so when the pair is the taller of the two they collapse to nothing
           and the pair sits where it always did. minmax(0, auto) on the nav row keeps
           the sidebar shrinkable — an auto row would refuse to go below the pane's own
           height and push it out of a locked screen. */
        body.in-session .quiz-layout {
            /* flex lives on the later rule below, beside the auto margins it belongs to. */
            min-height: 0; align-items: start;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: minmax(0, 1fr) auto minmax(0, auto) minmax(0, 1fr);
            grid-template-areas: "main ." "main stats" "main nav" "main .";
        }
        body.in-session .quiz-main { grid-area: main; }
        body.in-session .quiz-topbar { grid-area: stats; }
        body.in-session .quiz-sidebar { grid-area: nav; }
        /* 2x2 over the panel's width rather than four across: the column is 248px, and
           four figures on one line there would set in two anyway, raggedly. */
        body.in-session .quiz-topbar { display: block; margin-bottom: var(--space-md); }
        body.in-session .quiz-topbar .stats-bar {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: var(--space-md); row-gap: var(--space-sm); justify-items: start;
        }
        /* The block sits low on the screen, and the room above and below it BOTH give way
           to content before anything scrolls. Auto margins are what buy that: the block
           is content-sized, the leftover splits above and below it, and as the question
           grows the split shrinks to nothing on both sides — only then does
           .question-body start scrolling. It replaces a rigid `margin-top: min(15svh,
           50svh - 260px)`, which held its 120px open at the top of an 800px screen while
           the reader scrolled a question that had nowhere to go. The resting position is
           the same to within a couple of pixels (measured 135px of gap at 900 against a
           133px even split), so this is the same look with the stiffness taken out —
           and the 260px magic number, which had to be re-derived per mode, is gone. */
        body.in-session .quiz-layout { flex: 0 1 auto; margin-block: 0; }
        /* 40 above, 60 below: centred would be 50:50, so this puts the block a fifth of
           the way higher, towards the bar. Both spacers have a ZERO basis and only GROW,
           which is what makes the lift free — they take only space that is already
           spare, and the moment the question needs it they are the first thing to go
           (there is nothing to take from a zero basis). Auto margins could not do this:
           they split evenly, and a tail with a real basis competed with the question for
           the shrink instead of yielding to it — measured 67px still sitting under a
           question that had started scrolling. */
        body.in-session .quiz-headspace { flex: 4 1 0; min-height: 0; }
        body.in-session .quiz-tailspace { flex: 6 1 0; min-height: 0; }
        /* The exam needs no special case any more. It used to, because its clock was a
           bordered tile costing ~135px that the practice screen did not have; flattened
           to a 36px line it is close enough to practice that the auto margins above
           balance both. `body.in-exam` is still set — the class is cheap and the next
           exam-only rule will want it — but nothing in the layout reads it. */
        /* align-self: center, so the two columns centre on EACH OTHER rather than the
           question always winning. The spacer rows centre the readouts-and-navigator
           pair against the question while the question is the taller of the two; open
           the navigator and the pair becomes the taller, and without this the question
           stayed pinned to the top and the centres drifted apart again. */
        body.in-session .quiz-main { display: flex; flex-direction: column; min-height: 0; max-height: 100%; align-self: center; }
        /* 0 1 auto, not 1: the card takes the height it needs and no more, so a
           four-option question sits at the top of the column instead of being
           stretched down the screen with its buttons pinned to the bottom. It can
           still SHRINK, which is what keeps .question-body's scroller working on a
           long question. */
        /* Content-sized, so Previous and Next sit under the answers instead of at the
           foot of a half-empty column. It can still SHRINK, which is what keeps
           .question-body's scroller working on a long question. */
        body.in-session .question-card { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; }
        /* The only element on the quiz screen with a scrollbar. `contain` stops a
           flick past the last option rubber-banding the locked page behind it. */
        /* hidden on x: the pick animation scales the chosen option by 1.5%, which
           flashed a horizontal scrollbar on every answer. Nothing in here is ever
           legitimately wider than the card. */
        /* The scrollbar sits in the card's own padding with a gutter between it and
           the text, rather than hard against the last word of the question. The
           negative margin is what puts it there; padding-right alone would just
           narrow the content and leave the bar where it was. */
        /* The question sits in the MIDDLE of whatever room it has, rather than at the
           top with the slack dumped underneath it. `safe` is what makes that legal in a
           scroller: without it, centred content that outgrows the box is clipped at the
           top with no way to scroll back up. A browser that does not know the keyword
           drops the declaration and gets the old top alignment, which is a degradation
           rather than a break. Children do not shrink — a squashed image is not
           centring. */
        .question-body {
            flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain;
            padding-right: var(--space-sm); margin-right: calc(var(--space-sm) * -1);
            display: flex; flex-direction: column;
        }
        .question-body > * { flex-shrink: 0; }
        /* The footer row holds a position in the lower part of the screen. The body is
           never shorter than this, so Previous and Next land in the same place on every
           ordinary question, with room to spare beneath them; a longer question pushes
           them down from there, until the column hits the viewport and the body starts
           scrolling instead. vh first, as everywhere else. Below the navigator's
           breakpoint the card fills its area anyway and the buttons are already pinned,
           so the floor is dropped — on a short phone it would force an overflow. */
        body.in-session .question-body { min-height: 50vh; min-height: 50svh; }

        /* One thin bar for every scroller the app owns. The platform default is a
           15px slab against the last word of the question; this is 6px of hairline
           in the gutter each scroller already reserves. */
        .question-body, #questionNavGrid, .sidebar-body, body.in-session #endScreen.active {
            scrollbar-width: thin;
            scrollbar-color: var(--border-hover) transparent;
        }
        .question-body::-webkit-scrollbar,
        #questionNavGrid::-webkit-scrollbar,
        .sidebar-body::-webkit-scrollbar,
        body.in-session #endScreen.active::-webkit-scrollbar { width: 6px; height: 6px; }
        .question-body::-webkit-scrollbar-track,
        #questionNavGrid::-webkit-scrollbar-track,
        .sidebar-body::-webkit-scrollbar-track,
        body.in-session #endScreen.active::-webkit-scrollbar-track { background: transparent; }
        .question-body::-webkit-scrollbar-thumb,
        #questionNavGrid::-webkit-scrollbar-thumb,
        .sidebar-body::-webkit-scrollbar-thumb,
        body.in-session #endScreen.active::-webkit-scrollbar-thumb {
            background: var(--border-hover); border-radius: var(--radius-pill);
        }
        /* Nothing scrolls past the timer or the navigator any more, so neither
           has anything to stick to. */
        body.in-session #timer { position: static; }
        /* A FIXED pane, not a mirror of the question: measured against the question's
           content it held a different height on every question, which is movement with
           nothing behind it. vh first, as everywhere else, so a browser without svh
           keeps a cap; max-height keeps it inside a short viewport. */
        body.in-session .quiz-sidebar {
            position: static; align-self: start;
            height: clamp(300px, 56vh, 680px);
            height: clamp(300px, 56svh, 680px);
            max-height: 100%;
        }
        /* Collapsed — the default — the pane is the header and the view switcher, and
           nothing more, so it sizes to those rather than holding 56svh of nothing. The
           fixed height is what an OPEN pane wants, so it only applies when it is open. */
        body.in-session .quiz-sidebar:not(.nav-open) { height: auto; }
        .sidebar-body:not(.expanded) > #questionNavGrid { display: none; }

        /* Below this the container has less room than the card's own PINNED parts —
           meta row, padding and nav bar come to about 150px before a single word of
           the question. At 740x380 (any phone in landscape) .question-body measured
           0px and .quiz-nav sat at 485px against a 380px viewport, clipped away by
           main's overflow with no way to scroll to it. Readable content wins over
           the no-scroll rule, and only where the rule cannot be kept. */
        @media (max-height: 640px) {
            body.in-session { overflow: auto; }
            body.in-session main {
                height: auto;
                min-height: calc(100vh - var(--header-h));
                min-height: calc(100svh - var(--header-h));
                overflow: visible;
            }
            /* No lock here, so there is no slack to spend and no resting position to
               move — and the capped expression would go NEGATIVE below 520px tall,
               pulling the question up under the progress bar. */
            body.in-session .quiz-layout { grid-template-rows: auto auto auto; flex: 0 0 auto; margin-block: 0; }
            body.in-session .quiz-headspace, body.in-session .quiz-tailspace { display: none; }
            body.in-session .question-card { flex: 0 0 auto; }
            body.in-session #endScreen.active { overflow: visible; }
            /* One scroller, and at this height it is the page. */
            .question-body { overflow: visible; }
        }
        /* In the FLOW, under the band. They were a fixed bar across the bottom, which
           kept them on screen past the point of being useful — once you are in the review
           list there is nothing left for "Your answers" to point at. Here they sit with
           the result they belong to and scroll away behind it. */
        .end-actions {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-sm); flex-wrap: wrap;
            margin-top: var(--space-xl);
        }
        /* Smaller than a page-level action: the ring above is the result, these are what
           you do next. */
        .end-actions .btn-primary, .end-actions .btn-secondary {
            min-height: var(--ctl-sm); padding: 0 var(--space-md); font-size: var(--fs-xs);
        }
        .end-more { display: inline-flex; align-items: center; gap: var(--space-sm); }
        .end-more svg { width: var(--icon-xs); height: var(--icon-xs); }
        /* Visible but inert when there is nothing below — a control that silently does
           nothing is worse than one that says so. */
        .end-more:disabled { opacity: 0.45; cursor: default; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ============================================================
           THE LANDING PAGE — hero, why, numbers, one last call.
           ALL of #homeScreen, for everyone: it was the "landing tier"
           of a two-tier home screen until 2026-09-21, when the app
           moved to #practiseScreen and the tier switch retired.
           Both of its calls to action navigate there.
           ============================================================ */

        /* The pitch on the left, the building on the right. The photo column is
           slightly narrower than the text so the headline gets the room. */
        .hero-landing {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr);
            /* --space-xl, not --space-2xl: 40 is not a gap rung anywhere else in the
               sheet, and a ninth rung is the flat histogram the scale test watches for. */
            gap: var(--space-xl);
            align-items: center;
            padding: var(--space-lg) 0 var(--space-2xl);
        }
        .hero-text { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
        .hero-text > .eyebrow { margin-bottom: var(--space-ms); }

        .hero-headline {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: var(--fs-hero);
            line-height: var(--lh-tight);
            letter-spacing: var(--ls-display);
            color: var(--text);
            text-wrap: balance;
        }
        .hero-lead {
            max-width: 46ch;
            margin-top: var(--space-ms);
            color: var(--sub-text);
            font-size: var(--fs-md);
            line-height: var(--lh-prose);
            text-wrap: pretty;
        }
        .hero-cta-row {
            display: flex; flex-wrap: wrap; gap: var(--space-ms);
            margin-top: var(--space-lg);
        }
        /* One rung down each, on request: --ctl-md (44px) rather than --ctl-lg (52),
           --space-lg of side padding rather than --space-xl, --fs-base rather than
           --fs-md, and --icon-sm for the arrow. 44px is still the app's touch floor,
           so nothing here drops below what everything else holds to. This lands the pair
           on exactly .btn-lg's metrics, which is what the CTA band's button has always
           rendered at (see .cta-btn) — so the page's three primary actions now agree
           rather than the hero's being a rung larger. */
        .hero-cta-row .btn-primary, .hero-cta-row .btn-secondary { min-height: var(--ctl-md); padding: var(--space-ms) var(--space-lg); font-size: var(--fs-base); }
        .hero-cta-row .btn-primary svg { width: var(--icon-sm); height: var(--icon-sm); }

        .hero-visual { position: relative; min-width: 0; }
        .hero-photo {
            position: relative;
            /* 16/10 at EVERY width now. It was 1:1 on desktop and 16/10 only below
               620px, and the reason for the split was the handwritten margin note:
               its ink was a literal measured against the one patch of clean sky in
               the frame, and cropping moved it onto masonry. That note is gone (see
               below), so there is nothing left to hold the square in place and one
               aspect is one rule. object-fit: cover keeps the centred band: full
               pediment, the whole DEM DEUTSCHEN VOLKE inscription, both flags. */
            aspect-ratio: 16 / 10;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface2);
        }
        .hero-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* The handwritten margin notes — the mockup's signature, and the only place
           --font-hand is allowed. Never inherited by body copy. */
        .script-note {
            font-family: var(--font-hand);
            font-size: var(--fs-xl);
            line-height: var(--lh-ui);
            color: var(--muted);
        }
        /* .hero-note is GONE, and it was the crop that killed it. It needed a patch of
           clean sky to sit on and its ink was a literal measured against that sky; a
           16/10 crop removes the top 206 source rows, which is where all of the sky
           is. Scanned at note size across the whole cropped band, the BRIGHTEST
           darkest-pixel anywhere was luminance 15 — the flag's black band moves into
           that corner. There is no position on a cropped frame where it reads, so the
           note went rather than the crop. --font-hand still has two consumers (the
           numbers band's note and the CTA band's), so .script-note stays. */

        .section-head--centred { margin-left: auto; margin-right: auto; text-align: center; }
        .section-head--centred .eyebrow { display: block; margin-bottom: var(--space-2xs); }

        /* The why-band and the numbers band are hairline-separated bands; the shared
           rule lives with .result-stats, which is where that idiom is written down. */
        .stats-grid { list-style: none; }
        /* The why band is NOT a panel, and it is the one of the three that is not.
           Four claims about the product read as four claims; boxing them in a tinted
           panel with hairline dividers turned them into a table, and the tinted discs
           beside them already group each icon with its own line. So no fill, no
           hairline, no 1px separator gap — the items sit straight on the page and a
           real gap does the separating. The numbers band and the CTA band keep the
           panel: a row of four FIGURES is a readout and does want a frame. */
        .why-grid {
            list-style: none;
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: var(--space-xl);
        }
        /* Its own block of air: the section sits between two panels on a white page
           with nothing but whitespace to separate it from either. */
        #whyBand { padding-block: var(--space-2xl); }
        /* 40px under the heading rather than the global 12px. A centred heading over a
           four-column row needs to read as a heading, not as a first line. Scoped to
           this section: .section-head's own margin is shared with every other one. */
        #whyBand .section-head { margin-bottom: var(--space-2xl); }
        /* Same reasoning in the practise band, which is now a single centred line
           over the picker and the five cards. */
        .modes-band .section-head { margin-bottom: var(--space-lg); }
        .why-item {
            flex: 1 1 210px; min-width: 0;
            /* --space-md, up from --space-ms: a 44px disc needs more than 12px before
               the text starts, and --space-md is already a gap rung so this costs the
               histogram nothing. */
            display: flex; align-items: flex-start; gap: var(--space-md);
            /* Vertical air INSIDE the item, not horizontal: padding-inline here would
               inset the first and last items from the page's content edge and break
               their alignment with every other section. */
            padding-block: var(--space-sm);
        }
        .why-icon {
            flex: none; display: grid; place-items: center;
            width: var(--ctl-md); height: var(--ctl-md);
            border-radius: var(--radius-pill);
            background: var(--hue-tint); color: var(--hue-ink);
        }
        .why-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        .why-item h3 { font-size: var(--fs-base); font-weight: 600; color: var(--text); }
        .why-item p { margin-top: var(--space-xs); font-size: var(--fs-xs); line-height: var(--lh-prose); color: var(--muted); }

        .stats-item {
            flex: 1 1 130px; min-width: 0;
            display: flex; flex-direction: column; align-items: center; gap: var(--space-2xs);
            padding: var(--space-md);
            text-align: center;
            background: var(--band);
        }
        /* A readout, not a heading: --fs-2xl is the display-numeral step the rings and
           counters take, and it does not outrank an --fs-xl section heading. */
        .stats-num {
            font-family: var(--font-head); font-weight: 700;
            font-size: var(--fs-3xl); line-height: var(--lh-tight);
            letter-spacing: var(--ls-display);
            color: var(--text);
        }
        .stats-label { font-size: var(--fs-2xs); line-height: var(--lh-ui); color: var(--muted); }
        .stats-item--note { flex: 1 1 170px; justify-content: center; }

        .cta-band {
            position: relative;
            display: flex; align-items: center; flex-wrap: wrap;
            gap: var(--space-lg);
            padding: var(--space-xl);
            background: var(--band);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .cta-copy { flex: 1 1 280px; min-width: 0; }
        .cta-copy .eyebrow { display: block; margin-bottom: var(--space-2xs); }
        .cta-copy h2 {
            font-family: var(--font-head); font-weight: 600;
            font-size: var(--fs-2xl); letter-spacing: var(--ls-display);
            color: var(--text);
        }
        .cta-lead { margin-top: var(--space-2xs); font-size: var(--fs-base); line-height: var(--lh-prose); color: var(--muted); }
        /* flex: none, and nothing else. This rule also set min-height: --ctl-lg,
           --space-xl of padding and --fs-md, and ALL THREE were dead: the markup is
           `btn-primary btn-lg cta-btn`, and .btn-lg sits ~440 lines later in the
           sheet at the same single-class specificity, so it won every one of them.
           The button has always rendered at .btn-lg's 44px/--space-lg/--fs-base;
           measuring it is what found this. Size it through .btn-lg, or drop that
           class from the markup — do not re-add declarations here. */
        .cta-btn { flex: none; }
        .cta-btn svg { width: var(--icon-md); height: var(--icon-md); }
        /* An ornament. Take it out and the band is still heading, lead and button. */
        .cta-art { flex: none; display: block; color: var(--border-hover); }
        .cta-art svg { width: 120px; height: auto; display: block; }
        .cta-note { flex: none; max-width: 170px; }


        /* ============================================================
           HOME — a page of named sections, not a wall of tiles.
           The rhythm is: section heading > card title > body. Every
           section owns one job and says so above itself.
           ============================================================ */
        .home-section { margin-bottom: var(--space-xl); }
        .home-section:last-child { margin-bottom: 0; }

        .section-head { margin-bottom: var(--space-ms); max-width: 62ch; }
        /* The picker centres under the practise band's heading. It was a column beside
           a left-aligned heading; the heading is centred over the panel now, so there is
           nothing to sit opposite and the label rides on the same line as the pill. */
        #statePickerSlot {
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            gap: var(--space-sm); min-width: 0;
            margin-bottom: var(--space-lg);
        }
        .state-picker-label { display: block; }
        .section-head h2 {
            font-family: var(--font-head);
            font-weight: 600;
            font-size: var(--fs-2xl);
            letter-spacing: var(--ls-display);
            color: var(--text);
        }
        .section-head p {
            margin-top: var(--space-2xs);
            font-size: var(--fs-base);
            line-height: var(--lh-prose);
            color: var(--muted);
        }
        /* The tail is reference material, not something to act on. */
        .home-section--quiet .section-head h2 { font-size: var(--fs-lg); }

        /* The one scrollToId() target left: "Learn more" lands on #whyBand,
           and without this the sticky header sits on top of the heading it scrolled to.
           --header-h is what syncHeaderHeight() measures, so it tracks the phone's
           shorter strip too — a fixed 76px was the desktop header's height alone. */
        #whyBand { scroll-margin-top: var(--header-h); }

        /* ---- Overview card: ring headline + three counters ---- */
        .dash {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-md);
        }

        .state-picker {
            position: relative;
            min-width: 0; max-width: 100%;
            display: inline-flex; align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-md);
            padding: 0 calc(var(--space-xl) + var(--space-sm)) 0 var(--space-ms);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            color: var(--muted);
            cursor: pointer;
        }
        /* The <select> is invisible, so its own focus ring is too. The pill wears it. */
        .state-picker:focus-within {
            border-color: var(--accent);
            outline: 2px solid var(--accent-text);
            outline-offset: 3px;
        }
        .state-picker select:focus-visible { outline: none; }
        .state-picker svg { width: var(--icon-sm); height: var(--icon-sm); flex-shrink: 0; color: var(--muted); }
        /* The pill hugs this, so it fits "Berlin" as well as it fits
           "Mecklenburg-Vorpommern". */
        .state-picker-value {
            color: var(--text);
            font-size: var(--fs-base); font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        /* The real control, invisible, over the whole pill. 16px so iOS does not
           zoom when it opens. */
        .state-picker select {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            opacity: 0;
            font-size: var(--fs-md);
            border: none;
            cursor: pointer;
        }
        /* the caret, drawn once so the native arrow can stay hidden */
        .state-picker::after {
            content: ''; position: absolute; right: var(--space-ms); top: 50%;
            width: 7px; height: 7px; margin-top: calc(var(--space-2xs) * -1);
            border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
            transform: rotate(45deg); pointer-events: none;
        }

        /* The ring and the three counters are ONE band, not four boxes. The
           card is the only container here; inside it the figures are separated
           by hairlines, which is the same move the rest of the app makes. */
        .dash-body {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: stretch;
            gap: var(--space-lg);
        }
        .ready-ring-wrap { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
        .ready-ring { width: 100%; height: 100%; display: block; }
        .ready-ring-track { fill: none; stroke: var(--surface3); stroke-width: 8; }
        .ready-ring-bar {
            fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round;
            stroke-dasharray: 314; stroke-dashoffset: 314;
            transition: stroke-dashoffset 0.95s var(--ease-spring);
        }
        .ready-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .ready-ring-pct { color: var(--text); font-family: var(--font-head); font-weight: 600; font-size: var(--fs-xl); line-height: 1; letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }

        .dash-stats {
            display: grid; grid-template-columns: repeat(3, 1fr);
            padding-right: var(--space-2xl);
            align-items: center;
            min-width: 0;
            border-left: 1px solid var(--border);
        }
        .dash-stat {
            padding: 0 var(--space-md);
            display: flex; flex-direction: column; gap: var(--space-sm);
            min-width: 0;
        }
        .dash-stat + .dash-stat { border-left: 1px solid var(--border); }
        /* Something to do today is the one counter allowed to raise its hand,
           and a coloured numeral is the whole of it — a tinted slab behind it
           reads as brown mud on charcoal and buys no more attention. */
        .dash-stat--due .ds-num { color: var(--gold); }
        /* A counter is a READOUT. It reports on the section it sits in; it does not
           outrank the heading above it or the cards you are meant to press. Same move
           .stat-value made on the quiz screen (20.8 -> 16). */
        .ds-num { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-lg); line-height: 1; letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; color: var(--text); }
        .ds-of { color: var(--faint); font-size: var(--fs-xs); font-weight: 500; }

        .resume-banner {
            margin-top: var(--space-md);
            padding: var(--space-ms) var(--space-md);
            background: var(--accent-soft);
            border: 1px solid var(--accent-line);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-md); flex-wrap: wrap;
        }
        .resume-text { display: flex; flex-direction: column; gap: var(--space-2xs); font-size: var(--fs-sm); color: var(--muted); }
        .resume-text strong { color: var(--text); font-size: var(--fs-base); }
        .resume-actions { display: flex; gap: var(--space-sm); }

        /* The escape hatch is a corner glyph, not a row. A whole footer rule and a
           44px band for something you press once a year cost more height than the
           numbers above it. It keeps its 44px touch target by being 44px square. */
        .progress-reset {
            position: absolute; top: 6px; right: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            width: var(--ctl-md); height: var(--ctl-md);
            background: none; border: none; color: var(--muted);
            transition: color 0.2s var(--ease);
        }
        .progress-reset svg { width: var(--icon-md); height: var(--icon-md); }
        .progress-reset:hover { color: var(--red-text); }

        /* ============================================================
           MODE CARDS — five equal peers
           ------------------------------------------------------------
           The column counts are explicit rather than auto-fit, and that
           is deliberate: with FIVE cards, four columns leaves a single
           orphan on the second row and two columns leaves one on the
           third. Only 5, 3 and 1 divide the set without stranding a
           card, so those are the three layouts.
           ============================================================ */
        /* The mockup's pale panel behind the five cards, read as a RECESS in both
           themes: a step DOWN from the canvas, with the cards left as ordinary
           --surface tiles 1.2 above it (see --band). --space-2xl top and bottom,
           --space-lg at the sides — the reason for --lg rather than --xl is with the
           padding declaration below, and this line must not contradict it.
           The panel's job is to give the band air the canvas cannot. */
        .modes-band {
            background: var(--band);
            /* The recess is 1.06 off the canvas in dark and 1.08 in light, both under the
               1.20 where theme-dark.md §5 says to stop pushing fills apart and draw the
               edge — and the why, numbers and CTA bands below all carry this hairline
               already, so it is the page's own idiom rather than a new one. */
            border: 1px solid var(--border);
            border-radius: var(--radius);
            /* --space-lg at the sides, not --space-xl: the panel's inset comes straight
               off the five cards' width, and it is width that decides this grid. Bleeding
               the panel out through main's gutter was tried and reverted — main is only
               capped above ~1140px, so below that the band ran flush to the window with
               its 16px corners cut off, and the width it bought was not what fixed the
               card anyway (the card's own side padding was). */
            padding: var(--space-xl) var(--space-md);
        }
        /* --space-sm, not --space-md: at five columns every pixel of gap and of the
           panel's inset comes off the card, and the meta row has to hold the count and
           the estimate on ONE line. The two together buy 8px of card width. */
        .modes-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: var(--space-sm);
        }
        /* 1160, not the 940 the rest of the sheet breaks at: five columns of a 1009px
           content width is a 157px card, and "Prüfungssimulation" is one 18-character
           word that does not fit in one. Measured in German, which is what decides it. */
        @media (max-width: 1160px) {
            .modes-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        .mode-card {
            position: relative;
            /* Taller than it is wide-padded, for the same reason the band is. */
            padding: var(--space-lg) var(--space-md);
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex; flex-direction: column;
            text-align: left;
            font: inherit; color: inherit;
            transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
        }
        @media (hover: hover) {
            .mode-card:hover { background: var(--hover); border-color: var(--border-hover); }
        }
        .mode-card:active { background: var(--surface3); }

        /* ON THE RECESS, light has to move both state fills up a rung. A white card can
           only step DOWN, and the panel is only 1.20 beneath it: --hover lands 1.067
           from --band and --surface3 just 1.039, under the 1.05 nesting floor, so a
           pressed card merged into the panel — and the hairline cannot rescue it there
           (--border is 1.039 on --band too). Hover takes --surface2 (1.111) and press
           takes --hover (1.067). Dark is untouched: its states step UP and already clear
           the panel by 1.43 and 1.57. Same two rules for the topic chips, which sit on
           the same ground. */
        @media (hover: hover) {
            html.light .modes-band .mode-card:hover,
            html.light .modes-band .topic-chip:hover { background: var(--surface2); }
        }
        /* --surface3, not --hover: on the white canvas --hover lands 1.047 from the
           panel, under the 1.05 nesting floor, so a pressed card all but merged into
           it. --surface2 is 1.078 off the band and --surface3 1.215. */
        html.light .modes-band .mode-card:active,
        html.light .modes-band .topic-chip:active { background: var(--surface3); }

        /* The exam card was featured until 2026-09-21: full width, accent-tinted, with a
           solid Start pill. The landing page sells five modes as peers, so the treatment
           went with it — along with .mode-start-btn, .msb-arrow and the `mode.start`
           string, which was the only place any card said "Start" in words. */

        /* The estimate sits in the META row, beside the count. It has been three things:
           absolutely positioned top-right (it printed on top of the title once the icon
           joined the title's line), then in the head row pushed right by margin-left:auto
           — which worked at three cards a row and broke at five, where a nowrap
           "approx. 60-90 min" claimed 115px of a 165px row and squeezed "All questions"
           down to 13px. In the meta row it is beside the one other fact the card states,
           and it can wrap. */
        .mode-time {
            display: inline-flex; align-items: center; gap: var(--space-2xs);
            color: var(--muted);
        }
        /* A clock, not a middot: the glyph is what says "duration", which is why the
           strings could drop "approx."/"ca." and "limit" and fit beside the count. */
        .mode-time svg { width: var(--icon-xs); height: var(--icon-xs); flex: none; }
        /* A SOLID disc of the card's hue with a white arrow in it, and the action
           named beside it — the mockup's "Start Simulation" / "Choose Topics" row. The
           bare corner arrow it replaces was the compromise made when the cards had no
           colour to carry an action, and on a touch screen it read as a decoration. The
           label is --text, not the hue: the mockup's own label measures #000417. */
        .mode-start {
            display: flex; align-items: center; justify-content: center; gap: var(--space-sm);
            margin-top: var(--space-ms);
            font-size: var(--fs-xs); font-weight: 600; color: var(--text);
        }
        .mode-start-dot {
            flex: none; display: grid; place-items: center;
            width: var(--ctl-xs); height: var(--ctl-xs);
            border-radius: var(--radius-pill);
            background: var(--hue-ink); color: var(--on-hue);
            transition: transform 0.25s var(--ease-spring);
        }
        .mode-start-dot svg { width: var(--icon-xs); height: var(--icon-xs); }
        @media (hover: hover) {
            .mode-card:hover .mode-start-dot { transform: translateX(3px); }
        }

        /* A tinted plate, per the mockup — see the HUE DISCS block. --ctl-md is 44px
           against the mockup's 48, and concentric rounding puts a --radius-sm (10px)
           inner corner inside a --radius (16px) card with --space-md of padding. */
        .mode-icon {
            display: grid; place-items: center;
            width: var(--ctl-md); height: var(--ctl-md); flex-shrink: 0;
            border-radius: var(--radius-sm);
            background: var(--hue-tint); color: var(--hue-ink);
            margin: 0;
        }
        .mode-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        /* The plate sits ABOVE the title, which is the mockup's card: plate, title,
           description, then the action row. It goes back to one row on a phone, where
           the card is a list item rather than a tile. */
        .mode-head { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-ms); margin-bottom: var(--space-2xs); }
        .mode-head .mode-title { min-width: 0; }
        /* German compounds are one long word, and five cards a row is a 167px title
           box: "Prüfungssimulation" overflows it whatever the width, because `main`
           caps the content long before the viewport does. `hyphens: auto` breaks it
           properly (the root carries lang="de" when the UI is German) and
           `overflow-wrap: anywhere` is the backstop, exactly as `.opt-num` handles
           "Christusmonogramm". */
        .mode-title { font-family: var(--font-head); font-weight: 600; font-size: var(--fs-md); letter-spacing: var(--ls-display); margin-bottom: 0; hyphens: auto; overflow-wrap: anywhere; }
        .mode-description {
            color: var(--sub-text); font-size: var(--fs-sm); line-height: var(--lh-prose);
            margin-bottom: var(--space-sm);
        }
        /* A chip states a fact; the fact is small and grey. Only work that is
           actually waiting gets a colour. */
        /* ONE line, and the count and the estimate at ONE size: --fs-xs for the count
           over --fs-2xs for the estimate put 155px of text in a 157px card and wrapped.
           nowrap is the guarantee rather than the hope - if a translation ever outgrows
