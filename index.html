                             against the PHOTO, not against the photo plus its credit line
                             - which is what put the quote card on top of the credit. -->
                        <!-- The note sits on the one patch of this photograph that is clean
                             sky (top right: darkest pixel under it measures 210 of 255. The
                             mockup's top-left corner is our EU flag). Its ink is a literal
                             because its ground is a photograph rather than a token; see
                             LITERAL_PAIRS. The mockup's curved arrow is dropped - every
                             region it could point from has a flagpole running through it. -->
                    </figure>
                </div>
            </div>

            <!-- 3b · Why — the landing tier's argument. Four claims, hairline-separated
                 by a 1px GAP over the band's ground: a border-left draws a stray rule on
                 the first cell of a wrapped row, which is the results band's lesson. -->
            <section class="home-section" id="whyBand">
                <div class="section-head section-head--centred">
                    <p class="eyebrow" data-i18n="why.eyebrow"></p>
                    <h2 data-i18n="why.title"></h2>
                </div>
                <ul class="why-grid">
                    <li class="why-item" data-hue="blue"><span class="why-icon" data-icon="book" aria-hidden="true"></span><div><h3 data-i18n="why.1.title"></h3><p data-i18n="why.1.body"></p></div></li>
                    <li class="why-item" data-hue="green"><span class="why-icon" data-icon="shield" aria-hidden="true"></span><div><h3 data-i18n="why.2.title"></h3><p data-i18n="why.2.body"></p></div></li>
                    <li class="why-item" data-hue="violet"><span class="why-icon" data-icon="community" aria-hidden="true"></span><div><h3 data-i18n="why.3.title"></h3><p data-i18n="why.3.body"></p></div></li>
                    <li class="why-item" data-hue="amber"><span class="why-icon" data-icon="star" aria-hidden="true"></span><div><h3 data-i18n="why.4.title"></h3><p data-i18n="why.4.body"></p></div></li>
                </ul>
            </section>

            <!-- 3c · The four headline numbers. They are READOUTS: capped at --fs-2xl so
                 they cannot outrank a heading. -->
            <section class="home-section">
                <ul class="stats-grid">
                    <li class="stats-item"><span class="stats-num">300</span><span class="stats-label" data-i18n="stats.1"></span></li>
                    <li class="stats-item"><span class="stats-num">16</span><span class="stats-label" data-i18n="stats.2"></span></li>
                    <li class="stats-item"><span class="stats-num">2</span><span class="stats-label" data-i18n="stats.3"></span></li>
                    <li class="stats-item"><span class="stats-num">60</span><span class="stats-label" data-i18n="stats.4"></span></li>
                    <li class="stats-item stats-item--note"><p class="script-note" data-i18n="stats.annotation"></p></li>

            </section>

            <!-- 3d · One last call. The gate is an ornament: remove it and the band is
                 still heading, lead and button. -->
            <section class="home-section cta-band">

                    <p class="eyebrow" data-i18n="cta.eyebrow"></p>
                    <h2 data-i18n="cta.title"></h2>

                <p class="script-note cta-note" data-i18n="cta.annotation"></p>

        </section>

        <!-- PRACTISE — the app itself: where you stand, the five modes, the topic
             reveal, and the quiet tail. Reached from the header nav and from both of
             the landing page's calls to action. It is a PAGE, not a session: it
             scrolls, it keeps the footer and it keeps the nav, which is why
             showScreen() reads PAGE_SCREENS rather than testing for 'home'. -->
        <section id="practiseScreen" class="screen">
            <!-- 1 · Where you stand — one wide card, the returning learner's opening statement. -->
            <section class="home-section" data-needs-data>
                <div class="section-head">
                    <h2 data-i18n="home.progress.title"></h2>
                    <p data-i18n="home.progress.lead"></p>
                </div>
                <div id="homeStatus"></div>
            </section>

            <!-- 2 · Practise — the main event. It carried #homeMain while the hero's
                 CTA scrolled to it; the CTA navigates here now, so the anchor is gone. -->
            <section class="home-section modes-band">
                <!-- The heading alone. "Practise your way" and "Five ways in - one
                     goal: passing." both said what "Choose your practice mode" plus
                     five visibly different cards already say, and three stacked lines
                     of chrome pushed the cards down the panel for nothing. -->
                <div class="section-head section-head--centred">
                    <h2 data-i18n="home.practice.title"></h2>
                </div>
                <!-- The picker sits UNDER the centred heading rather than opposite it:
                     it still belongs to the section it changes, but a centred heading
                     has nothing for it to sit across from. -->
                <div id="statePickerSlot"></div>
                <div class="modes-grid" id="modesGrid"></div>
                <!-- The Topic card's reveal. It is BELOW the grid, not in it, so opening
                     it cannot reflow the five cards. renderTopics() fills it unchanged;
                     only its mount moved here from the retired "By topic" section. -->
                <div id="topicSection" hidden></div>
            </section>

            <!-- 4 · Quieter tail: what you did, and what the words mean. -->
            <section class="home-section home-section--quiet" data-needs-data>
                <div class="section-head">
                    <h2 data-i18n="home.more.title"></h2>
                    <p data-i18n="home.more.lead"></p>
                </div>
                <div id="historySection"></div>
                <div id="glossarySection"></div>
            </section>
        </section>

        <!-- Quiz Screen -->
        <section id="quizScreen" class="screen">
            <div class="quiz-progress" aria-hidden="true"><span id="quizProgressFill"></span></div>

            <!-- The two spacers split the free space 40:60, which puts the block a fifth
                 higher than centred. Both have a ZERO basis and only grow, so they exist
                 only while there is room to spare and collapse the instant the question
                 wants it — the question then scrolls, never before. -->
            <div class="quiz-headspace" aria-hidden="true"></div>

            <div class="quiz-layout">
                <!-- The readouts are a grid item of their own: on a wide screen they sit
                     above the navigator in the right column, on a phone they fall below
                     the question. Either way they are no longer inside .quiz-main. -->
                <div class="quiz-topbar">
                    <div class="stats-bar" id="statsBar">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>

                <!-- Left column: the question (+ timer for exam mode) -->
                <div class="quiz-main">
                    <div id="timer" style="display: none;">
                        <div class="timer-label" data-i18n="quiz.time"></div>
                        <div class="timer-display" id="timerDisplay">60:00</div>
                    </div>

                    <div class="question-card">
                        <div class="question-body" id="questionBody">
                        <div class="question-meta">
                            <div>
                                <span class="question-num" id="questionNum"></span>
                                <span class="question-category" id="questionCategory"></span>
                            </div>
                            <div class="question-meta-actions">
                                <button class="speak-btn" id="speakBtn" data-i18n-aria="quiz.speak"></button>
                                <button class="bilingual-toggle" id="bilingualToggle"></button>
                            </div>
                        </div>
                        <div class="question-text" id="questionText" tabindex="-1" lang="de"></div>

                        <div id="imageCredit" style="display: none; font-size: 0.68rem; color: var(--muted); text-align: center; margin: -4px 0 6px;"></div>

                        <div class="options" id="optionsContainer" lang="de"></div>

                        <div class="explanation" id="explanation" role="status" aria-live="polite">
                            <div class="explanation-header" id="explanationHeader"></div>
                            <div class="explanation-text" id="explanationText" lang="de"></div>
                            <div class="explanation-english" id="explanationEnglish" lang="en"></div>
                        </div>
                        </div>

                    </div>

                    <div class="quiz-nav">
                        <button class="btn-secondary" id="backBtn">← <span data-i18n="quiz.prev"></span></button>
                        <div id="keyboardHintContainer"></div>
                        <button class="btn-primary" id="nextBtn"></button>
                    </div>
                </div>

                <!-- Right column: vertical navigator sidebar -->
                <aside class="quiz-sidebar" id="questionNavWrapper" style="display: none;">
                    <div class="sidebar-header" id="sidebarToggle" aria-controls="sidebarBody">
                        <div class="sidebar-header-row">
                            <span class="sidebar-title" data-i18n="qnav.overview"></span>
                            <span class="sidebar-chevron" id="sidebarChevron"></span>
                        </div>
                    </div>
                    <div class="sidebar-body" id="sidebarBody">
                        <div id="navActions"></div>
                        <div class="question-nav-grid" id="questionNavGrid"></div>
                    </div>
                </aside>
            </div>
            <div class="quiz-tailspace" aria-hidden="true"></div>

        </section>

        <!-- End Screen -->
        <section id="endScreen" class="screen">
            <div class="end-screen">
                <h1 id="endTitle"></h1>

                <!-- No card around the score. The ring and the verdict sit on the page,
                     the way the question does: a box around them carried no information
                     and cost a band of height at the top of every result. -->
                <div class="score-hero">
                    <div class="score-ring-wrap">
                        <svg class="score-ring" viewBox="0 0 140 140" aria-hidden="true">
                            <circle class="score-ring-track" cx="70" cy="70" r="60"></circle>
                            <circle class="score-ring-bar" id="scoreRingBar" cx="70" cy="70" r="60"
                                    transform="rotate(-90 70 70)"></circle>
                        </svg>
                        <div class="score-ring-center">

                            <span class="score-number" id="finalScore"></span>
                        </div>
                    </div>
                    <div class="pass-fail" id="passFail"></div>
                    <div class="pass-threshold-note" id="passThreshold" hidden></div>
                </div>

                <!-- ONE band, hairline-separated, exactly as the home overview card does
                     it — not two wells plus three more cards underneath. -->
                <div class="result-stats" id="resultStats"></div>

                <!-- IN THE FLOW, under the result they belong to. They are above the fold
                     because the hero and the band are sized to leave room for them, and
                     they scroll away once you have gone past — which is the point: after
                     "More below" there is nothing left for them to say. There is no Back
                     here; the header already carries one. -->
                <div class="end-actions">
                    <button class="btn-primary" id="restartBtn"></button>
                    <button class="btn-secondary" id="retryWrongBtn" data-i18n="end.retryWrong"

                    </button>
                </div>

                <div id="reviewSection"></div>
            </div>
        </section>

        };

            // against the 17/33 threshold.
            try { const c = localStorage.getItem(STATE_KEY); return STATES[c] ? c : 'BE'; }

            selectedState = STATES[code] ? code : 'BE';

        function generalQuestions() { return QUESTIONS.filter(q => !q.state); }            // 300

        // Unbiased random sample (Fisher-Yates). NOT sort(() => Math.random() - 0.5): that
        // comparator is inconsistent, and it made early catalogue questions ~7x likelier to
        // land in an exam than late ones.
        function sample(arr, n) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a.slice(0, n);
        }

            'end.home':            { en: 'Back',                    de: 'Zurück' },
            /* It names its destination — the section heading it scrolls to says the same
               words — which tells you what is down there, where "More below" only said
               that something was. */
            'end.more':            { en: 'Your answers',            de: 'Deine Antworten' },
            'end.reviewTitle':     { en: 'Review your wrong answers', de: 'Falsche Antworten überprüfen' },
            'end.examReviewCount': { en: '{n} questions',             de: '{n} Fragen' },
            'end.aRight':          { en: 'Correct',                   de: 'Richtig' },
            'end.aWrong':          { en: 'Wrong',                     de: 'Falsch' },
            'end.aBlank':          { en: 'Not answered',              de: 'Nicht beantwortet' },
            'end.reviewCount':     { en: '{n} question',            de: '{n} Frage' },
            'end.reviewCountPl':   { en: '{n} questions',           de: '{n} Fragen' },
            'end.retryWrong':      { en: 'Retry the wrong ones',    de: 'Fehler wiederholen' },
            'end.reviewQ':         { en: 'Question {id}',           de: 'Frage {id}' },

            'quit.resumable':      { en: 'Leave the quiz and go home? You can pick this session up later.', de: 'Quiz beenden und zur Startseite? Du kannst die Sitzung später fortsetzen.' },
            'quit.lost':           { en: 'Leave the quiz and go home? Your progress in this round is lost.', de: 'Quiz beenden und zur Startseite? Dein Fortschritt in dieser Runde geht verloren.' },

            // errors
            'err.load':            { en: 'Questions could not be loaded. Please reload the page.', de: 'Fragen konnten nicht geladen werden. Bitte lade die Seite neu.' },
        };

        /** Mark one segment of a segmented switch as chosen — visually and for AT. */
        function setSegment(el, on) {
            el.classList.toggle('active', on);
            el.setAttribute('aria-pressed', String(on));
        }

        /** Look up a chrome string in the active language, filling {placeholders}. */
        function t(key, vars) {
            const entry = I18N[key];
            let s = entry ? (entry[lang] || entry.en) : key;
            if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            return s;
        }

        /** A topic label, in the active language. */
        const catLabel = key => (CATEGORIES[key] ? (CATEGORIES[key][lang] || CATEGORIES[key].en) : key);

        /** Fill every [data-i18n] / [data-i18n-html] / [data-i18n-aria] in the static markup. */
        function applyStaticStrings() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.dataset.i18nTitle)); });
            document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.setAttribute('alt', t(el.dataset.i18nAlt)); });
        }

        /**
         * The two segments and the globe summary's badge, which all three say the same
         * thing. ONE site, because initLang() and setLang() both need it and the pasted
         * copy would have drifted the moment the badge showed anything but a code.
         * The badge is not a data-i18n string: it is a language CODE, identical in
         * both languages, so applyStaticStrings() must not own it.
         */
        function paintLangControls() {
            document.documentElement.lang = lang;
            setSegment(document.getElementById('langDe'), lang === 'de');
            setSegment(document.getElementById('langEn'), lang === 'en');
            const badge = document.getElementById('langBadge');
            if (badge) badge.textContent = lang.toUpperCase();
        }

        /** Paint the saved language on boot, without re-rendering screens that do not exist yet. */
        function initLang() {
            paintLangControls();
            applyStaticStrings();
        }

        function setLang(next) {
            lang = next === 'de' ? 'de' : 'en';
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            paintLangControls();
            applyStaticStrings();
            // Repaint whichever screen is on. Every renderer reads from `state`, so
            // this changes the chrome without touching the round in progress.
            initHomeScreen();
            if (state.currentScreen === 'quiz' && state.currentQuestions.length) displayQuestion();
            if (state.currentScreen === 'end') { renderEndScreen(); requestAnimationFrame(syncEndScrollCue); }
        }

        // ============================================================
        // APPLICATION STATE
        // ============================================================
        let state = {
            currentScreen: 'home',
            currentMode: null,
            currentQuestionIndex: 0,
            currentQuestions: [],
            answered: {},          // { [questionIndex]: chosenOptionIndex }
            correct: 0,
            incorrect: 0,
            showEnglish: false,
            showExplanation: false,
            timerInterval: null,
            timeLeft: 3600,
            themeDark: true,
            missedQuestions: [],   // {q, userAnswerIdx} for wrong-answer review
            examStartTime: null,   // Date.now() when exam begins
            elapsedSecs: null,     // seconds taken, frozen at endQuiz so the results repaint
            shuffled: false,       // the round is in random order, not the order it was built in
            navView: 'linear',     // which of the navigator's three views is on
            baseOrder: null,       // question ids in the order the round was built, captured on first shuffle
            generalCorrect: 0,     // correct general answers (exam sub-score)
            stateCorrect: 0,       // correct state answers (exam sub-score)
        };

        // ============================================================
        // PERSISTENT PROGRESS + SPACED REPETITION (Leitner)
        // ============================================================
        const PROGRESS_KEY = 'eib_progress_v1';
        const SESSION_KEY  = 'eib_session_v1';
        const MAX_BOX = 5;
        const DAY_MS  = 86400000;
        const BOX_INTERVALS = [0, 1, 3, 7, 16, 35]; // days until due, index = box 1..5

        // { [id]: { seen, correct, wrong, streak, lastSeen, box, due } }
        let progress = {};

        function loadProgress() {
            try {
                const raw = localStorage.getItem(PROGRESS_KEY);
                progress = raw ? JSON.parse(raw) : {};
            } catch (e) { progress = {}; }
            if (!progress || typeof progress !== 'object') progress = {};
        }
        function saveProgress() {
            try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
        }
        function recordAnswer(q, isCorrect) {
            const now = Date.now();
            const r = progress[q.id] || { seen: 0, correct: 0, wrong: 0, streak: 0, lastSeen: 0, box: 1, due: 0 };
            r.seen++;
            r.lastSeen = now;
            if (isCorrect) {
                r.correct++;
                r.streak = (r.streak || 0) + 1;
                r.box = Math.min(MAX_BOX, (r.box || 1) + 1);
            } else {
                r.wrong++;
                r.streak = 0;
                r.box = 1;
            }
            r.due = now + BOX_INTERVALS[r.box] * DAY_MS;
            progress[q.id] = r;
            saveProgress();
        }
        function masteredCount() {
            return activePool().filter(q => { const r = progress[q.id]; return r && (r.box || 1) >= 4; }).length;
        }
        // Scoped to the active pool, like every other number on the overview tile —
        // otherwise switching Bundesland silently keeps the old state's answers in the ring.
        function overallAccuracy() {
            let c = 0, t = 0;
            for (const q of activePool()) {
                const r = progress[q.id];
                if (!r) continue;
                c += r.correct || 0; t += (r.correct || 0) + (r.wrong || 0);
            }
            return t ? Math.round(c / t * 100) : 0;
        }
        // Smart Review queue: due (weakest box first), then unseen, then nearest-due — capped.
        function buildReviewQueue(limit = 25) {
            const pool = activePool();
            const now = Date.now();
            const due = pool.filter(q => progress[q.id] && progress[q.id].due <= now)
                .sort((a, b) => (progress[a.id].box - progress[b.id].box) || (progress[a.id].due - progress[b.id].due));
            const unseen = pool.filter(q => !progress[q.id]);
            const queue = [...due, ...unseen];
            if (queue.length < limit) {
                const rest = pool.filter(q => progress[q.id] && progress[q.id].due > now)
                    .sort((a, b) => progress[a.id].box - progress[b.id].box);
                queue.push(...rest);
            }
            return queue.slice(0, limit);
        }
        function reviewDueCount() {
            const now = Date.now();
            return activePool().filter(q => progress[q.id] && progress[q.id].due <= now).length;
        }
        function clearProgress() {
            progress = {};
            resultsHistory = [];
            try {
                localStorage.removeItem(PROGRESS_KEY);
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem(HISTORY_KEY);
            } catch (e) {}
        }

        // ---- results history ----
        const HISTORY_KEY = 'eib_history_v1';
        let resultsHistory = [];
        function loadHistory() {
            try { const raw = localStorage.getItem(HISTORY_KEY); resultsHistory = raw ? JSON.parse(raw) : []; }
            catch (e) { resultsHistory = []; }
            if (!Array.isArray(resultsHistory)) resultsHistory = [];
        }
        function recordResult(entry) {
            resultsHistory.push(entry);
            if (resultsHistory.length > 50) resultsHistory = resultsHistory.slice(-50);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(resultsHistory)); } catch (e) {}
        }

        // ---- in-progress session resume (non-exam modes) ----
        function saveSession() {
            if (state.currentMode === 'exam' || state.currentMode === 'mistakes' || !state.currentQuestions.length) return;
            try {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    mode: state.currentMode,
                    topic: state.currentTopic || null,
                    stateCode: state.stateCode || null,
                    ids: state.currentQuestions.map(q => q.id),
                    idx: state.currentQuestionIndex,
                    answered: state.answered,
                    shuffled: state.shuffled,
                    navView: state.navView,
                    baseOrder: state.baseOrder,
                    correct: state.correct,
                    incorrect: state.incorrect,
                    ts: Date.now()
                }));
            } catch (e) {}
        }
        function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
        function getSavedSession() {
            try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
            catch (e) { return null; }
        }

        // ============================================================
        // THEME MANAGEMENT
        // ============================================================
        function initTheme() {
            // Default = light "paper" (the signature bento look); only dark if explicitly saved.
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        function setTheme(theme) {
            const meta = document.getElementById('themeColorMeta');
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                state.themeDark = false;
                setSegment(document.getElementById('darkBtn'), false);
                setSegment(document.getElementById('lightBtn'), true);
                localStorage.setItem('theme', 'light');
                if (meta) meta.setAttribute('content', '#FFFFFF');
            } else {
                document.documentElement.classList.remove('light');
                state.themeDark = true;
                setSegment(document.getElementById('darkBtn'), true);
                setSegment(document.getElementById('lightBtn'), false);
                localStorage.setItem('theme', 'dark');
                if (meta) meta.setAttribute('content', '#1A1A1A');
            }
        }

        // ============================================================
        // SCREEN MANAGEMENT
        // ============================================================
        // The two PAGES. They scroll, they keep the footer and the header nav, and
        // neither is a session. Everything else - quiz, end - is an app view that is
        // locked to the viewport. This set is what `body.in-session` is computed from;
        // it read `screenName !== 'home'` until Practise became a screen of its own,
        // and that test would have locked the app page to the viewport and hidden the
        // very nav you arrived by.
        const PAGE_SCREENS = new Set(['home', 'practise']);

        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenName + 'Screen').classList.add('active');
            state.currentScreen = screenName;
            const inSession = !PAGE_SCREENS.has(screenName);
            // A session is locked to the viewport with a back button where the logo
            // was. One class carries both.
            document.body.classList.toggle('in-session', inSession);
            // The exam's clock costs the question column a row, which is the whole of
            // the slack the shift under the progress bar spends. Set here rather than
            // in startMode() so the topic, mistakes and resume paths are covered too.
            document.body.classList.toggle('in-exam', inSession && state.currentMode === 'exam');
            syncNav(screenName);
            // The scroll cue belongs to the results screen only, and the layout it
            // measures is not laid out until after this paints.
            requestAnimationFrame(syncEndScrollCue);
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        /**
         * The nav's active mark. The underline is the only other thing that says which
         * page you are on and a screen reader cannot see it, so aria-current moves with
         * it. In a session neither page is current, and the nav is hidden anyway.
         */
        function syncNav(screenName) {
            document.querySelectorAll('.header-nav [data-screen]').forEach(el => {
                const on = el.dataset.screen === screenName;
                el.classList.toggle('nav-link--active', on);
                if (on) el.setAttribute('aria-current', 'page');
                else el.removeAttribute('aria-current');
            });
        }

        // Learn More is the one on-page anchor left: Start Now and the CTA band now
        // navigate to the Practise page rather than scrolling to a band inside this
        // one. (Respects reduced-motion; #whyBand carries scroll-margin-top so the
        // sticky header does not cover its heading.)
        function scrollToId(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        }

        // ============================================================
        // HOME SCREEN
        // ============================================================
        // Set when questions.json could not be fetched. The home screen is then an
        // error, not a menu: repainting it with mode cards gives the user four
        // buttons that throw on click.
        let loadFailed = false;

        /**
         * The one door that repaints the Practise page. Callers do not call the
         * individual renderers.
         *
         * `hasProgress()` and the two-tier switch it drove are GONE (2026-09-21): the
         * marketing and the app are separate screens now, so there is nothing to choose
         * between. What survives is the load failure, which is not a tier either — the
         * sections marked [data-needs-data] all read the question pool, so with no
         * catalogue they would render empty headings over an error message. They go dark
         * and the error stands alone in the mode grid, which is the one thing the
         * landing page's buttons lead to.
         */
        function initHomeScreen() {
            document.querySelectorAll('#practiseScreen [data-needs-data]')
                .forEach(el => { el.hidden = loadFailed; });
            if (loadFailed) {
                document.getElementById('modesGrid').innerHTML =
                    '<div class="load-error">' + t('err.load') + '</div>';
                // And the reader has to be able to SEE it. The error lives in the mode
                // grid, which is on this screen; before the split that WAS the screen
                // they were looking at, and after it a failed load left them on a
                // landing page that looked perfectly well with a working Start button.
                if (state.currentScreen === 'home') showScreen('practise');
                return;
            }

            renderModes();
            renderTopics();
            renderStatePicker();
            renderHistory();
            renderGlossary();
            renderHomeStatus();
        }

        /** The state picker sits with the modes it changes, not with the progress it does not. */
        function renderStatePicker() {
            const el = document.getElementById('statePickerSlot');
            if (!el) return;
            const opts = Object.entries(STATES)
                .map(([code, name]) => `<option value="${code}"${code === selectedState ? ' selected' : ''}>${name}</option>`)
                .join('');
            el.innerHTML = `
                <span class="eyebrow state-picker-label">${t('dash.state')}</span>
                <label class="state-picker">
                    ${ICONS.pin}
                    <span class="state-picker-value">${STATES[selectedState]}</span>
                    <select id="stateSelect" aria-label="${t('dash.statePick')}" onchange="onStateChange(this.value)">${opts}</select>
                </label>`;
        }

        function renderTopics() {
            const el = document.getElementById('topicSection');
            if (!el) return;
            const all = generalQuestions();
            const chips = TOPIC_KEYS.map(key => {
                const meta = CATEGORIES[key];
                const qs = all.filter(q => q.category === key);
                if (!qs.length) return '';
                const mastered = qs.filter(q => progress[q.id] && (progress[q.id].box || 1) >= 4).length;
                const pct = qs.length ? Math.round((mastered / qs.length) * 100) : 0;
                return `
                    <button class="topic-chip" onclick="startTopic('${key}')">
                        <span class="topic-chip-icon">${ICONS[key] || meta.icon}</span>
                        <span class="topic-chip-body">
                            <span class="topic-chip-name">${catLabel(key)}</span>
                            <span class="topic-chip-meta">${t('topic.meta', { n: qs.length, m: mastered })}</span>
                            ${mastered ? `<span class="topic-chip-bar"><span style="width:${pct}%"></span></span>` : ''}
                        </span>
                        <span class="topic-chip-go">${ICONS.arrowRight}</span>
                    </button>`;
            }).join('');
            el.innerHTML = `<div class="topic-grid">${chips}</div>`;
        }

        function startTopic(catKey) {
            const qs = generalQuestions().filter(q => q.category === catKey);
            if (!qs.length) return;
            state.currentMode = 'topic';
            state.currentTopic = catKey;
            state.shuffled = false;
            state.navView = 'linear';
            state.baseOrder = null;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            state.currentQuestions = qs;
            clearSession();
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // RESULTS HISTORY (home)
        // ============================================================
        function renderHistory() {
            const el = document.getElementById('historySection');
            if (!el) return;
            if (!resultsHistory.length) { el.innerHTML = ''; return; }

            const exams = resultsHistory.filter(h => h.mode === 'exam');
            let examBlock = '';
            if (exams.length) {
                const passed = exams.filter(h => h.passed).length;
                const best = Math.max(...exams.map(h => h.percent));
                const bars = exams.slice(-12).map(h => {
                    const ht = Math.max(8, Math.round(h.percent * 0.5)); // 0..50px
                    return `<span class="hist-bar ${h.passed ? 'pass' : 'fail'}" style="height:${ht}px" title="${h.percent}% – ${h.passed ? t('hist.pass') : t('hist.fail')}"></span>`;
                }).join('');
                examBlock = `
                    <div class="hist-exam">
                        <div class="hist-exam-stats">
                            <span>${t('hist.passed', { n: passed, total: exams.length })}</span>
                            <span>${t('hist.best', { p: best })}</span>
                        </div>
                        <div class="hist-bars">${bars}</div>
                    </div>`;
            }

            const modeLabel = m => t('hist.mode.' + m) === 'hist.mode.' + m ? m : t('hist.mode.' + m);
            const rows = resultsHistory.slice(-6).reverse().map(h => {
                const d = new Date(h.ts);
                const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
                             d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                const badge = h.mode === 'exam' ? `<span class="hist-badge ${h.passed ? 'pass' : 'fail'}">${h.passed ? t('hist.pass') : t('hist.fail')}</span>` : '';
                return `<div class="hist-row"><span class="hist-mode">${modeLabel(h.mode)}</span><span class="hist-date">${date}</span><span class="hist-score">${h.correct}/${h.total} · ${h.percent}%</span>${badge}</div>`;
            }).join('');

            el.innerHTML = `
                <details class="glossary-wrap">
                    <summary class="glossary-summary">${t('hist.title', { n: resultsHistory.length })}</summary>
                    <div class="hist-body">${examBlock}<div class="hist-list">${rows}</div></div>
                </details>`;
        }

        // ============================================================

        // ============================================================
        const GLOSSARY = [
            { term: 'Grundgesetz', de: 'Die Verfassung Deutschlands (seit 1949). Regelt Grundrechte und Staatsaufbau.', en: 'Germany’s constitution (since 1949). Defines basic rights and the structure of the state.' },
