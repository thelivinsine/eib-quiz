           (244px each at a 900px viewport). Measured, both languages,
           1400 / 1200 / 1159 / 1024 / 900 / 760 / 640. */
        @media (max-width: 1160px) {
            .dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); padding-right: 0; }
            /* Only grid-column here — the CENTRING lives in a second 1160 block
               BELOW the base .dash-summary rule, because that base sits after this one
               in the sheet and both are single-class selectors, so anything stated here
               that the base also states is lost to source order. grid-column survives
               only because the base does not set it. Same trap that once
               left .cta-btn with three dead declarations. */
            .dash-summary { grid-column: 1 / -1; }
        }
        /* .dash-tile is GONE with the borders (2026-09-22): with no fill, no edge, no
           radius and no padding it was a min-width carrier, and both its consumers
           already set that themselves. .dash-tile--ring lost the prefix with it. */
        .dash-summary {
            min-width: 0;
            display: grid; grid-template-columns: auto 1fr;
            align-items: center; gap: var(--space-md);
            /* Nudged in off the card's edge (2026-09-23, on request), four across only. */
            padding-left: var(--space-xl);
        }
        /* THE PAIR CENTRES ONCE THE SUMMARY OWNS THE ROW (2026-09-22, on request: "the
           ring graph and the text aren't centred at this screen width"). Below 1160 the
           summary spans 1 / -1, and a row-wide `auto 1fr` pins the ring to the left edge
           with the sentence beside it — at 1000px that is a pair in the corner of an
           empty row, not a summary. Both tracks go content-sized so justify-content has
           free space to centre them in.
           **This block must stay BELOW the base rule above**: they are both single-class
           selectors, so the later one wins, and stating grid-template-columns up in the
           first 1160 block did nothing at all (measured: the pair still spanned 49-936
           of a 887px row). The sentence keeps its left edge — it is prose, and the
           phone's stacked-and-centred treatment is for a column too narrow to hold the
           two side by side, which this is not. */
        @media (max-width: 1160px) {
            .dash-summary { grid-template-columns: auto auto; justify-content: center; padding-left: 0; }
        }
        /* NO RULE BETWEEN THE RING AND THE VERDICT (2026-09-22, on request). The
           mockup draws one; it was removed anyway, because the ring is already a shape
           with its own edge and a hairline two tokens from it is a divider inside a
           tile inside a card.
           AND NO PADDING EITHER (2026-09-22, on request): the padding was standing in
           for the deleted rule at 32px total, which with nothing drawn in it read as a
           gap rather than as a pair. .dash-summary's --space-md gap is the whole
           separation now, and 16px off a CIRCLE is 16px only at the text's own
           vertical band — where the ring is at its widest — so it is the tightest
           honest reading of the distance. */
        .dash-verdict {
            min-width: 0;
        }
        /* --type-title OVER --type-small (16/14 since 2026-09-23, with NO phone step: the
           summary stacks on a phone, so the headline has the card's full width and all
           four tiers measure one line at 320). The history below is the 15/13 version's.
           15/13, AND 14/13 ON A PHONE (2026-09-22, on request). The mockup sets both
           lines at ~12 and separates them by weight and colour alone; this card went
           there for an hour and it was wrong in the room — at 12/12 the verdict was the
           smallest thing in the card and read as a caption on the ring rather than as
           the card's own sentence. The pair is --text 600 over --muted 400, so the
           weight-and-colour separation the mockup uses is kept and the size comes back.
           What makes --fs-base safe is .dash-grid's 2fr, not luck: the verdict box is
           247px and the worst headline ("You're just getting started") sets 188.0.
           Below 620px that box is 189 and the same string sets 188 — one pixel, which
           is not clearance — so the 620px block takes it down a rung. Every headline
           is ONE line, measured at four tiers x two languages x both widths, and that
           is what keeps this block shorter than the 152px ring beside it. */
        .dash-verdict strong { font: var(--type-title); letter-spacing: var(--ls-display); display: block; color: var(--text); }
        .dash-verdict p { font: var(--type-small); margin-top: var(--space-2xs); color: var(--muted); }
        /* The key to the tick on the ring: the same --text bar, beside its name. */
        .dash-pass {
            font: var(--type-label);
            display: inline-flex; align-items: center; gap: var(--space-sm);
            margin-top: var(--space-sm);
            color: var(--sub-text);
        }
        .dash-pass::before { content: ''; width: 3px; height: 12px; border-radius: var(--radius-xs); background: var(--text); }

        /* A RUNG DOWN THE CONTROL LADDER (2026-09-22, on request: "the size of Your
           state and the dropdown should be scaled down"). --ctl-sm with a --fs-sm value,
           an --icon-xs pin and tighter padding on both sides: this is a setting you
           touch once a session, sitting between a --fs-2xl heading and five cards, and
           at --ctl-md with a --fs-base value it read as a primary control.
           THE THUMB FLOOR COMES BACK ON A COARSE POINTER — see the block below. A
           deliberate size-down without that is an accessibility regression on the device
           most people use, which is exactly the fault the quiz's Previous/Next pair
           shipped with. The invisible <select> keeps --fs-md: anything under 16px makes
           iOS Safari zoom the page on focus, and that is not a visual choice. */
        .state-picker {
            position: relative;
            min-width: 0; max-width: 100%;
            display: inline-flex; align-items: center; gap: var(--space-2xs);
            min-height: var(--ctl-sm);
            padding: 0 calc(var(--space-md) + var(--space-sm)) 0 var(--space-sm);
            /* A FILLED pill on a faint rim, the mockup's (1.17 off its page; --band is
               1.15 in dark). It used to be a --surface pill on the heavy --border, which
               in dark drew the loudest outline in the section round a setting. */
            background: var(--band);
            border: 1px solid var(--tile-edge);
            border-radius: var(--radius-pill);
            color: var(--muted);
            cursor: pointer;
        }
        /* The <select> is invisible, so its own focus ring is too. The pill wears it. */
        .state-picker:focus-within {
            border-color: var(--accent);
            outline: 2px solid var(--accent-text);
            outline-offset: 3px;
        }
        .state-picker select:focus-visible { outline: none; }
        .state-picker svg { width: var(--icon-xs); height: var(--icon-xs); flex-shrink: 0; color: var(--muted); }
        @media (pointer: coarse) {
            .state-picker { min-height: var(--ctl-md); }
        }
        /* The pill hugs this, so it fits "Berlin" as well as it fits
           "Mecklenburg-Vorpommern". */
        .state-picker-value {
            font: var(--type-control-sm);
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        /* The real control, invisible, over the whole pill. 16px so iOS does not
           zoom when it opens. */
        .state-picker select {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            opacity: 0;
            font-size: var(--fs-md);
            border: none;
            cursor: pointer;
        }
        /* the caret, drawn once so the native arrow can stay hidden */
        .state-picker::after {
            content: ''; position: absolute; right: var(--space-sm); top: 50%;
            width: 7px; height: 7px; margin-top: calc(var(--space-2xs) * -1);
            border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
            transform: rotate(45deg); pointer-events: none;
        }

        /* THE RING IS THE CARD'S HEADLINE (2026-09-23, on request: "make the ring graph
           bigger and with more engaging UI" — the card read bland and empty without the
           resume banner). 152px at every width, up from the mockup's 104, and it now
           carries two things beyond the arc:
           - a KNOB riding the arc's leading end — a group rotated about the centre on
             the same transition as the dash, so the two stay in step;
           - the PASS MARK as a tick across the track at 52% (the exam's 17 of 33), so
             the ring says where you are AND where you need to be. The verdict's legend
             names it.
           The arc is plain --accent, NOT a gradient: a linear gradient cannot follow a
           circle (the colour ran back the way it came past half way), light's two blues
           were near-identical, and dark's --accent-fill end sat ~1.9:1 on the track.
           r stays 50 and the dasharray 314, which the JS counts on. The viewBox is
           "1 1 118 118" rather than cropped to the stroke, because the tick and the
           knob reach r = 58. */
        .ready-ring-wrap { position: relative; width: 152px; height: 152px; flex-shrink: 0; }
        .ready-ring { width: 100%; height: 100%; display: block; overflow: visible; }
        .ready-ring-track { fill: none; stroke: var(--surface3); stroke-width: 10; }
        .ready-ring-bar {
            fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
            stroke-dasharray: 314; stroke-dashoffset: 314;
            transition: stroke-dashoffset 0.95s var(--ease-spring);
        }
        .ready-ring-knob {
            transform-origin: 60px 60px;
            transition: transform 0.95s var(--ease-spring);
        }
        .ready-ring-knob circle { fill: var(--tile); stroke: var(--accent); stroke-width: 3.5; }
        .ready-ring-pass { stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; }
        .ready-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* --fs-xl, the card's one large figure: still a rung under the --fs-2xl
           section heading above it, so the heading keeps the section. */
        .ready-ring-pct { font: var(--type-figure-md); color: var(--text); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }
        /* The caption the mockup puts under the percentage, and it IS the three
           readouts' label — the rule below carries both, so the card's four blocks
           share one label treatment and one figure treatment.
           It was 9px for a day, the app's only sub-floor type, because a 22px
           percentage above it left a ~78px chord for a tracked ACCURACY and the word
           grazed the stroke. The figure is --fs-md now, so the stack is shorter, the
           caption sits nearer the dial's centre where the chord is wider (83.2px
           measured), and the word itself is narrower at 11px: 66px in 83. Measured
           clearance, not restored optimism. */
        /* THE FOUR NAMES ARE THE VERDICT'S PARAGRAPH, WORD FOR WORD (2026-09-22, on
           request: "same paragraph text formatting as Above the pass mark"). Every
           declaration below matches .dash-verdict p — --fs-xs, weight 400, --muted,
           --lh-prose — and the two that are ABSENT are the point: no uppercase and no
           --ls-caps. They are sentence case now ("Answered", "Due for review"), which
           is how the strings were written all along; the shouting was CSS.
           This is the third and quietest answer to "not bold and reduced". The first
           two went UNDER the 12px floor (9px for the ring's caption, then 11px for all
           four) and needed TYPE_EXEMPT in tools/scale.test.mjs to do it; dropping the
           uppercase and the tracking buys the same quiet AT a scale step, so the
           exemption is gone and nothing in the sheet is below the floor.
           It also buys WIDTH, which is what the phone row lives on: uppercase + 0.06em
           is wide, so the widest German name went 97.4 -> ~80 while gaining 2px of
           size.
           Since 2026-09-23 they are in the shared micro-label list near the top of the
           sheet; they were kept apart only while that rule was uppercase. */
        .ready-ring-sub {
            margin-top: var(--space-2xs);
            white-space: nowrap;
        }

        /* A READOUT IS A FIGURE OVER ITS NAME, and nothing else (2026-09-22, on
           request). Two things went: the hued plate — the app's only hued icons, the
           three --*-dim / --* pairs restored here on request the day before — and the
           .ds-sub line under the name. That line said what the name said ("Answered"
           over "Questions you've attempted"), so the card stated each of its three
           numbers twice and drew a box beside each one to do it.
           --space-2xs, not --space-3xs: 2px is not a gap rung in this sheet and
           minting one busts the ratchet's gapRungs budget. This block IS what
           .dash-stat-fig was — the plate's row wrapper went with the plate rather
           than being kept as a flex column wrapped round a flex column. */
        /* CENTRED IN ITS COLUMN AT EVERY WIDTH (2026-09-22, on request — the phone
           was left-aligned for an hour and that override is gone). A readout is
           ~100px of content in a 195px column, so left-aligned it hung on the
           column's left edge and dropped every pixel of slack on its right — three
           ragged blocks
           trailing off into nothing. The mockup left-aligns these, but the mockup's
           readout is a TILE whose fill occupies the column; with the tiles gone
           (2026-09-22) there is nothing to occupy it, so the air has to be split
           either side of the figure instead of pooled after it. The summary stays
           left: it is a ring followed by a sentence, and a sentence is read from a
           left edge. */
        .dash-stat { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; text-align: center; }
        /* German sets these names as one long word; the backstop keeps a label that
           outgrows its tile inside it rather than across its border. */
        .dash-stat .ds-label { overflow-wrap: anywhere; }
        /* A bare glyph centred over the figure (2026-09-23, on request). No plate, and
           neutral like every icon here: the due numeral stays the one thing in colour.
           The margin makes the glyph-to-figure step 8px against the figure-to-name 4. */
        .ds-icon { display: flex; justify-content: center; margin-bottom: var(--space-2xs); color: var(--sub-text); }
        .ds-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        /* Something to do today is the one counter allowed to raise its hand,
           and a coloured numeral is the whole of it — a tinted slab behind it
           reads as brown mud on charcoal and buys no more attention. */
        .dash-stat--due .ds-num { color: var(--gold); }
        /* --fs-md, AND THE RING'S PERCENTAGE IS THE SAME RULE bar the selector
           (2026-09-22, on request: 22 -> 18 -> 16 in one day, reversing the --fs-xl
           set that morning off the mockup's 23px digit). The mockup's figure is big
           because it is one of three things inside a bordered tile with a plate and a
           sub-line to balance it; bare on the card beside a 104px dial, 22px of
           Bricolage 600 over a name read as heavy rather than as a readout. Family,
           weight, tracking and tabular numerals match the ring's figure exactly, so
           the card's four blocks are ONE treatment: an --fs-md figure over an 11px
           name, four times. If either moves, move both. */
        .ds-num { font: var(--type-figure-sm); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; color: var(--text); }
        /* margin-left on top of the string's own leading space: the mockup sets the
           total off the figure at ~9px and " /" alone buys 3. --fs-2xs came down from
           --fs-xs with the figure and then STAYED while the figure fell twice more
           (on request: "keep the size of 310 intact"). That is the point of it — the
           denominator is a SCALE, not part of the number, and at 12px under a 16px
           figure it reads one rung down rather than three. */
        .ds-of { font: var(--type-caption); font-variant-numeric: tabular-nums; margin-left: var(--space-2xs); color: var(--faint); }

        /* position + overflow are for .resume-art, which bleeds off the bottom edge. */
        /* NO HAIRLINE. The mockup draws this as a tint and nothing else — measured
           #EEF4FE edge to edge with no darker line anywhere on its border — and an
           --accent-line rule round a fill that is already 1.09 off the card reads as
           a second box inside the box. */
        .resume-banner {
            position: relative; overflow: hidden;
            /* --space-xl: this is the only fill left inside the card, so it has to sit
               a clear step below a row that no longer has edges of its own. */
            margin-top: var(--space-xl);
            padding: var(--space-md) var(--space-lg);
            background: var(--accent-soft);
            border-radius: var(--radius);
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-md); flex-wrap: wrap;
        }
        /* The mockup puts a plate on this banner too, and a plate is the one place
           a glyph gets a ground. Neutral, like every other one. */
        .resume-icon {
            flex: none; display: grid; place-items: center;
            width: var(--ctl-md); height: var(--ctl-md);
            border-radius: var(--radius-sm);
            background: var(--surface); color: var(--accent-text);
        }
        .resume-icon svg { width: var(--icon-md); height: var(--icon-md); }
        /* The ornament sits BEHIND the row and is cropped by the banner's bottom
           edge, so the peaks rise out of it rather than floating in it. It carries no
           text, so it asserts nothing in contrast.test.mjs.
           It is sized FROM the banner, not in pixels: at a fixed 250px wide it stood
           83px tall in a 68px banner, so overflow: hidden cropped the peaks and the
           flag with them — the ornament's whole point, invisible. */
        .resume-art {
            position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-35%);
            z-index: 0; pointer-events: none;
            /* --accent-line, not .cta-art's --border-hover: the mockup's peaks are a
               desaturated BLUE on the banner's blue wash (#C9D7F5 measured, and light's
               --accent-line is #BFD4FA), and a grey ornament on a tinted ground reads
               as dirt. Dark gets #2D5185 on #273E67, which is the same quiet step. */
            color: var(--accent-line);
        }
        /* aspect-ratio, not just width: auto. An inline SVG's auto width is the
           engine's call — Chromium derives it from the viewBox against the definite
           height, but an engine that resolves it to 100% of the containing block
           would stretch the peaks across the whole banner. 4.5/1 is the viewBox, and
           it plus translateX(-35%) is what lands the range the mockup measures: the
           peaks start ~36% across the banner and the last slope reaches the ground at
           ~75%, clear of the text on the left and the buttons on the right. */
        .resume-art svg { height: 100%; width: auto; aspect-ratio: 5.25 / 1; display: block; }
        /* THE ACCENT, NOT --btn-fill. Everywhere else in this app a primary button is
           the mockups' near-black navy; on THIS banner the mockup paints it accent blue
           (#3474F8 measured against light's #2563EB), because the banner is already a
           blue tint and a navy slab in the middle of it reads as a hole. */
        .resume-banner .btn-primary { background: var(--accent-fill); color: var(--on-accent); }
        .resume-main { position: relative; z-index: 1; display: flex; align-items: center; gap: var(--space-ms); min-width: 0; }
        .resume-text { display: flex; flex-direction: column; gap: var(--space-2xs); color: var(--muted); min-width: 0; }
        .resume-text strong { font: var(--type-title); letter-spacing: var(--ls-display); color: var(--text); }
        .resume-text > span { font: var(--type-label); }
        .resume-actions { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: var(--space-sm); }

        /* The escape hatch is a corner glyph, not a row. A whole footer rule and a
           44px band for something you press once a year cost more height than the
           numbers above it. It keeps its 44px touch target by being 44px square. */
        .progress-reset {
            position: absolute; top: 6px; right: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            width: var(--ctl-md); height: var(--ctl-md);
            background: none; border: none; color: var(--muted);
            transition: color 0.2s var(--ease);
        }
        /* --icon-md, down from --icon-lg (2026-09-22, on request: the glyph "looks ugly
           and big"). --icon-lg existed because the old arrowhead needed the room — it was
           8.8 units of base on a 2.4-unit band, a spear rather than a head, and it stood
           proud of the ring's own left edge. With the head redrawn to 5.4 on a 2.2 band
           (2.45x, the ordinary ratio) the glyph reads at 18. The hit target is --ctl-md
           either way, so nothing about the touch floor moved. */
        .progress-reset svg { width: var(--icon-md); height: var(--icon-md); }
        .progress-reset:hover { color: var(--red-text); }

        /* ============================================================
           MODE CARDS — five equal peers
           ------------------------------------------------------------
           The column counts are explicit rather than auto-fit, and that
           is deliberate: with FIVE cards, four columns leaves a single
           orphan on the second row and two columns leaves one on the
           third. Only 5, 3 and 1 divide the set without stranding a
           card, so those are the three layouts.
           ============================================================ */
        /* THERE IS NO PANEL BEHIND THE FIVE CARDS (2026-09-21, on request). It was the
           mockup's pale --band plate with a hairline and --space-xl/--space-md of
           padding; the cards sit straight on the canvas now, like the why band's four
           items. Five bordered tiles are already five boxes — a sixth box round them is
           the containers-inside-containers look this sheet keeps removing, and the
           panel's inset came off the card widths, which is what the meta row is short of.
           The cards SEPARATE BETTER without it: in dark a tile is 1.36 off the page
           against 1.18 off the panel, and in light the hairline carries it either way.
           What went with it: the 620px padding override, and the two html.light
           .modes-band state rules that only existed because a white card could not step
           down far enough on a panel 1.20 beneath it. .modes-band went on 2026-09-23 with
           the section-head margin it was the last hook for. */
        /* --space-sm, not --space-md: at five columns every pixel of gap comes off the
           card, and the meta row has to hold the count and the estimate on ONE line. */
        .modes-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: var(--space-sm);
        }
        /* 1160, not the 940 the rest of the sheet breaks at: five columns of a 1009px
           content width is a 157px card, and "Prüfungssimulation" is one 18-character
           word that does not fit in one. Measured in German, which is what decides it. */
        @media (max-width: 1160px) {
            /* Five cards on three columns fell 3 + 2 with the pair hard left and taller
               than the row above. Six half-tracks, each card two of them, and the first
               card of a closing row of two starts on the second, so a closing pair
               centres under the row above it whatever the count (not :nth-child(4),
               which only holds for five). 1fr rows make every card one height. */
            .modes-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 1fr; }
            .modes-grid > .mode-card { grid-column: span 2; }
            .modes-grid > .mode-card:nth-child(3n + 1):nth-last-child(2) { grid-column: 2 / span 2; }
        }
        /* THE PRACTISE-MODE MOCKUP'S CARD (2026-09-23, on request: "adapting the tile's
           shade, making them minimalistic"). A --tile on its hairline; a circular disc;
           title and description centred; then ONE foot row - the facts on the left, a
           bare arrow disc on the right. The action LABEL ("Start test") and the clock
           glyph are gone: the mockup names neither, the disc is the action and the
           middot says the second fact is a duration. Mapped onto this card by width
           (362 -> 205.6px) the mockup's card is 249px tall against this one's 250, its
           disc 47px against 44 and its side padding 20px, which is --space-lg. */
        .mode-card {
            position: relative;
            /* The foot row is measured against the CARD, not the viewport: a card is
               205px wide at five across and 290+ at three, whatever the screen. */
            container: mode-card / inline-size;
            padding: var(--space-lg);
            border-radius: var(--radius);
            background: var(--tile);
            border: 1px solid var(--tile-edge);
            cursor: pointer;
            display: flex; flex-direction: column;
            text-align: center;
            transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
        }
        @media (hover: hover) {
            .mode-card:hover { background: var(--tile-hover); border-color: var(--tile-edge-hover); }
            .mode-card:hover .mode-go { transform: translateX(3px); }
        }
        .mode-card:active { background: var(--surface3); }

        /* A CIRCLE one rung above the tile, glyph in --text: the mockup's disc measures
           1.294 on its tile, --surface is 1.271 on --tile. Light has no rung above a
           white tile, so its disc steps DOWN to --surface2, as every light well does. */
        .mode-icon {
            display: grid; place-items: center;
            width: var(--ctl-md); height: var(--ctl-md); flex-shrink: 0;
            border-radius: var(--radius-pill);
            background: var(--surface); color: var(--text);
        }
        html.light .mode-icon { background: var(--surface2); }
        .mode-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        .mode-head { display: flex; flex-direction: column; align-items: center; gap: var(--space-ms); margin-bottom: var(--space-2xs); }
        .mode-head .mode-title { min-width: 0; }
        /* German compounds are one long word, and five cards a row is a ~163px title
           box: "Prüfungssimulation" overflows it whatever the width, because `main`
           caps the content long before the viewport does. `hyphens: auto` breaks it
           properly (the root carries lang="de" when the UI is German) and
           `overflow-wrap: anywhere` is the backstop, exactly as `.opt-num` handles
           "Christusmonogramm". */
        .mode-title { font: var(--type-title); letter-spacing: var(--ls-display); margin-bottom: 0; hyphens: auto; overflow-wrap: anywhere; }
        .mode-description {
            font: var(--type-small);
            color: var(--sub-text);
            margin-bottom: var(--space-md);
        }
        /* Only work that is actually waiting gets a colour, and it sits on its own line
           above the foot, centred, where the mockup puts "2 due". */
        .mode-flag {
            font: var(--type-chip);
            align-self: center;
            margin-top: auto; margin-bottom: var(--space-ms);
            padding: var(--space-3xs) var(--space-sm); border-radius: var(--radius-pill);
            color: var(--gold); background: var(--gold-dim);
        }
        /* Centred, as the mockup's one-line facts sit on their disc. Only a STACKED
           foot bottom-aligns (the container query below): a two-line pair and Smart
           Review's lone line centre at different heights, and the five arrows have to
           share one line across the row. */
        .mode-foot {
            display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm);
            margin-top: auto;
            text-align: left;
        }
        .mode-flag + .mode-foot { margin-top: 0; }
        /* --sub-text, not --muted: the mockup's facts measure as bright as its
           description. nowrap per fact, so a fact never breaks mid-phrase. */
        .mode-meta {
            font: var(--type-caption);
            display: flex; align-items: baseline; gap: var(--space-2xs);
            min-width: 0; white-space: nowrap;
            color: var(--sub-text);
            font-variant-numeric: tabular-nums;
        }
        /* THE ONE PLACE THIS LEAVES THE MOCKUP. At five across the card's content box is
           ~163px, and "300 questions · 60–90 min" is 155px at the 12px floor before the
           28px disc and its gap - the mockup's own facts, scaled, are ~10px, which this
           sheet does not go below. So a narrow card STACKS the two facts and drops the
           middot. A container query measures the CONTENT box, so the threshold is the
           one-line foot itself: 155 + 8 + 28 = ~192, and 195 leaves a little slack. */
        @container mode-card (max-width: 195px) {
            .mode-foot { align-items: flex-end; }
            .mode-meta { flex-direction: column; align-items: flex-start; gap: 0; }
            .mode-sep { display: none; }
        }
        /* One rung above the icon disc - the mockup's arrow disc is 1.435 on its tile,
           --surface2 is 1.455 on --tile - and --surface2 in light too, where it is the
           same well the icon disc uses. */
        .mode-go {
            flex: none; display: grid; place-items: center;
            width: var(--ctl-xs); height: var(--ctl-xs);
            border-radius: var(--radius-pill);
            background: var(--surface2); color: var(--text);
            transition: transform 0.25s var(--ease-spring);
        }
        .mode-go svg { width: var(--icon-xs); height: var(--icon-xs); }

        /* ============================================================
           TOPICS — chips on the page; the section heading names them
           ============================================================ */
        .topic-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: var(--space-sm); }
        .topic-chip {
            display: flex; align-items: center; gap: var(--space-ms);
            padding: var(--space-sm) var(--space-ms);
            min-height: var(--ctl-lg);
            text-align: left;
            border-radius: var(--radius);
            background: var(--tile);
            border: 1px solid var(--tile-edge);
        }
        .topic-chip-icon {
            width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0;
            display: grid; place-items: center;
            color: var(--muted);
            transition: color 0.18s var(--ease);
        }
        .topic-chip-icon svg { width: var(--icon-lg); height: var(--icon-lg); }
        .topic-chip-body { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; flex: 1; }
        .topic-chip-name { font: var(--type-title); letter-spacing: var(--ls-display); color: var(--text); }
        .topic-chip-meta { font: var(--type-caption); color: var(--muted); }
        .topic-chip-bar { display: block; height: 3px; margin-top: var(--space-3xs); border-radius: var(--radius-xs); background: var(--surface3); overflow: hidden; }
        .topic-chip-bar > span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
        .topic-chip-go { flex-shrink: 0; color: var(--faint); display: grid; place-items: center; }
        .topic-chip-go svg { width: var(--icon-md); height: var(--icon-md); }
        @media (hover: hover) {
            /* --text, not --accent-text: no icon in the app is painted in an accent. */
            .topic-chip:hover .topic-chip-icon,
            .topic-chip:hover .topic-chip-go { color: var(--text); }
        }

        /* ============================================================
           TAIL — history and glossary, one quiet card each
           ============================================================ */
        .sub-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
        }
        #historySection:empty, #topicSection:empty, #glossarySection:empty { display: none; }
        /* The Topic card's reveal. Below the grid, so opening it never reflows the cards. */
        #topicSection { margin-top: var(--space-md); }

        .load-error {
            grid-column: 1 / -1;
            padding: var(--space-lg);
            text-align: center;
            color: var(--red-text);
            background: var(--red-dim);
            border-radius: var(--radius);
        }

        /* History. .hist-exam-stats and .hist-row read --type-small's 14px but NOT its
           --lh-prose: they are list rows, not running text, so they keep --lh-ui (as
           .review-answer does). Prose leading is for sentences a reader reads through. */
        .hist-exam { padding: var(--space-md); border-radius: var(--radius); margin-bottom: var(--space-md); background: var(--surface2); border-color: var(--border-soft); }
        .hist-exam-stats { font: var(--type-small); line-height: var(--lh-ui); display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--space-sm); color: var(--sub-text); margin-bottom: var(--space-md); }
        .hist-exam-stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
        .hist-bars { display: flex; align-items: flex-end; gap: var(--space-sm); height: 52px; }
        .hist-bar { flex: 1 1 0; min-width: 6px; max-width: 34px; border-radius: var(--radius-xs) var(--radius-xs) 0 0; background: var(--muted); transition: height 0.4s var(--ease); }
        .hist-bar.pass { background: var(--teal-deep); }
        .hist-bar.fail { background: var(--red); }
        .hist-list { border-radius: var(--radius); overflow: hidden; border-color: var(--border-soft); }
        .hist-row { font: var(--type-small); line-height: var(--lh-ui); display: flex; align-items: center; gap: var(--space-md); padding: var(--space-ms) var(--space-md); border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
        .hist-row:last-child { border-bottom: none; }
        .hist-mode { font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
        .hist-date { font: var(--type-caption); color: var(--muted); font-variant-numeric: tabular-nums; }
        .hist-score { color: var(--sub-text); font-weight: 500; font-variant-numeric: tabular-nums; }
        .hist-badge { font: var(--type-chip); padding: var(--space-3xs) var(--space-sm); border-radius: var(--radius-pill); }
        .hist-badge.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .hist-badge.fail { color: var(--red-text); background: var(--red-dim); }

        /* Glossary */
        .glossary-section { margin-bottom: var(--space-lg); }
        .glossary-wrap { border-radius: var(--radius); overflow: hidden; }
        details.glossary-wrap > summary, details.gloss-item > summary { cursor: pointer; list-style: none; }
        details.glossary-wrap > summary::-webkit-details-marker, details.gloss-item > summary::-webkit-details-marker { display: none; }
        .glossary-summary { font: var(--type-title); letter-spacing: var(--ls-display); padding: var(--space-ms) var(--space-md); min-height: var(--ctl-md); display: flex; align-items: center; gap: var(--space-sm); transition: background 0.2s var(--ease); }
        /* --hover, not --tile-hover: this row has no edge to change, so the fill is the
           whole state and needs dark's 1.20 step (--tile-hover is 1.105 on a tile). */
        .glossary-summary:hover { background: var(--hover); }
        .glossary-summary::after { content: '+'; margin-left: auto; color: var(--muted); font-size: var(--fs-lg); line-height: 1; }
        details.glossary-wrap[open] .glossary-summary::after { content: '−'; }
        .gloss-list { border-top: 1px solid var(--border-soft); }
        .hist-body { padding: var(--space-md); border-top: 1px solid var(--border-soft); }
        .hist-body .hist-list { border: none; border-radius: 0; }
        .gloss-item { border-bottom: 1px solid var(--border-soft); }
        .gloss-item:last-child { border-bottom: none; }
        .gloss-item > summary { font: var(--type-control-sm); padding: var(--space-ms) var(--space-md); color: var(--text); transition: color 0.2s var(--ease); }
        .gloss-item > summary:hover { color: var(--accent-text); }
        .gloss-def { font: var(--type-small); padding: 0 var(--space-md) var(--space-ms); display: flex; flex-direction: column; gap: var(--space-2xs); color: var(--sub-text); }
        .gloss-en { color: var(--muted); font-style: italic; }

        /* ============================================================
           BUTTONS — ONE SIZE, everywhere, at every width
           36px tall (--ctl-sm), a 14px/600 label (--type-control-sm), --space-lg a
           side, a 14px glyph (--icon-xs), 8px corners (--radius-ctl). No -sm or -lg.
           2026-09-23, on request ("zoomed in ... scale them down by keeping their
           aspect ratios intact to make them look premium"): the 44px / 15px / 28px
           button scaled by 36/44. Label and padding land on the nearest rungs, which
           keeps every button's width:height within ~4% of what it was. It is the
           header chrome's own size (.session-back is 36px at 14px), so a button and
           the strip above it are one family.
           A button is never stretched and never loses padding on a narrow screen:
           it is as wide as its label at every width (see the 620px block).
           The touch floor is kept WITHOUT changing the shape: under a coarse pointer
           an invisible ::after adds 4px above and below, a 44px target on a 36px
           button. */
        .btn-primary, .btn-secondary {
            font: var(--type-control-sm);
            min-height: var(--ctl-sm);
            padding: var(--space-2xs) var(--space-lg);
            border-radius: var(--radius-ctl);
            border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
            /* Never stretched to fill a row, never squeezed under its label: a row
               that runs out of room WRAPS its buttons instead. */
            flex: none; white-space: nowrap;
            transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease), filter 0.16s var(--ease);
        }
        /* --btn-fill, not --accent-fill: on the mockup a CTA is near-black navy and
           the accent blue is reserved for tints, links and small discs. In dark the two
           tokens hold the same value. */
        .btn-primary { color: var(--on-btn); background: var(--btn-fill); }
        .btn-primary:hover { filter: brightness(1.08); }
        .btn-primary:active { filter: brightness(0.94); }
        /* The logo kit's Learn More: near-black label on --btn-edge, which is a SLATE
           edge in light and the tile hairline in dark (see the token blocks). */
        .btn-secondary { color: var(--text); background: var(--surface); border-color: var(--btn-edge); }
        .btn-secondary:hover { background: var(--hover); border-color: var(--btn-edge-hover); }
        .btn-primary svg, .btn-secondary svg { flex: none; width: var(--icon-xs); height: var(--icon-xs); }
        @media (pointer: coarse) {
            .btn-primary, .btn-secondary { position: relative; }
            .btn-primary::after, .btn-secondary::after {
                content: ''; position: absolute; left: 0; right: 0;
                top: calc((var(--ctl-sm) - var(--ctl-md)) / 2); bottom: calc((var(--ctl-sm) - var(--ctl-md)) / 2);
            }
        }
        /* Inside a round the header is a back button and a preferences menu; a section
           nav there points at a page you are not on. */
        body.in-session .header-nav { display: none; }

        /* ============================================================
           FOOTER — the page's last band, and the small print's home
           ============================================================ */
        .site-footer {
            border-top: 1px solid var(--border);
            background: var(--band);
            padding: var(--space-2xl) var(--space-lg)
                     calc(var(--space-2xl) + env(safe-area-inset-bottom));
        }
        /* A session screen is pinned to the viewport and nothing after <main> may add
           to the page's height, or scrollHeight stops equalling innerHeight. */
        body.in-session .site-footer { display: none; }
        .footer-inner {
            max-width: var(--maxw); margin: 0 auto;
            display: flex; flex-wrap: wrap; align-items: flex-start;
            justify-content: space-between; gap: var(--space-xl);
        }
        .footer-col { min-width: 0; }
        /* The brand column carries the blurb, so it earns more room than the two link
           columns beside it. */
        .footer-col--brand { flex: 1 1 260px; max-width: 34ch; }
        .footer-brand { display: flex; align-items: center; gap: var(--space-sm); }
        .footer-blurb {
            font: var(--type-small);
            margin-top: var(--space-md);
            color: var(--sub-text);
        }
        .footer-col-title {
            font: var(--type-label);
            color: var(--muted);
            margin-bottom: var(--space-md);
        }
        .footer-list { list-style: none; display: flex; flex-direction: column; gap: var(--space-sm); }
        /* One rule for the <button>s and the <a>s alike, so a mode action and an
           external source read identically. Underline on hover only: four stacked
           permanently-underlined lines read as a wall. */
        .footer-link {
            font: var(--type-label);
            display: inline-block; text-align: left;
            padding: 0; border: 0; background: none;
            color: var(--sub-text); text-decoration: none; cursor: pointer;
            transition: color 0.16s var(--ease);
        }
        .footer-link:hover { color: var(--accent-text); text-decoration: underline; }
        .footer-bar {
            font: var(--type-caption);
            max-width: var(--maxw); margin: 0 auto;
            margin-top: var(--space-2xl); padding-top: var(--space-md);
            border-top: 1px solid var(--border);
            display: flex; flex-wrap: wrap; align-items: baseline;
            justify-content: space-between; gap: var(--space-sm);
            color: var(--muted);
        }
        .footer-legal a { color: inherit; text-decoration: underline; }
        .footer-legal a:hover { color: var(--accent-text); }
        .footer-lockup { display: flex; flex-direction: column; line-height: var(--lh-tight); }
        .footer-name {
            font-family: var(--font-head); font-weight: 700; font-size: var(--fs-base);
            letter-spacing: var(--ls-display); color: var(--text);
        }
        .footer-tagline { font: var(--type-caption); color: var(--muted); letter-spacing: var(--ls-caps); margin-top: var(--space-2xs); }

        /* Visually hidden, still read out. */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: calc(1px * -1); overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }

        /* The card's pinned footer. Previous on the left, Next on the right -
           the row maps to the direction each button moves you. Neither is ever
           allowed to change the row's height: a row that reflows as you answer
           cannot be pinned under your thumb. */
        .quiz-nav {
            display: flex; align-items: center; justify-content: space-between;
            gap: var(--space-sm);
            margin-top: var(--space-md);
            flex-shrink: 0;
        }
        #nextBtn:disabled { visibility: hidden; }
        #backBtn:disabled { color: var(--faint); border-color: var(--border-soft); background: var(--surface2); cursor: default; }

        /* ============================================================
           QUIZ SCREEN
           ============================================================ */
        /* NOT tiles. Four numbers boxed in four cards is the containers-inside-
           containers look, and it spent a row of height the question card needs.
           Same move as the home overview band: figures separated by hairlines,
           label and value on one line. */
        /* The readouts line up with the question column and centre over it — they
           report on the round you are reading, not on the whole screen. */
        .quiz-topbar {
            display: flex; align-items: center; justify-content: center;
            gap: var(--space-md); flex-wrap: wrap;
            margin-bottom: var(--space-md); flex-shrink: 0;
        }
        .stats-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: var(--space-lg); row-gap: var(--space-2xs); }
        /* It rides in the footer row, between the two buttons: out of the reading
           path, on a line that already exists, and costing the question no height. */
        #keyboardHintContainer { flex: 0 1 auto; min-width: 0; display: flex; justify-content: center; }
        /* No ticks between the readouts: four numbers separated by three hairlines
           is six things to look at. Whitespace does the separating, the labels drop
           to the quietest tier, and the numbers carry the row. */
        .stat { display: flex; align-items: baseline; gap: var(--space-sm); padding: 0; }
        /* The label is the shared micro-label rule's: --muted, not --faint, because at
           0.63rem uppercase these were once the smallest type on the screen painted in
           the quietest tier (4.52 light / 5.67 dark), and on a phone the row sits at the
           bottom where it has to be legible in one glance. --faint is for placeholder
           and disabled, not for a label you read. */
        .stat-value { font: var(--type-figure-sm); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }
        /* tabular-nums again: the font shorthand resets what the span inherited from
           the figure around it. */
        .stat-of { font: var(--type-caption); font-variant-numeric: tabular-nums; color: var(--muted); }

        /* The question column — readouts, question, buttons — beside the navigator.
           Column gap only, and wider than the page's rhythm: the two are different
           jobs and should not read as one block. */
        .quiz-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0 var(--space-xl);
            align-items: start;
        }
        .quiz-main { min-width: 0; }

        /* The exam timer follows you down the page. It used to scroll away at the
           first question, so a timed simulation ran with an invisible clock. */
        /* NOT a tile. A clock is one figure you glance at, and boxing it cost the
           question a 100px row it needed — it is a line of text now, at one size, with
           the label and the figure reading as a single phrase. */
        #timer {
            position: sticky; top: var(--header-h); z-index: 20;
            display: flex; align-items: baseline; justify-content: center; gap: var(--space-sm);
            padding: 0; text-align: center; background: none; border: 0; border-radius: 0;
        }
        /* One line, so it needs a line's worth of room under it and no more. */
        body.in-session #timer { margin-bottom: var(--space-sm); }
        /* With no border left to pulse, the danger state is carried by the figure. */
        #timer.danger { animation: pulseDanger 1.1s var(--ease) infinite; }
        @keyframes pulseDanger { 50% { opacity: 0.55; } }
        .timer-display { font: var(--type-figure-sm); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; color: var(--text); }
        #timer.danger .timer-display { color: var(--red-text); }
        .pacing-info { font: var(--type-label); margin-top: 0; font-variant-numeric: tabular-nums; }

        /* A 3px hairline told you nothing but "some". This is a real track: 8px, the
           quarters marked so a length means something at a glance, and a bright tip on
           the fill so the leading edge is findable on a 300-question round. */
        .quiz-progress {
            position: relative; height: 8px; margin-bottom: var(--space-2xl); flex-shrink: 0;
            background: var(--surface3); border-radius: var(--radius-pill);
            overflow: hidden;
        }
        .quiz-progress > span {
            position: relative; display: block; height: 100%; width: 0;
            border-radius: inherit; background: var(--accent-grad);
            transition: width 0.45s var(--ease-spring);
        }
        /* The leading edge, lit from inside the fill so the pill's clip keeps it tidy. */
        .quiz-progress > span::after {
            content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 12px;
            border-radius: inherit;
            background: linear-gradient(90deg, transparent, var(--on-accent));
            opacity: 0.4;
        }
        /* One continuous track. It used to carry quarter marks, which nothing on the
           screen explained — a bar cut into four reads as four somethings, and the
           readouts already state the count exactly. */

        /* NOT a tile. The question sits on the page and the options are the boxes
           inside it — a card around a card around four cards is the containers-in-
           containers look, and the outer one carried no information. No fill, no
           hairline, no padding: the question's left edge is the column's left edge. */
        .question-card { padding: 0; }
        .q-enter { animation: qEnter 0.4s var(--ease-spring) both; }
        @keyframes qEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        .question-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); margin-bottom: var(--space-md); flex-shrink: 0; }
        .question-meta > div:first-child { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
        .question-num { color: var(--accent-text); flex-shrink: 0; }
        /* Plain text after a dot, not a pill. The category is context you glance
           at; a bordered chip next to the bordered buttons made the row above the
           question busier than the question. */
        /* --muted: it names the topic of the question you are reading, which is content,
           not a placeholder. The separator dot stays in --faint — that IS decoration. */
        .question-category {
            font: var(--type-label);
            color: var(--muted);
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .question-category:empty { display: none; }
        .question-category::before { content: '·'; margin-right: var(--space-sm); color: var(--faint); }
        .question-meta-actions { display: flex; gap: var(--space-sm); flex-shrink: 0; }
        /* These are buttons and have to look like buttons: an icon floating on the
           page is a decoration. They stay small and quiet — a hairline and the tile
           fill — but never borderless. */
        .speak-btn, .bilingual-toggle {
            font: var(--type-chip);
            border: none; background: none; color: var(--sub-text);
            min-height: var(--ctl-sm); padding: 0 var(--space-xs);
            display: inline-flex; align-items: center; justify-content: center;
            transition: color 0.16s var(--ease);
        }
        .speak-btn { min-width: 34px; padding: 0 var(--space-xs); }
        /* On a touch screen every one of these is a finger target, not a cursor target. */
        @media (pointer: coarse) {
            .speak-btn, .bilingual-toggle, .session-back, .brand { min-height: var(--ctl-md); }
            /* The next rung UP, or this rule sets the height it already had: an answer
               row is the thing you reach for most, and a thumb gets the height back. */
            .option-btn { min-height: var(--ctl-lg); }
            .speak-btn { min-width: 44px; }
            .q-nav-btn { min-height: var(--ctl-md); }
            /* The footer's links are 17px of text with 8px between them, i.e. a 25px
               pitch. That scrapes past WCAG 2.5.8 on spacing alone, and four of these
               START A ROUND, so they get a real target rather than a technicality.
               --ctl-sm, not --ctl-md: they are a list of links, not the card's own
               buttons, and 44px x 4 would make the footer taller than the content it
               sits under. Applying the rule the last mobile pass wrote down: a control
               shrunk for visual weight gets added to this block in the same change. */
            .footer-link { min-height: var(--ctl-sm); display: inline-flex; align-items: center; }
        }
        .speak-btn svg, .bilingual-toggle svg { width: var(--icon-sm); height: var(--icon-sm); }
        .bilingual-toggle { gap: var(--space-sm); }
        .speak-btn:hover, .bilingual-toggle:hover { color: var(--text); }
        .bilingual-toggle.active { color: var(--accent-text); }

        .question-text { font: var(--type-subheading); letter-spacing: var(--ls-display); color: var(--text); text-wrap: pretty; }
        .question-text:focus { outline: none; }
        .question-english { font: var(--type-small); display: none; margin-top: var(--space-sm); padding-top: var(--space-sm); border-top: 1px dashed var(--border); color: var(--muted); }
        .question-english.show { display: block; }
        .question-image { width: 100%; max-width: 294px; margin: var(--space-md) auto 0; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        /* Was an inline 0.68rem — 10.9px, under the floor, and invisible to
           scale.test.mjs because it lived in the markup. */
        #imageCredit { font: var(--type-caption); color: var(--muted); text-align: center; margin: calc(-1 * var(--space-2xs)) 0 var(--space-xs); }

        .options { display: flex; flex-direction: column; gap: var(--space-sm); margin-top: var(--space-lg); }
        .option-btn {
            font: var(--type-option);
            display: flex; align-items: center; gap: var(--space-sm);
            width: 100%; text-align: left;
            min-height: var(--ctl-md);
            padding: var(--space-sm) var(--space-ms);
            /* concentric: a 16px card with 14px of padding holds a 10px option. */
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            /* --surface2 in BOTH themes now. This was --surface in light, on the
               argument that --surface2 was a 1.02 step on the old paper-grey page and
               therefore the washed-out look. On a WHITE canvas that argument inverts:
               --surface IS the page, and --surface2 is a clear 1.15 step above it. */
            background: var(--surface2); color: var(--text);
            transition: border-color 0.16s var(--ease), background 0.16s var(--ease);
        }

        @media (hover: hover) {
            /* --surface3, not --hover, in BOTH themes now that the option is --surface2.
               --hover is the token that knows which way each theme steps, and in light
               it steps DOWN from --surface — from --surface2 that is the wrong way and a
               1.03 step besides. One rung up the ramp is the same move in both. */
            .option-btn:hover:not(:disabled) { border-color: var(--border-hover); background: var(--surface3); }
        }
        .option-btn:active:not(:disabled) { background: var(--surface3); }
        .option-btn:disabled { cursor: default; }
        .opt-letter {
            font: var(--type-chip);
            flex-shrink: 0; width: 26px; height: 26px; border-radius: var(--radius-sm);
            display: grid; place-items: center;
            /* The chip is the well inside the option now that the option is the tile.
               Its letter is --sub-text, not --muted: A/B/C/D is how you name the answer
               you are picking, and --muted put it at 4.68 on the chip in dark — the
               PLACEHOLDER tier (theme-dark.md §2 measures 4.67 there), on a label that
               is content. --sub-text lands it in the secondary band, 6.4 dark / 9.2
               light, and the chip reads at a glance instead of disappearing. */
            color: var(--sub-text); background: var(--surface3); border: 1px solid var(--border);
            transition: border-color 0.16s var(--ease), color 0.16s var(--ease);
        }
        @media (hover: hover) {
            .option-btn:hover:not(:disabled) .opt-letter { border-color: var(--border-hover); color: var(--text); }
        }
        .opt-text-wrap { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
        /* The English line IS the answer for a reader using the translation, so it takes
           the secondary tier rather than the quietest one. */
        .option-en-text { font: var(--type-caption); display: none; color: var(--sub-text); font-style: italic; }
        .option-en-text.show { display: block; }
        /* The dim is a text tier now; the fill it used to borrow is the base. */
        /* :not(.picked) too — in the exam the chosen option carries no green or red, so
           without it the answer you put down is the one thing on the row that dims. */
        .options.answered .option-btn:not(.correct):not(.incorrect):not(.picked) { color: var(--muted); }
        /* The exam's only answer state: what you put down, said without saying whether
           it is right. Accent rather than green or red, and the letter chip filled so it
           reads at a glance from the navigator's cell colour too. */
        .option-btn.picked { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
        .option-btn.picked .opt-letter { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
        .option-btn.correct { border-color: var(--green); background: var(--green-dim); color: var(--text); }
        .option-btn.correct .opt-letter { background: var(--green); border-color: var(--green); color: #fff; }
        html:not(.light) .option-btn.correct .opt-letter { color: #04231A; }
        .option-btn.incorrect { border-color: var(--red); background: var(--red-dim); color: var(--text); }
        .option-btn.incorrect .opt-letter { background: var(--red); border-color: var(--red); color: #fff; }
        html:not(.light) .option-btn.incorrect .opt-letter { color: #3A0A0A; }
        .option-btn.just-picked { animation: pickPop 0.28s var(--ease); }
        @keyframes pickPop { 0% { transform: scale(1); } 45% { transform: scale(1.015); } 100% { transform: scale(1); } }

        /* margin-inline: auto — the grid is capped at 70% of the column, and without it
           that 30% all fell on the right, so a four-image question sat off-centre under
           a full-width question. */
        /* ONE row of four, not 2x2. Four pictures you are choosing between are four
           things to compare, and a 2x2 makes you compare them in two passes; side by
           side they read in one. It also halves the block's height, which is what pays
           for the extra width.
           Capped against the VIEWPORT as well as the column, because the frames are
           square: the column width sets the frame width and the frame width sets the
           height, so on a wide screen an uncapped row would push the labels off the
           bottom. You can open any of them full size, so a thumbnail only has to be
           recognisable, not readable. */
        .options--image { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-md); max-width: min(100%, 72svh); margin-inline: auto; }
        .option-btn--image { flex-direction: column; align-items: stretch; padding: var(--space-sm); gap: var(--space-sm); }
        .option-btn--image { min-height: 0; }
        /* A SQUARE frame, not 4/3. The catalogue's crests run 0.78-1.0 in aspect, so in a
           landscape box every one of them was height-limited and they came out 136-174px
           wide against an identical 174px box — same height, visibly different sizes. A
           square frame is the shape the content actually is, so each image fills it and
           the four read as one set. `contain` stays: these images ARE the answer and
           cropping one can remove the detail that distinguishes it. */
        .opt-img { position: relative; display: block; border-radius: var(--radius-xs); overflow: hidden; background: var(--surface2); border: 1px solid var(--border-soft); aspect-ratio: 1 / 1; }
        .opt-img img { width: 100%; height: 100%; object-fit: contain; }
        /* The whole picture is the zoom target — the option is a BUTTON, so the click
           handler stops propagation or looking would answer the question. Selecting is
           the label row beneath, which is why it keeps its own hover. */
        .opt-img { cursor: zoom-in; }
        /* On a pointer device the invitation is the hover itself: a veil over the
           picture carrying the words, so nothing sits on top of the answer at rest. */
        .opt-img-hover {
            font: var(--type-chip);
            position: absolute; inset: 0; display: grid; place-items: center;
            padding: var(--space-sm); text-align: center;
            /* 0.60, not 0.55: the veil lets 45%/40% of the picture through, so the WORST
               case is a white crest, and at 0.55 the composite was #78787A — 4.41 against
               #fff at 0.76rem, under the AA floor. 0.60 composites to #6B6C6E, 5.26. Both
               literals are registered in tools/contrast.test.mjs (LITERAL_PAIRS). */
            color: #fff; background: rgba(9, 10, 13, 0.60);
            opacity: 0; transition: opacity 0.16s var(--ease);
        }
        @media (hover: none) { .opt-img-hover { display: none; } }
        @media (hover: hover) {
            .opt-img:hover .opt-img-hover { opacity: 1; }
        }
        .question-image { cursor: zoom-in; }
        /* Where there is no hover to carry the message, one quiet line does — under the
           question, above the pictures it is talking about. */
        .img-zoom-hint { font: var(--type-caption); display: none; margin: 0 0 var(--space-sm); text-align: center; color: var(--muted); }
        @media (hover: none) { .img-zoom-hint { display: block; } }

        /* ---- Image lightbox ---- */
        .img-zoom[hidden] { display: none; }
        .img-zoom { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: var(--space-lg); }
        .img-zoom-backdrop { position: absolute; inset: 0; background: rgba(9, 10, 13, 0.72); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
        .img-zoom-figure {
            position: relative; margin: 0; max-width: min(760px, 100%); max-height: 100%;
            display: flex; flex-direction: column; gap: var(--space-sm);
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: var(--space-md);
        }
        /* OFF the picture: in the overlay's own corner, so it never covers a corner of
           the thing you opened it to look at. Clicking anywhere outside the frame closes
           it too — the backdrop fills the rest of the screen. */
        .img-zoom-close {
            position: absolute; top: var(--space-md); right: var(--space-md);
            width: var(--ctl-md); height: var(--ctl-md); z-index: 2;
            display: grid; place-items: center;
            background: none; border: none; color: var(--sub-text);
            cursor: pointer; transition: color 0.16s var(--ease);
        }
        .img-zoom-close:hover { color: var(--text); }
        .img-zoom-close svg { width: var(--icon-md); height: var(--icon-md); }
        .img-zoom img { display: block; width: 100%; max-height: calc(100svh - 190px); object-fit: contain; border-radius: var(--radius-sm); }
        .img-zoom-caption { font: var(--type-label); color: var(--sub-text); text-align: center; }
        @media (max-width: 620px) {
            .img-zoom { padding: var(--space-md); }
            .img-zoom-figure { padding: var(--space-sm); }
        }
        /* overflow-wrap, because `Christusmonogramm` is a single 17-character word: its
           min-content width alone made that column wider than its neighbour, and with
           `1fr` meaning minmax(auto, 1fr) the grid handed it the extra space. The two
           tiles then held different-sized pictures for no reason but a label. */
        .option-btn--image .opt-num { font: var(--type-label); color: var(--sub-text); text-align: center; overflow-wrap: anywhere; }
        .option-btn--image.img-missing .opt-img { display: grid; place-items: center; min-height: 120px; }
        .option-btn--image.img-missing .opt-img::after { font: var(--type-caption); content: attr(data-missing); color: var(--muted); }
        .option-btn--image.img-missing .opt-img img { display: none; }

        .keyboard-hint { font: var(--type-caption); position: relative; padding: var(--space-2xs) var(--space-xs) var(--space-2xs) var(--space-ms); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--muted); display: flex; align-items: center; gap: var(--space-2xs); flex-wrap: wrap; }
        @media (hover: none) { .keyboard-hint { display: none; } }
        kbd { font: var(--type-chip); padding: var(--space-3xs) var(--space-xs); border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border); color: var(--sub-text); box-shadow: 0 1px 0 var(--border); }
        .keyboard-hint-close {
            margin-left: var(--space-2xs); width: var(--icon-lg); height: var(--icon-lg); flex-shrink: 0;
            display: grid; place-items: center;
            background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-pill);
            color: var(--muted); font-size: var(--fs-base); line-height: 1;
        }
        .keyboard-hint-close:hover { color: var(--text); background: var(--hover); border-color: var(--border-hover); }

        .explanation { display: none; margin-top: var(--space-md); padding: var(--space-ms) var(--space-ms); border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); animation: fadeUp 0.28s var(--ease) both; }
        .explanation.show { display: block; }
        .explanation.correct { border-color: var(--green); background: var(--green-dim); }
        .explanation.incorrect { border-color: var(--red); background: var(--red-dim); }
        .explanation-header { font: var(--type-title); margin-bottom: var(--space-2xs); letter-spacing: var(--ls-display); }
        .explanation.correct .explanation-header { color: var(--green); }
        .explanation.incorrect .explanation-header { color: var(--red-text); }
        .explanation-text { font: var(--type-body); color: var(--sub-text); }
        .explanation-english { font: var(--type-small); display: none; margin-top: var(--space-xs); color: var(--muted); font-style: italic; }
        .explanation-english.show { display: block; }

        /* Sidebar navigator */
        .quiz-sidebar {
            width: 248px;
            border-radius: var(--radius);
            padding: var(--space-ms);
            position: sticky;
            top: calc(var(--header-h) + 8px);
            /* Never taller than the screen — otherwise it is not sticky, it is just long.
               vh first: a browser that does not know svh drops that line and keeps this
               one, rather than dropping the cap and growing to 2900px again. */
            max-height: calc(100vh - var(--header-h) - 24px);
            max-height: calc(100svh - var(--header-h) - 24px);
            display: flex; flex-direction: column;
        }
        /* A real button at every width now that the panel collapses on the desktop too. */
        .sidebar-header { cursor: pointer; flex-shrink: 0; }
        .sidebar-header-row { display: flex; align-items: center; justify-content: space-between; min-height: var(--ctl-xs); }
        /* A drawn chevron in a hit target, not a dingbat: the glyph rendered at a
           different weight and baseline in every font stack. */
        .sidebar-chevron {
            display: grid; flex-shrink: 0;
            width: var(--ctl-xs); height: var(--ctl-xs);
            place-items: center; color: var(--muted);
            transition: transform 0.25s var(--ease), color 0.2s var(--ease);
        }
        .sidebar-chevron svg { width: var(--icon-sm); height: var(--icon-sm); }
        .sidebar-chevron.open { transform: rotate(180deg); }
        .sidebar-header:hover .sidebar-chevron { color: var(--text); }
        /* Same gutter as .question-body — the nav numbers were touching the bar. */
        .sidebar-body {
            margin-top: var(--space-sm); min-height: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        /* The grid is the scroller, not the panel: the view switcher above it is a
           control OVER the list and used to scroll away with it. Both views of the
           list carry the id, so the rule is written against that and not the class
           the renderer swaps. */
        #questionNavGrid {
            /* align-content: start is load-bearing. A grid defaults to stretch, and
               this one is now a flex child that FILLS the panel — so with fewer cells
               than room, the auto rows stretched to fit and every cell came out a tall
               rounded slab instead of the square the aspect-ratio asks for, with the
               row gap swallowed. Extra room belongs at the bottom of the list. */
            align-content: start;
            flex: 1; min-height: 0; overflow: hidden auto; overscroll-behavior: contain;
            padding-right: var(--space-sm); margin-right: calc(var(--space-sm) * -1);
        }
        /* Six across in the sidebar, many more across the full-width strip on a
           narrow screen. 34px clears the 24px AA target with room and still holds a
           three-digit number — which a shuffled round shows. */
        .question-nav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: var(--space-2xs); }

        /* Collapsible category groups. The group holding the current question is
           always open; anything else the reader opened stays open across renders. */
        .question-nav-groups { display: flex; flex-direction: column; gap: var(--space-2xs); }
        .qnav-group { border-radius: var(--radius-sm); }
        .qnav-group + .qnav-group { border-top: 1px solid var(--border-soft); padding-top: var(--space-2xs); }
        .qnav-group-head {
            font: var(--type-chip);
            display: flex; align-items: center; gap: var(--space-sm);
            min-height: var(--ctl-sm); padding: 0 var(--space-2xs);
            cursor: pointer; list-style: none;
            color: var(--sub-text);
        }
        .qnav-group-head::-webkit-details-marker { display: none; }
        /* One caret, drawn here, rotating on open. */
        .qnav-group-head::before {
            content: ''; flex-shrink: 0;
            width: 6px; height: 6px; margin-left: var(--space-3xs);
            border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
            transform: rotate(-45deg);
            transition: transform 0.18s var(--ease);
        }
        .qnav-group[open] > .qnav-group-head::before { transform: rotate(45deg); }
        .qnav-group-head:hover { color: var(--text); }
        .qnav-group-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .qnav-group-count { flex-shrink: 0; font-weight: 500; color: var(--faint); font-variant-numeric: tabular-nums; }
        .qnav-group > .question-nav-grid { padding: var(--space-2xs) 0 var(--space-sm); }

        /* Order/view is a round-level control, so it sits above the numbers it
           re-orders. Same segmented control as the header switches — three
           mutually exclusive views is exactly what that pattern is for. */
        #navActions:empty { display: none; }
        #navActions { flex-shrink: 0; margin: 0 0 var(--space-sm); }
        .qnav-seg { display: flex; width: 100%; }
        .qnav-seg .seg-btn { font: var(--type-chip); flex: 1; min-width: 0; padding: 0 var(--space-xs); min-height: var(--ctl-xs); }

        /* Stated after the base rules above, not with the other coarse-pointer
           overrides earlier in the sheet — same specificity, so source order decides. */
        @media (pointer: coarse) {
            .qnav-seg .seg-btn, .qnav-group-head { min-height: var(--ctl-md); }
        }
        .q-nav-btn { font: var(--type-chip); aspect-ratio: 1; min-height: var(--ctl-xs); border: 1px solid var(--border); background: var(--surface2); color: var(--muted); border-radius: var(--radius-sm); font-variant-numeric: tabular-nums; transition: background 0.16s var(--ease), border-color 0.16s var(--ease), color 0.16s var(--ease); }
        .q-nav-btn:hover { border-color: var(--border-hover); background: var(--hover); color: var(--text); }
        .q-nav-btn.qnav-current { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
        /* Answered, mark withheld — the exam's cell. */
        .q-nav-btn.qnav-answered { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-text); }
        .q-nav-btn.qnav-correct { background: var(--green-dim); border-color: color-mix(in srgb, var(--green) 55%, transparent); color: var(--green); }
        .q-nav-btn.qnav-incorrect { background: var(--red-dim); border-color: color-mix(in srgb, var(--red) 55%, transparent); color: var(--red-text); }

        /* ============================================================
           END SCREEN
           ============================================================ */
        .end-screen { max-width: 680px; margin: 0 auto; text-align: center; }
        .end-screen > h1 { font: var(--type-heading); letter-spacing: var(--ls-display); margin-bottom: var(--space-lg); }
        /* A ROW, not a stack. The card is 680px wide and held a 170px ring centred in it
           with a pill underneath: 286px tall and empty either side of the ring. The ring
           sits ON the page now: a box around a ring and a verdict says nothing the ring
           does not, and it cost a band of height at the top of every result. */
        .score-hero { display: flex; flex-direction: column; align-items: center; gap: var(--space-md); }
        .score-ring-wrap { position: relative; width: 190px; height: 190px; flex-shrink: 0; margin: 0; }
        .score-ring { width: 100%; height: 100%; display: block; }
        .score-ring-track { fill: none; stroke: var(--surface3); stroke-width: 9; }
        .score-ring-bar { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 377; stroke-dashoffset: 377; transition: stroke-dashoffset 1.1s var(--ease-spring); }
        .score-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2xs); }
        .score-ring-pct { font: var(--type-figure-lg); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; color: var(--text); }
        .score-ring-center .score-number { font: var(--type-label); color: var(--muted); font-variant-numeric: tabular-nums; }
        /* Only an exam has a pass mark, so on every other round this is empty — and an
           empty inline-block still spent its margin and padding as a blank band under
           the ring. Visible once it has something to say. */
        .pass-fail:empty { display: none; }
        /* align-self so the pill is as wide as its words, inside a stretch column. */
        .pass-fail { font: var(--type-title); letter-spacing: var(--ls-display); display: inline-block; align-self: center; margin: 0; padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-pill); }
        .pass-fail.pass { color: var(--teal-deep); background: var(--teal-tint); }
        .pass-fail.fail { color: var(--red-text); background: var(--red-dim); }
        /* ONE band, figures separated by hairlines — the same move the home overview card
           makes. It replaces two wells and three more cards: five boxes for five numbers,
           each a container holding nothing but a label and a figure. */
        /* ONE consumer now. .why-grid left on 2026-09-21 (it stopped being a panel)
           and .stats-grid on 2026-09-22 (it stopped being one too - see the swap note
           beside .why-grid). The rule stays written this way because the 1px gap below
           is still the sheet's only such literal and this is where that idiom is
           explained; a second band that wants hairlines joins this selector (and takes
           margin-top back out into a rule of its own). */
        .result-stats {
            display: flex; flex-wrap: wrap; justify-content: center;
            margin-top: var(--space-xl);
            border: 1px solid var(--border); border-radius: var(--radius);
            /* The separators are a 1px GAP over the band's own colour, not a border on
               each cell: a border-left lands on the first cell of a wrapped row too, and
