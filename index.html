               draws a stray line down the middle of the band on a phone. A gap separates
               in both directions and cannot do that. */
            gap: 1px; background: var(--border); overflow: hidden;
        }
        .result-stat {
            flex: 1 1 0; min-width: 104px;
            padding: var(--space-ms) var(--space-md);
            display: flex; flex-direction: column; align-items: center; gap: var(--space-2xs);
            background: var(--surface);
        }

        .result-stat .rs-label { font: var(--type-label); color: var(--muted); }
        .result-stat .rs-num { font: var(--type-figure-md); letter-spacing: var(--ls-display); font-variant-numeric: tabular-nums; }
        .pass-threshold-note { font: var(--type-label); color: var(--muted); margin: 0; }
        .pass-threshold-note[hidden] { display: none; }
        .review-section { margin-top: var(--space-xl); text-align: left; }
        .review-section-header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); flex-wrap: wrap; margin-bottom: var(--space-lg); }
        /* The exam's header is the count alone — no heading beside it to sit opposite, and
           no button since Retry moved up to the action row — so it centres rather than
           hanging off the left edge. */
        .review-section-header--solo { justify-content: center; }
        .review-section-header h2 { font: var(--type-subheading); letter-spacing: var(--ls-display); }
        .review-header-actions { display: flex; align-items: center; gap: var(--space-md); flex-wrap: wrap; }
        .review-count { font: var(--type-label); color: var(--muted); }
        .review-item { padding: var(--space-md); border-radius: var(--radius); margin-bottom: var(--space-sm); }
        .review-q-num { margin-bottom: var(--space-xs); }
        .review-q-text { font: var(--type-title); letter-spacing: var(--ls-display); margin-bottom: var(--space-md); }
        .review-answers { display: flex; flex-direction: column; gap: var(--space-sm); margin-bottom: var(--space-md); }
        .review-answer { font: var(--type-small); line-height: var(--lh-ui); padding: var(--space-sm) var(--space-ms); border-radius: var(--radius-sm); }
        .review-answer.user-wrong { color: var(--red-text); background: var(--red-dim); }
        .review-answer.correct-ans { color: var(--green); background: var(--green-dim); }
        /* The exam's list carries every question, so it needs a right and a blank too. */
        .review-answer.user-right { color: var(--green); background: var(--green-dim); }
        .review-answer.user-blank { color: var(--muted); background: var(--surface2); }
        .review-explanation { font: var(--type-small); color: var(--sub-text); padding-top: var(--space-sm); border-top: 1px solid var(--border-soft); }
        .review-explanation-en { color: var(--muted); font-style: italic; margin-top: var(--space-xs); }

        /* ============================================================
           MOTION PREFERENCES
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 940px) {
            /* The hero stacks, photo FIRST: the picture is what says what this is, and
               below the fold a headline over a 1:1 photograph pushes the buttons off. */
            .hero-landing { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
            .hero-visual { order: -1; max-width: 460px; width: 100%; margin-inline: auto; }
            .hero-text { align-items: center; text-align: center; }
            /* So a pair that wraps (German at 320) centres each line under the text. */
            .hero-cta-row { justify-content: center; }
            .hero-lead { margin-inline: auto; }
            /* The two script notes and the gate are decorative, and at tablet width they
               have nowhere good to go: the numbers band's note wrapped onto a line of its
               own under the four figures, and the CTA band's pushed its button under the
               copy. Hidden here, the CTA band's copy and button share one row. */
            .stats-item--note, .cta-note, .cta-art { display: none; }

            /* body.in-session-prefixed, or the desktop two-column rule outranks this one
               and the areas fight: "main stats" against a single column collapsed the
               question to 12px. */
            body.in-session .quiz-layout, .quiz-layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto auto;
                grid-template-areas: "main" "stats" "nav";
            }
            /* The question comes first and the collapsed navigator sits UNDER it: on a
               phone the strip was the first thing on the screen, competing with the
               question for the reader's first look. The card takes the flexible row,
               the strip takes what it needs. */
            body.in-session .quiz-layout { position: relative; }
            /* Expanded, the panel takes a share of the screen and no more: it grows
               up from the bottom to 42% of the viewport and the numbers scroll INSIDE
               it, so the question stays on screen above. It used to cover the card
               outright (absolute; inset: 0), which is fine when the strip is at the
               top of the screen and wrong now that it is at the bottom — you lost the
               question you were answering the moment you opened the overview. The card
               shrinks into what is left; .question-body is its scroller. */
            body.in-session .quiz-sidebar { z-index: 30; }
            /* Collapsed, this is a strip with one line of text in it — the card's
               padding made it a 76px box holding a 20px label. */
            /* The fixed pane height is a DESKTOP rule: down here the navigator is a
               collapsed strip, and a 450px strip is 450px of nothing. */
            body.in-session .quiz-sidebar { height: auto; max-height: none; align-self: auto; }
            /* No floor here: the card fills its area instead, which parks the buttons
               directly above the overview strip — one position on every question, and
               the place a thumb is already reaching for. */
            body.in-session .question-body { min-height: 0; }
            /* Nothing to spend down here either: the card already fills its area and
               the buttons are already pinned above the strip, so the shift would come
               straight out of the question and start it scrolling. */
            body.in-session .quiz-layout { flex: 1; margin-block: 0; }
            /* No spare space to split down here — the layout fills its row — and left
               growing they would take the column and collapse the question to nothing. */
            body.in-session .quiz-headspace, body.in-session .quiz-tailspace { display: none; }
            /* The readouts move BELOW Previous and Next on a phone. At the top they
               were the first thing on the screen, competing with the question for the
               reader's first look, and they are a running tally you glance at — not
               something to lead with. `order` moves them without touching the DOM, so
               the reading order stays question-first and the focus order with it.
               The gap above is a full --space-2xl: the buttons belong to the
               question, the tally and the overview strip below do not, and that
               distance is what says so. */
            body.in-session .quiz-topbar { margin-top: var(--space-2xl); margin-bottom: 0; }
            /* Back to one line down here: the panel's 248px column is what asked for a
               2x2, and on a phone the row is the full width. */
            body.in-session .quiz-topbar .stats-bar { display: flex; }
            .quiz-sidebar { width: auto; position: static; padding: var(--space-xs) var(--space-md); margin-top: var(--space-sm); }
            .sidebar-header { cursor: pointer; min-height: var(--ctl-md); display: flex; flex-direction: column; justify-content: center; }
            /* Below this the hint costs the card a row for a tip that is only ever
               shown once — and there is no keyboard to hint at. The CONTAINER goes
               too: hidden content still left its top margin between the buttons and
               the overview strip. */
            .keyboard-hint { display: none; }
            #keyboardHintContainer { display: none; }
            /* The buttons and the strip below them are one band at the bottom of the
               screen, so they sit close enough to read as one. */
            .quiz-layout { gap: 0 var(--space-sm); }

            .sidebar-body { display: none; }
            /* flex, not block: the grid inside it is the scroller now. vh first, as
               everywhere else, so a browser without svh keeps a cap. 26% here plus the
               header and the panel's own padding puts the WHOLE panel just under 35%
               of the screen, which is the budget — the question keeps the rest. */
            .sidebar-body.expanded { display: flex; max-height: 26vh; max-height: 26svh; }
        }

        /* The phone's type step, and the ONLY place a phone font size lives: a big
           figure drops to 28, so the display headline still outranks it (the heading
           is fluid now, --fs-heading, and needs no step). 700, NOT the 620 layout breakpoint: --fs-hero is 5.2vw, so the
           headline only clears the 36px figure above 692px — at 621-692 it was 32-36
           against 36 (final review, 2026-09-23). scale.test.mjs checks every width. */
        @media (max-width: 700px) {
            :root {
                --type-figure-lg: 600 var(--fs-2xl)/var(--lh-tight) var(--font-head);
            }
            /* The results ring steps down WITH its numeral (190 -> 160px): at 620 the
               ring shrank while a 700px step had already dropped the figure to 28, so
               621-700 showed a phone numeral in a desktop dial. */
            .score-ring-wrap { width: 160px; height: 160px; }
        }

        @media (max-width: 620px) {
            main { padding: var(--space-lg) var(--space-md); padding-bottom: calc(var(--space-3xl) + env(safe-area-inset-bottom)); }
            /* body.in-session main outranks the rule above it on specificity alone,
               media query or not, so the 16px gutter has to be restated here. */
            body.in-session main {
                padding: var(--space-sm) var(--space-md);
                padding-bottom: calc(var(--space-sm) + env(safe-area-inset-bottom));
            }

            /* Hero: introduce, then get out of the way. */
            .hero-landing { padding: var(--space-ms) 0 var(--space-2xl); gap: var(--space-lg); }
            /* Buttons stay SIDE BY SIDE on a phone, each as wide as its own label
               (2026-09-23, on request: "not letting them stretch"). The pair used to
               split the row with flex: 1 1 0, which stretched two 36px buttons into
               170px slabs. */
            .hero-cta-row { gap: var(--space-sm); margin-top: var(--space-ms); }
            /* The margin notes are decorative, and down here they have nowhere to sit
               that is not on top of the building. */
            .resume-art { display: none; }

            .why-item { flex-basis: 100%; }
            /* Stacked, the small print has nothing to sit opposite, so it stops
               being right-aligned and reads from the same edge as the mark. */
            .site-footer { padding-inline: var(--space-md); }
            /* Stacked, the brand column stops reserving width it no longer needs. */
            .footer-inner { gap: var(--space-xl); }
            .footer-col--brand { flex-basis: 100%; max-width: none; }
            .cta-band { padding: var(--space-lg); gap: var(--space-ms); }

            /* --space-xl, up from --space-lg (2026-09-22, on request). The desktop gap
               went 28 -> 40 and this one stayed at 20, which on a phone — where every
               section is a full-width stack — read as one continuous column. 28 keeps the
               same ratio to the page's 40px run-out that the desktop's 40 has to its 56. */
            .home-section { margin-bottom: var(--space-2xl); }
            /* A section's one-line description is a desktop affordance. Down here each
               wraps to two lines and the four of them cost ~150px — 7% of the page —
               while the headings above them already name the section. The heading stays;
               the gloss goes. */
            .section-head p { display: none; }
            .dash { padding: var(--space-md); }
            /* ONE column on a phone, and this reverses the old rule that "the three
               overview stats stay three columns". They cannot any more: at 375px three
               of them give the label an 85px box while "BEANTWORTET" sets 109 and
               "ZUR WIEDERHOLUNG" more — one German word, so there is nothing to wrap
               and it simply runs past its column. As rows the label has the width it
               needs. --space-lg of gap, not --space-2xs: down here the rows are the
               only thing separating them now that the tiles are gone, and the desktop
               --space-xl is a whole readout's height on a phone. */
            /* THE THREE READOUTS STAY IN ONE ROW ON A PHONE (2026-09-22, on
               request), which reverses the 2026-09-21 rule above. That rule was
               right for its own labels: at 12px/600 "BEANTWORTET" set 109 in an
               85px column and ran straight past it. The labels are 11px/400 now —
               the widest German one, WIEDERHOLUNG, measures 97.4 — and three
               content-sized columns fit inside the card's 311px with room over.
               IT IS A FLEX ROW DOWN HERE, NOT A GRID, and that is not a style
               preference — a grid cannot do it. .dash-summary spans 1 / -1, and a
               SPANNING ITEM DISTRIBUTES ITS SIZE ACROSS EVERY TRACK IT SPANS,
               equally: the ring and its sentence are far wider than any readout,
               so all three columns came out the same 97.7px whatever the track
               sizing said — measured with minmax(90px, auto), then again with
               minmax(90px, max-content) and justify-content: space-between, both
               identical to the pixel. The widest German label measured 97.4 in
               that 97.7, and 0.3px is not clearance, it is luck.
               Flex sizes each readout to its own content and space-between puts
               the leftover width BETWEEN them. The labels then took the verdict
               paragraph's formatting (sentence case, untracked), which cut the
               widest German one to 86.1 — so all three now fit a 320px phone as
               well. flex-wrap stays as the escape for anything narrower, where
               the third takes its own line rather than a German word breaking
               down the middle (.ds-label carries overflow-wrap: anywhere, so a
               squeeze would be silent).
               The summary keeps its own line with flex-basis 100%. */
            .dash-grid {
                display: flex; flex-wrap: wrap;
                justify-content: center;
                /* Row --space-lg under the summary, column --space-xl between the
                   three readouts (2026-09-22, on request). Content-sized and centred,
                   they sat 20px apart with ~20px either side; at 28 they are 28 apart
                   with ~13 either side, which reads as three separated figures rather
                   than one run of text. It costs the 320px case: 284.3 of content and
                   gap in a 256px card, so down there the third wraps to its own line
                   (flex-wrap, which is exactly what it is for). At 375 all three hold
                   one row in both languages.
                   BACK TO --space-lg (2026-09-23): "Answered overall" is 106px against
                   "Answered"'s 57, and at 28 the English row needed 309.3 in a 309px
                   card — the third readout wrapped at 375. At 20 it is 293.3. */
                gap: var(--space-lg);
            }
            /* CENTRED, AND THE RING STACKS OVER ITS SENTENCE (2026-09-22, on request).
               Side by side the pair measured 104 + 16 + 189 = 309 in a 311px card, so
               it was not centred in any meaningful sense — it simply filled the row
               edge to edge. Stacked, both are centred on the card's axis and the
               sentence gets the full width, which puts it on one line.
               justify-content: center on the row above does the same for the three
               readouts: space-between pinned the outer two to the card's edges, and
               centring them leaves ~20-30px either side — the inset the resume banner
               has, which is what the card now reads as. */
            .dash-summary {
                flex: 1 0 100%;
                grid-template-columns: 1fr;
                justify-items: center;
                text-align: center;
            }
            /* CENTRED, because down here the banner has WRAPPED (2026-09-22, on
               request). .resume-banner is a space-between row, so once the text
               block takes the full width the buttons become the only item on the
               second line and space-between parks them hard left, under a plate
               rather than under the sentence they belong to. width: 100% is what
               makes them their own line's whole width so justify-content has
               something to centre them in. */
            .resume-actions { width: 100%; justify-content: center; }
            /* NO PHONE OVERRIDE (2026-09-22, on request). It used to go full width
               with the label hard left and the pill hard right — and `flex: 1` on the
               pill is what stretched it, so "Berlin" sat in a 250px capsule with a
               gap before the caret. The base rule is what was wanted all along: the
               slot centres the pair and the pill is inline-flex, i.e. as wide as the
               state it is showing. A long name still cannot overflow — the pill keeps
               max-width: 100% and .state-picker-value keeps min-width: 0 with an
               ellipsis, so it shrinks rather than pushing the label off the page
               (checked with Mecklenburg-Vorpommern in German, the worst case). */

            /* One card a row on a phone, read as a list row: flush left, the disc beside
               the name. The foot row needs nothing here - it is already facts left,
               arrow right, which is the end of a list row's diagonal. */
            .modes-grid { grid-template-columns: 1fr; grid-auto-rows: auto; gap: var(--space-sm); }
            .modes-grid > .mode-card, .modes-grid > .mode-card:nth-child(3n + 1):nth-last-child(2) { grid-column: auto; }
            .mode-card { text-align: left; }
            .mode-card .mode-head { flex-direction: row; align-items: center; justify-content: flex-start; gap: var(--space-sm); }
            .mode-card .mode-description { margin-bottom: var(--space-sm); }
            .mode-card .mode-flag { align-self: flex-start; }

            /* ONE column, and two-up was tried and reverted: at 175px the long topic
               names ('Fundamental Rights & Constitution') wrap to four lines, so a chip
               went 55px -> 114px and the section got TALLER (314 -> 340). The label is
               what decides this grid, not the icon. */
            .topic-grid { grid-template-columns: 1fr; }
            .sub-card { padding: var(--space-md); }
            .header-content { padding: var(--space-xs) var(--space-md); gap: var(--space-sm); }
            .header-controls { gap: var(--space-2xs); }
            .seg { padding: 1px; }
            .nav-link { padding: 0 var(--space-2xs); }
            .header-nav { gap: var(--space-2xs); }
            /* The .header-controls .seg-btn shrink to --ctl-xs that used to sit here
               is GONE. It was written for two segmented controls standing in the
               header strip; the one that is left is three ICONS wide, and shrinking it
               here would hand a phone three 28px targets (the nested 360px block is the
               one place that does, where the alternative is a clipped button). */
            .session-back { min-height: var(--ctl-sm); padding: 0 var(--space-ms) 0 var(--space-sm); gap: var(--space-sm); }
            .session-back-icon svg { width: var(--icon-sm); height: var(--icon-sm); }
            .brand { min-height: var(--ctl-sm); gap: var(--space-sm); }
            .brand-mark { width: var(--ctl-xs); height: var(--ctl-xs); }
            /* BOTH PAGES ARE IN THE PHONE'S NAV (2026-09-22, on request: "in mobile
               view the header should show both the pages similar to the desktop
               view"). This is the third answer here and each one was a width problem:
               the nav was hidden outright while the row carried brand + globe menu +
               a two-word theme seg, then it showed ONE item (the page you are not on)
               once the seg moved into that menu, and it shows both now that the menu
               is a 46px EN pill and the seg is three icons.
               WHAT PAYS FOR IT, measured at 375px: the globe summary (92) became the
               EN pill (46), the theme seg came back into the row (+92 against the menu
               it was hidden in), and the BRAND NAME went the way of the tagline (-62),
               leaving the E mark - which is still the way home from anywhere. The
               nav's own gaps and padding are tightened here too, because a 14px label
               in two links is the thing this row now spends its width on.
               Do not add a fourth item to this row without taking one out. */
            .brand-tagline { display: none; }
            .brand-name { display: none; }
            .header-nav { display: flex; }
            /* The four-item row is measured at 375 and clears by 14.8px; at 320 the
               same row overruns the content edge by 41 and `overflow-x: clip` hides
               it, which is the backstop and not the plan - the moon button was simply
               cut off. Three trims, all of them stated AFTER the coarse-pointer block
               so source order gives them the win: half the side gutter, a tighter gap
               between the three groups, and 28px-wide scheme buttons (28x36 targets,
               still over the 24px WCAG 2.5.8 floor, and only on a screen this narrow).
               The row needs 361.5px to fit as it stands, so 360 is where it stops
               fitting and 375 is left exactly as measured. At 320 it then ends at
               296.7 in a 304px box, 7.3px clear. */
            @media (max-width: 360px) {
                .header-content { padding-inline: var(--space-sm); gap: var(--space-2xs); }
                .header-controls > .seg .seg-btn { width: var(--ctl-xs); }
            }
            /* The number and the topic stack instead of sharing a line. Side by side in a
               375px row the topic was the one that lost, ellipsised to "Fundame..." —
               and it is the half that actually varies. Stacked, both read in full and
               the pair still aligns with the speak/translate buttons opposite, because
               the row centres the two columns against each other. */
            .question-meta > div:first-child { flex-direction: column; align-items: flex-start; gap: var(--space-2xs); }
            .question-category { white-space: normal; }
            .question-category::before { content: none; }
            /* PHONES ONLY (this lived in the 940 block until 2026-09-23; between 621 and
               940 the base rules keep Previous/Next under the answers, where a
               1024px-tall tablet had ~430px of nothing between them). The card
               stretches here, which parks .quiz-nav at the bottom of the column: the two
               buttons sit in the same place on every question, directly above the
               overview strip, where a thumb can learn them. The column has to take the
               whole row first — the grid places items at the start, so on its own
               .quiz-main is as tall as its content and flex: 1 has nothing to grow into.
               (There is no rule above the buttons: pinned, it would float in open space.) */
            body.in-session .quiz-main { align-self: stretch; }
            body.in-session .question-card { flex: 1; }
            .question-card { padding: var(--space-md); }
            /* The card's padding insets the question and its options by --space-md a
               side; the progress bar hangs off #quizScreen and .quiz-nav off .quiz-main,
               so neither inherited it and both ran 16px wider at each edge than the
               question they belong to. Measured at 390px: question 32-358, bar and
               buttons 16-374. They take the same inset now, so the bar starts where the
               question starts and Previous sits under the first option. Only below
               620px — above it the card has no padding and the three already agree.
               The readouts are NOT in this list (2026-09-23): the row is centred, so an
               inset aligns nothing and only costs width — at 320 it left 256px for a row
               that needs up to 310. */
            body.in-session .quiz-progress,
            .quiz-nav,
            body.in-session .quiz-sidebar { margin-inline: var(--space-md); }
            body.in-session main { padding-left: var(--space-md); padding-right: var(--space-md); }
            /* Same trade, against the phone's narrower gutter. */
            body.in-session #endScreen.active {
                margin-inline: calc(-1 * var(--space-md));
                padding-inline: var(--space-md);
            }
            /* Still below the buttons here — only the gap tightens. margin-bottom stays
               0 from the 940px block; restating it as spacing-md would put a dead row
               under the tally and push the overview strip off a short phone. */
            .quiz-topbar { margin-top: var(--space-xl); }
            .question-meta { margin-bottom: var(--space-ms); }
            /* The tiles carry their own height on a wide grid; on a phone they
               only need to hold their content. */
            #statTile { min-height: 0; }
            /* Timer becomes one line so the question starts higher. The JS
               owns #timer's own display, so the children go inline instead. */
            #timer { padding: var(--space-sm) var(--space-md); }
            /* Already one line at one size; nothing left to collapse down here. */
            #timer { gap: var(--space-sm); }
            /* The strip needs air above it on a phone: flush to the top edge (or to a
               notch's inset) it read as part of the status bar. The safe-area inset is
               added to this, not replaced by it, so a notched phone gets both. */
            .header-content { padding-top: var(--space-md); padding-bottom: var(--space-ms); }
            /* ...and the progress bar drops clear of that row instead of sitting tight
               under the hairline. */
            body.in-session .quiz-progress { margin-top: var(--space-sm); margin-bottom: var(--space-lg); }
            /* body.in-session .quiz-topbar-prefixed, or the in-session rule's --space-md
               outranks it on specificity: this 8px never applied until 2026-09-23, when
               the readouts went to figure-sm 16 + label 13 and three-digit counts in
               German wrapped the row at 360px. */
            body.in-session .quiz-topbar .stats-bar { column-gap: var(--space-sm); row-gap: var(--space-2xs); }
            /* One declaration each. Three stacked PRs left three `.stat { gap }` rules
               (6/4/5px, last won) and set the label's size twice, so the "one size"
               a comment here claimed was overridden three lines under it. These are
               the values that were actually rendering. `.stat + .stat` had a
               `border-left: none` with nothing to cancel — the base rule carries no
               border since the hairlines between the readouts were dropped. */
            .stat { padding: 0; gap: var(--space-2xs); }
            /* The answered readout drops its word, not its figure. Once the labels
               cleared the 12px floor the four no longer fitted one 360px line in
               German: "Beantwortet" alone sets ~100px, and the LABEL is what is wide,
               not the number. `n / total` is the one readout that names itself —
               beside Richtig, Falsch and Score it can only be the count — so it is
               the one that can give the word up and keep the row on one line. */
            .stats-bar .stat:last-child .stat-label { display: none; }
            /* ...and below 342px the score gives its word up too, for the same reason:
               a percentage names itself. The row needs up to 310px in English (150 /
               150 / 50% / 300 / 300) and a 320px screen has 288, so it wrapped as soon
               as the counts reached two digits; without the word it needs 269. Above
               342 the full row fits (w - 32 >= 310.4). In the exam the answered count
               is the only readout, so there is no third child to hide. */
            @media (max-width: 342px) {
                .stats-bar .stat:nth-child(3) .stat-label { display: none; }
            }
            /* Wraps to two rows rather than squeezing five figures into 390px. */
            .result-stat { min-width: 30%; }
            .hist-row { gap: var(--space-sm); }

            /* Back to 2x2 on a phone. Four across a 375px row is an 80px frame under a
               three-line label — the comparison the single row buys you needs the
               pictures to still be legible, and down here they would not be. */
            .options--image { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: min(92%, 33svh); }
        }

        @media (max-width: 400px) {
            /* Stays 2x2, never one column: four square frames stacked is 757px of
               overflow on a 390px screen; two columns of small thumbnails fit, and a
               thumbnail only has to be recognisable now that any of them opens full
               size on a tap. */
            .options--image { max-width: min(92%, 26svh); }
            /* The label is what tips a 2x2 over on a narrow screen — "Christusmonogramm
               (Chi-Rho)" sets in three lines. It only has to name the picture. */
            .option-btn--image .opt-num { font: var(--type-caption); }
            .option-btn--image { padding: var(--space-sm); gap: var(--space-sm); }
        }
    </style>
</head>

    <header>
        <div class="header-content">
            <button class="brand" onclick="showScreen('home')" data-i18n-aria="nav.home">
                <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 60 63" aria-hidden="true"><path fill="#64748B" d="M8 0H50A10 10 0 0 1 60 10V11A10 10 0 0 1 50 21H0V8A8 8 0 0 1 8 0Z"/><path fill="#FFCC00" d="M0 42H50A10 10 0 0 1 60 52V53A10 10 0 0 1 50 63H8A8 8 0 0 1 0 55Z M0 41H35V42H0Z"/><path fill="#E10600" d="M0 21H35A10 10 0 0 1 45 31V32A10 10 0 0 1 35 42H0Z M0 20H35V21H0Z"/><path fill="#0F172A" d="M8 0.75H50A9.25 9.25 0 0 1 59.25 10V11A9.25 9.25 0 0 1 50 20.25H0.75V8A7.25 7.25 0 0 1 8 0.75Z"/><path class="brand-mark-top" fill="#0F172A" d="M8 0H50A10 10 0 0 1 60 10V11A10 10 0 0 1 50 21H0V8A8 8 0 0 1 8 0Z"/></svg></span>
                <span class="brand-lockup">
                    <span class="brand-name">EIB Quiz</span>
                    <span class="brand-tagline" data-i18n="nav.tagline"></span>
                </span>
            </button>
            <button class="session-back" id="sessionBack" data-i18n-aria="nav.backAria">
                <span class="session-back-icon" aria-hidden="true"></span>

    <script>
        // ============================================================
        // DATA: 460 questions (300 general + 16×10 state)
        // ------------------------------------------------------------
        // IDs run contiguously Q1–Q460. Q1–Q300 are the 300 official BAMF
        // general questions; Q301–Q460 are the 16 state-specific sets
        // (10 each). IDs are app-local identifiers, not BAMF catalogue numbers.
        // ============================================================
        let QUESTIONS = []; // loaded from questions.json (see loadQuestions)

        // Topic categories (key -> bilingual label + icon). Must match tools/categorize.js.
        const CATEGORIES = {
            rights:   { de: 'Grundrechte & Verfassung',          en: 'Fundamental Rights & Constitution', icon: '⚖️' },
            politics: { de: 'Demokratie, Wahlen & Staat',        en: 'Democracy, Elections & State',      icon: '🗳️' },
            history:  { de: 'Geschichte',                        en: 'History',                           icon: '📜' },
            society:  { de: 'Gesellschaft, Soziales & Wirtschaft', en: 'Society, Welfare & Economy',       icon: '🤝' },
            symbols:  { de: 'Symbole, Geografie & Europa',       en: 'Symbols, Geography & Europe',       icon: '🦅' },
        };
        // Topic chips cover the general themes only (state questions live under Bundesland mode).
        const TOPIC_KEYS = ['rights', 'politics', 'history', 'society', 'symbols'];
        // The exam's shape, in one place: startMode() draws the paper from these, and the
        // results screen, the history, the ring's pass tick and the copy all read them.
        const EXAM_GENERAL = 30, EXAM_STATE = 3, EXAM_PASS = 17;
        const EXAM_SIZE = EXAM_GENERAL + EXAM_STATE;
        const PASS_PCT = Math.round(EXAM_PASS / EXAM_SIZE * 100); // 52

        // Inline solid icons (24x24, currentColor) — filled silhouettes whose detail is
        // knocked out with fill-rule="evenodd", so a glyph still takes the colour of the
        // text tier around it. Generated by tools/icon-packs.mjs ("solid" pack); add a new
        // icon there first so the contact sheet keeps documenting production.
        const _svg = inner => `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">${inner}</svg>`;
        // The LINE icons' wrapper: no fill, and .icon-line in the sheet draws the stroke.
        const _line = inner => `<svg class="icon-line" viewBox="0 0 24 24" fill="none" aria-hidden="true">${inner}</svg>`;
        const ICONS = {
            allQuestions: _svg('<circle cx="4.7" cy="6" r="1.5"/><circle cx="4.7" cy="12" r="1.5"/><circle cx="4.7" cy="18" r="1.5"/><rect x="8.8" y="4.9" width="11.4" height="2.2" rx="1.1"/><rect x="8.8" y="10.9" width="11.4" height="2.2" rx="1.1"/><rect x="8.8" y="16.9" width="7.4" height="2.2" rx="1.1"/>'),
            bundesland: _svg('<path fill-rule="evenodd" d="M12 22.2c0 0 7.1-6.6 7.1-11.7a7.1 7.1 0 1 0-14.2 0C4.9 15.6 12 22.2 12 22.2ZM12 13.6a3.1 3.1 0 1 0 0-6.2 3.1 3.1 0 0 0 0 6.2Z"/>'),

        /** Mark one segment of a segmented switch as chosen — visually and for AT. */
        function setSegment(el, on) {
            el.classList.toggle('active', on);
            el.setAttribute('aria-pressed', String(on));
        }

        /** Look up a chrome string in the active language, filling {placeholders}. */
        function t(key, vars) {
            const entry = I18N[key];
            let s = entry ? (entry[lang] || entry.en) : key;
            if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            return s;
        }

        /** A topic label, in the active language. */
        const catLabel = key => (CATEGORIES[key] ? (CATEGORIES[key][lang] || CATEGORIES[key].en) : key);

        /** Fill every [data-i18n] / [data-i18n-html] / [data-i18n-aria] in the static markup. */
        function applyStaticStrings() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => { el.setAttribute('title', t(el.dataset.i18nTitle)); });
            document.querySelectorAll('[data-i18n-alt]').forEach(el => { el.setAttribute('alt', t(el.dataset.i18nAlt)); });
        }

        /**
         * The toggle's face and its accessible name. ONE site, because initLang() and
         * setLang() both need it. The face is a language CODE, identical in both
         * languages, so applyStaticStrings() must not own it — but the aria-label has
         * to say what pressing does, and that string IS translated, so it is written
         * here rather than through data-i18n-aria.
         */
        function paintLangControls() {
            document.documentElement.lang = lang;
            const btn = document.getElementById('langToggle');
            if (!btn) return;
            btn.textContent = lang.toUpperCase();
            // The name STARTS with the visible code (WCAG 2.5.3): "click EN" has to work.
            btn.setAttribute('aria-label', lang.toUpperCase() + ' – ' + t(lang === 'en' ? 'nav.switchToDe' : 'nav.switchToEn'));
        }

        /** Two languages, so the pill flips rather than opening a menu. */
        function toggleLang() {
            setLang(lang === 'en' ? 'de' : 'en');
        }

        /** Paint the saved language on boot, without re-rendering screens that do not exist yet. */
        function initLang() {
            paintLangControls();
            applyStaticStrings();
        }

        function setLang(next) {
            lang = next === 'de' ? 'de' : 'en';
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            paintLangControls();
            applyStaticStrings();
            // Repaint whichever screen is on. Every renderer reads from `state`, so
            // this changes the chrome without touching the round in progress.
            initHomeScreen();
            if (state.currentScreen === 'quiz' && state.currentQuestions.length) displayQuestion();
            if (state.currentScreen === 'end') { renderEndScreen(); requestAnimationFrame(syncEndScrollCue); }
        }

        // ============================================================
        // APPLICATION STATE
        // ============================================================
        let state = {
            currentScreen: 'home',
            currentMode: null,
            currentQuestionIndex: 0,
            currentQuestions: [],
            answered: {},          // { [questionIndex]: chosenOptionIndex }
            correct: 0,
            incorrect: 0,
            showEnglish: false,
            showExplanation: false,
            timerInterval: null,
            timeLeft: 3600,
            missedQuestions: [],   // {q, userAnswerIdx} for wrong-answer review
            examStartTime: null,   // Date.now() when exam begins
            elapsedSecs: null,     // seconds taken, frozen at endQuiz so the results repaint
            shuffled: false,       // the round is in random order, not the order it was built in
            navView: 'linear',     // which of the navigator's three views is on
            baseOrder: null,       // question ids in the order the round was built, captured on first shuffle
            generalCorrect: 0,     // correct general answers (exam sub-score)
            stateCorrect: 0,       // correct state answers (exam sub-score)
        };

        // ============================================================
        // PERSISTENT PROGRESS + SPACED REPETITION (Leitner)
        // ============================================================
        const PROGRESS_KEY = 'eib_progress_v1';
        const SESSION_KEY  = 'eib_session_v1';
        const MAX_BOX = 5;
        const DAY_MS  = 86400000;
        const BOX_INTERVALS = [0, 1, 3, 7, 16, 35]; // days until due, index = box 1..5

        // { [id]: { seen, correct, wrong, streak, lastSeen, box, due } }
        let progress = {};

        function loadProgress() {
            try {
                const raw = localStorage.getItem(PROGRESS_KEY);
                progress = raw ? JSON.parse(raw) : {};
            } catch (e) { progress = {}; }
            if (!progress || typeof progress !== 'object') progress = {};
        }
        function saveProgress() {
            try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
        }
        function recordAnswer(q, isCorrect) {
            const now = Date.now();
            const r = progress[q.id] || { seen: 0, correct: 0, wrong: 0, streak: 0, lastSeen: 0, box: 1, due: 0 };
            r.seen++;
            r.lastSeen = now;
            if (isCorrect) {
                r.correct++;
                r.streak = (r.streak || 0) + 1;
                r.box = Math.min(MAX_BOX, (r.box || 1) + 1);
            } else {
                r.wrong++;
                r.streak = 0;
                r.box = 1;
            }
            r.due = now + BOX_INTERVALS[r.box] * DAY_MS;
            progress[q.id] = r;
            saveProgress();
        }
        function masteredCount() {
            return activePool().filter(q => { const r = progress[q.id]; return r && (r.box || 1) >= 4; }).length;
        }
        // Scoped to the active pool, like every other number on the overview tile —
        // otherwise switching Bundesland silently keeps the old state's answers in the ring.
        function overallAccuracy() {
            let c = 0, t = 0;
            for (const q of activePool()) {
                const r = progress[q.id];
                if (!r) continue;
                c += r.correct || 0; t += (r.correct || 0) + (r.wrong || 0);
            }
            return t ? Math.round(c / t * 100) : 0;
        }
        // Smart Review queue: due (weakest box first), then unseen, then nearest-due — capped.
        function buildReviewQueue(limit = 25) {
            const pool = activePool();
            const now = Date.now();
            const due = pool.filter(q => progress[q.id] && progress[q.id].due <= now)
                .sort((a, b) => (progress[a.id].box - progress[b.id].box) || (progress[a.id].due - progress[b.id].due));
            const unseen = pool.filter(q => !progress[q.id]);
            const queue = [...due, ...unseen];
            if (queue.length < limit) {
                const rest = pool.filter(q => progress[q.id] && progress[q.id].due > now)
                    .sort((a, b) => progress[a.id].box - progress[b.id].box);
                queue.push(...rest);
            }
            return queue.slice(0, limit);
        }
        function reviewDueCount() {
            const now = Date.now();
            return activePool().filter(q => progress[q.id] && progress[q.id].due <= now).length;
        }
        function clearProgress() {
            progress = {};
            resultsHistory = [];
            try {
                localStorage.removeItem(PROGRESS_KEY);
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem(HISTORY_KEY);
            } catch (e) {}
        }

        // ---- results history ----
        const HISTORY_KEY = 'eib_history_v1';
        let resultsHistory = [];
        function loadHistory() {
            try { const raw = localStorage.getItem(HISTORY_KEY); resultsHistory = raw ? JSON.parse(raw) : []; }
            catch (e) { resultsHistory = []; }
            if (!Array.isArray(resultsHistory)) resultsHistory = [];
        }
        function recordResult(entry) {
            resultsHistory.push(entry);
            if (resultsHistory.length > 50) resultsHistory = resultsHistory.slice(-50);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(resultsHistory)); } catch (e) {}
        }

        // ---- in-progress session resume (non-exam modes) ----
        function saveSession() {
            if (state.currentMode === 'exam' || state.currentMode === 'mistakes' || !state.currentQuestions.length) return;
            try {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    mode: state.currentMode,
                    topic: state.currentTopic || null,
                    stateCode: state.stateCode || null,
                    ids: state.currentQuestions.map(q => q.id),
                    idx: state.currentQuestionIndex,
                    answered: state.answered,
                    shuffled: state.shuffled,
                    navView: state.navView,
                    baseOrder: state.baseOrder,
                    correct: state.correct,
                    incorrect: state.incorrect,
                    ts: Date.now()
                }));
            } catch (e) {}
        }
        function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
        function getSavedSession() {
            try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
            catch (e) { return null; }
        }

        // ============================================================
        // THEME MANAGEMENT
        // ============================================================
        // THREE MODES since 2026-09-22 (light / system / dark, per the reference's
        // sun/monitor/moon). 'system' follows prefers-color-scheme and keeps following
        // it: the OS can flip while the tab is open, so the query is listened to, not
        // just read. What did NOT change is the DEFAULT — nothing saved is still light,
        // not system, so a first visit looks exactly as it did. The pre-paint script in
        // <head> has to agree with this or a system-dark reader gets a white flash.
        const _schemeMql = window.matchMedia('(prefers-color-scheme: dark)');
        // The mode in force, held here so the change listener never has to read
        // storage — which can throw, and every access to it below is guarded.
        let _themeMode = 'light';

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            setTheme(saved === 'dark' || saved === 'system' ? saved : 'light');
        }

        function setTheme(mode) {
            if (mode !== 'dark' && mode !== 'system') mode = 'light';
            _themeMode = mode;
            const dark = mode === 'dark' || (mode === 'system' && _schemeMql.matches);
            const meta = document.getElementById('themeColorMeta');
            document.documentElement.classList.toggle('light', !dark);
            setSegment(document.getElementById('lightBtn'), mode === 'light');
            setSegment(document.getElementById('systemBtn'), mode === 'system');
            setSegment(document.getElementById('darkBtn'), mode === 'dark');
            try { localStorage.setItem('theme', mode); } catch (e) {}
            if (meta) meta.setAttribute('content', dark ? '#1A1A1A' : '#FFFFFF');
        }

        // Only while the reader is ON system: in light or dark their choice stands.
        // addListener is the pre-Safari-14 spelling; without the fallback the throw
        // here would stop the whole script before boot.
        const _onSchemeChange = () => { if (_themeMode === 'system') setTheme('system'); };
        if (_schemeMql.addEventListener) _schemeMql.addEventListener('change', _onSchemeChange);
        else _schemeMql.addListener(_onSchemeChange);

        // ============================================================
        // SCREEN MANAGEMENT
        // ============================================================
        // The two PAGES. They scroll, they keep the footer and the header nav, and
        // neither is a session. Everything else - quiz, end - is an app view that is
        // locked to the viewport. This set is what `body.in-session` is computed from;
        // it read `screenName !== 'home'` until Practise became a screen of its own,
        // and that test would have locked the app page to the viewport and hidden the
        // very nav you arrived by.
        const PAGE_SCREENS = new Set(['home', 'practise']);

        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenName + 'Screen').classList.add('active');
            state.currentScreen = screenName;
            const inSession = !PAGE_SCREENS.has(screenName);
            // A session is locked to the viewport with a back button where the logo
            // was. One class carries both.
            document.body.classList.toggle('in-session', inSession);
            // The exam's clock costs the question column a row, which is the whole of
            // the slack the shift under the progress bar spends. Set here rather than
            // in startMode() so the topic, mistakes and resume paths are covered too.
            document.body.classList.toggle('in-exam', inSession && state.currentMode === 'exam');
            syncNav(screenName);
            // The scroll cue belongs to the results screen only, and the layout it
            // measures is not laid out until after this paints.
            requestAnimationFrame(syncEndScrollCue);
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        /**
         * The nav's active mark. The underline is the only other thing that says which
         * page you are on and a screen reader cannot see it, so aria-current moves with
         * it. In a session neither page is current, and the nav is hidden anyway.
         */
        function syncNav(screenName) {
            document.querySelectorAll('.header-nav [data-screen]').forEach(el => {
                const on = el.dataset.screen === screenName;
                el.classList.toggle('nav-link--active', on);
                if (on) el.setAttribute('aria-current', 'page');
                else el.removeAttribute('aria-current');
            });
        }

        // Learn More is the one on-page anchor left: Start Now and the CTA band now
        // navigate to the Practise page rather than scrolling to a band inside this
        // one. (Respects reduced-motion; #whyBand carries scroll-margin-top so the
        // sticky header does not cover its heading.)
        function scrollToId(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        }

        // ============================================================
        // HOME SCREEN
        // ============================================================
        // Set when questions.json could not be fetched. The home screen is then an
        // error, not a menu: repainting it with mode cards gives the user four
        // buttons that throw on click.
        let loadFailed = false;

        /**
         * The one door that repaints the Practise page. Callers do not call the
         * individual renderers.
         *
         * `hasProgress()` and the two-tier switch it drove are GONE (2026-09-21): the
         * marketing and the app are separate screens now, so there is nothing to choose
         * between. What survives is the load failure, which is not a tier either — the
         * sections marked [data-needs-data] all read the question pool, so with no
         * catalogue they would render empty headings over an error message. They go dark
         * and the error stands alone in the mode grid, which is the one thing the
         * landing page's buttons lead to.
         */
        function initHomeScreen() {
            document.querySelectorAll('#practiseScreen [data-needs-data]')
                .forEach(el => { el.hidden = loadFailed; });
            if (loadFailed) {
                document.getElementById('modesGrid').innerHTML =
                    '<div class="load-error">' + t('err.load') + '</div>';
                // And the reader has to be able to SEE it. The error lives in the mode
                // grid, which is on this screen; before the split that WAS the screen
                // they were looking at, and after it a failed load left them on a
                // landing page that looked perfectly well with a working Start button.
                if (state.currentScreen === 'home') showScreen('practise');
                return;
            }

            renderModes();
            renderTopics();
            renderStatePicker();
            renderHistory();
            renderGlossary();
            renderHomeStatus();
        }

        /** The state picker sits with the modes it changes, not with the progress it does not. */
        function renderStatePicker() {
            const el = document.getElementById('statePickerSlot');
            if (!el) return;
            const opts = Object.entries(STATES)
                .map(([code, name]) => `<option value="${code}"${code === selectedState ? ' selected' : ''}>${name}</option>`)
                .join('');
            el.innerHTML = `
                <label class="state-picker">
                    ${ICONS.pin}
                    <span class="state-picker-value">${STATES[selectedState]}</span>
                    <select id="stateSelect" aria-label="${t('dash.statePick')}" onchange="onStateChange(this.value)">${opts}</select>
                </label>`;
        }

        function renderTopics() {
            const el = document.getElementById('topicSection');
            if (!el) return;
            const all = generalQuestions();
            const chips = TOPIC_KEYS.map(key => {
                const meta = CATEGORIES[key];
                const qs = all.filter(q => q.category === key);
                if (!qs.length) return '';
                const mastered = qs.filter(q => progress[q.id] && (progress[q.id].box || 1) >= 4).length;
                const pct = qs.length ? Math.round((mastered / qs.length) * 100) : 0;
                return `
                    <button class="topic-chip" onclick="startTopic('${key}')">
                        <span class="topic-chip-icon">${ICONS[key] || meta.icon}</span>
                        <span class="topic-chip-body">
                            <span class="topic-chip-name">${catLabel(key)}</span>
                            <span class="topic-chip-meta">${t('topic.meta', { n: qs.length, m: mastered })}</span>
                            ${mastered ? `<span class="topic-chip-bar"><span style="width:${pct}%"></span></span>` : ''}
                        </span>
                        <span class="topic-chip-go">${ICONS.arrowRight}</span>
                    </button>`;
            }).join('');
            el.innerHTML = `<div class="topic-grid">${chips}</div>`;
        }

        function startTopic(catKey) {
            const qs = generalQuestions().filter(q => q.category === catKey);
            if (!qs.length) return;
            state.currentMode = 'topic';
            state.currentTopic = catKey;
            state.shuffled = false;
            state.navView = 'linear';
            state.baseOrder = null;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            state.currentQuestions = qs;
            clearSession();
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // RESULTS HISTORY (home)
        // ============================================================
        function renderHistory() {
            const el = document.getElementById('historySection');
            if (!el) return;
            if (!resultsHistory.length) { el.innerHTML = ''; return; }

            const exams = resultsHistory.filter(h => h.mode === 'exam');
            let examBlock = '';
            if (exams.length) {
                const passed = exams.filter(h => h.passed).length;
                const best = Math.max(...exams.map(h => h.percent));
                const bars = exams.slice(-12).map(h => {
                    const ht = Math.max(8, Math.round(h.percent * 0.5)); // 0..50px
                    return `<span class="hist-bar ${h.passed ? 'pass' : 'fail'}" style="height:${ht}px" title="${h.percent}% – ${h.passed ? t('hist.pass') : t('hist.fail')}"></span>`;
                }).join('');
                examBlock = `
                    <div class="hist-exam">
                        <div class="hist-exam-stats">
                            <span>${t('hist.passed', { n: passed, total: exams.length })}</span>
                            <span>${t('hist.best', { p: best })}</span>
                        </div>
                        <div class="hist-bars">${bars}</div>
                    </div>`;
            }

            const modeLabel = m => t('hist.mode.' + m) === 'hist.mode.' + m ? m : t('hist.mode.' + m);
            const rows = resultsHistory.slice(-6).reverse().map(h => {
                const d = new Date(h.ts);
                const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
                             d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                const badge = h.mode === 'exam' ? `<span class="hist-badge ${h.passed ? 'pass' : 'fail'}">${h.passed ? t('hist.pass') : t('hist.fail')}</span>` : '';
                return `<div class="hist-row"><span class="hist-mode">${modeLabel(h.mode)}</span><span class="hist-date">${date}</span><span class="hist-score">${h.correct}/${h.total} · ${h.percent}%</span>${badge}</div>`;
            }).join('');

            el.innerHTML = `
                <details class="glossary-wrap">
                    <summary class="glossary-summary">${t('hist.title', { n: resultsHistory.length })}</summary>
                    <div class="hist-body">${examBlock}<div class="hist-list">${rows}</div></div>
                </details>`;
        }

        function renderGlossary() {
            const el = document.getElementById('glossarySection');
            if (!el) return;
