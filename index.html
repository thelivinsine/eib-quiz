        /** Mark one segment of a segmented switch as chosen — visually and for AT. */
        function setSegment(el, on) {
            el.classList.toggle('active', on);
            el.setAttribute('aria-pressed', String(on));
        }

        /** Look up a chrome string in the active language, filling {placeholders}. */
        function t(key, vars) {
            const entry = I18N[key];
            let s = entry ? (entry[lang] || entry.en) : key;
            if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
            return s;
        }

        /** A topic label, in the active language. */
        const catLabel = key => (CATEGORIES[key] ? (CATEGORIES[key][lang] || CATEGORIES[key].en) : key);

        /** Fill every [data-i18n] / [data-i18n-html] / [data-i18n-aria] in the static markup. */
        function applyStaticStrings() {
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
        }

        /** Paint the saved language on boot, without re-rendering screens that do not exist yet. */
        function initLang() {
            document.documentElement.lang = lang;
            setSegment(document.getElementById('langDe'), lang === 'de');
            setSegment(document.getElementById('langEn'), lang === 'en');
            applyStaticStrings();
        }

        function setLang(next) {
            lang = next === 'de' ? 'de' : 'en';
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
            document.documentElement.lang = lang;
            setSegment(document.getElementById('langDe'), lang === 'de');
            setSegment(document.getElementById('langEn'), lang === 'en');
            applyStaticStrings();
            // Repaint whichever screen is on. Every renderer reads from `state`, so
            // this changes the chrome without touching the round in progress.
            initHomeScreen();
            if (state.currentScreen === 'quiz' && state.currentQuestions.length) displayQuestion();
            if (state.currentScreen === 'end') renderEndScreen();
        }

        // ============================================================
        // APPLICATION STATE
        // ============================================================
        let state = {
            currentScreen: 'home',
            currentMode: null,
            currentQuestionIndex: 0,
            currentQuestions: [],
            answered: {},          // { [questionIndex]: chosenOptionIndex }
            correct: 0,
            incorrect: 0,
            showEnglish: false,
            showExplanation: false,
            timerInterval: null,
            timeLeft: 3600,
            themeDark: true,
            missedQuestions: [],   // {q, userAnswerIdx} for wrong-answer review
            examStartTime: null,   // Date.now() when exam begins
            elapsedSecs: null,     // seconds taken, frozen at endQuiz so the results repaint
            shuffled: false,       // the round is in random order, so the navigator drops its groups
            generalCorrect: 0,     // correct general answers (exam sub-score)
            stateCorrect: 0,       // correct state answers (exam sub-score)
        };

        // ============================================================
        // PERSISTENT PROGRESS + SPACED REPETITION (Leitner)
        // ============================================================
        const PROGRESS_KEY = 'eib_progress_v1';
        const SESSION_KEY  = 'eib_session_v1';
        const MAX_BOX = 5;
        const DAY_MS  = 86400000;
        const BOX_INTERVALS = [0, 1, 3, 7, 16, 35]; // days until due, index = box 1..5

        // { [id]: { seen, correct, wrong, streak, lastSeen, box, due } }
        let progress = {};

        function loadProgress() {
            try {
                const raw = localStorage.getItem(PROGRESS_KEY);
                progress = raw ? JSON.parse(raw) : {};
            } catch (e) { progress = {}; }
            if (!progress || typeof progress !== 'object') progress = {};
        }
        function saveProgress() {
            try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
        }
        function recordAnswer(q, isCorrect) {
            const now = Date.now();
            const r = progress[q.id] || { seen: 0, correct: 0, wrong: 0, streak: 0, lastSeen: 0, box: 1, due: 0 };
            r.seen++;
            r.lastSeen = now;
            if (isCorrect) {
                r.correct++;
                r.streak = (r.streak || 0) + 1;
                r.box = Math.min(MAX_BOX, (r.box || 1) + 1);
            } else {
                r.wrong++;
                r.streak = 0;
                r.box = 1;
            }
            r.due = now + BOX_INTERVALS[r.box] * DAY_MS;
            progress[q.id] = r;
            saveProgress();
        }
        function masteredCount() {
            return activePool().filter(q => { const r = progress[q.id]; return r && (r.box || 1) >= 4; }).length;
        }
        // Scoped to the active pool, like every other number on the overview tile —
        // otherwise switching Bundesland silently keeps the old state's answers in the ring.
        function overallAccuracy() {
            let c = 0, t = 0;
            for (const q of activePool()) {
                const r = progress[q.id];
                if (!r) continue;
                c += r.correct || 0; t += (r.correct || 0) + (r.wrong || 0);
            }
            return t ? Math.round(c / t * 100) : 0;
        }
        // Smart Review queue: due (weakest box first), then unseen, then nearest-due — capped.
        function buildReviewQueue(limit = 25) {
            const pool = activePool();
            const now = Date.now();
            const due = pool.filter(q => progress[q.id] && progress[q.id].due <= now)
                .sort((a, b) => (progress[a.id].box - progress[b.id].box) || (progress[a.id].due - progress[b.id].due));
            const unseen = pool.filter(q => !progress[q.id]);
            const queue = [...due, ...unseen];
            if (queue.length < limit) {
                const rest = pool.filter(q => progress[q.id] && progress[q.id].due > now)
                    .sort((a, b) => progress[a.id].box - progress[b.id].box);
                queue.push(...rest);
            }
            return queue.slice(0, limit);
        }
        function reviewDueCount() {
            const now = Date.now();
            return activePool().filter(q => progress[q.id] && progress[q.id].due <= now).length;
        }
        function clearProgress() {
            progress = {};
            resultsHistory = [];
            try {
                localStorage.removeItem(PROGRESS_KEY);
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem(HISTORY_KEY);
            } catch (e) {}
        }

        // ---- results history ----
        const HISTORY_KEY = 'eib_history_v1';
        let resultsHistory = [];
        function loadHistory() {
            try { const raw = localStorage.getItem(HISTORY_KEY); resultsHistory = raw ? JSON.parse(raw) : []; }
            catch (e) { resultsHistory = []; }
            if (!Array.isArray(resultsHistory)) resultsHistory = [];
        }
        function recordResult(entry) {
            resultsHistory.push(entry);
            if (resultsHistory.length > 50) resultsHistory = resultsHistory.slice(-50);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(resultsHistory)); } catch (e) {}
        }

        // ---- in-progress session resume (non-exam modes) ----
        function saveSession() {
            if (state.currentMode === 'exam' || state.currentMode === 'mistakes' || !state.currentQuestions.length) return;
            try {
                localStorage.setItem(SESSION_KEY, JSON.stringify({
                    mode: state.currentMode,
                    topic: state.currentTopic || null,
                    stateCode: state.stateCode || null,
                    ids: state.currentQuestions.map(q => q.id),
                    idx: state.currentQuestionIndex,
                    answered: state.answered,
                    shuffled: state.shuffled,
                    correct: state.correct,
                    incorrect: state.incorrect,
                    ts: Date.now()
                }));
            } catch (e) {}
        }
        function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} }
        function getSavedSession() {
            try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }
            catch (e) { return null; }
        }

        // ============================================================
        // THEME MANAGEMENT
        // ============================================================
        function initTheme() {
            // Default = light "paper" (the signature bento look); only dark if explicitly saved.
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                setTheme('dark');
            } else {
                setTheme('light');
            }
        }

        function setTheme(theme) {
            const meta = document.getElementById('themeColorMeta');
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                state.themeDark = false;
                setSegment(document.getElementById('darkBtn'), false);
                setSegment(document.getElementById('lightBtn'), true);
                localStorage.setItem('theme', 'light');
                if (meta) meta.setAttribute('content', '#F2F3F5');
            } else {
                document.documentElement.classList.remove('light');
                state.themeDark = true;
                setSegment(document.getElementById('darkBtn'), true);
                setSegment(document.getElementById('lightBtn'), false);
                localStorage.setItem('theme', 'dark');
                if (meta) meta.setAttribute('content', '#131418');
            }
        }

        // ============================================================
        // SCREEN MANAGEMENT
        // ============================================================
        function showScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenName + 'Screen').classList.add('active');
            state.currentScreen = screenName;
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        // Landing hero CTA: smooth-scroll down to the main bento content
        // (respects reduced-motion; scroll-margin-top offsets the sticky header).
        function scrollToMain() {
            const el = document.getElementById('homeMain');
            if (!el) return;
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
        }

        // ============================================================
        // HOME SCREEN
        // ============================================================
        // Set when questions.json could not be fetched. The home screen is then an
        // error, not a menu: repainting it with mode cards gives the user four
        // buttons that throw on click.
        let loadFailed = false;

        function initHomeScreen() {
            if (loadFailed) {
                document.getElementById('modesGrid').innerHTML =
                    '<div class="load-error">' + t('err.load') + '</div>';
                return;
            }
            renderModes();
            renderTopics();
            renderHistory();
            renderGlossary();
            renderHomeStatus();
            renderStatePicker();
        }

        /** The state picker sits with the modes it changes, not with the progress it does not. */
        function renderStatePicker() {
            const el = document.getElementById('statePickerSlot');
            if (!el) return;
            const opts = Object.entries(STATES)
                .map(([code, name]) => `<option value="${code}"${code === selectedState ? ' selected' : ''}>${name}</option>`)
                .join('');
            el.innerHTML = `
                <span class="eyebrow state-picker-label">${t('dash.state')}</span>
                <label class="state-picker">
                    ${ICONS.pin}
                    <span class="state-picker-value">${STATES[selectedState]}</span>
                    <select id="stateSelect" aria-label="${t('dash.statePick')}" onchange="onStateChange(this.value)">${opts}</select>
                </label>`;
        }

        function renderTopics() {
            const el = document.getElementById('topicSection');
            if (!el) return;
            const all = generalQuestions();
            const chips = TOPIC_KEYS.map(key => {
                const meta = CATEGORIES[key];
                const qs = all.filter(q => q.category === key);
                if (!qs.length) return '';
                const mastered = qs.filter(q => progress[q.id] && (progress[q.id].box || 1) >= 4).length;
                const pct = qs.length ? Math.round((mastered / qs.length) * 100) : 0;
                return `
                    <button class="topic-chip" onclick="startTopic('${key}')">
                        <span class="topic-chip-icon">${ICONS[key] || meta.icon}</span>
                        <span class="topic-chip-body">
                            <span class="topic-chip-name">${catLabel(key)}</span>
                            <span class="topic-chip-meta">${t('topic.meta', { n: qs.length, m: mastered })}</span>
                            ${mastered ? `<span class="topic-chip-bar"><span style="width:${pct}%"></span></span>` : ''}
                        </span>
                        <span class="topic-chip-go">${ICONS.arrowRight}</span>
                    </button>`;
            }).join('');
            el.innerHTML = `<div class="topic-grid">${chips}</div>`;
        }

        function startTopic(catKey) {
            const qs = generalQuestions().filter(q => q.category === catKey);
            if (!qs.length) return;
            state.currentMode = 'topic';
            state.currentTopic = catKey;
            state.shuffled = false;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            state.currentQuestions = qs;
            clearSession();
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // RESULTS HISTORY (home)
        // ============================================================
        function renderHistory() {
            const el = document.getElementById('historySection');
            if (!el) return;
            if (!resultsHistory.length) { el.innerHTML = ''; return; }

            const exams = resultsHistory.filter(h => h.mode === 'exam');
            let examBlock = '';
            if (exams.length) {
                const passed = exams.filter(h => h.passed).length;
                const best = Math.max(...exams.map(h => h.percent));
                const bars = exams.slice(-12).map(h => {
                    const ht = Math.max(8, Math.round(h.percent * 0.5)); // 0..50px
                    return `<span class="hist-bar ${h.passed ? 'pass' : 'fail'}" style="height:${ht}px" title="${h.percent}% – ${h.passed ? t('hist.pass') : t('hist.fail')}"></span>`;
                }).join('');
                examBlock = `
                    <div class="hist-exam">
                        <div class="hist-exam-stats">
                            <span>${t('hist.passed', { n: passed, total: exams.length })}</span>
                            <span>${t('hist.best', { p: best })}</span>
                        </div>
                        <div class="hist-bars">${bars}</div>
                    </div>`;
            }

            const modeLabel = m => t('hist.mode.' + m) === 'hist.mode.' + m ? m : t('hist.mode.' + m);
            const rows = resultsHistory.slice(-6).reverse().map(h => {
                const d = new Date(h.ts);
                const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
                             d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
                const badge = h.mode === 'exam' ? `<span class="hist-badge ${h.passed ? 'pass' : 'fail'}">${h.passed ? t('hist.pass') : t('hist.fail')}</span>` : '';
                return `<div class="hist-row"><span class="hist-mode">${modeLabel(h.mode)}</span><span class="hist-date">${date}</span><span class="hist-score">${h.correct}/${h.total} · ${h.percent}%</span>${badge}</div>`;
            }).join('');

            el.innerHTML = `<div class="sub-card"><span class="eyebrow">${t('hist.title')}</span>${examBlock}<div class="hist-list">${rows}</div></div>`;
        }

        function renderGlossary() {
            const el = document.getElementById('glossarySection');
            if (!el) return;

                <details class="gloss-item">
                    <summary lang="de">${g.term}</summary>
                    <div class="gloss-def"><span lang="de">${g.de}</span><span class="gloss-en" lang="en">${g.en}</span></div>
                </details>`).join('');
            el.innerHTML = `
                <details class="glossary-wrap">

                    <div class="gloss-list">${items}</div>

        // ============================================================
        // TEXT-TO-SPEECH (German question read-aloud)
        // ============================================================
        const ttsSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;
        function speakQuestion() {
            if (!ttsSupported) return;
            const q = state.currentQuestions[state.currentQuestionIndex];
            if (!q) return;
            const synth = window.speechSynthesis;
            if (synth.speaking) { synth.cancel(); return; } // toggle off
            const parts = [q.de, ...q.options.filter(o => o && !/^img\//.test(o))];
            const utt = new SpeechSynthesisUtterance(parts.join('. '));
            utt.lang = 'de-DE';
            utt.rate = 0.95;
            const deVoice = synth.getVoices().find(v => v.lang && v.lang.startsWith('de'));
            if (deVoice) utt.voice = deVoice;
            synth.cancel();
            synth.speak(utt);
        }

        // ============================================================
        // HOME · the overview card
        // ------------------------------------------------------------
        // One card, three levels of weight: the accuracy ring is the
        // headline, the three counters are the supporting row, and the
        // state picker and reset are the quiet edge.
        // ============================================================
        function renderHomeStatus() {
            const el = document.getElementById('homeStatus');
            if (!el) return;
            const pool = activePool();
            const totalPool = pool.length;
            const mastered = masteredCount();
            const due = reviewDueCount();
            const ring = overallAccuracy();
            const answeredInPool = pool.filter(q => progress[q.id]).length;

            // Resume banner — only when a saved in-progress session exists.
            const sess = getSavedSession();
            let resumeHtml = '';
            if (sess && Array.isArray(sess.ids) && sess.ids.length) {
                const sessLabel = sess.mode === 'topic'
                    ? catLabel(sess.topic)
                    : sess.mode === 'bundesland'
                        ? (STATES[sess.stateCode] || t('mode.state.title'))
                        : t('hist.mode.' + sess.mode);
                const answered = sess.answered ? Object.keys(sess.answered).length : 0;
                resumeHtml = `
                    <div class="resume-banner">
                        <div class="resume-text">
                            <strong>${t('dash.resume')}</strong>
                            <span>${sessLabel} · ${t('dash.resumeMeta', { n: answered, total: sess.ids.length })}</span>
                        </div>
                        <div class="resume-actions">
                            <button class="btn-primary btn-sm" onclick="resumeSession()">${t('dash.resumeGo')} →</button>
                            <button class="btn-secondary btn-sm" onclick="clearSession(); renderHomeStatus();">${t('dash.resumeDrop')}</button>
                        </div>
                    </div>`;
            }

            el.innerHTML = `
                <div class="dash">
                    <div class="dash-head">
                        <span class="eyebrow">${t('dash.eyebrow')}</span>
                    </div>
                    <div class="dash-body">
                        <div class="ready-ring-wrap" title="${ring}% ${t('dash.accuracy')}">
                            <svg class="ready-ring" viewBox="0 0 120 120" aria-hidden="true">
                                <circle class="ready-ring-track" cx="60" cy="60" r="50"></circle>
                                <circle class="ready-ring-bar" id="readyRingBar" cx="60" cy="60" r="50" transform="rotate(-90 60 60)"></circle>
                            </svg>
                            <div class="ready-ring-center">
                                <span class="ready-ring-pct" id="readyRingPct">0%</span>
                                <span class="ready-ring-sub">${t('dash.accuracy')}</span>
                            </div>
                        </div>
                        <div class="dash-stats">
                            <div class="dash-stat">
                                <span class="ds-num">${answeredInPool}<span class="ds-of">/${totalPool}</span></span>
                                <span class="ds-label">${t('dash.answered')}</span>
                            </div>
                            <div class="dash-stat">
                                <span class="ds-num">${mastered}</span>
                                <span class="ds-label">${t('dash.mastered')}</span>
                            </div>
                            <div class="dash-stat${due ? ' dash-stat--due' : ''}">
                                <span class="ds-num">${due}</span>
                                <span class="ds-label">${t('dash.due')}</span>
                            </div>
                        </div>
                    </div>
                    ${resumeHtml}
                    ${answeredInPool > 0 ? `<button class="progress-reset" onclick="if(confirm(t('dash.resetConfirm'))){clearProgress();initHomeScreen();}">${t('dash.reset')}</button>` : ''}
                </div>`;

            animateReadyRing(ring);
        }

        function animateReadyRing(pct) {
            const bar = document.getElementById('readyRingBar');
            const lbl = document.getElementById('readyRingPct');
            if (!bar || !lbl) return;
            const C = 314; // 2*PI*r(50)
            bar.style.opacity = pct >= 2 ? '1' : '0'; // hide tiny arcs (round cap would show a stray dot)
            bar.style.strokeDashoffset = C;
            lbl.textContent = '0%';
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            requestAnimationFrame(() => requestAnimationFrame(() => {
                bar.style.strokeDashoffset = String(C * (1 - pct / 100));
                if (reduce) { lbl.textContent = pct + '%'; return; }
                const t0 = performance.now(), dur = 900;
                const tick = now => {
                    const k = Math.min(1, (now - t0) / dur);
                    lbl.textContent = Math.round(pct * (1 - Math.pow(1 - k, 3))) + '%';
                    if (k < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }));
        }

        function resumeSession() {
            const sess = getSavedSession();
            if (!sess) return;
            const byId = new Map(QUESTIONS.map(q => [q.id, q]));
            const qs = sess.ids.map(id => byId.get(id)).filter(Boolean);
            // `answered` is keyed by position in sess.ids, so dropping any id shifts every
            // later answer onto the wrong question. Nothing sane to resume — discard it.
            if (!qs.length || qs.length !== sess.ids.length) { clearSession(); renderHomeStatus(); return; }
            state.currentMode = sess.mode;
            state.currentTopic = sess.topic || null;
            state.stateCode = sess.stateCode || selectedState;
            state.currentQuestions = qs;
            state.currentQuestionIndex = Math.min(sess.idx || 0, qs.length - 1);
            state.answered = sess.answered || {};
            state.shuffled = !!sess.shuffled;
            state.correct = sess.correct || 0;
            state.incorrect = sess.incorrect || 0;
            state.showExplanation = false;
            // Rebuild the wrong-answer list from the saved answers — otherwise the end
            // screen only reviews mistakes made after the resume. Derived, not persisted,
            // so sessions saved by older builds resume correctly too.
            state.missedQuestions = Object.entries(state.answered)
                .filter(([i, a]) => qs[i] && a !== qs[i].correct)
                .map(([i, a]) => ({ q: qs[i], userAnswerIdx: a }));
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        function renderModes() {
            const grid = document.getElementById('modesGrid');
            const due = reviewDueCount();
            const st = STATES[selectedState];
            const card = (mode, icon, title, desc, meta, extra = '') => `
                <button class="mode-card ${extra}" onclick="startMode('${mode}')">
                    <span class="mode-icon">${icon}</span>
                    <span class="mode-title">${title}</span>
                    <span class="mode-description">${desc}</span>
                    <span class="mode-meta">${meta}</span>
                    <span class="mode-start-btn">${t('mode.start')} <span class="msb-arrow">→</span></span>
                </button>`;
            const dot = ' · ';
            // The exam is the thing this app is for, so it is the only card that
            // gets the full-width charcoal treatment. The rest are peers, and the
            // only colour among them flags questions that are actually due.
            grid.innerHTML =
                card('exam', ICONS.exam, t('mode.exam.title'), t('mode.exam.desc', { state: st }),
                     t('mode.exam.badge') + dot + t('mode.exam.time'), 'mode-card--featured') +
                card('allQuestions', ICONS.allQuestions, t('mode.all.title'), t('mode.all.desc'),
                     t('mode.all.badge') + dot + t('mode.all.time')) +
                card('bundesland', ICONS.bundesland, t('mode.state.title'), t('mode.state.desc', { state: st }),
                     t('mode.state.badge') + dot + t('mode.state.time')) +
                card('review', ICONS.review, t('mode.review.title'), t('mode.review.desc'),
                     (due ? `<span class="mode-flag">${t('mode.review.badgeDue', { n: due })}</span>`
                          : t('mode.review.badge') + dot) + t('mode.review.time'));
        }

        // ============================================================
        // QUESTION NAVIGATOR
        // ============================================================
        function renderQuestionNav() {
            const total = state.currentQuestions.length;
            const answered = Object.keys(state.answered).length;
            document.getElementById('navProgressSummary').textContent = t('qnav.answered', { n: answered, total });

            // Shuffle belongs to rounds you work through in order; an exam is
            // already random and a 10-question set has nothing to gain.
            const actions = document.getElementById('navActions');
            if (actions) {
                actions.innerHTML = total > 40
                    ? `<button class="qnav-shuffle${state.shuffled ? ' is-on' : ''}" onclick="shuffleRound()">
                           ${ICONS.shuffle}<span>${state.shuffled ? t('qnav.inOrder') : t('qnav.shuffle')}</span>
                       </button>`
                    : '';
            }

            const cell = i => {
                const ans = state.answered[i];
                let cls = 'q-nav-btn';
                if (i === state.currentQuestionIndex) {
                    cls += ' qnav-current';
                } else if (ans !== undefined) {
                    cls += ans === state.currentQuestions[i].correct
                        ? ' qnav-correct' : ' qnav-incorrect';
                }
                return `<button class="${cls}" onclick="jumpToQuestion(${i})" title="${t('quiz.question', { n: i + 1 })}">${i + 1}</button>`;
            };

            const el = document.getElementById('questionNavGrid');

            const groups = new Map();
            state.currentQuestions.forEach((q, i) => {
                const k = navGroupKey(q);
                if (!groups.has(k)) groups.set(k, []);
                groups.get(k).push(i);
            });

            // A shuffled round has no meaningful groups — its numbers ARE the order.
            // A short round does not need them, and a round that is all one category
            // would just get a lid over the whole list.
            if (state.shuffled || total <= 40 || groups.size < 2) {
                el.className = 'question-nav-grid';
                el.innerHTML = Array.from({ length: total }, (_, i) => cell(i)).join('');
                return;
            }

            // Carry the reader's own open/closed groups across the re-render by reading
            // the DOM we are about to replace. The previously active group is dropped:
            // it was open because it held the question, not because anyone chose it, and
            // keeping it would leave every category expanded after a lap of the round.
            const stillOpen = new Set(
                [...el.querySelectorAll('.qnav-group[open]')].map(d => d.dataset.cat)
            );
            stillOpen.delete(navLastActiveKey);
            const activeKey = navGroupKey(state.currentQuestions[state.currentQuestionIndex]);

            navLastActiveKey = activeKey;
            el.className = 'question-nav-groups';
            el.innerHTML = [...groups].map(([key, idxs]) => {
                const done = idxs.filter(i => state.answered[i] !== undefined).length;
                const open = key === activeKey || stillOpen.has(key);
                return `
                    <details class="qnav-group"${open ? ' open' : ''} data-cat="${key}">
                        <summary class="qnav-group-head">
                            <span class="qnav-group-name">${navGroupLabel(key)}</span>
                            <span class="qnav-group-count">${done}/${idxs.length}</span>
                        </summary>
                        <div class="question-nav-grid">${idxs.map(cell).join('')}</div>
                    </details>`;
            }).join('');

            // Keep the question you are on in view inside the scrolling panel.
            const cur = el.querySelector('.qnav-current');
            if (cur) cur.scrollIntoView({ block: 'nearest' });
        }

        // The group that was open purely because it was active, last render.
        let navLastActiveKey = null;

        /** Which navigator group a question belongs to. */
        function navGroupKey(q) { return q.state ? 'state' : (q.category || 'other'); }
        function navGroupLabel(key) {
            if (key === 'state') return STATES[state.stateCode] || t('mode.state.title');
            return CATEGORIES[key] ? catLabel(key) : t('quiz.general');
        }

        /**
         * Re-order the round, or put it back in catalogue order.
         * `state.answered` is keyed by POSITION, so it has to move with the
         * questions — otherwise every answer lands on a different question.
         */
        function shuffleRound() {
            const qs = state.currentQuestions;
            if (qs.length < 2) return;
            const next = state.shuffled
                ? [...qs].sort((a, b) => a.id - b.id)
                : sample(qs, qs.length);
            const wasAt = new Map(qs.map((q, i) => [q.id, i]));
            const here = qs[state.currentQuestionIndex];
            const answered = {};
            next.forEach((q, i) => {
                const was = wasAt.get(q.id);
                if (state.answered[was] !== undefined) answered[i] = state.answered[was];
            });
            state.currentQuestions = next;
            state.answered = answered;
            state.shuffled = !state.shuffled;
            // stay on the question that was on screen
            state.currentQuestionIndex = Math.max(0, next.indexOf(here));
            saveSession();
            displayQuestion();
        }

        function toggleQuestionNav() {} // sidebar is always open

        function jumpToQuestion(qIdx) {
            state.currentQuestionIndex = qIdx;
            displayQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function startMode(mode) {
            // Bail before touching state — a half-reset state with the previous round's
            // questions still in it is worse than not starting.
            const reviewQueue = mode === 'review' ? buildReviewQueue(25) : null;
            if (reviewQueue && !reviewQueue.length) {
                alert('Noch nichts zu wiederholen — beantworte zuerst ein paar Fragen.');
                return;
            }
            state.currentMode = mode;
            state.currentTopic = null;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            state.stateCode = selectedState;
            state.shuffled = false;

            if (mode === 'allQuestions') {
                state.currentQuestions = generalQuestions();
            } else if (mode === 'bundesland') {
                state.currentQuestions = stateQuestions();
            } else if (mode === 'review') {
                state.currentQuestions = reviewQueue;
            } else if (mode === 'exam') {
                state.currentQuestions = [...sample(generalQuestions(), 30), ...sample(stateQuestions(), 3)];
                state.examStartTime = Date.now();
                startTimer();
            }

            clearSession(); // committed to a fresh round — replace any prior resumable session

            // Show sidebar navigator in non-exam modes, hide in exam
            const navWrapper = document.getElementById('questionNavWrapper');
            navWrapper.style.display = mode === 'exam' ? 'none' : 'flex';

            // Always start with sidebar collapsed on mobile
            if (window.innerWidth <= NAV_COLLAPSE_AT) {
                const sidebarBody = document.getElementById('sidebarBody');
                const sidebarChevron = document.getElementById('sidebarChevron');
                const sidebarToggle = document.getElementById('sidebarToggle');
                if (sidebarBody) sidebarBody.classList.remove('expanded');
                if (sidebarChevron) sidebarChevron.classList.remove('open');
                if (sidebarToggle) sidebarToggle.setAttribute('aria-expanded', 'false');
            }

            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // QUIZ SCREEN
        // ============================================================
        let hintShown = false;

        function displayQuestion() {
            const q = state.currentQuestions[state.currentQuestionIndex];
            const progress = ((state.currentQuestionIndex + 1) / state.currentQuestions.length) * 100;

            // Re-trigger the per-question entrance animation.
            const card = document.querySelector('.question-card');
            if (card) { card.classList.remove('q-enter'); void card.offsetWidth; card.classList.add('q-enter'); }

            // Update stats
            updateStats();
            updateProgress(progress);

            // Question content
            document.getElementById('questionNum').textContent = t('quiz.question', { n: state.currentQuestionIndex + 1 });
            document.getElementById('questionCategory').textContent =
                q.state ? (q.stateName || STATES[q.state] || t('mode.state.title'))
                    : (q.category ? catLabel(q.category) : t('quiz.general'));
            document.getElementById('questionText').textContent = q.de;
            document.getElementById('questionEnglish').innerHTML = `<div>${q.en}</div>`;
            document.getElementById('questionEnglish').classList.remove('show');

            const imgCredit = document.getElementById('imageCredit');
            if (q.image) {
                const qImg = document.getElementById('questionImage');
                qImg.src = q.image;
                qImg.alt = q.de;
                qImg.style.display = 'block';
                if (q.image_credit) {
                    imgCredit.textContent = q.image_credit;
                    imgCredit.style.display = 'block';
                } else {
                    imgCredit.style.display = 'none';
                }
            } else {
                document.getElementById('questionImage').style.display = 'none';
                imgCredit.style.display = 'none';
            }

            // Options
            const optionsContainer = document.getElementById('optionsContainer');
            const hasImages = Array.isArray(q.option_images) && q.option_images.length === q.options.length;
            optionsContainer.classList.toggle('options--image', hasImages);
            optionsContainer.innerHTML = q.options.map((opt, idx) => {
                if (hasImages) {
                    return `
                <button class="option-btn option-btn--image" onclick="selectAnswer(${idx})" id="option-${idx}" aria-label="${String.fromCharCode(65 + idx)}: ${opt}">
                    <span class="opt-img" data-missing="${t('quiz.imgMissing')}"><img src="${q.option_images[idx]}" alt="${opt}" loading="lazy" onerror="this.closest('.option-btn').classList.add('img-missing')"></span>
                    <span class="opt-num">${String.fromCharCode(65 + idx)} — ${opt}</span>
                </button>`;
                }
                const enText = q.options_en && q.options_en[idx] ? q.options_en[idx] : '';
                const enClass = enText && state.showEnglish ? ' show' : '';
                return `
                <button class="option-btn" onclick="selectAnswer(${idx})" id="option-${idx}">
                    <span class="opt-letter">${String.fromCharCode(65 + idx)}</span><span class="opt-text-wrap">${opt}${enText ? `<span class="option-en-text${enClass}" lang="en">${enText}</span>` : ''}</span>
                </button>`;
            }).join('');

            // Keyboard hint (shown once per session, on first question only)
            const hintContainer = document.getElementById('keyboardHintContainer');
            if (!hintShown && state.currentQuestionIndex === 0) {
                hintShown = true;
                hintContainer.innerHTML = `
                    <div class="keyboard-hint" id="keyboardHint">
                        <kbd>↑</kbd><kbd>↓</kbd> ${t('quiz.kbNav')} &nbsp;
                        <kbd>Space</kbd> ${t('quiz.kbPick')} &nbsp;
                        <kbd>Enter</kbd> ${t('quiz.kbNext')}
                        <button class="keyboard-hint-close" aria-label="${t('quiz.kbClose')}" onclick="document.getElementById('keyboardHintContainer').innerHTML=''">×</button>
                    </div>`;
            } else {
                hintContainer.innerHTML = '';
            }

            // Bilingual toggle state
            const toggle = document.getElementById('bilingualToggle');
            toggle.innerHTML = ICONS.translate + '<span>EN</span>';
            toggle.title = state.showEnglish ? t('quiz.hideEn') : t('quiz.showEn');
            toggle.setAttribute('aria-pressed', String(!!state.showEnglish));
            const speakBtn = document.getElementById('speakBtn');
            if (speakBtn && !speakBtn.firstChild) speakBtn.innerHTML = ICONS.speaker;
            toggle.classList.toggle('active', state.showEnglish);
            document.getElementById('questionEnglish').classList.toggle('show', state.showEnglish);

            // Show back button when not on the first question
            const backBtn = document.getElementById('backBtn');
            backBtn.style.display = state.currentQuestionIndex > 0 ? 'block' : 'none';

            // Restore answered state if this question was already answered (via navigator jump)
            const prevAnswer = state.answered[state.currentQuestionIndex];
            const optsEl = document.getElementById('optionsContainer');
            if (prevAnswer !== undefined) {
                document.getElementById('answerHint').style.display = 'none';
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                document.getElementById('option-' + q.correct).classList.add('correct');
                if (prevAnswer !== q.correct) {
                    document.getElementById('option-' + prevAnswer).classList.add('incorrect');
                }
                if (optsEl) optsEl.classList.add('answered');
                showExplanation(q, prevAnswer === q.correct);
                const nextBtn = document.getElementById('nextBtn');
                nextBtn.style.display = 'block';
                nextBtn.textContent = state.currentQuestionIndex + 1 === state.currentQuestions.length
                    ? t('quiz.finish') : t('quiz.next') + ' →';
            } else {
                if (optsEl) optsEl.classList.remove('answered');
                document.getElementById('explanation').classList.remove('show');
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('answerHint').style.display = 'block';
                // Focus question text (non-interactive) so Space can't accidentally select option A
                document.getElementById('questionText').focus({ preventScroll: true });
            }

            // Always update sidebar navigator
            renderQuestionNav();

        }

        function updateStats() {
            const total = state.currentQuestions.length;
            const score = total > 0 ? Math.round((state.correct / total) * 100) : 0;

            document.getElementById('statsBar').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">${t('quiz.stat.question')}</div>
                    <div class="stat-value">${state.currentQuestionIndex + 1}/${total}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">${t('quiz.stat.correct')}</div>
                    <div class="stat-value" style="color: var(--green)">${state.correct}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">${t('quiz.stat.wrong')}</div>
                    <div class="stat-value" style="color: var(--red-text)">${state.incorrect}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">${t('quiz.stat.score')}</div>
                    <div class="stat-value">${score}%</div>
                </div>
            `;
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
            const qpf = document.getElementById('quizProgressFill');
            if (qpf) qpf.style.width = percent + '%';
            document.getElementById('progressLeft').textContent = t('qnav.progress', { n: state.currentQuestionIndex + 1, total: state.currentQuestions.length });
            document.getElementById('progressPercent').textContent = Math.round(percent) + '%';
        }

        function selectAnswer(idx) {
            const q = state.currentQuestions[state.currentQuestionIndex];
            state.answered[state.currentQuestionIndex] = idx;

            document.getElementById('answerHint').style.display = 'none';

            // Disable all buttons; dim the unchosen
            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            const optsEl = document.getElementById('optionsContainer');
            if (optsEl) optsEl.classList.add('answered');

            // Highlight correct/incorrect, with a pop on the chosen option
            document.getElementById('option-' + q.correct).classList.add('correct');
            const picked = document.getElementById('option-' + idx);
            if (picked) { picked.classList.add('just-picked'); }
            if (idx !== q.correct) {
                document.getElementById('option-' + idx).classList.add('incorrect');
            }

            // Update score and sub-scores
            if (idx === q.correct) {
                state.correct++;
                if (q.state) state.stateCorrect++;
                else state.generalCorrect++;
            } else {
                state.incorrect++;
                state.missedQuestions.push({ q, userAnswerIdx: idx });
            }

            // Durable progress (spaced repetition) + resumable session
            recordAnswer(q, idx === q.correct);
            saveSession();

            // Show explanation
            showExplanation(q, idx === q.correct);

            // Show next button and scroll it into view
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.style.display = 'block';
            nextBtn.textContent = state.currentQuestionIndex + 1 === state.currentQuestions.length ? t('quiz.finish') : t('quiz.next') + ' →';
            setTimeout(() => document.getElementById('explanation').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
            setTimeout(() => nextBtn.focus(), 600);

            // Always refresh sidebar navigator
            renderQuestionNav();
        }

        function showExplanation(q, isCorrect) {
            const exp = document.getElementById('explanation');
            exp.classList.remove('correct', 'incorrect');
            exp.classList.add(isCorrect ? 'correct' : 'incorrect');
            exp.classList.add('show');

            document.getElementById('explanationHeader').textContent = isCorrect ? t('quiz.correct') : t('quiz.wrong');
            if (!isCorrect) {
                document.getElementById('explanationHeader').textContent += t('quiz.rightAnswer') + q.options[q.correct];
            }

            document.getElementById('explanationText').textContent = q.explanation_de;
            document.getElementById('explanationEnglish').textContent = q.explanation_en;
            document.getElementById('explanationEnglish').classList.toggle('show', state.showEnglish);
        }

        // ============================================================
        // TIMER
        // ============================================================
        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerEl.style.display = 'block';
            state.timeLeft = 3600; // 60 minutes

            state.timerInterval = setInterval(() => {
                state.timeLeft--;
                updateTimerDisplay();

                if (state.timeLeft <= 0) {
                    clearInterval(state.timerInterval);
                    endQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(state.timeLeft / 60);
            const secs = state.timeLeft % 60;
            const display = `${mins}:${secs.toString().padStart(2, '0')}`;
            document.getElementById('timerDisplay').textContent = display;

            const timerEl = document.getElementById('timer');
            if (state.timeLeft < 300) {
                timerEl.classList.add('danger');
            } else {
                timerEl.classList.remove('danger');
            }

            // Pacing indicator: show after first answer
            let pacingEl = document.getElementById('pacingInfo');
            if (!pacingEl) {
                pacingEl = document.createElement('div');
                pacingEl.id = 'pacingInfo';
                pacingEl.className = 'pacing-info';
                timerEl.appendChild(pacingEl);
            }
            const answered = state.currentQuestionIndex;
            if (answered > 0 && state.examStartTime) {
                const elapsed = (Date.now() - state.examStartTime) / 1000;
                const avgSec = elapsed / answered;
                const remaining = state.currentQuestions.length - answered;
                const projectedSec = avgSec * remaining;
                const bufferSec = state.timeLeft - projectedSec;
                const avgMin = (avgSec / 60).toFixed(1);
                if (bufferSec > 300) {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage`;
                    pacingEl.style.color = 'var(--green)';
                } else if (bufferSec > 0) {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage`;
                    pacingEl.style.color = 'var(--gold)';
                } else {
                    pacingEl.textContent = `⬤ ${avgMin} Min/Frage — zu langsam`;
                    pacingEl.style.color = 'var(--red)';
                }
            }
        }

        // ============================================================
        // END SCREEN
        // ============================================================
        function animateScoreRing(percent, passed) {
            const bar = document.getElementById('scoreRingBar');
            const pctEl = document.getElementById('scoreRingPct');
            if (!bar || !pctEl) return;
            const C = 377; // 2 * PI * r(60)
            const color = passed === true ? 'var(--green)' : passed === false ? 'var(--red)' : 'var(--lime)';
            bar.style.stroke = color;
            pctEl.style.color = passed === false ? 'var(--red)' : (passed === true ? 'var(--green)' : 'var(--lime)');
            bar.style.opacity = percent > 0 ? '1' : '0'; // avoid stray round-cap dot at 0%
            bar.style.strokeDashoffset = C;            // reset
            pctEl.textContent = '0%';
            const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(() => {
                bar.style.strokeDashoffset = String(C * (1 - percent / 100));
                if (reduce) { pctEl.textContent = percent + '%'; return; }
                const t0 = performance.now(), dur = 1000;
                const tick = now => {
                    const k = Math.min(1, (now - t0) / dur);
                    const eased = 1 - Math.pow(1 - k, 3);
                    pctEl.textContent = Math.round(percent * eased) + '%';
                    if (k < 1) requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
            }, 80);
        }

        // endQuiz records the round once; renderEndScreen paints it from state and
        // may run again (a language switch repaints without re-recording).
        function endQuiz() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            clearSession(); // round finished — no longer resumable

            const total = state.currentQuestions.length;
            const percent = Math.round((state.correct / total) * 100);
            const isExam = state.currentMode === 'exam';

            state.elapsedSecs = isExam
                ? (state.examStartTime
                    ? Math.round((Date.now() - state.examStartTime) / 1000)
                    : (3600 - state.timeLeft))
                : null;

            recordResult({
                ts: Date.now(),
                mode: state.currentMode,
                topic: state.currentTopic || null,
                correct: state.correct,
                total,
                percent,
                passed: isExam ? state.correct >= 17 : null
            });

            renderEndScreen();
            showScreen('end');
        }

        function renderEndScreen() {
            const total = state.currentQuestions.length;
            if (!total) return;
            const percent = Math.round((state.correct / total) * 100);
            const isExam = state.currentMode === 'exam';

            document.getElementById('endTitle').textContent = t('end.' + state.currentMode) === 'end.' + state.currentMode
                ? t('end.done')
                : t('end.' + state.currentMode);

            document.getElementById('finalScore').textContent = `${state.correct}/${total}`;
            document.getElementById('scoreMessage').textContent = isExam
                ? t('end.scoreExam', { p: percent })
                : t('end.scoreOther', { n: state.correct, total, p: percent });

            const passFail = document.getElementById('passFail');
            passFail.textContent = '';
            passFail.className = 'pass-fail';
            const passed = isExam ? state.correct >= 17 : null;
            if (isExam) {
                passFail.textContent = passed ? t('end.pass') : t('end.fail');
                passFail.classList.add(passed ? 'pass' : 'fail');
            }

            animateScoreRing(percent, passed);

            document.getElementById('correctCount').textContent = state.correct;
            document.getElementById('incorrectCount').textContent = state.incorrect;

            // Exam sub-scores: general score, state score, elapsed time, threshold note
            const subScoresEl = document.getElementById('examSubScores');
            if (isExam) {
                const elapsed = state.elapsedSecs || 0;
                const elapsedStr = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, '0')}`;
                subScoresEl.style.display = 'block';
                subScoresEl.innerHTML = `
                    <div class="pass-threshold-note">${t('end.threshold')}</div>
                    <div class="exam-subscores">
                        <div class="breakdown-item">
                            <div class="breakdown-label">${t('end.general')}</div>
                            <div class="breakdown-number" style="color: var(--gold)">${state.generalCorrect}</div>
                        </div>
                        <div class="breakdown-item">
                            <div class="breakdown-label">${t('end.stateOf3', { state: STATES[state.stateCode] || t('mode.state.title') })}</div>
                            <div class="breakdown-number" style="color: var(--gold)">${state.stateCorrect}</div>
                        </div>
                        <div class="breakdown-item">
                            <div class="breakdown-label">${t('end.elapsed')}</div>
                            <div class="breakdown-number" style="color: var(--blue)">${elapsedStr}</div>
                        </div>
                    </div>`;
            } else {
                subScoresEl.style.display = 'none';
            }

            // Wrong-answer review list
            const reviewEl = document.getElementById('reviewSection');
            const missed = state.missedQuestions.filter(m => m && m.q);
            if (missed.length > 0) {
                const count = missed.length === 1
                    ? t('end.reviewCount', { n: 1 })
                    : t('end.reviewCountPl', { n: missed.length });
                reviewEl.innerHTML = `
                    <div class="review-section">
                        <div class="review-section-header">
                            <h2>${t('end.reviewTitle')}</h2>
                            <div class="review-header-actions">
                                <span class="review-count">${count}</span>
                                <button class="btn-primary btn-sm" onclick="startMistakeMode()">${t('end.retryWrong')}</button>
                            </div>
                        </div>
                        ${missed.map(({ q, userAnswerIdx }) => `
                            <div class="review-item">
                                <div class="review-q-num">${t('end.reviewQ', { id: q.id })}</div>
                                <div class="review-q-text" lang="de">${q.de}</div>
                                <div class="review-answers" lang="de">
                                    <div class="review-answer user-wrong">✗ ${q.options[userAnswerIdx]}</div>
                                    <div class="review-answer correct-ans">✓ ${q.options[q.correct]}</div>
                                </div>
                                <div class="review-explanation" lang="de">
                                    ${q.explanation_de}
                                    ${state.showEnglish ? `<div class="review-explanation-en" lang="en">${q.explanation_en}</div>` : ''}
                                </div>
                            </div>`).join('')}
                    </div>`;
            } else {
                reviewEl.innerHTML = '';
            }
        }

        // ============================================================
        // MISTAKE MODE
        // ============================================================
        function startMistakeMode() {
            const qs = state.missedQuestions.map(m => m.q);
            if (qs.length === 0) return;
            state.currentMode = 'mistakes';
            state.shuffled = false;
            state.currentQuestions = qs;
            state.currentQuestionIndex = 0;
            state.answered = {};
            state.correct = 0;
            state.incorrect = 0;
            state.showExplanation = false;
            state.missedQuestions = [];
            state.examStartTime = null;
            state.generalCorrect = 0;
            state.stateCorrect = 0;
            document.getElementById('questionNavWrapper').style.display = 'flex';
            document.getElementById('timer').style.display = 'none';
            showScreen('quiz');
            displayQuestion();
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        document.getElementById('darkBtn').addEventListener('click', () => setTheme('dark'));
        document.getElementById('lightBtn').addEventListener('click', () => setTheme('light'));

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (ttsSupported) window.speechSynthesis.cancel();
            state.currentQuestionIndex++;
            state.showExplanation = false;
            if (state.currentQuestionIndex < state.currentQuestions.length) {
                displayQuestion();
            } else {
                endQuiz();
            }
        });

        const _speakBtn = document.getElementById('speakBtn');
        if (_speakBtn) {
            if (!ttsSupported) _speakBtn.style.display = 'none';
            else _speakBtn.addEventListener('click', speakQuestion);
        }

        document.getElementById('bilingualToggle').addEventListener('click', () => {
            state.showEnglish = !state.showEnglish;
            const toggle = document.getElementById('bilingualToggle');
            toggle.innerHTML = ICONS.translate + '<span>EN</span>';
            toggle.title = state.showEnglish ? t('quiz.hideEn') : t('quiz.showEn');
            toggle.setAttribute('aria-pressed', String(!!state.showEnglish));
            toggle.classList.toggle('active', state.showEnglish);
            document.getElementById('questionEnglish').classList.toggle('show', state.showEnglish);
            document.getElementById('explanationEnglish').classList.toggle('show', state.showEnglish);
            document.querySelectorAll('.option-en-text').forEach(el => el.classList.toggle('show', state.showEnglish));
        });

        const _navToggle = document.getElementById('questionNavToggle');
        if (_navToggle) _navToggle.addEventListener('click', toggleQuestionNav);

        document.getElementById('backBtn').addEventListener('click', () => {
            if (state.currentQuestionIndex > 0) {
                state.currentQuestionIndex--;
                displayQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        document.getElementById('quitBtn').addEventListener('click', () => {
            const resumable = state.currentMode !== 'exam' && state.currentMode !== 'mistakes';
            const msg = resumable ? t('quit.resumable') : t('quit.lost');
            if (confirm(msg)) {
                if (state.timerInterval) clearInterval(state.timerInterval);
                if (ttsSupported) window.speechSynthesis.cancel();
                if (!resumable) clearSession();
                document.getElementById('timer').style.display = 'none';
                initHomeScreen();
                showScreen('home');
            }
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if (state.currentMode === 'topic') startTopic(state.currentTopic);
            else startMode(state.currentMode);
        });

        document.getElementById('homeBtn').addEventListener('click', () => {
            if (ttsSupported) window.speechSynthesis.cancel();
            initHomeScreen();
            showScreen('home');
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (state.currentScreen !== 'quiz') return;
            const options = Array.from(document.querySelectorAll('.option-btn:not(:disabled)'));
            const nextBtn = document.getElementById('nextBtn');

            if (options.length > 0) {
                const focused = document.activeElement;
                const idx = options.indexOf(focused);
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    options[(idx + 1) % options.length].focus();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    options[(idx - 1 + options.length) % options.length].focus();
                } else if ((e.key === ' ' || e.key === 'Enter') && idx !== -1) {
                    e.preventDefault();
                    focused.click();
                }
            } else if (e.key === 'Enter' && nextBtn.style.display !== 'none') {
                nextBtn.click();
            }
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================
        // Don't let the browser restore a partial scroll offset after a
        // pull-to-refresh / reload — that would tuck the hero under the
        // sticky header. Always start at the top.
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        // Use instant (not smooth) — html{scroll-behavior:smooth} would otherwise
        // animate these resets and they could be interrupted mid-scroll.
        const toTop = () => window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        toTop();
        window.addEventListener('load', toTop);
        // PWA resume / bfcache restore: keep the home screen pinned to the top
        // so the hero is never tucked under the sticky header.
        window.addEventListener('pageshow', () => {
            if (state.currentScreen === 'home') toTop();
        });

        // The sticky exam timer has to clear the sticky header, and the header grows a row
        // when its controls wrap. Measure it rather than guessing a breakpoint.
        const _headerEl = document.querySelector('header');
        function syncHeaderHeight() {
            document.documentElement.style.setProperty('--header-h', _headerEl.offsetHeight + 'px');
        }
        syncHeaderHeight();
        new ResizeObserver(syncHeaderHeight).observe(_headerEl);

        loadProgress();
        loadHistory();
        initTheme();
        initLang();

        async function loadQuestions() {
            try {
                const res = await fetch('questions.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                QUESTIONS = await res.json();
            } catch (e) {
                console.error('Failed to load questions.json', e);
                loadFailed = true;
                initHomeScreen();
                return;
            }
            initHomeScreen();
            // The home content renders here (async), making the page tall enough to
            // scroll. Reset to the top now so a pull-to-refresh can't leave the hero
            // tucked under the sticky header. rAF covers post-layout reflow.
            if (state.currentScreen === 'home') {
                toTop();
                requestAnimationFrame(toTop);
            }
        }
        loadQuestions();

        document.getElementById('sidebarToggle').addEventListener('click', function() {
            if (window.innerWidth > NAV_COLLAPSE_AT) return;
            const body = document.getElementById('sidebarBody');
            const chevron = document.getElementById('sidebarChevron');
            const expanded = body.classList.toggle('expanded');
            chevron.classList.toggle('open', expanded);
            this.setAttribute('aria-expanded', String(expanded));
        });

        // ---- Service worker (offline / installable PWA) ----
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
